<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 160">
<rect width="320" height="160" fill="#fff"/>
<text x="10" y="20" font-size="13" fill="#333">音调高低（频率）</text>
<path d="M30 50 q6 -16 12 0 q6 16 12 0 q6 -16 12 0 q6 16 12 0 q6 -16 12 0" fill="none" stroke="#e0533a" stroke-width="2"/>
<text x="120" y="54" font-size="11" fill="#e0533a">密→频率高→音调高</text>
<path d="M200 50 q15 -16 30 0 q15 16 30 0" fill="none" stroke="#e0533a" stroke-width="2"/>
<text x="270" y="54" font-size="11" fill="#e0533a">疏</text>
<text x="10" y="100" font-size="13" fill="#333">音量大小（振幅）</text>
<path d="M30 130 q12 -10 24 0 q12 10 24 0 q12 -10 24 0" fill="none" stroke="#2f7d5d" stroke-width="2"/>
<text x="120" y="134" font-size="11" fill="#2f7d5d">小→振幅小→声音轻</text>
<path d="M200 130 q12 -28 24 0 q12 28 24 0" fill="none" stroke="#2f7d5d" stroke-width="3"/>
<text x="270" y="134" font-size="11" fill="#2f7d5d">大</text>
</svg>

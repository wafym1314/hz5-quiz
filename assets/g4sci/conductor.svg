<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
<rect width="320" height="180" fill="#fff"/>
<rect x="20" y="20" width="130" height="140" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
<text x="40" y="42" font-size="13" fill="#1976d2">导体（易导电）</text>
<text x="40" y="70" font-size="12" fill="#333">金属：铜/铁/铝</text>
<text x="40" y="95" font-size="12" fill="#333">人体、大地</text>
<text x="40" y="120" font-size="12" fill="#333">食盐水</text>
<rect x="170" y="20" width="130" height="140" fill="#fbe9e7" stroke="#c62828" stroke-width="2"/>
<text x="190" y="42" font-size="13" fill="#c62828">绝缘体（不易导电）</text>
<text x="190" y="70" font-size="12" fill="#333">橡胶、塑料</text>
<text x="190" y="95" font-size="12" fill="#333">玻璃、陶瓷</text>
<text x="190" y="120" font-size="12" fill="#333">干木头、纸</text>
<text x="10" y="175" font-size="11" fill="#333">导体和绝缘体常组合使用，如开关</text>
</svg>

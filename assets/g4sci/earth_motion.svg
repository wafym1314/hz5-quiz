<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" preserveAspectRatio="xMidYMid meet">
<rect width="320" height="180" fill="#fff"/>
<circle cx="250" cy="40" r="20" fill="#ffca28"/>
<text x="240" y="30" font-size="12" fill="#f57f17">太阳</text>
<circle cx="110" cy="110" r="40" fill="#64b5f6"/>
<line x1="110" y1="55" x2="110" y2="165" stroke="#e53935" stroke-width="3" stroke-dasharray="4"/>
<text x="116" y="60" font-size="11" fill="#e53935">地轴(倾斜)</text>
<path d="M70 110 a40 40 0 0 1 80 0" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#333"/></marker></defs>
<text x="150" y="105" font-size="11" fill="#333">自西向东自转→昼夜</text>

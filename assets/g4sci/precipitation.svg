<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
<rect width="320" height="180" fill="#fff"/>
<text x="10" y="22" font-size="13" fill="#333">降水的形式</text>
<line x1="40" y1="50" x2="30" y2="90" stroke="#42a5f5" stroke-width="3"/>
<line x1="55" y1="50" x2="45" y2="90" stroke="#42a5f5" stroke-width="3"/>
<text x="30" y="110" font-size="12" fill="#1976d2">雨</text>
<g fill="#90caf9" stroke="#42a5f5" stroke-width="1">
<path d="M150 50 l-12 16 l12 16 l12 -16 z"/>
</g>
<text x="138" y="110" font-size="12" fill="#1976d2">雪（冰晶）</text>
<path d="M250 55 l25 25 l-25 25 l-25 -25 z" fill="#b0bec5" stroke="#607d8b" stroke-width="2"/>
<text x="232" y="120" font-size="12" fill="#455a64">冰雹</text>
<text x="10" y="160" font-size="11" fill="#333">降水包括雨、雪、冰雹；降水量用雨量器测，单位毫米</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
<rect width="320" height="180" fill="#fff"/>
<text x="10" y="20" font-size="13" fill="#333">铁生锈的条件</text>
<rect x="20" y="50" width="70" height="90" fill="#e1f5fe" stroke="#333" stroke-width="2"/>
<line x1="55" y1="60" x2="55" y2="130" stroke="#8d6e63" stroke-width="4"/>
<text x="35" y="160" font-size="11" fill="#c62828">水+空气→生锈</text>
<rect x="125" y="50" width="70" height="90" fill="#f5f5f5" stroke="#333" stroke-width="2"/>
<line x1="160" y1="60" x2="160" y2="130" stroke="#90a4ae" stroke-width="4"/>
<text x="135" y="160" font-size="11" fill="#333">干燥→不生锈</text>
<rect x="230" y="50" width="70" height="90" fill="#fffde7" stroke="#333" stroke-width="2"/>
<line x1="265" y1="60" x2="265" y2="130" stroke="#90a4ae" stroke-width="4"/>
<text x="245" y="160" font-size="11" fill="#333">涂油→不生锈</text>
<text x="10" y="175" font-size="11" fill="#333">铁生锈需要水和空气（氧气）同时具备</text>
</svg>

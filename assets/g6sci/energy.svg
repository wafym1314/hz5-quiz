<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
<rect width="320" height="180" fill="#fff"/>
<circle cx="40" cy="40" r="18" fill="#ffca28"/>
<text x="28" y="35" font-size="11" fill="#f57f17">太阳</text>
<line x1="60" y1="48" x2="110" y2="80" stroke="#333" stroke-width="2"/>
<text x="62" y="70" font-size="10" fill="#333">光→</text>
<rect x="115" y="70" width="50" height="30" fill="#a5d6a7"/>
<text x="120" y="90" font-size="10" fill="#333">植物(化学能)</text>
<line x1="165" y1="85" x2="210" y2="85" stroke="#333" stroke-width="2"/>
<rect x="215" y="70" width="60" height="30" fill="#ffcc80"/>
<text x="220" y="90" font-size="10" fill="#333">人或动物</text>
<text x="10" y="130" font-size="11" fill="#333">能量形式：机械能/热能/电能/光能/化学能/声能</text>
<text x="10" y="150" font-size="11" fill="#333">能量可相互转化，如燃烧：化学能→热能+光能</text>
<text x="10" y="170" font-size="11" fill="#333">煤、石油、天然气是不可再生能源，应节约</text>
</svg>

{i:0,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:0,q:"—Where is the green book? —____",o:["It is on the teacher's desk.","It is in the desk.","It is under the chair.","It is near the window."],a:0,k:"句型：Where is...? 询问物品位置",e:"解析：问句是 Where is...?（某物在哪里），回答用 It is + 方位介词短语。书通常放在老师的桌子上，故选 on the teacher's desk。"},
{i:1,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:0,q:"—What's in the classroom? —____",o:["One blackboard, many desks and chairs.","Many books and a pen.","A bed and a sofa.","Some rice and soup."],a:0,k:"词汇：classroom 教室里的物品",e:"解析：教室里有黑板、课桌和椅子。bed/sofa 是家里家具，rice/soup 是食物，都不属于教室，故选第一项。"},
{i:2,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:0,q:"“黑板”的英文是？",o:["blackboard","window","fan","door"],a:0,k:"词汇：blackboard 黑板",e:"解析：black（黑）+ board（板）= blackboard 黑板。window 窗户、fan 风扇、door 门。"},
{i:3,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:0,q:"表示“在……上面（接触表面）”的方位介词是？",o:["on","in","under","near"],a:0,k:"介词：on 在上面",e:"解析：on 表示“在……表面之上”，如 on the wall（在墙上）；in 在……里，under 在……下，near 在……附近。"},
{i:4,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:0,q:"We can see a big ____ on the wall.",o:["blackboard","desk","chair","fan"],a:0,k:"词汇：blackboard 在墙上",e:"解析：挂在墙上的是黑板 blackboard。desk/chair 在地面，fan 在天花板上，故选 blackboard。"},
{i:5,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:0,q:"—Open the ____, please. Let fresh air in. —OK.",o:["window","blackboard","light","floor"],a:0,k:"词汇：window 窗户",e:"解析：开窗通风应打开 window（窗户）。blackboard 黑板、light 灯、floor 地板都不能放进新鲜空气。"},
{i:6,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:0,q:"“关上门”应说：Close the ____.",o:["door","window","light","fan"],a:0,k:"词汇：door 门",e:"解析：door 是门，close the door 关上门。其余三项都不是“门”。"},
{i:7,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:1,q:"—Where is the picture? —It is ____ the wall.（在墙上）",o:[],a:"on",k:"介词填空：on the wall",e:"解析：图片、地图等“贴在/挂在墙表面”用 on the wall。on 表示在表面上。"},
{i:8,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:0,q:"“computer”的意思是？",o:["计算机；电脑","黑板","风扇","门"],a:0,k:"词汇：computer 电脑",e:"解析：computer 意为计算机/电脑。其余三项分别是 blackboard、fan、door。"},
{i:9,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:0,q:"—Let's clean the classroom! —____",o:["OK.","No.","Yes, I am.","Thank you."],a:0,k:"交际：应答建议",e:"解析：别人提议 Let's...（我们一起……），肯定应答用 OK. 或 Great.。No. 不礼貌，Yes, I am. 答非所问。"},
{i:10,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:0,q:"“floor”的意思是？",o:["地板","墙","灯","课桌"],a:0,k:"词汇：floor 地板",e:"解析：floor 是地板。wall 墙、light 灯、desk 课桌。"},
{i:11,c:"4en-1",ch:"四上·第1单元 My classroom（教室与方位）",f:1,q:"Turn on the ____, please. It's dark in the room.（开灯）",o:[],a:"light",k:"词汇填空：light 灯",e:"解析：房间暗要开灯，turn on the light 开灯。light 此处意为电灯。"},

{i:12,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:0,q:"“书包”的英文是？",o:["schoolbag","book","pen","desk"],a:0,k:"词汇：schoolbag 书包",e:"解析：school（学校）+ bag（包）= schoolbag 书包。book 书、pen 钢笔、desk 课桌。"},
{i:13,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:0,q:"—What's in your schoolbag? —____",o:["An English book and a maths book.","A bed and a sofa.","Some beef.","A red door."],a:0,k:"句型：What's in...? 书包里有什么",e:"解析：问句问书包里有什么，应回答书本文具。English book 英语书、maths book 数学书符合。其余是家具、食物、门。"},
{i:14,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:0,q:"“storybook”的意思是？",o:["故事书","数学书","英语书","笔记本"],a:0,k:"词汇：storybook 故事书",e:"解析：story（故事）+ book（书）= storybook 故事书。"},
{i:15,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:0,q:"—What colour is it? —____",o:["It's blue and white.","It's a book.","I'm fine.","Thank you."],a:0,k:"句型：What colour...? 问颜色",e:"解析：What colour 问颜色，回答用 It's + 颜色。blue and white 蓝白相间正确。"},
{i:16,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:0,q:"“Put your ____ in your schoolbag.” 最合适的是？",o:["maths book","chair","door","window"],a:0,k:"词汇：maths book 数学书",e:"解析：能放进书包的应是书，maths book（数学书）正确。chair/door/window 是家具，不能放进书包。"},
{i:17,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:0,q:"“notebook”的意思是？",o:["笔记本","故事书","糖果","钥匙"],a:0,k:"词汇：notebook 笔记本",e:"解析：note（笔记）+ book（本）= notebook 笔记本。"},
{i:18,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:0,q:"“candy”的意思是？",o:["糖果","玩具","钥匙","笔记本"],a:0,k:"词汇：candy 糖果",e:"解析：candy 是糖果。toy 玩具、key 钥匙、notebook 笔记本。"},
{i:19,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:1,q:"—What colour is your schoolbag? —It's ____ and white.（黑和白）",o:[],a:"black",k:"颜色填空：black 黑色",e:"解析：常见书包配色是黑白相间，black and white 黑白色。black 黑色。"},
{i:20,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:0,q:"“key”的意思是？",o:["钥匙","糖果","笔记本","玩具"],a:0,k:"词汇：key 钥匙",e:"解析：key 是钥匙。其余分别为 candy、notebook、toy。"},
{i:21,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:0,q:"“Chinese book”的意思是？",o:["语文书","英语书","数学书","故事书"],a:0,k:"词汇：Chinese book 语文书",e:"解析：Chinese 语文/中文，Chinese book 语文书。"},
{i:22,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:0,q:"—What's in your schoolbag? —____",o:["Three storybooks.","A red apple.","It's on the desk.","I'm nine."],a:0,k:"句型：What's in...? 回答内容",e:"解析：回答书包里有什么，Three storybooks（三本故事书）符合。其余答非所问。"},
{i:23,c:"4en-2",ch:"四上·第2单元 My schoolbag（书包与颜色）",f:1,q:"I have a ____ in my schoolbag.（玩具）",o:[],a:"toy",k:"词汇填空：toy 玩具",e:"解析：toy 是玩具，可以放在书包里。与 candy、key 同属小物件词汇。"},

{i:24,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:0,q:"—What's his name? —____",o:["His name is John.","Her name is John.","I am John.","It is John."],a:0,k:"句型：What's his name? 他的名字",e:"解析：his 指“他的”，回答用 His name is...。John 是男生名，用 his 正确。"},
{i:25,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:0,q:"He is tall and ____.",o:["strong","small","red","three"],a:0,k:"词汇：strong 强壮的",e:"解析：形容身材 tall and strong（又高又壮）是固定搭配。small/red/three 都不与 tall 搭配形容人。"},
{i:26,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:0,q:"“glasses”的意思是？",o:["眼镜","鞋子","头发","书"],a:0,k:"词汇：glasses 眼镜",e:"解析：glasses 是眼镜（常以复数形式出现）。shoe 鞋、hair 头发。"},
{i:27,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:0,q:"He has short ____.",o:["hair","shoes","glasses","bag"],a:0,k:"词汇：hair 头发",e:"解析：has short hair 留短发，hair（头发）不可数。shoes/glasses 用 have 但 short 不修饰；bag 不对。"},
{i:28,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:0,q:"“friendly”的意思是？",o:["友好的","强壮的","安静的","高的"],a:0,k:"词汇：friendly 友好的",e:"解析：friend（朋友）+ ly = friendly 友好的。strong 强壮、quiet 安静、tall 高。"},
{i:29,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:0,q:"“安静的”的英文是？",o:["quiet","strong","friendly","tall"],a:0,k:"词汇：quiet 安静的",e:"解析：quiet 安静的。其余分别为 strong、friendly、tall。"},
{i:30,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:0,q:"She's cute. ____ name is Sarah.",o:["Her","His","My","Your"],a:0,k:"代词：her 她的",e:"解析：Sarah 是女生，用形容词性物主代词 her（她的）。his 他的，my 我的，your 你的。"},
{i:31,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:1,q:"He has black ____.（头发）",o:[],a:"hair",k:"词汇填空：hair 头发",e:"解析：has black hair 有一头黑发。hair 作“头发”统称时不可数，不用复数。"},
{i:32,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:0,q:"He is ____ and thin.",o:["tall","strong","quiet","hair"],a:0,k:"词汇：tall and thin 又高又瘦",e:"解析：tall and thin（又高又瘦）形容人。strong 强壮与 thin 矛盾；quiet 不接 thin；hair 是名词。"},
{i:33,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:0,q:"“shoe”的意思是？",o:["鞋","眼镜","头发","书包"],a:0,k:"词汇：shoe 鞋",e:"解析：shoe 是鞋。glasses 眼镜、hair 头发、schoolbag 书包。"},
{i:34,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:0,q:"My friend is ____. She often helps me.",o:["friendly","strong","hair","glasses"],a:0,k:"词汇：friendly 友好的",e:"解析：经常帮助别人说明性格 friendly（友好的）。strong/hair/glasses 不能说明性格友善。"},
{i:35,c:"4en-3",ch:"四上·第3单元 My friends（描述朋友）",f:1,q:"—What's ____ name? —His name is Mike.（他的）",o:[],a:"his",k:"代词填空：his 他的",e:"解析：Mike 是男生，用 his（他的）修饰 name。his 是形容词性物主代词。"},

{i:36,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:0,q:"—Where is the cat? —____",o:["It's in the living room.","It's a cat.","Yes, it is.","I like cats."],a:0,k:"句型：Where is...? 回答位置",e:"解析：问猫在哪里，回答用 It's + 方位。in the living room（在客厅）正确。"},
{i:37,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:0,q:"—Is she in the study? —____",o:["No, she isn't.","Yes, he is.","No, he isn't.","It's a study."],a:0,k:"句型：Is she...? 否定回答",e:"解析：问句主语 she，否定回答 No, she isn't.。he 主语不符，故选第一项。"},
{i:38,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:0,q:"“去厨房”应说：____",o:["Go to the kitchen.","Go to the bedroom.","Go to the study.","Go to the bathroom."],a:0,k:"词汇：kitchen 厨房",e:"解析：kitchen 厨房，Go to the kitchen 去厨房。其余是卧室、书房、浴室。"},
{i:39,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:0,q:"“沙发”的英文是？",o:["sofa","bed","table","fridge"],a:0,k:"词汇：sofa 沙发",e:"解析：sofa 沙发。bed 床、table 桌子、fridge 冰箱。"},
{i:40,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:0,q:"I'm hungry. Go to the ____.",o:["kitchen","bedroom","study","bathroom"],a:0,k:"词汇：kitchen 厨房（饿了去）",e:"解析：饿了去厨房找吃的，kitchen 厨房。bedroom 卧室、study 书房、bathroom 浴室。"},
{i:41,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:0,q:"读书通常在 ____。",o:["study","kitchen","bathroom","bedroom"],a:0,k:"词汇：study 书房",e:"解析：study 书房是读书的地方。kitchen 厨房、bathroom 浴室、bedroom 卧室（虽可读书但 study 最贴切）。"},
{i:42,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:0,q:"I'm tired. I want to have a nap in the ____.",o:["bedroom","kitchen","living room","study"],a:0,k:"词汇：bedroom 卧室",e:"解析：have a nap 小睡，应在 bedroom（卧室）的床上。其余房间不适合睡觉。"},
{i:43,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:1,q:"—Where is the dog? —It's ____ the living room.（在……里）",o:[],a:"in",k:"介词填空：in 在……里",e:"解析：狗在客厅里面，用 in 表示“在……内部”。"},
{i:44,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:0,q:"“fridge”的意思是？",o:["冰箱","沙发","床","桌子"],a:0,k:"词汇：fridge 冰箱",e:"解析：fridge 冰箱。sofa 沙发、bed 床、table 桌子。"},
{i:45,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:0,q:"“bathroom”的意思是？",o:["浴室；洗手间","卧室","书房","厨房"],a:0,k:"词汇：bathroom 浴室",e:"解析：bath（洗澡）+ room = bathroom 浴室/洗手间。"},
{i:46,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:0,q:"“phone”的意思是？",o:["电话","电脑","风扇","桌子"],a:0,k:"词汇：phone 电话",e:"解析：phone 电话。computer 电脑、fan 风扇、table 桌子。"},
{i:47,c:"4en-4",ch:"四上·第4单元 My home（房间与家具）",f:1,q:"Go to the ____ and read a book.（书房）",o:[],a:"study",k:"词汇填空：study 书房",e:"解析：读书去书房 study。study 既是“学习”也是“书房”。"},

{i:48,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:0,q:"—What would you like? —____",o:["I'd like some beef.","I like beef.","It's beef.","Yes, please."],a:0,k:"句型：What would you like? 想要什么",e:"解析：问“你想吃点什么”，用 I'd like...（我想要……）回答。I'd = I would。"},
{i:49,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:0,q:"“我想喝点汤”应说：____",o:["I'd like some soup.","I like soup.","It's soup.","A soup."],a:0,k:"句型：I'd like some soup",e:"解析：想喝汤用 I'd like some soup.。soup 不可数，不加 a，也不说 I like（那是“喜欢”不是“想要”）。"},
{i:50,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:0,q:"“noodles”的意思是？",o:["面条","牛肉","鸡肉","汤"],a:0,k:"词汇：noodles 面条",e:"解析：noodles 面条（常以复数）。beef 牛肉、chicken 鸡肉、soup 汤。"},
{i:51,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:0,q:"吃饭用的“筷子”是？",o:["chopsticks","fork","knife","spoon"],a:0,k:"词汇：chopsticks 筷子",e:"解析：chopsticks 筷子（常以复数）。fork 叉、knife 刀、spoon 勺。"},
{i:52,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:0,q:"Help yourself. 的意思是？",o:["请自便；随便吃","帮助你自己","帮我一下","谢谢你"],a:0,k:"交际：Help yourself 请自便",e:"解析：用餐时主人说 Help yourself 是“请随便吃/自便”。不是字面“帮助自己”。"},
{i:53,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:0,q:"“蔬菜”的英文是？",o:["vegetable","beef","chicken","soup"],a:0,k:"词汇：vegetable 蔬菜",e:"解析：vegetable 蔬菜。beef 牛肉、chicken 鸡肉、soup 汤。"},
{i:54,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:0,q:"“fork”的意思是？",o:["餐叉","勺子","刀","筷子"],a:0,k:"词汇：fork 餐叉",e:"解析：fork 餐叉。spoon 勺、knife 刀、chopsticks 筷子。"},
{i:55,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:1,q:"—What would you like? —I'd like some ____.（汤）",o:[],a:"soup",k:"词汇填空：soup 汤",e:"解析：soup 汤，不可数名词，some soup 一些汤。回答用 I'd like... 对应问句 What would you like?"},
{i:56,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:0,q:"“knife”的意思是？",o:["刀","叉","勺","碗"],a:0,k:"词汇：knife 刀",e:"解析：knife 刀。fork 叉、spoon 勺、bowl 碗。"},
{i:57,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:0,q:"Pass me the ____, please. I want to drink the soup.",o:["spoon","fork","knife","chopsticks"],a:0,k:"词汇：spoon 勺子",e:"解析：喝汤用 spoon（勺子）。fork 叉、knife 刀、chopsticks 筷子都不适合喝汤。"},
{i:58,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:0,q:"“chicken”的意思是？",o:["鸡肉","牛肉","面条","蔬菜"],a:0,k:"词汇：chicken 鸡肉",e:"解析：chicken 鸡肉（也可指“鸡”这种动物）。beef 牛肉、noodles 面条、vegetable 蔬菜。"},
{i:59,c:"4en-5",ch:"四上·第5单元 Dinner's ready（食物与用餐）",f:1,q:"Dinner's ____. Let's eat!（准备好的）",o:[],a:"ready",k:"词汇填空：ready 准备好的",e:"解析：Dinner's ready. 晚饭准备好了。ready 准备好的，是形容词。"},

{i:60,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:0,q:"—Where is the library? —____",o:["It's on the first floor.","It's a library.","Yes, it is.","I like library."],a:0,k:"句型：Where is...? 楼层",e:"解析：问图书馆在哪，回答用 It's on the + 序数词 + floor。first floor 一楼。"},
{i:61,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:0,q:"—Is this the teachers' office? —____",o:["Yes, it is.","No, it is.","Yes, he is.","It's a teacher."],a:0,k:"句型：Is this...? 肯定回答",e:"解析：问句主语 this，肯定回答 Yes, it is.。he 是“他”不符；No, it is. 自相矛盾。"},
{i:62,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:0,q:"“去操场玩”应说：____",o:["Go to the playground.","Go to the library.","Go to the gym.","Go to the art room."],a:0,k:"词汇：playground 操场",e:"解析：playground 操场，Go to the playground 去操场。library 图书馆、gym 体育馆、art room 美术教室。"},
{i:63,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:0,q:"“library”的意思是？",o:["图书馆","操场","办公室","电脑室"],a:0,k:"词汇：library 图书馆",e:"解析：library 图书馆。playground 操场、teachers' office 办公室、computer room 电脑室。"},
{i:64,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:0,q:"“二楼”的英文是？",o:["second floor","first floor","teachers' office","library"],a:0,k:"词汇：second floor 二楼",e:"解析：second 第二，second floor 二楼。first floor 一楼。"},
{i:65,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:0,q:"画画应去 ____。",o:["art room","music room","computer room","gym"],a:0,k:"词汇：art room 美术教室",e:"解析：art 美术，art room 美术教室。music room 音乐教室、computer room 电脑室、gym 体育馆。"},
{i:66,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:0,q:"上音乐课应去 ____。",o:["music room","art room","library","playground"],a:0,k:"词汇：music room 音乐教室",e:"解析：music 音乐，music room 音乐教室。art room 美术教室、library 图书馆、playground 操场。"},
{i:67,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:1,q:"—Where is the computer room? —It's on the ____.（二楼）",o:[],a:"second floor",k:"词汇填空：second floor 二楼",e:"解析：电脑室在二楼，用 second floor。first floor 是一楼。"},
{i:68,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:0,q:"“gym”的意思是？",o:["体育馆","图书馆","办公室","楼梯"],a:0,k:"词汇：gym 体育馆",e:"解析：gym 体育馆/健身房。library 图书馆、teachers' office 办公室。"},
{i:69,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:0,q:"—Is that the computer room? —No, it's the ____.",o:["library","gym","playground","office"],a:0,k:"词汇：library 图书馆",e:"解析：否定回答说明那不是电脑室而是图书馆 library。其余都不构成对应否定。"},
{i:70,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:0,q:"“teachers' office”的意思是？",o:["教师办公室","图书馆","操场","音乐教室"],a:0,k:"词汇：teachers' office 教师办公室",e:"解析：teachers' office 教师办公室。其余分别为 library、playground、music room。"},
{i:71,c:"4en-6",ch:"四下·第1单元 My school（学校场所与方位）",f:1,q:"This is the ____. We can read books here.（图书馆）",o:[],a:"library",k:"词汇填空：library 图书馆",e:"解析：能读书的地方是 library（图书馆）。read books 读书对应图书馆。"},

{i:72,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:0,q:"—What time is it? —____",o:["It's six o'clock.","It's a clock.","Yes, it is.","I'm six."],a:0,k:"句型：What time is it? 几点了",e:"解析：问时间回答 It's + 时刻。six o'clock 六点整。a clock 是“一个钟”，答非所问。"},
{i:73,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:0,q:"“该吃早饭了”应说：____",o:["It's time for breakfast.","It's time for lunch.","It's time for dinner.","It's time for bed."],a:0,k:"句型：It's time for... 到…时间",e:"解析：breakfast 早饭，It's time for breakfast 该吃早饭了。lunch 午饭、dinner 晚饭、bed 睡觉。"},
{i:74,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:0,q:"“get up”的意思是？",o:["起床","上学","回家","睡觉"],a:0,k:"词汇：get up 起床",e:"解析：get up 起床。go to school 上学、go home 回家、go to bed 睡觉。"},
{i:75,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:0,q:"It's 7:30. It's time to ____.",o:["go to school","go home","go to bed","get up"],a:0,k:"常识：7:30 上学",e:"解析：早上 7:30 通常去上学 go to school。go home 回家、go to bed 睡觉、get up 起床（一般更早）。"},
{i:76,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:0,q:"“上英语课”用 ____。",o:["English class","music class","PE class","lunch"],a:0,k:"词汇：English class 英语课",e:"解析：English class 英语课。music class 音乐课、PE class 体育课、lunch 午饭。"},
{i:77,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:0,q:"“go to bed”的意思是？",o:["上床睡觉","起床","回家","吃午饭"],a:0,k:"词汇：go to bed 睡觉",e:"解析：go to bed 上床睡觉。get up 起床、go home 回家、lunch 午饭。"},
{i:78,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:0,q:"It's 12:00. It's time for ____.",o:["lunch","breakfast","dinner","PE class"],a:0,k:"常识：12:00 午饭",e:"解析：中午 12 点吃午饭 lunch。breakfast 早饭、dinner 晚饭、PE class 体育课。"},
{i:79,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:1,q:"—What time is it? —It's ____ o'clock.（七）",o:[],a:"seven",k:"数字填空：seven 七",e:"解析：seven 七，seven o'clock 七点钟。注意拼写 s-e-v-e-n。"},
{i:80,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:0,q:"“dinner”的意思是？",o:["晚餐；正餐","早餐","午餐","体育课"],a:0,k:"词汇：dinner 晚餐",e:"解析：dinner 晚餐/正餐。breakfast 早餐、lunch 午餐。"},
{i:81,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:0,q:"It's 9:00 p.m. It's time to ____.",o:["go to bed","go to school","get up","go home"],a:0,k:"常识：晚上9点睡觉",e:"解析：晚上 9 点该睡觉 go to bed。go to school/get up 是早晨，go home 不一定 9 点。"},
{i:82,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:0,q:"“music class”的意思是？",o:["音乐课","英语课","体育课","午饭"],a:0,k:"词汇：music class 音乐课",e:"解析：music class 音乐课。English class 英语课、PE class 体育课、lunch 午饭。"},
{i:83,c:"4en-7",ch:"四下·第2单元 What time is it?（时间表达）",f:1,q:"It's time ____ go to school.（to/for）",o:[],a:"to",k:"结构填空：It's time to + 动词",e:"解析：It's time to + 动词原形，go to school 是动词短语，用 to。It's time for + 名词。"},

{i:84,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:0,q:"—What's the weather like in Beijing? —____",o:["It's sunny and warm.","It's a sun.","Yes, it is.","I like warm."],a:0,k:"句型：What's the weather like? 天气",e:"解析：问天气回答用 It's + 表示天气的形容词。sunny and warm 晴朗温暖正确。"},
{i:85,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:0,q:"“寒冷的”英文是？",o:["cold","hot","warm","cool"],a:0,k:"词汇：cold 寒冷的",e:"解析：cold 寒冷的。hot 热、warm 温暖、cool 凉爽。"},
{i:86,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:0,q:"It's ____ today. Let's make a snowman.",o:["snowy","rainy","sunny","windy"],a:0,k:"词汇：snowy 下雪的",e:"解析：堆雪人 make a snowman 需要下雪 snowy。rainy 下雨、sunny 晴、windy 有风都不适合。"},
{i:87,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:0,q:"“炎热的”英文是？",o:["hot","cold","cool","warm"],a:0,k:"词汇：hot 炎热的",e:"解析：hot 炎热的。cold 寒冷、cool 凉爽、warm 温暖。"},
{i:88,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:0,q:"“windy”的意思是？",o:["有风的","多云的","下雪的","下雨的"],a:0,k:"词汇：windy 有风的",e:"解析：wind（风）+ y = windy 有风的。cloudy 多云、snowy 下雪、rainy 下雨。"},
{i:89,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:0,q:"—Can I go outside? —No, you ____.",o:["can't","can","do","don't"],a:0,k:"情态动词：can 的否定",e:"解析：Can I...? 否定回答 No, you can't.。can't = can not。"},
{i:90,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:0,q:"“cloudy”的意思是？",o:["多云的","晴朗的","有风的","下雪的"],a:0,k:"词汇：cloudy 多云的",e:"解析：cloud（云）+ y = cloudy 多云的。sunny 晴朗、windy 有风、snowy 下雪。"},
{i:91,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:1,q:"—What's the weather like? —It's ____ and windy.（温暖）",o:[],a:"warm",k:"词汇填空：warm 温暖",e:"解析：warm 温暖的，与 windy 并列描述天气。注意 warm 不是 hot。"},
{i:92,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:0,q:"“rainy”的意思是？",o:["下雨的","下雪的","晴朗的","多云的"],a:0,k:"词汇：rainy 下雨的",e:"解析：rain（雨）+ y = rainy 下雨的。snowy 下雪、sunny 晴朗、cloudy 多云。"},
{i:93,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:0,q:"It's cold outside. Put on your ____.",o:["coat","shirt","dress","skirt"],a:0,k:"词汇：coat 外套",e:"解析：天冷穿外套 coat 保暖。shirt 衬衫、dress 连衣裙、skirt 裙子都较薄。"},
{i:94,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:0,q:"“cool”的意思是？",o:["凉爽的","寒冷的","炎热的","温暖的"],a:0,k:"词汇：cool 凉爽的",e:"解析：cool 凉爽的（比 cold 温和）。cold 寒冷、hot 炎热、warm 温暖。"},
{i:95,c:"4en-8",ch:"四下·第3单元 Weather（天气）",f:1,q:"It's ____ in Harbin. It's white everywhere.（下雪的）",o:[],a:"snowy",k:"词汇填空：snowy 下雪的",e:"解析：哈尔滨冬天多雪，snowy 下雪的，到处白茫茫。snow 是雪（名词），此处需形容词 snowy。"},

{i:96,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:0,q:"—Whose dress is this? —____",o:["It's Amy's.","It's Amy.","Yes, it is.","A red dress."],a:0,k:"句型：Whose...? 谁的",e:"解析：Whose 问“谁的”，回答用名词所有格 ...'s。It's Amy's 是 Amy 的。It's Amy 是人名不对。"},
{i:97,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:0,q:"—Is this yours? —Yes, ____.",o:["it is","it isn't","he is","they are"],a:0,k:"代词：yours 名词性物主代词",e:"解析：yours = your + 名词，问句主语 this 用 it 回指，肯定 Yes, it is.。"},
{i:98,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:0,q:"“连衣裙”的英文是？",o:["dress","skirt","coat","shirt"],a:0,k:"词汇：dress 连衣裙",e:"解析：dress 连衣裙。skirt 短裙、coat 外套、shirt 衬衫。"},
{i:99,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:0,q:"I like that red ____.",o:["sweater","shirt","coat","jacket"],a:0,k:"词汇：sweater 毛衣",e:"解析：sweater 毛衣，that red sweater 那件红毛衣。其余虽是衣物但题干语境常指毛衣，且四项中只有 sweater 最常被 that 指代。此处以 sweater 为正确项。"},
{i:100,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:0,q:"“shorts”的意思是？",o:["短裤","袜子","裤子","外套"],a:0,k:"词汇：shorts 短裤",e:"解析：shorts 短裤（常以复数）。sock 袜子、pants 裤子、coat 外套。"},
{i:101,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:0,q:"外面冷，应说：____",o:["Put on your coat.","Take off your coat.","Put on your shirt.","Take off your hat."],a:0,k:"交际：Put on 穿上",e:"解析：天冷要穿上外套 Put on your coat.。Take off 是脱下，方向相反。"},
{i:102,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:0,q:"These are my ____.",o:["socks","shoe","shirt","coat"],a:0,k:"名词单复数：these 接复数",e:"解析：These are 后接复数名词，socks 袜子（复数）正确。shoe/shirt/coat 是单数。"},
{i:103,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:1,q:"—Whose ____ is this? —It's John's.（衬衫）",o:[],a:"shirt",k:"词汇填空：shirt 衬衫",e:"解析：shirt 衬衫，Whose shirt 谁的衬衫。回答 It's John's 用单数 shirt 对应 it。"},
{i:104,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:0,q:"“jacket”的意思是？",o:["夹克衫","毛衣","裙子","帽子"],a:0,k:"词汇：jacket 夹克衫",e:"解析：jacket 夹克衫/短上衣。sweater 毛衣、skirt 裙子、hat 帽子。"},
{i:105,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:0,q:"—Is this your skirt? —Yes, it's ____.",o:["mine","my","your","yours"],a:0,k:"代词：mine 我的（名词性）",e:"解析：mine = my skirt，名词性物主代词单独使用，不加名词。my 后须接名词。"},
{i:106,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:0,q:"“pants”的意思是？",o:["裤子","短裤","袜子","鞋子"],a:0,k:"词汇：pants 裤子",e:"解析：pants 裤子（常以复数）。shorts 短裤、socks 袜子、shoes 鞋子。"},
{i:107,c:"4en-9",ch:"四下·第5单元 My clothes（衣物）",f:1,q:"These blue shoes are ____.（你的）",o:[],a:"yours",k:"代词填空：yours 你的",e:"解析：yours = your shoes，名词性物主代词，单独作表语。These shoes 是复数，对应 yours。"},

{i:108,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:0,q:"—How much is the scarf? —____",o:["It's ten yuan.","It's ten.","Yes, it is.","A scarf."],a:0,k:"句型：How much...? 问价格",e:"解析：How much 问价格/不可数数量，回答用 It's + 钱数。ten yuan 十元。必须有货币单位 yuan。"},
{i:109,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:0,q:"“这把雨伞多少钱？”应说：____",o:["How much is the umbrella?","How much are the umbrella?","What is the umbrella?","How many is the umbrella?"],a:0,k:"句型：How much is + 单数",e:"解析：umbrella 单数用 is，How much is the umbrella? 正确。are 用于复数，What 问“是什么”不对。"},
{i:110,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:0,q:"“expensive”的意思是？",o:["昂贵的","便宜的","漂亮的","好的"],a:0,k:"词汇：expensive 昂贵的",e:"解析：expensive 昂贵的。cheap 便宜、pretty 漂亮、nice 好。"},
{i:111,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:0,q:"The gloves are nice. Can I ____?",o:["try them on","try it on","try on them","try on it"],a:0,k:"短语：try on 代词位置",e:"解析：gloves 复数用 them；try on 的宾语是代词时必须放在中间，try them on 试穿它们。名词才可放后：try on the gloves。"},
{i:112,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:0,q:"“便宜的”英文是？",o:["cheap","expensive","pretty","nice"],a:0,k:"词汇：cheap 便宜的",e:"解析：cheap 便宜的。expensive 昂贵、pretty 漂亮、nice 好。"},
{i:113,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:0,q:"—How much are these socks? —____",o:["They're five yuan.","It's five yuan.","Yes, they are.","Five socks."],a:0,k:"句型：How much are + 复数",e:"解析：socks 复数用 are，回答 They're + 钱数。It's 用于单数，故选 They're five yuan。"},
{i:114,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:0,q:"“sunglasses”的意思是？",o:["太阳镜","手套","围巾","雨伞"],a:0,k:"词汇：sunglasses 太阳镜",e:"解析：sunglasses 太阳镜（复数）。gloves 手套、scarf 围巾、umbrella 雨伞。"},
{i:115,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:1,q:"—How much ____ the dress? —It's eighty yuan.（be动词）",o:[],a:"is",k:"动词填空：is 单数",e:"解析：the dress 单数，be 动词用 is。How much is...? 问单数物品价格。"},
{i:116,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:0,q:"“scarf”的意思是？",o:["围巾","手套","太阳镜","雨伞"],a:0,k:"词汇：scarf 围巾",e:"解析：scarf 围巾。gloves 手套、sunglasses 太阳镜、umbrella 雨伞。"},
{i:117,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:0,q:"“pretty”的意思是？",o:["美观的；漂亮的","便宜的","昂贵的","大的"],a:0,k:"词汇：pretty 漂亮的",e:"解析：pretty 漂亮的/美观的。cheap 便宜、expensive 昂贵。常用来形容衣物好看。"},
{i:118,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:0,q:"“glove”的意思是？",o:["手套","围巾","太阳镜","雨伞"],a:0,k:"词汇：glove 手套",e:"解析：glove 手套（常用复数 gloves）。scarf 围巾、sunglasses 太阳镜、umbrella 雨伞。"},
{i:119,c:"4en-10",ch:"四下·第6单元 Shopping（购物）",f:1,q:"—Can I help you? —Yes. I want a ____, please.（围巾）",o:[],a:"scarf",k:"词汇填空：scarf 围巾",e:"解析：scarf 围巾，a scarf 一条围巾。购物场景常用 I want a + 衣物。"}

{i:0,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:0,q:"声音是由物体的什么产生的？",o:["振动","颜色变化","发光","变热"],a:0,k:"声音：物体振动产生",e:"解析：声音是由物体振动产生的，振动停止，发声也就停止。"},
{i:1,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:0,q:"下列现象能说明物体在发声的是？",o:["正在发声的音叉在抖动","静止不动的石块","水结成冰","镜子反光"],a:0,k:"发声物体在振动",e:"解析：正在发声的音叉振动明显，说明发声的物体在振动。"},
{i:2,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:0,q:"声音的传播需要什么？",o:["介质，如空气、水、木头","真空","颜色","光亮"],a:0,k:"声音传播需要介质",e:"解析：声音不能在真空中传播，需要气体、液体或固体等介质。"},
{i:3,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:0,q:"在月球上（接近真空），两名宇航员不借助设备能直接听到对方说话吗？",o:["不能，真空不能传声","能，和地球上一样","能，因为月球上有空气","不能，因为太冷"],a:0,k:"真空不能传声",e:"解析：月球周围几乎没有空气（接近真空），声音无法传播，必须靠无线电设备交流。"},

{i:5,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:0,q:"下列材料中，传声效果最好的是？",o:["木头（固体）","真空","棉花","羽毛"],a:0,k:"固体能传声",e:"解析：固体传声一般比气体好，木头传声效果优于棉花、羽毛，真空不能传声。"},
{i:6,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:1,q:"声音不能在____中传播。",o:[],a:"真空",k:"真空不能传声",e:"解析：声音的传播需要介质，真空里没有物质传声，所以声音不能在真空中传播。"},
{i:7,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:0,q:"用棉线做的“土电话”能传声，主要依靠什么？",o:["固体（棉线）传声","真空传声","空气流动","光"],a:0,k:"固体能传声",e:"解析：土电话靠拉紧的棉线（固体）把振动传到另一端。"},
{i:8,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:0,q:"我们听到声音时，声波最后到达哪里产生听觉？",o:["大脑（经听觉神经）","指甲","头发","衣服"],a:0,k:"听觉在大脑形成",e:"解析：声波经外耳道、鼓膜、听小骨、耳蜗、听觉神经，最后传到大脑形成听觉。"},
{i:9,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:0,q:"敲响的鼓面用手按住后声音消失，是因为？",o:["鼓面振动停止","温度降低","光变暗","空气变少"],a:0,k:"振动停止发声停止",e:"解析：手按住鼓面使振动停止，发声也就停止了。"},
{i:10,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:1,q:"敲响的音叉触及水面，水花四溅，说明正在发声的物体在____。",o:[],a:"振动",k:"发声物体在振动",e:"解析：水花四溅说明音叉在振动，证明发声的物体在振动。"},
{i:11,c:"4sci-1",ch:"四上·第1单元 声音（产生与传播）",f:0,q:"下列不能用来探究“声音由振动产生”的是？",o:["观察静止的石块","弹拨橡皮筋看其抖动","敲鼓看鼓面振动","拨动钢尺看其颤动"],a:0,k:"振动产生声音",e:"解析：静止的石块没有振动，也无法发声，不能用来说明声音由振动产生。"},

{i:12,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:0,q:"声音的“高低”叫做什么？",o:["音调","音量","音色","响度"],a:0,k:"音调=高低",e:"解析：音调指声音的高低，音量（响度）指声音的强弱。"},
{i:13,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:0,q:"音调的高低主要由什么决定？",o:["振动频率（快慢）","颜色","重量","温度"],a:0,k:"音调由频率决定",e:"解析：音调由发声体振动的频率决定，振动越快（频率越高），音调越高。"},
{i:14,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:0,q:"下图中左边波形密、右边波形疏，说明左边的声音？",o:["音调高","音调低","更轻","更暗"],a:0,k:"波形密=频率高=音调高",e:"解析：波形越密表示振动频率越高，音调越高。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g4sci/pitch_volume.svg"},
{i:15,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:0,q:"声音的“强弱”叫做什么？",o:["音量（响度）","音调","音色","频率"],a:0,k:"音量=强弱",e:"解析：音量（响度）指声音的强弱，音调指声音的高低。"},
{i:16,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:0,q:"音量的大小主要由什么决定？",o:["振动幅度（振幅）","颜色","形状","气味"],a:0,k:"音量由振幅决定",e:"解析：音量（响度）由振幅决定，振幅越大，声音越响。"},
{i:17,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:0,q:"同样一根橡皮筋，拉得越紧，拨动时音调会？",o:["越高","越低","不变","消失"],a:0,k:"越紧音调越高",e:"解析：橡皮筋拉得越紧振动越快，频率越高，音调越高。"},
{i:18,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:0,q:"男生说话的音调一般比女生？",o:["低","高","一样","无法确定"],a:0,k:"男生音调较低",e:"解析：男生声带较厚较长，振动较慢，音调较低。"},
{i:19,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:0,q:"敲击鼓面，用力越大，鼓声会？",o:["越响（音量越大）","越轻","越高","越尖"],a:0,k:"用力大振幅大",e:"解析：敲击越用力，鼓面振动幅度越大，声音越响。"},
{i:20,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:1,q:"物体振动得越快，发出的声音音调越____。",o:[],a:"高",k:"频率高→音调高",e:"解析：振动越快（频率越高），声音的音调越高。"},
{i:21,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:1,q:"物体振动幅度越大，发出的声音越____。",o:[],a:"响",k:"振幅大→音量越大",e:"解析：振幅越大，声音的音量（响度）越大，听起来越响。"},
{i:22,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:0,q:"小提琴的弦越细、越短、越紧，发出的音高会？",o:["越高","越低","不变","越轻"],a:0,k:"短紧细→音高高",e:"解析：弦越细、越短、越紧，振动越快，音高越高。"},
{i:23,c:"4sci-2",ch:"四上·第1单元 声音（音调与音量）",f:0,q:"用相同力度敲击大钟和小铃铛，通常小铃铛的音调？",o:["高","低","一样","为零"],a:0,k:"小的物体音调高",e:"解析：小铃铛体积小、振动快，音调比大钟高。"},

{i:24,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:0,q:"人体进行气体交换的主要器官是？",o:["肺","胃","肝","皮肤"],a:0,k:"肺是呼吸器官",e:"解析：肺是气体交换的主要场所，氧气进入血液，二氧化碳排出体外。"},
{i:25,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:0,q:"下列不是呼吸器官的是？",o:["肌肉","鼻","气管","支气管"],a:0,k:"呼吸器官组成",e:"解析：鼻、咽、喉、气管、支气管、肺是呼吸器官，肌肉不是。"},
{i:26,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:0,q:"下图中空气进入体内的正确路线是？",o:["鼻→气管→肺","肺→气管→鼻","胃→肠→肺","耳→鼻→肺"],a:0,k:"呼吸通道顺序",e:"解析：空气经鼻、咽、喉、气管、支气管进入肺。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g4sci/respiratory.svg"},
{i:27,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:0,q:"吸气时，胸廓和肺发生什么变化？",o:["胸廓扩大，肺扩张","胸廓缩小，肺收缩","都不变","先大后小随机"],a:0,k:"吸气胸廓扩大",e:"解析：吸气时胸廓扩大、肺扩张，外界空气进入肺；呼气时相反。"},
{i:28,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:0,q:"我们呼出的气体和吸入的空气相比，哪种成分增加？",o:["二氧化碳","氧气","氮气（大幅增加）","氢气"],a:0,k:"呼出气二氧化碳多",e:"解析：呼出气体中二氧化碳增多、氧气减少。"},
{i:29,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:0,q:"肺活量是指？",o:["一次尽力吸气后再尽力呼出的气体总量","胃的容量","心脏大小","血液量"],a:0,k:"肺活量定义",e:"解析：肺活量是一次尽力吸气后，再尽力呼出的气体总量。"},
{i:30,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:0,q:"经常参加体育锻炼，肺活量会？",o:["增大","减小","不变","消失"],a:0,k:"锻炼增大肺活量",e:"解析：经常锻炼能增强呼吸肌，使肺活量增大。"},
{i:31,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:0,q:"气管内壁有纤毛和黏液，主要作用是？",o:["阻挡灰尘和细菌","帮助消化","产生声音","运输血液"],a:0,k:"气管自我保护",e:"解析：纤毛和黏液能粘住灰尘、细菌，保护呼吸道。"},
{i:32,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:1,q:"人体通过____吸入氧气、排出二氧化碳。",o:[],a:"呼吸",k:"呼吸功能",e:"解析：呼吸系统通过呼吸实现气体交换，吸入氧气、排出二氧化碳。"},
{i:33,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:0,q:"氧气进入血液后，主要靠什么运到全身？",o:["血液循环（血液）","头发","指甲","骨骼"],a:0,k:"血液运输氧气",e:"解析：氧气进入血液后，由血液循环运送到全身细胞。"},
{i:34,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:0,q:"下列做法不利于保护呼吸器官的是？",o:["雾霾天不戴口罩还长跑","不吸烟","保持空气清新","锻炼肺活量"],a:0,k:"保护呼吸器官",e:"解析：雾霾天不戴口罩长跑会吸入污染物，损害呼吸道。"},
{i:35,c:"4sci-3",ch:"四上·第2单元 呼吸与消化（呼吸系统）",f:1,q:"气体从鼻进入后，经过咽、喉，再进入____。",o:[],a:"气管",k:"呼吸通道",e:"解析：空气经鼻、咽、喉后进入气管，再到支气管和肺。"},

{i:36,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:0,q:"食物初步消化从哪个器官开始？",o:["口腔","大肠","小肠末端","皮肤"],a:0,k:"消化从口腔开始",e:"解析：口腔中牙齿咀嚼、唾液初步消化淀粉，消化从口腔开始。"},
{i:37,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:0,q:"米饭在口腔中咀嚼久了会有甜味，是因为唾液把淀粉变成了？",o:["麦芽糖","食盐","沙子","水"],a:0,k:"唾液淀粉酶",e:"解析：唾液中的淀粉酶把淀粉分解为麦芽糖，所以越嚼越甜。"},
{i:38,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:0,q:"下图中食物旅行的路线里，主要消化和吸收营养的器官是？",o:["小肠","牙齿","食道","鼻腔"],a:0,k:"小肠主消化吸收",e:"解析：小肠很长，内壁有绒毛，是消化和吸收营养物质的主要场所。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g4sci/digestive.svg"},
{i:39,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:0,q:"胃液主要能初步消化哪类营养物质？",o:["蛋白质","维生素","水","无机盐"],a:0,k:"胃液消化蛋白质",e:"解析：胃里的胃液含胃蛋白酶，能初步消化蛋白质。"},
{i:40,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:0,q:"淀粉遇碘酒会变成什么颜色，可用来检验淀粉？",o:["蓝（蓝紫）色","红色","绿色","无色"],a:0,k:"淀粉遇碘变蓝",e:"解析：淀粉遇碘酒变蓝（蓝紫）色，这是检验淀粉的特性反应。"},
{i:41,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:0,q:"大肠的主要作用是什么？",o:["吸收水分，形成粪便","消化蛋白质","产生胆汁","进行呼吸"],a:0,k:"大肠吸水",e:"解析：大肠吸收水分和少量无机盐，形成并贮存粪便。"},
{i:42,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:0,q:"肝脏分泌的胆汁主要帮助消化什么？",o:["脂肪","淀粉","维生素","水"],a:0,k:"胆汁乳化脂肪",e:"解析：胆汁能把脂肪乳化成小颗粒，帮助脂肪消化。"},
{i:43,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:0,q:"下列做法符合均衡膳食的是？",o:["食物多样、不挑食","只吃肉","只吃零食","不吃蔬菜"],a:0,k:"均衡膳食",e:"解析：均衡膳食应食物多样、谷类为主、荤素搭配。"},
{i:44,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:1,q:"食物在____里被牙齿咀嚼、与唾液混合，开始消化。",o:[],a:"口腔",k:"口腔消化",e:"解析：口腔中牙齿咀嚼、舌头搅拌、唾液混合，是消化的开始。"},
{i:45,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:1,q:"营养物质主要在____被吸收进血液。",o:[],a:"小肠",k:"小肠吸收",e:"解析：小肠是消化和吸收的主要场所，营养物质在这里进入血液。"},
{i:46,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:0,q:"牙齿的主要作用是什么？",o:["咀嚼磨碎食物","呼吸","听声音","发光"],a:0,k:"牙齿咀嚼",e:"解析：牙齿把食物磨碎，便于消化。"},
{i:47,c:"4sci-4",ch:"四上·第2单元 呼吸与消化（消化系统）",f:0,q:"关于消化，下列说法正确的是？",o:["消化是把食物变成可吸收的小分子","消化只是把食物切开","消化只在口腔发生","食物直接变成血"],a:0,k:"消化本质",e:"解析：消化是把大分子营养物质分解为可吸收的小分子的过程。"},

{i:48,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:0,q:"一个简单电路要让灯泡发光，必不可少的是？",o:["电源、导线、用电器（灯泡）","只用水","只用空气","只用声音"],a:0,k:"电路三要素",e:"解析：简单电路一般要有电源、导线和用电器（如灯泡）形成回路。"},
{i:49,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:0,q:"电池凸起的一端是？",o:["正极（+）","负极（−）","没有极性","中间"],a:0,k:"电池极性",e:"解析：电池铜帽（凸起端）是正极，锌壳是负极。"},
{i:50,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:0,q:"下图中电流从电池出发，经过导线和灯泡再回到电池，形成？",o:["闭合回路","断路","真空","磁场"],a:0,k:"闭合回路",e:"解析：只有构成闭合回路，电流才能流过灯丝使灯泡发光。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g4sci/circuit.svg"},
{i:51,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:0,q:"用导线直接把电池两极连起来，会发生什么？",o:["短路，电池发烫甚至损坏","灯泡更亮","什么也不发生","产生彩虹"],a:0,k:"短路危险",e:"解析：导线直接连电池两极叫短路，电流过大，电池会很快发烫损坏。"},
{i:52,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:0,q:"开关在电路中的作用是？",o:["接通或断开电路","发电","存电","改变颜色"],a:0,k:"开关作用",e:"解析：开关能控制电路的通断。"},
{i:53,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:0,q:"两节电池串联（首尾相连）比一节电池，灯泡通常？",o:["更亮","更暗","不亮","不变"],a:0,k:"串联电压增大",e:"解析：串联增加电压，通过灯泡的电流更大，灯泡更亮。"},
{i:54,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:0,q:"下列用电器中，主要把电能变成光的是？",o:["电灯","电炉（热）","电动机（动）","电池"],a:0,k:"电能转化",e:"解析：电灯主要把电能转化为光（和少量热）。"},
{i:55,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:1,q:"连接电路时，电流只有形成____回路，灯泡才会亮。",o:[],a:"闭合",k:"闭合回路",e:"解析：必须形成闭合回路，电流才能通过灯泡使其发光。"},
{i:56,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:1,q:"电池有正、负两极，铜帽一端是____极。",o:[],a:"正",k:"电池极性",e:"解析：电池铜帽（凸起端）为正极，锌壳为负极。"},
{i:57,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:0,q:"小灯泡的发光部分主要是？",o:["灯丝","玻璃泡","金属螺口","底座"],a:0,k:"灯丝发光",e:"解析：电流通过灯丝（钨丝）发热到白炽而发光。"},
{i:58,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:0,q:"关于电路，正确的是？",o:["断开开关，电流中断，灯泡灭","开关不影响灯泡","导线越长灯泡越亮","电池越多灯泡越暗"],a:0,k:"开关控制电路",e:"解析：开关断开时电路断路，电流中断，灯泡熄灭。"},
{i:59,c:"4sci-5",ch:"四下·第1单元 电路（简单电路）",f:0,q:"下列哪种连接能让灯泡亮起来？",o:["用导线把灯泡接入电池两端形成回路","把灯泡放电池旁不连线","只接灯泡一端","用橡皮把线隔开"],a:0,k:"形成回路才亮",e:"解析：必须让电流形成闭合回路，灯泡才会亮。"},

{i:60,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:0,q:"下列材料容易导电的是？",o:["铁（金属）","橡胶","塑料","干木头"],a:0,k:"金属是导体",e:"解析：金属（如铁、铜、铝）容易导电，是导体。"},
{i:61,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:0,q:"下图中蓝色框里的材料（金属、人体、大地、食盐水）都属于？",o:["导体","绝缘体","光源","热源"],a:0,k:"导体一类",e:"解析：金属、人体、大地、食盐水都容易导电，属于导体。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g4sci/conductor.svg"},
{i:62,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:0,q:"下列适合做电线外皮的是？",o:["塑料（绝缘体）","铜","铝","铁"],a:0,k:"外皮用绝缘体",e:"解析：电线外皮用绝缘体（如塑料）防止触电，内芯用导体（铜）导电。"},
{i:63,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:0,q:"人体和大地属于？",o:["导体","绝缘体","既不导也不绝","磁体"],a:0,k:"人体大地是导体",e:"解析：人体和大地都含有可自由移动的电荷，能导电，属于导体。"},
{i:64,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:0,q:"关于导体和绝缘体，正确的是？",o:["导体和绝缘体不是绝对的，湿木头也能导电","导体永远导电、绝缘体永远绝对不导电","绝缘体什么都不是","导体都不是金属"],a:0,k:"导绝非绝对",e:"解析：导体和绝缘体之间没有绝对界限，干木头不导电，湿木头能导电。"},
{i:65,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:0,q:"开关里既有导体又有绝缘体，绝缘体部分的作用是？",o:["防止触电、安全操作","导电","发光","发声"],a:0,k:"绝缘体保安全",e:"解析：开关外壳用绝缘体，避免人手触电。"},
{i:66,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:0,q:"下列不能用来做导体的是？",o:["玻璃","铜丝","铝箔","食盐水"],a:0,k:"玻璃是绝缘体",e:"解析：玻璃不容易导电，是绝缘体，不能作导体。"},
{i:67,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:1,q:"像铜、铁这样的金属容易导电，叫做____。",o:[],a:"导体",k:"导体",e:"解析：容易导电的物体叫导体，金属是最常见的导体。"},
{i:68,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:1,q:"像橡胶、塑料这样不容易导电的材料，叫做____。",o:[],a:"绝缘体",k:"绝缘体",e:"解析：不容易导电的物体叫绝缘体，如橡胶、塑料、玻璃、陶瓷。"},
{i:69,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:0,q:"湿手触摸电器比干手更危险，是因为？",o:["水（含杂质）能导电","水更滑","水更凉","水会发光"],a:0,k:"湿手危险",e:"解析：纯水不导电，但日常的水含杂质能导电，湿手易触电。"},
{i:70,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:0,q:"下列物品外壳用绝缘体制作以保安全的是？",o:["电笔外壳（塑料）","铁丝","铜片","铝箔"],a:0,k:"绝缘外壳",e:"解析：电笔外壳用塑料等绝缘体，防止使用时触电。"},
{i:71,c:"4sci-6",ch:"四下·第1单元 电路（导体与绝缘体）",f:0,q:"检测物体是否导电，通常把它连入什么中观察灯泡是否亮？",o:["简单电路","水杯","火炉","镜子"],a:0,k:"检测器=电路",e:"解析：用简单的检测电路（电池、灯泡、导线）可判断物体是否导电。"},

{i:72,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:0,q:"花岗岩属于哪类岩石？",o:["岩浆岩","沉积岩","变质岩","陨石"],a:0,k:"花岗岩是岩浆岩",e:"解析：花岗岩是岩浆冷却凝固形成的岩浆岩。"},
{i:73,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:0,q:"下图中岩石按成因可划分为哪三类？",o:["岩浆岩、沉积岩、变质岩","金、银、铜","红、黄、蓝","沙、土、水"],a:0,k:"三类岩石",e:"解析：岩石按成因分为岩浆岩、沉积岩和变质岩。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g4sci/rocks.svg"},
{i:74,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:0,q:"由泥沙等沉积物层层压实、胶结形成的是？",o:["沉积岩（如砂岩、石灰岩）","岩浆岩","变质岩","火山岩"],a:0,k:"沉积岩成因",e:"解析：砂岩、页岩、石灰岩等由沉积物压实胶结而成，属于沉积岩。"},
{i:75,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:0,q:"大理岩是由哪种岩石经高温高压变质而成？",o:["石灰岩","花岗岩","玄武岩","砂岩"],a:0,k:"大理岩来源",e:"解析：大理岩由石灰岩在高温高压下变质形成。"},
{i:76,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:0,q:"花岗岩中常见的主要矿物不包括？",o:["石灰（方解石）","石英","长石","云母"],a:0,k:"花岗岩矿物",e:"解析：花岗岩主要由石英、长石、云母组成，不含石灰（方解石）。"},
{i:77,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:0,q:"比较矿物硬度时，下列能刻动较多矿物的是？",o:["小刀（较硬）","指甲","铜钥匙","手指"],a:0,k:"硬度比较",e:"解析：矿物硬度可用指甲(约2.5)、铜钥匙(约3)、小刀(约5.5)划刻比较，小刀最硬能刻动更多。"},
{i:78,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:0,q:"下列由岩浆冷却形成的是？",o:["玄武岩","砂岩","页岩","大理岩"],a:0,k:"玄武岩是岩浆岩",e:"解析：玄武岩是岩浆喷出冷却形成的岩浆岩。"},
{i:79,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:1,q:"岩石按成因可分为岩浆岩、沉积岩和____。",o:[],a:"变质岩",k:"三类岩石",e:"解析：岩石按成因分为岩浆岩、沉积岩、变质岩三类。"},
{i:80,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:1,q:"花岗岩中常含有石英、长石和____三种矿物。",o:[],a:"云母",k:"花岗岩矿物",e:"解析：花岗岩主要由石英、长石、云母三种矿物组成。"},
{i:81,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:0,q:"关于岩石的用途，不正确的是？",o:["岩石不能做任何事","建筑房屋","铺路","雕刻"],a:0,k:"岩石用途",e:"解析：岩石可建筑、铺路、雕刻等，用途很广。"},
{i:82,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:0,q:"砂岩属于？",o:["沉积岩","岩浆岩","变质岩","金属"],a:0,k:"砂岩是沉积岩",e:"解析：砂岩由砂粒沉积胶结而成，属于沉积岩。"},
{i:83,c:"4sci-7",ch:"四下·第2单元 岩石与矿物",f:0,q:"关于矿物，正确的是？",o:["矿物是自然存在、有固定成分的物质","矿物都是人造的","矿物没有颜色","矿物都不能用"],a:0,k:"矿物定义",e:"解析：矿物是自然界中天然存在、成分相对固定的物质，如石英、方解石。"},

{i:84,c:"4sci-8",ch:"四下·第3单元 地球运动",f:0,q:"地球的形状是？",o:["两极稍扁、赤道略鼓的球体","绝对标准圆球","平板","立方体"],a:0,k:"地球形状",e:"解析：地球是一个两极稍扁、赤道略鼓的不规则球体。"},
{i:85,c:"4sci-8",ch:"四下·第3单元 地球运动",f:0,q:"下图中地球绕地轴转动，产生的是？",o:["昼夜交替","四季","月相","星座"],a:0,k:"自转→昼夜",e:"解析：地球自转约24小时，产生昼夜交替现象。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g4sci/earth_motion.svg"},
{i:86,c:"4sci-8",ch:"四下·第3单元 地球运动",f:0,q:"地球自转的方向是？",o:["自西向东","自东向西","静止不动","上下翻滚"],a:0,k:"自转方向",e:"解析：地球自转方向是自西向东，所以从北极上空看是逆时针。"},
{i:87,c:"4sci-8",ch:"四下·第3单元 地球运动",f:0,q:"地球自转一周大约需要？",o:["24小时（一天）","1年","1个月","1小时"],a:0,k:"自转周期",e:"解析：地球自转一周约24小时，即一天。"},
{i:88,c:"4sci-8",ch:"四下·第3单元 地球运动",f:0,q:"地球公转一周大约需要？",o:["365天（一年）","1天","1小时","10天"],a:0,k:"公转周期",e:"解析：地球绕太阳公转一周约365天，即一年。"},
{i:89,c:"4sci-8",ch:"四下·第3单元 地球运动",f:0,q:"一年四季的变化主要是由于地球的？",o:["公转且地轴倾斜","自转","形状","大小"],a:0,k:"四季成因",e:"解析：地球公转时地轴倾斜，使太阳直射点在南北回归线间移动，形成四季。"},
{i:90,c:"4sci-8",ch:"四下·第3单元 地球运动",f:0,q:"地轴与公转轨道面大约倾斜多少度？",o:["约23.5°","0°","90°","180°"],a:0,k:"地轴倾角",e:"解析：地轴倾斜约23.5°，这是形成四季的重要原因。"},
{i:91,c:"4sci-8",ch:"四下·第3单元 地球运动",f:1,q:"地球自转产生____交替现象。",o:[],a:"昼夜",k:"自转→昼夜",e:"解析：地球自转使地球表面不断面向或背向太阳，形成昼夜交替。"},
{i:92,c:"4sci-8",ch:"四下·第3单元 地球运动",f:1,q:"地球绕太阳公转产生____变化。",o:[],a:"四季",k:"公转→四季",e:"解析：地球公转加上地轴倾斜，使各地受热不同，形成春夏秋冬四季。"},
{i:93,c:"4sci-8",ch:"四下·第3单元 地球运动",f:0,q:"最早用实验证明地球在自转的是？",o:["傅科摆","钟摆","天平","温度计"],a:0,k:"傅科摆",e:"解析：傅科摆的摆动方向相对地面不断偏转，证明地球在自转。"},
{i:94,c:"4sci-8",ch:"四下·第3单元 地球运动",f:0,q:"在同一天里，东边的地方比西边的地方？",o:["先迎来黎明","后迎来黎明","永不天亮","同时处于黑夜"],a:0,k:"东边先黎明",e:"解析：地球自西向东转，东边先被太阳照到，先迎来黎明。"},
{i:95,c:"4sci-8",ch:"四下·第3单元 地球运动",f:0,q:"关于地球的运动，正确的是？",o:["地球同时在自转和公转","只自转不公转","只公转不自转","既不自转也不公转"],a:0,k:"同时自转公转",e:"解析：地球既绕地轴自转，又绕太阳公转。"},

{i:96,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:0,q:"下列不属于降水形式的是？",o:["风","雨","雪","冰雹"],a:0,k:"降水形式",e:"解析：降水是从云中降落到地面的液态或固态水，风不是降水。"},
{i:97,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:0,q:"下图中所示的降水形式包括雨、雪和？",o:["冰雹","雷电","彩虹","风"],a:0,k:"降水三形式",e:"解析：常见的降水形式有雨、雪、冰雹。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g4sci/precipitation.svg"},
{i:98,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:0,q:"测量降水量的仪器是？",o:["雨量器","温度计","风向标","天平"],a:0,k:"雨量器",e:"解析：雨量器用来收集并测量降水量。"},
{i:99,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:0,q:"降水量的单位通常是？",o:["毫米（mm）","千克","摄氏度","米/秒"],a:0,k:"降水量单位",e:"解析：降水量指雨水深度，单位用毫米。"},
{i:100,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:0,q:"风向是指？",o:["风吹来的方向","风吹去的方向","风的速度","风的颜色"],a:0,k:"风向定义",e:"解析：风向指风的来向，如北风是从北边吹来的风。"},
{i:101,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:0,q:"“北风”是指？",o:["从北边吹来的风","吹向北边的风","没有风","向南吹的风"],a:0,k:"北风含义",e:"解析：北风是从北方吹来的风。"},
{i:102,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:0,q:"天空中的云按高度和形状常分为？",o:["积云、层云、卷云","红云、绿云、蓝云","大云、小云","云A、云B"],a:0,k:"云的分类",e:"解析：云常分为积云、层云、卷云三类。"},
{i:103,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:0,q:"像一团团棉花似的云通常是？",o:["积云","丝状细云（卷云）","贴地灰幕（层云）","火球"],a:0,k:"积云特征",e:"解析：积云孤立、像棉花团，常出现在晴天。"},
{i:104,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:1,q:"雨、雪、冰雹都是____的不同形式。",o:[],a:"降水",k:"降水形式",e:"解析：雨、雪、冰雹都是从云中降落的水，属于降水的不同形式。"},
{i:105,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:1,q:"天气的冷热程度用____表示，单位是摄氏度。",o:[],a:"气温",k:"气温",e:"解析：气温指空气冷热程度，用摄氏度（℃）表示。"},
{i:106,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:0,q:"通常用来观测风向的仪器是？",o:["风向标","雨量器","温度计","显微镜"],a:0,k:"风向标",e:"解析：风向标箭头指向风吹来的方向，用来测风向。"},
{i:107,c:"4sci-9",ch:"四下·第4单元 降水与天气",f:0,q:"关于天气，正确的是？",o:["天气是短时间内的大气状况","天气永远不变","天气只指下雨","天气与生活无关"],a:0,k:"天气概念",e:"解析：天气是某一地区短时间内的大气状况，如阴晴、冷暖、风雨等。"},

{i:108,c:"4sci-10",ch:"四下·第5单元 植物的生长变化",f:0,q:"种子里能发育成新植物的是？",o:["胚","种皮","沙子","颜色"],a:0,k:"胚发育成新株",e:"解析：种子由种皮和胚组成，胚（胚芽、胚轴、胚根、子叶）发育成新植株。"},
{i:109,c:"4sci-10",ch:"四下·第5单元 植物的生长变化",f:0,q:"种子萌发不需要的条件是？",o:["土壤","水","空气（氧气）","适宜的温度"],a:0,k:"萌发三条件",e:"解析：种子萌发需要水、空气和适宜温度，一般不需要土壤。"},
{i:110,c:"4sci-10",ch:"四下·第5单元 植物的生长变化",f:0,q:"下图中根的主要作用是？",o:["吸收水和无机盐、固定植物","开花","结果","发光"],a:0,k:"根的作用",e:"解析：根把植物固定在土壤里，并吸收水分和无机盐。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g4sci/plant_growth.svg"},
{i:111,c:"4sci-10",ch:"四下·第5单元 植物的生长变化",f:0,q:"植物体内把水分从根运到叶的结构是？",o:["茎（导管）","花瓣","果皮","种子"],a:0,k:"茎的运输",e:"解析：茎内的导管把根吸收的水和无机盐向上运输到叶。"},

{i:1,c:"4yw-1",ch:"四上·第1单元 自然奇观",f:0,q:"“鼎沸”的“鼎”字读音是（ ）。",o:["dǐng","dīng","tǐng","dìng"],a:0,k:"字音：鼎dǐng",e:"解析：“鼎”读dǐng，第三声，如“人声鼎沸”“鼎力”。"},
{i:2,c:"4yw-1",ch:"四上·第1单元 自然奇观",f:0,q:"《走月亮》中“细细的溪水，流着山草和野花的香味，流着月光”运用了（ ）的修辞手法。",o:["比喻","拟人","通感（或移觉）","夸张"],a:2,k:"修辞手法：通感",e:"解析：把嗅觉（香味）、视觉（月光）用“流着”这一动作写出，属于通感（把不同感官的感觉沟通起来），让景物更鲜活。"},
{i:3,c:"4yw-1",ch:"四上·第1单元 自然奇观",f:0,q:"《秋晚的江上》的作者是（ ）。",o:["刘大白","郭沫若","徐志摩","冰心"],a:0,k:"文学常识：《秋晚的江上》",e:"解析：《秋晚的江上》作者是刘大白，诗中写了归巢的鸟儿、斜阳、芦苇等意象。"},
{i:4,c:"4yw-1",ch:"四上·第1单元 自然奇观",f:0,q:"《花牛歌》的作者是（ ）。",o:["徐志摩","胡适","闻一多","刘大白"],a:0,k:"文学常识：《花牛歌》",e:"解析：《花牛歌》作者是徐志摩，诗歌描写花牛在草地里坐、眠、走、做梦的可爱形象。"},

{i:6,c:"4yw-1",ch:"四上·第1单元 自然奇观",f:0,q:"下列句子中，运用了比喻修辞的是（ ）。",o:["浪潮越来越近，犹如千万匹白色战马齐头并进","花牛在草地里眠，白云霸占了半个天","归巢的鸟儿，尽管是倦了，还驮着斜阳回去","沟水汩汩，很满意地响着"],a:0,k:"修辞手法：比喻",e:"解析：A把“浪潮”比作“千万匹白色战马”，有本体、喻体、喻词“犹如”，是比喻；B、C、D把物当人写，是拟人。"},
{i:7,c:"4yw-1",ch:"四上·第1单元 自然奇观",f:0,q:"“人声鼎沸”这个成语的意思是（ ）。",o:["形容人很多，声音嘈杂喧闹","形容人非常安静","形容人说话很有礼貌","形容人多力量大"],a:0,k:"成语：人声鼎沸",e:"解析：“鼎沸”像锅里沸腾的水，“人声鼎沸”形容人群声音喧闹，像水在锅里沸腾一样。"},
{i:8,c:"4yw-1",ch:"四上·第1单元 自然奇观",f:0,q:"《走月亮》一文中，“走月亮”是指（ ）。",o:["在月光下散步","月亮在天上移动","赶月亮走","看月亮升起"],a:0,k:"词义理解：《走月亮》",e:"解析：“走月亮”是吴地（南方）的一种风俗，指中秋夜妇女在月光下散步、游玩，文中指“我”和阿妈在月光下散步。"},
{i:9,c:"4yw-1",ch:"四上·第1单元 自然奇观",f:0,q:"下列词语书写完全正确的一组是（ ）。",o:["宽阔 笼罩 依旧 恢复","宽扩 笼照 依就 恢付","宽濶 茏罩 依旧 恢復","宽括 笼昭 依旧 恢服"],a:0,k:"字形辨析",e:"解析：A项全部正确；B、C、D中“宽阔”误为“宽扩/宽濶/宽括”等，均为错字。"},
{i:10,c:"4yw-1",ch:"四上·第1单元 自然奇观",f:1,q:"《观潮》中描写浪潮声音巨大的四字词语有____、____（写出两个）。",o:[],a:"山崩地裂、闷雷滚动",k:"词语积累：《观潮》",e:"解析：文中写潮来时声音“好像闷雷滚动”，近处“犹如山崩地裂”，这两个四字词语写出了大潮的声势。"},

{i:11,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:0,q:"《暮江吟》的作者是（ ）。",o:["白居易","杜甫","李白","王维"],a:0,k:"文学常识：《暮江吟》",e:"解析：《暮江吟》是唐代诗人白居易的作品，描写傍晚江面和夜晚的景色。"},
{i:12,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:0,q:"“一道残阳铺水中，半江瑟瑟半江红”中“瑟瑟”的意思是（ ）。",o:["碧绿色","寒冷的样子","发抖的样子","风声"],a:0,k:"词语理解：瑟瑟",e:"解析：“瑟瑟”在诗中指碧绿色的宝石，这里形容未被残阳照到的江水呈碧绿色，与受光的红色形成对比。"},
{i:13,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:0,q:"《题西林壁》“不识庐山真面目，只缘身在此山中”中“只缘”的意思是（ ）。",o:["只因为","原来","一直","无缘无故"],a:0,k:"词语理解：只缘",e:"解析：“缘”是“因为”，“只缘”即“只因为”。诗句说明身在其中反而看不清事物全貌，蕴含“当局者迷”的哲理。"},
{i:14,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:0,q:"《题西林壁》的作者是（ ），他号东坡居士。",o:["苏轼","苏洵","苏辙","欧阳修"],a:0,k:"文学常识：苏轼",e:"解析：《题西林壁》作者是北宋诗人苏轼，他与父亲苏洵、弟弟苏辙合称“三苏”。"},
{i:15,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:0,q:"《雪梅》“梅须逊雪三分白，雪却输梅一段香”告诉我们（ ）。",o:["事物各有所长，也各有所短，应取人之长补己之短","雪比梅更香","梅比雪更白","梅和雪完全一样"],a:0,k:"诗意理解：《雪梅》",e:"解析：“逊”是“不及”，“输”也是“不如”。诗句说梅不如雪白，雪不如梅香，说明事物各有优缺点，要互相学习。"},
{i:16,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:0,q:"“梅雪争春未肯降”中“降”的意思是（ ）。",o:["服输","下降","投降","降落"],a:0,k:"词语理解：降",e:"解析：“降”读xiáng，意为“服输、认输”。诗人写梅和雪争春互不相让，连诗人也放下笔难评高下。"},
{i:17,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:1,q:"《暮江吟》中写九月初三夜景象的诗句：可怜九月初三夜，____。",o:[],a:"露似真珠月似弓",k:"古诗默写：《暮江吟》",e:"解析：原句为“可怜九月初三夜，露似真珠月似弓”，“可怜”意为可爱，“真珠”即珍珠。"},
{i:18,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:0,q:"下列诗句中，与“当局者迷，旁观者清”意思相近的是（ ）。",o:["不识庐山真面目，只缘身在此山中","梅须逊雪三分白，雪却输梅一段香","一道残阳铺水中，半江瑟瑟半江红","露似真珠月似弓"],a:0,k:"诗句哲理",e:"解析：“不识庐山真面目，只缘身在此山中”说明因为身处其中而看不清全局，与“当局者迷，旁观者清”同理。"},
{i:19,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:0,q:"《题西林壁》“横看成岭侧成峰，远近高低各不同”写的是（ ）。",o:["从不同角度看庐山，样子各不相同","庐山的天气变化","庐山的花草","诗人的行程"],a:0,k:"诗意理解：《题西林壁》",e:"解析：诗句写横看、侧看、远看、近看庐山，形态各不相同，说明观察角度不同，认识也不同。"},
{i:20,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:0,q:"“骚人阁笔费评章”中“阁笔”的意思是（ ）。",o:["放下笔","拿起笔","握笔","扔掉笔"],a:0,k:"词语理解：阁笔",e:"解析：“阁”同“搁”，放下。“阁笔”即放下笔，指诗人因梅雪难分高下而停下笔难作评判。"},
{i:21,c:"4yw-2",ch:"四上·第3单元 古诗三首",f:1,q:"《题西林壁》中蕴含“从不同角度观察会有不同认识”的诗句：____，远近高低各不同。",o:[],a:"横看成岭侧成峰",k:"古诗默写：《题西林壁》",e:"解析：“横看成岭侧成峰，远近高低各不同”写出了从不同角度观察庐山形态各异。"},

{i:22,c:"4yw-3",ch:"四上·第4单元 神话故事",f:0,q:"《盘古开天地》中，盘古醒来后用（ ）分开了天和地。",o:["斧头","剑","大刀","神力"],a:0,k:"课文内容：《盘古开天地》",e:"解析：文中写盘古抡起斧头朝黑暗劈去，轻而清的东西上升为天，重而浊的东西下降为地。"},
{i:23,c:"4yw-3",ch:"四上·第4单元 神话故事",f:0,q:"《精卫填海》中，精卫本是（ ）。",o:["炎帝的小女儿女娃","黄帝的女儿","一只鸟","海神"],a:0,k:"文学常识：《精卫填海》",e:"解析：“炎帝之少女，名曰女娃。”女娃溺于东海，化为精卫鸟，常衔木石填海。"},
{i:24,c:"4yw-3",ch:"四上·第4单元 神话故事",f:0,q:"“常衔西山之木石，以堙于东海”中“堙”的意思是（ ）。",o:["填塞","扔掉","搬运","淹没"],a:0,k:"文言词义：堙",e:"解析：“堙”意为“填塞”，精卫鸟常衔西山的树枝石块，用来填塞东海，表现其坚韧不屈。"},
{i:25,c:"4yw-3",ch:"四上·第4单元 神话故事",f:0,q:"《普罗米修斯》中，普罗米修斯从（ ）那里为人类盗取火种。",o:["太阳车","宙斯","阿波罗","赫拉克勒斯"],a:0,k:"课文内容：《普罗米修斯》",e:"解析：普罗米修斯从太阳车的火焰中盗取火种带到人间，因此被宙斯惩罚锁在高加索山上。"},
{i:26,c:"4yw-3",ch:"四上·第4单元 神话故事",f:0,q:"《女娲补天》中，女娲用来补天的是（ ）。",o:["五色石","黄金","白玉","泥土"],a:0,k:"课文内容：《女娲补天》",e:"解析：神话中女娲炼五色石以补苍天，斩巨龟四足撑天，杀黑龙、积芦灰止洪水。"},
{i:27,c:"4yw-3",ch:"四上·第4单元 神话故事",f:0,q:"下列神话人物与其事迹搭配正确的是（ ）。",o:["精卫——衔石填海","盘古——射下九日","普罗米修斯——开天辟地","女娲——盗取火种"],a:0,k:"神话人物",e:"解析：A正确，精卫衔石填海；B射日的是后羿；C开天辟地的是盘古；D盗火的是普罗米修斯。"},
{i:28,c:"4yw-3",ch:"四上·第4单元 神话故事",f:0,q:"《精卫填海》选自（ ）。",o:["《山海经》","《史记》","《论语》","《庄子》"],a:0,k:"文学常识：《山海经》",e:"解析：《精卫填海》出自《山海经·北山经》，“精卫填海”后比喻意志坚定、不畏艰难。"},
{i:29,c:"4yw-3",ch:"四上·第4单元 神话故事",f:1,q:"《盘古开天地》中，盘古倒下后，他的气息变成了____，他的汗水变成了____。",o:[],a:"四季的风和飘动的云、滋润万物的雨露",k:"课文内容：《盘古开天地》",e:"解析：文中写盘古的身体化为万物：气息变风云，声音变雷声，双眼变日月，汗水变雨露等，想象丰富。"},
{i:30,c:"4yw-3",ch:"四上·第4单元 神话故事",f:0,q:"“炎帝之少女”中“少女”的意思是（ ）。",o:["小女儿","年轻女子","少女","姑娘"],a:0,k:"文言词义：少女",e:"解析：文言文中“少女”指“小女儿”，与现代汉语“少女”（年轻姑娘）意思不同。"},
{i:31,c:"4yw-3",ch:"四上·第4单元 神话故事",f:0,q:"普罗米修斯被锁在高加索山上，最终是（ ）救了他。",o:["赫拉克勒斯","宙斯","阿波罗","雅典娜"],a:0,k:"课文内容：《普罗米修斯》",e:"解析：希腊神话中，大力神赫拉克勒斯射死鹫鹰、砸碎锁链，解救了普罗米修斯。"},
{i:32,c:"4yw-3",ch:"四上·第4单元 神话故事",f:0,q:"下列故事中，属于中国神话的是（ ）。",o:["女娲补天","普罗米修斯盗火","亚当与夏娃","诺亚方舟"],a:0,k:"神话归类",e:"解析：“女娲补天”是中国创世神话；B是希腊神话，C、D是《圣经》故事。"},
{i:33,c:"4yw-3",ch:"四上·第4单元 神话故事",f:1,q:"《精卫填海》中写女娃化鸟原因的句子：女娃游于东海，____，故为精卫。",o:[],a:"溺而不返",k:"文言默写：《精卫填海》",e:"解析：原句“女娃游于东海，溺而不返，故为精卫”，“溺”是溺水，“不返”是没有回来。"},

{i:34,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:0,q:"《出塞》“但使龙城飞将在，不教胡马度阴山”中“飞将”指的是（ ）。",o:["汉代名将李广","霍去病","卫青","项羽"],a:0,k:"文学常识：飞将李广",e:"解析：“飞将”指西汉名将李广，人称“飞将军”。诗人借怀念李广，表达希望有良将守边的愿望。"},
{i:35,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:0,q:"《出塞》的作者是（ ）。",o:["王昌龄","王翰","李清照","王维"],a:0,k:"文学常识：《出塞》",e:"解析：《出塞》是唐代诗人王昌龄的七言绝句，被誉为“唐人七绝的压卷之作”。"},
{i:36,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:0,q:"《凉州词》“葡萄美酒夜光杯，欲饮琵琶马上催”描写的是（ ）场景。",o:["将士出征前饮酒","宫廷宴会","朋友送别","农家小聚"],a:0,k:"诗意理解：《凉州词》",e:"解析：王翰《凉州词》写边塞军中宴饮，葡萄美酒、夜光杯、琵琶，表现将士豪放旷达的胸襟。"},
{i:37,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:0,q:"《夏日绝句》“生当作人杰，死亦为鬼雄”的作者是（ ）。",o:["李清照","李白","杜甫","白居易"],a:0,k:"文学常识：李清照",e:"解析：李清照是宋代女词人，“生当作人杰，死亦为鬼雄”借项羽表达了对南宋朝廷苟且偷安的愤慨。"},
{i:38,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:0,q:"“至今思项羽，不肯过江东”中“项羽”是（ ）时期人物。",o:["秦末楚汉","春秋","战国","三国"],a:0,k:"文学常识：项羽",e:"解析：项羽是秦末楚汉相争时的西楚霸王，兵败垓下，不肯回江东，自刎乌江。"},
{i:39,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:0,q:"《出塞》“万里长征人未还”表达的是（ ）。",o:["对出征将士久未归来的悲叹","对战争的赞美","对家乡美景的喜爱","对朋友的思念"],a:0,k:"诗意理解：《出塞》",e:"解析：“人未还”写征人远征万里、久久未归，既有对将士的同情，也有对和平的渴望。"},
{i:40,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:1,q:"《夏日绝句》中表明作者生死观的诗句：生当作人杰，____。",o:[],a:"死亦为鬼雄",k:"古诗默写：《夏日绝句》",e:"解析：“生当作人杰，死亦为鬼雄”表现了作者崇尚英雄、宁死不屈的气概。"},
{i:41,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:0,q:"下列诗句中，不是边塞诗的是（ ）。",o:["锄禾日当午，汗滴禾下土","秦时明月汉时关，万里长征人未还","葡萄美酒夜光杯，欲饮琵琶马上催","醉卧沙场君莫笑，古来征战几人回"],a:0,k:"诗歌题材",e:"解析：A是李绅《悯农》写农民劳作，属田园/悯农诗；B、C、D均为边塞诗。"},
{i:42,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:0,q:"《凉州词》的作者是（ ）。",o:["王翰","王昌龄","王之涣","王维"],a:0,k:"文学常识：《凉州词》",e:"解析：王翰（字子羽）作《凉州词》；注意王之涣也有《凉州词》“黄河远上白云间”，不要混淆。"},
{i:43,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:0,q:"“不教胡马度阴山”中“教”的读音和意思是（ ）。",o:["jiào，让","jiāo，教育","jiào，教导","jiāo，交给"],a:0,k:"字音字义：教",e:"解析：“教”此处读jiào，意为“让、使”，“不教胡马度阴山”即不让敌军越过阴山。"},
{i:44,c:"4yw-4",ch:"四上·第7单元 家国情怀古诗",f:1,q:"《出塞》前两句：____，万里长征人未还。",o:[],a:"秦时明月汉时关",k:"古诗默写：《出塞》",e:"解析：“秦时明月汉时关，万里长征人未还”，“秦时明月汉时关”运用互文，意即秦汉时的明月与关塞。"},

{i:45,c:"4yw-5",ch:"四上·第8单元 历史故事",f:0,q:"《王戎不取道旁李》中，王戎不摘李子的原因是（ ）。",o:["树在道边而多子，此必苦李","他不喜欢吃李子","李子还没熟","他够不着"],a:0,k:"课文内容：《王戎不取道旁李》",e:"解析：王戎推断“树在道边而多子，此必苦李”——大道边的树结满果子却没人摘，必是苦李，表现他善于观察思考。"},
{i:46,c:"4yw-5",ch:"四上·第8单元 历史故事",f:0,q:"王戎是（ ）时期“竹林七贤”之一。",o:["魏晋","汉代","唐代","宋代"],a:0,k:"文学常识：王戎",e:"解析：王戎是魏晋时期人，为“竹林七贤”之一。故事出自《世说新语》。"},
{i:47,c:"4yw-5",ch:"四上·第8单元 历史故事",f:0,q:"《西门豹治邺》中，西门豹用什么办法惩治了巫婆和官绅（ ）。",o:["以彼之道还施彼身，借口姑娘不漂亮把巫婆等投入漳河","直接下令捉拿","报告朝廷","发动百姓起义"],a:0,k:"课文内容：《西门豹治邺》",e:"解析：西门豹将计就计，说新娘不漂亮要巫婆去跟河神说一声，把巫婆投入河中，依次惩治官绅，破除迷信、兴修水利。"},
{i:48,c:"4yw-5",ch:"四上·第8单元 历史故事",f:0,q:"《故事二则》中“纪昌学射”告诉我们（ ）。",o:["学习要练好基本功，持之以恒","射箭很容易","要听老师的话","眼睛要大"],a:0,k:"寓意：纪昌学射",e:"解析：纪昌在飞卫指导下先练不眨眼的眼力、再看小如大的视功，说明学习任何本领都要从基本功练起、坚持不懈。"},
{i:49,c:"4yw-5",ch:"四上·第8单元 历史故事",f:0,q:"“扁鹊治病”中，蔡桓侯最终病死是因为（ ）。",o:["讳疾忌医，不肯早治","扁鹊医术不高","没有药","生病太重"],a:0,k:"寓意：扁鹊治病",e:"解析：蔡桓侯不听扁鹊劝告、隐瞒病情（讳疾忌医），小病拖成大病无法医治，说明有病要早治、要听忠告。"},
{i:50,c:"4yw-5",ch:"四上·第8单元 历史故事",f:0,q:"《西门豹治邺》中，邺地“田地荒芜，人烟稀少”的原因是（ ）。",o:["巫婆官绅借河神娶亲搜刮百姓，漳河常年泛滥","战争","瘟疫","地震"],a:0,k:"课文内容：《西门豹治邺》",e:"解析：邺地因巫婆与官绅以“给河神娶媳妇”为名年年搜刮钱财，加上漳河泛滥不治，导致民穷地荒。"},
{i:51,c:"4yw-5",ch:"四上·第8单元 历史故事",f:1,q:"《王戎不取道旁李》中王戎的推断：树在道边而多子，____。",o:[],a:"此必苦李",k:"文言默写",e:"解析：原句“树在道边而多子，此必苦李”，“必”是“一定”，体现王戎的推理能力。"},
{i:52,c:"4yw-5",ch:"四上·第8单元 历史故事",f:0,q:"“尝与诸小儿游”中“尝”的意思是（ ）。",o:["曾经","尝试","品尝","经常"],a:0,k:"文言词义：尝",e:"解析：文言文中“尝”常作“曾经”讲，“尝与诸小儿游”即“曾经和小朋友们一起游玩”。"},
{i:53,c:"4yw-5",ch:"四上·第8单元 历史故事",f:0,q:"《故事二则》包括（ ）。",o:["扁鹊治病、纪昌学射","精卫填海、夸父逐日","女娲补天、盘古开天","西门豹、王戎"],a:0,k:"课文内容",e:"解析：四年级上册《故事二则》为“扁鹊治病”和“纪昌学射”两则寓言式历史故事。"},
{i:54,c:"4yw-5",ch:"四上·第8单元 历史故事",f:0,q:"纪昌学射的老师是（ ）。",o:["飞卫","甘蝇","后羿","养由基"],a:0,k:"课文内容：纪昌学射",e:"解析：纪昌拜飞卫为师学射，飞卫先让他练眼力基本功，后教射箭。"},
{i:55,c:"4yw-5",ch:"四上·第8单元 历史故事",f:1,q:"《扁鹊治病》告诉我们不能____，要____（用成语或短语填空）。",o:[],a:"讳疾忌医、防微杜渐",k:"寓意：扁鹊治病",e:"解析：蔡桓侯讳疾忌医终至病亡，启示我们掩饰缺点、不愿改正会酿成大患，应在小问题时及时解决（防微杜渐）。"},

{i:56,c:"4yw-6",ch:"四下·第1单元 田园生活",f:0,q:"《四时田园杂兴（其二十五）》“梅子金黄杏子肥，麦花雪白菜花稀”描写的是（ ）景色。",o:["初夏江南田园","早春","深秋","寒冬"],a:0,k:"诗意理解：范成大",e:"解析：范成大这首诗写初夏江南田园：梅子黄、杏子肥、麦花白、菜花稀，色彩鲜明。"},
{i:57,c:"4yw-6",ch:"四下·第1单元 田园生活",f:0,q:"《宿新市徐公店》“儿童急走追黄蝶，飞入菜花无处寻”中“急走”的意思是（ ）。",o:["奔跑","慢慢走","着急地走","走开"],a:0,k:"词语理解：急走",e:"解析：文言中“走”是“跑”，“急走”即“奔跑”，写儿童追蝴蝶的活泼场景。"},
{i:58,c:"4yw-6",ch:"四下·第1单元 田园生活",f:0,q:"《清平乐·村居》中“最喜小儿亡赖”的“亡赖”意思是（ ）。",o:["顽皮、淘气","没有依靠","懒惰","无赖（贬义）"],a:0,k:"词语理解：亡赖",e:"解析：“亡赖”通“无赖”，此处是喜爱之意，指小儿调皮可爱，“溪头卧剥莲蓬”写出其天真。"},
{i:59,c:"4yw-6",ch:"四下·第1单元 田园生活",f:0,q:"《清平乐·村居》的作者是（ ），号稼轩。",o:["辛弃疾","苏轼","李清照","陆游"],a:0,k:"文学常识：辛弃疾",e:"解析：辛弃疾，字幼安，号稼轩，南宋豪放派词人，“清平乐”是词牌名，“村居”是题目。"},
{i:60,c:"4yw-6",ch:"四下·第1单元 田园生活",f:0,q:"《乡下人家》的作者是（ ）。",o:["陈醉云","茅盾","老舍","巴金"],a:0,k:"文学常识：《乡下人家》",e:"解析：《乡下人家》作者陈醉云，文章按房前屋后、春夏秋的时间顺序描绘乡村生活。"},
{i:61,c:"4yw-6",ch:"四下·第1单元 田园生活",f:0,q:"《天窗》的作者是（ ），他还写了《子夜》等。",o:["茅盾","鲁迅","叶圣陶","冰心"],a:0,k:"文学常识：《天窗》",e:"解析：《天窗》作者茅盾（沈雁冰），“天窗”是乡间屋顶上开的小窗，雨天夜晚成了孩子想象的窗口。"},
{i:62,c:"4yw-6",ch:"四下·第1单元 田园生活",f:1,q:"《宿新市徐公店》中写菜花丛中小孩追蝶的诗句：儿童急走追黄蝶，____。",o:[],a:"飞入菜花无处寻",k:"古诗默写",e:"解析：原句“儿童急走追黄蝶，飞入菜花无处寻”，黄蝶与黄花同色，故“无处寻”。"},
{i:63,c:"4yw-6",ch:"四下·第1单元 田园生活",f:0,q:"下列词语中，不是描写乡村生活的是（ ）。",o:["高楼林立","鸡犬相闻","炊烟袅袅","依山傍水"],a:0,k:"词语辨析",e:"解析：“高楼林立”形容城市建筑密集；“鸡犬相闻”“炊烟袅袅”“依山傍水”都描写乡村宁静生活。"},
{i:64,c:"4yw-6",ch:"四下·第1单元 田园生活",f:0,q:"《清平乐·村居》中，大儿、中儿、小儿分别在做什么（ ）。",o:["锄豆、织鸡笼、剥莲蓬","织鸡笼、锄豆、剥莲蓬","读书、种地、玩耍","钓鱼、砍柴、放牛"],a:0,k:"课文内容：《清平乐·村居》",e:"解析：词中写“大儿锄豆溪东，中儿正织鸡笼。最喜小儿亡赖，溪头卧剥莲蓬”，三个儿子各有事做。"},
{i:65,c:"4yw-6",ch:"四下·第1单元 田园生活",f:0,q:"《四时田园杂兴》的作者是（ ）诗人范成大。",o:["南宋","唐代","北宋","元代"],a:0,k:"文学常识：范成大",e:"解析：范成大是南宋诗人，《四时田园杂兴》组诗共60首，分“春日”“晚春”“夏日”“秋日”“冬日”五组写田园。"},
{i:66,c:"4yw-6",ch:"四下·第1单元 田园生活",f:1,q:"《四时田园杂兴（其二十五）》中写麦花与菜花的诗句：麦花雪白菜花____。",o:[],a:"稀",k:"古诗默写",e:"解析：原句“麦花雪白菜花稀”，“稀”指菜花已结籽稀疏，与前句“肥”相对。"},

{i:67,c:"4yw-7",ch:"四下·第3单元 诗歌",f:0,q:"《繁星（一五九）》“母亲啊！天上的风雨来了，鸟儿躲到它的巢里；心中的风雨来了，我只躲到你的怀里”中，两个“风雨”意思（ ）。",o:["第一个指自然界的风雨，第二个指生活中的困难、挫折","都指自然界的风雨","都指困难","第一个指困难，第二个指风雨"],a:0,k:"词语理解：《繁星》",e:"解析：第一个“风雨”是真实的自然风雨；第二个“风雨”比喻生活中的困难、烦恼，表达了对母亲的依恋。"},
{i:68,c:"4yw-7",ch:"四下·第3单元 诗歌",f:0,q:"《繁星》的作者是（ ），原名谢婉莹。",o:["冰心","丁玲","萧红","庐隐"],a:0,k:"文学常识：冰心",e:"解析：冰心，原名谢婉莹，代表作有诗集《繁星》《春水》，短文《繁星（七一）（一三一）（一五九）》。"},
{i:69,c:"4yw-7",ch:"四下·第3单元 诗歌",f:0,q:"《绿》的作者是（ ），诗中写“好像绿色的墨水瓶倒翻了”。",o:["艾青","冰心","郭沫若","徐志摩"],a:0,k:"文学常识：《绿》",e:"解析：《绿》作者是艾青，诗歌用丰富的绿色表现春天的生机，“所有的绿集中起来，挤在一起”。"},
{i:70,c:"4yw-7",ch:"四下·第3单元 诗歌",f:0,q:"《白桦》的作者是（ ）诗人叶赛宁。",o:["苏联（俄）","中国","法国","美国"],a:0,k:"文学常识：《白桦》",e:"解析：《白桦》作者叶赛宁是俄罗斯（苏联）诗人，诗歌以白桦赞美高尚、纯洁的品格。"},
{i:71,c:"4yw-7",ch:"四下·第3单元 诗歌",f:0,q:"下列诗句中，出自《绿》的是（ ）。",o:["好像绿色的墨水瓶倒翻了，到处是绿的","母亲啊！天上的风雨来了","我是星星，从苍穹坠落在绿茵中","大雪压青松，青松挺且直"],a:0,k:"诗句出处",e:"解析：A出自艾青《绿》；B出自冰心《繁星》；C出自《花之歌》一类作品；D是陈毅诗。"},
{i:72,c:"4yw-7",ch:"四下·第3单元 诗歌",f:0,q:"《在天晴了的时候》的作者是（ ）。",o:["戴望舒","冰心","艾青","叶赛宁"],a:0,k:"文学常识：《在天晴了的时候》",e:"解析：《在天晴了的时候》作者戴望舒，诗中写雨后漫步小径，泥路、小草、小白菊、凤蝶儿等清新画面。"},
{i:73,c:"4yw-7",ch:"四下·第3单元 诗歌",f:1,q:"《繁星（一三一）》中表达对大海热爱：哪一次我的思潮里，没有你____的清响？",o:[],a:"波涛",k:"诗句默写：《繁星》",e:"解析：原句“哪一次我的思潮里，没有你波涛的清响？”用反问突出大海在诗人心中的地位。"},
{i:74,c:"4yw-7",ch:"四下·第3单元 诗歌",f:0,q:"现代诗与古诗相比，特点不包括（ ）。",o:["讲究严格的平仄和对仗","形式自由，分行排列","常表达诗人独特情感","可以押韵也可不押韵"],a:0,k:"文学常识：现代诗",e:"解析：现代诗（新诗）形式自由、不讲究严格平仄对仗；古诗才讲究格律对仗。故A不是现代诗特点。"},
{i:75,c:"4yw-7",ch:"四下·第3单元 诗歌",f:0,q:"《繁星（七一）》“这些事——是永不漫灭的回忆”中“漫灭”的意思是（ ）。",o:["磨灭、消失","漫山遍野","漫游","淹没"],a:0,k:"词语理解：漫灭",e:"解析：“漫灭”指模糊、磨灭、消失，“永不漫灭的回忆”意即永远不会忘却的记忆。"},
{i:76,c:"4yw-7",ch:"四下·第3单元 诗歌",f:0,q:"下列诗句使用了拟人手法的是（ ）。",o:["不再胆怯的小白菊，慢慢地抬起它们的头","好像绿色的墨水瓶倒翻了","梅子金黄杏子肥","半江瑟瑟半江红"],a:0,k:"修辞手法：拟人",e:"解析：“小白菊抬起头”把植物当人写，是拟人；B是比喻/夸张想象；C、D是描写。"},
{i:77,c:"4yw-7",ch:"四下·第3单元 诗歌",f:1,q:"《绿》中写绿色聚集的动态：所有的绿集中起来，____，重叠在一起，静静地交叉在一起。",o:[],a:"挤在一起",k:"诗句默写：《绿》",e:"解析：原句“所有的绿集中起来，挤在一起，重叠在一起，静静地交叉在一起”，“挤”字赋予绿以动感。"},

{i:78,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:0,q:"《囊萤夜读》中“胤恭勤不倦，博学多通”的“胤”指的是（ ）。",o:["车胤","匡衡","孙康","李白"],a:0,k:"文学常识：车胤",e:"解析：《囊萤夜读》主人公是晋朝车胤，“恭勤不倦”指谦逊勤奋不知疲倦。"},
{i:79,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:0,q:"“夏月则练囊盛数十萤火以照书”中“练囊”的意思是（ ）。",o:["白色薄绢做的口袋","练习用的袋子","练字的袋子","丝线袋"],a:0,k:"文言词义：练囊",e:"解析：“练”指白绢，“练囊”即用白色薄绢缝的口袋，车胤夏夜以此装萤火虫照明读书。"},
{i:80,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:0,q:"《铁杵成针》中，李白最初读书（ ）。",o:["未成，弃去（没有完成，放弃离开）","学成了","去考状元","教书"],a:0,k:"课文内容：铁杵成针",e:"解析：“世传李太白读书山中，未成，弃去”——李白没读完就放弃了，路过溪边见老媪磨针才感悟回去完成学业。"},
{i:81,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:0,q:"“逢老媪方磨铁杵”中“方”的意思是（ ）。",o:["正在","方向","方形","才"],a:0,k:"文言词义：方",e:"解析：“方”在句中意为“正在”，老媪“正在”磨铁杵。李白问之，媪曰“欲作针”。"},
{i:82,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:0,q:"“太白感其意，还卒业”中“卒业”的意思是（ ）。",o:["完成学业","毕业典礼","停学","上学"],a:0,k:"文言词义：卒业",e:"解析：“卒”是“完成”，“卒业”即学完功课。李白被老媪意志感动，回去完成了学业。"},
{i:83,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:0,q:"“铁杵成针”的故事告诉我们（ ）。",o:["只要有恒心，肯下功夫，事情就能成功","针很容易做","老媪很闲","李白不爱学习"],a:0,k:"寓意：铁杵成针",e:"解析：老媪说“只要功夫深，铁杵磨成针”，比喻持之以恒、肯下苦功就能成功。"},
{i:84,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:1,q:"《囊萤夜读》中写车胤家贫苦读：家贫不常得油，夏月则____以照书。",o:[],a:"练囊盛数十萤火",k:"文言默写",e:"解析：原句“家贫不常得油，夏月则练囊盛数十萤火以照书，以夜继日焉”，表现其勤奋。"},
{i:85,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:0,q:"下列成语与“囊萤夜读”主题相近的是（ ）。",o:["悬梁刺股","守株待兔","画蛇添足","掩耳盗铃"],a:0,k:"成语归类",e:"解析：“囊萤夜读”“悬梁刺股”“凿壁偷光”都讲刻苦读书；B、C、D是讽刺性寓言。"},
{i:86,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:0,q:"《铁杵成针》的故事发生在（ ）山下。",o:["象耳山","庐山","泰山","华山"],a:0,k:"课文内容：铁杵成针",e:"解析：“磨针溪，在象耳山下”，传说李白在象耳山读书时遇老媪磨针。"},
{i:87,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:0,q:"“媪”的意思是（ ）。",o:["老妇人","老太太（尊称）","女孩","妻子"],a:0,k:"文言词义：媪",e:"解析：“媪”读ǎo，指老妇人。“老媪”即老奶奶。"},
{i:88,c:"4yw-8",ch:"四下·第6单元 文言文二则",f:1,q:"《铁杵成针》中老媪回答李白为何磨铁杵：欲____。",o:[],a:"作针",k:"文言默写",e:"解析：老媪答“欲作针”——想把它磨成针，正是“铁杵磨成针”的来源，点明持之以恒的道理。"},

{i:89,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:0,q:"《芙蓉楼送辛渐》“洛阳亲友如相问，一片冰心在玉壶”中“冰心”比喻（ ）。",o:["纯洁清白的心","冰冷的心","心如止水","心情不好"],a:0,k:"词语理解：冰心",e:"解析：“冰心”比喻品格纯洁清白，诗人以此表明自己虽遭贬谪仍坚守高洁操守，不为谣诼所动。"},
{i:90,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:0,q:"《芙蓉楼送辛渐》的作者是（ ）。",o:["王昌龄","王之涣","王维","王勃"],a:0,k:"文学常识：王昌龄",e:"解析：王昌龄，唐代诗人，七绝圣手，“一片冰心在玉壶”为其名句。"},
{i:91,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:0,q:"《塞下曲》“月黑雁飞高，单于夜遁逃”中“单于”原指（ ）。",o:["匈奴首领","唐代将军","猎人","雁群首领"],a:0,k:"词语理解：单于",e:"解析：“单于”是匈奴君主的称号，诗中泛指敌军首领，“夜遁逃”写其趁黑逃跑。"},
{i:92,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:0,q:"《塞下曲》“欲将轻骑逐，大雪满弓刀”表现了将军（ ）。",o:["雪夜追敌的豪迈气概","害怕敌人","不想打仗","在赏雪"],a:0,k:"诗意理解：《塞下曲》",e:"解析：将军正要率轻骑兵追击，大雪纷飞落满弓刀，画面雄壮，表现将士不畏艰险的英勇气概。"},
{i:93,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:0,q:"《墨梅》“不要人夸好颜色，只留清气满乾坤”赞美了（ ）。",o:["不求人夸、坚守高洁品格的精神","梅花很香","颜色漂亮","画家技艺高"],a:0,k:"诗意理解：《墨梅》",e:"解析：王冕借墨梅表达不向世俗献媚、只留清香在天地间的清高品格，“清气”双关清香与清气节。"},
{i:94,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:0,q:"《墨梅》的作者是（ ）代画家王冕。",o:["元","唐","宋","明"],a:0,k:"文学常识：王冕",e:"解析：王冕是元代诗人、画家，擅长画梅，《墨梅》题于自画墨梅图上。"},
{i:95,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:1,q:"《塞下曲》中写将军雪夜准备追击的诗句：欲将轻骑逐，____。",o:[],a:"大雪满弓刀",k:"古诗默写",e:"解析：原句“欲将轻骑逐，大雪满弓刀”，“骑”读jì指骑兵，画面苍劲有力。"},
{i:96,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:0,q:"下列诗句中，属于送别诗的是（ ）。",o:["洛阳亲友如相问，一片冰心在玉壶","月黑雁飞高，单于夜遁逃","不要人夸好颜色，只留清气满乾坤","梅子金黄杏子肥"],a:0,k:"诗歌题材",e:"解析：A出自王昌龄《芙蓉楼送辛渐》，是送别诗；B是边塞征战；C是咏物；D是田园。"},
{i:97,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:0,q:"“平明送客楚山孤”中“平明”的意思是（ ）。",o:["天刚亮","中午","傍晚","深夜"],a:0,k:"词语理解：平明",e:"解析：“平明”指天亮时分，“寒雨连江夜入吴，平明送客楚山孤”写清晨送别友人。"},
{i:98,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:0,q:"王冕《墨梅》“我家洗砚池头树”化用了（ ）的典故。",o:["王羲之临池学书","李白铁杵成针","匡衡凿壁偷光","祖逖闻鸡起舞"],a:0,k:"文学常识：洗砚池",e:"解析：“洗砚池”典出王羲之（传说其练书法，池水尽墨），王冕借指自己勤学，也呼应“墨梅”之墨。"},
{i:99,c:"4yw-9",ch:"四下·第7单元 人物品质古诗",f:1,q:"《墨梅》中表明志向的诗句：不要人夸好颜色，____。",o:[],a:"只留清气满乾坤",k:"古诗默写",e:"解析：原句“不要人夸好颜色，只留清气满乾坤”，“乾坤”指天地间，表达高洁自守。"},

{i:100,c:"4yw-10",ch:"四下·第8单元 童话",f:0,q:"《宝葫芦的秘密（节选）》的作者是（ ）。",o:["张天翼","叶圣陶","冰心","陈伯吹"],a:0,k:"文学常识：张天翼",e:"解析：张天翼，代表作《宝葫芦的秘密》，写王葆得到宝葫芦后发生的一系列故事，寓意幸福要靠劳动。"},
{i:101,c:"4yw-10",ch:"四下·第8单元 童话",f:0,q:"《巨人的花园》的作者是（ ）国作家王尔德。",o:["英","法","俄","丹"],a:0,k:"文学常识：王尔德",e:"解析：奥斯卡·王尔德是英国（爱尔兰）作家，《巨人的花园》童话说明分享快乐才会真正幸福。"},
{i:102,c:"4yw-10",ch:"四下·第8单元 童话",f:0,q:"《巨人的花园》中，花园春天回归的原因是（ ）。",o:["巨人拆了围墙，让孩子们进来玩耍","巨人赶走了所有孩子","冬天过去了","仙女生气了"],a:0,k:"课文内容：《巨人的花园》",e:"解析：巨人醒悟后拆掉围墙、欢迎孩子，孩子们带来春天，说明“没有孩子的地方就没有春天”。"},
{i:103,c:"4yw-10",ch:"四下·第8单元 童话",f:0,q:"《海的女儿》作者是（ ）童话作家安徒生。",o:["丹麦","德国","瑞典","挪威"],a:0,k:"文学常识：安徒生",e:"解析：汉斯·克里斯蒂安·安徒生是丹麦童话作家，代表作《海的女儿》《丑小鸭》《卖火柴的小女孩》等。"},
{i:104,c:"4yw-10",ch:"四下·第8单元 童话",f:0,q:"《宝葫芦的秘密》中，宝葫芦能（ ）。",o:["变出主人想要的东西","让人长生不老","预测未来","飞行"],a:0,k:"课文内容：宝葫芦",e:"解析：宝葫芦能满足王葆的愿望、变出他想要的东西，但后来王葆发现不劳而获带来麻烦，明白要自己努力。"},
{i:105,c:"4yw-10",ch:"四下·第8单元 童话",f:0,q:"下列作品与作者搭配错误的是（ ）。",o:["《巨人的花园》——安徒生","《海的女儿》——安徒生","《宝葫芦的秘密》——张天翼","《巨人的花园》——王尔德"],a:0,k:"文学常识",e:"解析：A错，《巨人的花园》作者是王尔德，不是安徒生；B、C、D均正确。"},
{i:106,c:"4yw-10",ch:"四下·第8单元 童话",f:1,q:"《巨人的花园》告诉我们：____的孩子才有春天（用课文原句关键词填空）。",o:[],a:"有孩子们",k:"课文寓意",e:"解析：文中说“没有孩子的地方就没有春天”，巨人接纳孩子后花园才恢复生机，寓意快乐要与人分享。"},
{i:107,c:"4yw-10",ch:"四下·第8单元 童话",f:0,q:"安徒生是（ ）代表人物。",o:["童话","寓言","诗歌","小说"],a:0,k:"文学常识：安徒生",e:"解析：安徒生是世界著名童话作家，其作品属童话体裁。"},
{i:108,c:"4yw-10",ch:"四下·第8单元 童话",f:0,q:"《宝葫芦的秘密》中王葆最终（ ）。",o:["明白了幸福要靠自己劳动，不再依赖宝葫芦","一直使用宝葫芦","把宝葫芦扔了得到财富","成了神仙"],a:0,k:"课文内容",e:"解析：王葆经历一系列尴尬后认识到不劳而获并不幸福，最终明白事情要靠自己努力。"},
{i:109,c:"4yw-10",ch:"四下·第8单元 童话",f:0,q:"下列故事中，属于童话的是（ ）。",o:["《海的女儿》","《精卫填海》","《王戎不取道旁李》","《西门豹治邺》"],a:0,k:"体裁辨析",e:"解析：“海的女儿”是安徒生童话；B是神话，C、D是历史故事（文言文）。"},
{i:110,c:"4yw-10",ch:"四下·第8单元 童话",f:1,q:"《宝葫芦的秘密》主人公叫____，他得到了一个能变出东西的____。",o:[],a:"王葆、宝葫芦",k:"课文内容",e:"解析：主人公王葆偶然得到宝葫芦，它能在他想要时变出东西，引出关于“不劳而获”的思考。"},

{i:111,c:"4yw-11",ch:"四年级·字词辨析与成语",f:0,q:"下列词语中，“薄”字读音与其他三项不同的一项是（ ）。",o:["薄弱","薄雾","薄饼","单薄"],a:2,k:"多音字：薄",e:"解析：“薄”在“薄弱、薄雾、单薄”中读bó；在“薄饼”中读báo（口语，厚度小）。"},
{i:112,c:"4yw-11",ch:"四年级·字词辨析与成语",f:0,q:"下列词语中没有错别字的一组是（ ）。",o:["振奋 清晰 训斥 非凡","振份 清淅 训拆 非几","振备 清析 训尺 非帆","振奋 清淅 训斥 非帆"],a:0,k:"字形辨析",e:"解析：A全部正确；其余项把“振奋”误作“振份/振备”等，均错。"},
{i:113,c:"4yw-11",ch:"四年级·字词辨析与成语",f:0,q:"“归根到底”的近义词是（ ）。",o:["总而言之","分道扬镳","莫名其妙","不可思议"],a:0,k:"词语理解",e:"解析：“归根到底”意为归结到根本上，近义词“总而言之”“说到底”。"},
{i:114,c:"4yw-11",ch:"四年级·字词辨析与成语",f:0,q:"下列成语使用正确的一项是（ ）。",o:["钱塘江大潮汹涌而来，真是气势磅礴","今天天气真好，我气急败坏地去公园","他上课专心，常常横七竖八地坐着","这道菜味道随遇而安"],a:0,k:"成语运用",e:"解析：A“气势磅礴”形容气势雄伟，用于大潮正确；B“气急败坏”（慌张愤怒）不合语境；C“横七竖八”（杂乱）贬义误用；D“随遇而安”指适应环境，不形容味道。"},
{i:115,c:"4yw-11",ch:"四年级·字词辨析与成语",f:0,q:"下列词语搭配不当的一项是（ ）。",o:["改进错误","改正缺点","改善生活","改变态度"],a:0,k:"词语搭配",e:"解析：“改进”多与“方法、技术”搭配，“错误”应与“改正”搭配，故“改进错误”不当。"},
{i:116,c:"4yw-11",ch:"四年级·字词辨析与成语",f:1,q:"把词语补充完整：____云驾雾、____风唤雨、____根到底。",o:[],a:"腾、呼、归",k:"成语积累",e:"解析：依次应为“腾云驾雾”“呼风唤雨”“归根到底”，均为四上常见成语。"},
{i:117,c:"4yw-11",ch:"四年级·字词辨析与成语",f:0,q:"“无论……都……”表示（ ）关系的关联词。",o:["条件","转折","因果","递进"],a:0,k:"关联词",e:"解析：“无论……都……”表示条件关系，指在任何条件下结果都不变。"},
{i:118,c:"4yw-11",ch:"四年级·字词辨析与成语",f:0,q:"下列句子中关联词使用正确的一句是（ ）。",o:["无论天气多冷，他都坚持锻炼","尽管天气多冷，但是他坚持锻炼","虽然天气很冷，但是都坚持锻炼","无论天气很冷，他而且坚持锻炼"],a:0,k:"关联词运用",e:"解析：A“无论……都……”搭配正确；“尽管”应与“还/仍”搭配，“虽然”与“但是”搭配但不与“都”配，C、D搭配不当。"},
{i:119,c:"4yw-11",ch:"四年级·字词辨析与成语",f:0,q:"“亭亭玉立”一般用来形容（ ）。",o:["女子或花木形体挺拔优美","建筑物高大","声音响亮","文章优美"],a:0,k:"词语理解",e:"解析：“亭亭玉立”形容美女身材细长或花木等形体挺拔，如荷花“亭亭玉立”。"},
{i:120,c:"4yw-11",ch:"四年级·字词辨析与成语",f:0,q:"“尝与诸小儿游”中“诸”的意思是（ ）。",o:["众、许多","各个","姓诸","之乎"],a:0,k:"文言词义：诸",e:"解析：“诸”在文言中常作“众、许多”，“诸小儿”即“许多小孩子”。"},
{i:121,c:"4yw-11",ch:"四年级·字词辨析与成语",f:1,q:"写出带“风”字的两个成语：____、____。",o:[],a:"呼风唤雨、风和日丽",k:"成语积累",e:"解析：含“风”的成语很多，如“呼风唤雨”“风和日丽”“狂风暴雨”“春风化雨”等，写出两个即可。"},

{i:122,c:"4yw-12",ch:"四年级·修改病句与修辞手法",f:0,q:"下列句子中，没有语病的一句是（ ）。",o:["经过努力，他的成绩提高了","经过努力，使他的成绩提高了","他的成绩提高了很多倍","他基本上把作业全部做完了"],a:0,k:"病句：成分残缺",e:"解析：A正确；B缺主语（“经过……使”淹没主语），应删“使”或“经过”；C“提高很多倍”不当（成绩不能用倍数）；D“基本上”与“全部”矛盾。"},
{i:123,c:"4yw-12",ch:"四年级·修改病句与修辞手法",f:0,q:"“全班同学都到了，只有小明没来。”这句话的语病是（ ）。",o:["前后矛盾","成分残缺","搭配不当","重复累赘"],a:0,k:"病句：前后矛盾",e:"解析：“都到了”与“只有小明没来”自相矛盾，应改为“除了小明，全班都到了”。"},
{i:124,c:"4yw-12",ch:"四年级·修改病句与修辞手法",f:0,q:"下列句子使用了比喻修辞的是（ ）。",o:["荷叶挨挨挤挤的，像一个个碧绿的大圆盘","小鸟在枝头唱歌","春天到了，花儿醒了","风儿轻轻抚摸我的脸"],a:0,k:"修辞：比喻",e:"解析：A把荷叶比作大圆盘，有喻词“像”；B、C、D把物当人写，是拟人。"},
{i:125,c:"4yw-12",ch:"四年级·修改病句与修辞手法",f:0,q:"“飞流直下三千尺，疑是银河落九天”使用了（ ）修辞。",o:["夸张","比喻","拟人","对偶"],a:0,k:"修辞：夸张",e:"解析：“三千尺”极言瀑布之长，是夸张；兼用比喻（银河）。主要手法是夸张。"},
{i:126,c:"4yw-12",ch:"四年级·修改病句与修辞手法",f:0,q:"下列句子属于拟人的是（ ）。",o:["秋天到了，高粱涨红了脸","他跑得像兔子一样快","书是人类进步的阶梯","问君能有几多愁？恰似一江春水向东流"],a:0,k:"修辞：拟人",e:"解析：A“高粱涨红了脸”赋予植物人的神态，是拟人；B、D是比喻，C是比喻。"},
{i:127,c:"4yw-12",ch:"四年级·修改病句与修辞手法",f:0,q:"“爱心是一片照射在冬日的阳光”这句话是（ ）。",o:["比喻句","拟人句","夸张句","反问句"],a:0,k:"修辞：比喻",e:"解析：把“爱心”比作“冬日的阳光”（暗喻，本体+是+喻体），是比喻句。"},
{i:128,c:"4yw-12",ch:"四年级·修改病句与修辞手法",f:1,q:"修改病句：他穿了一件红色的上衣和一顶帽子。应改为：他穿了一件红色的上衣，____。",o:[],a:"戴了一顶帽子",k:"病句：搭配不当",e:"解析：“穿”不能与“帽子”搭配，应改为“戴了一顶帽子”，即“他穿了一件红色上衣，戴了一顶帽子”。"},
{i:129,c:"4yw-12",ch:"四年级·修改病句与修辞手法",f:0,q:"“这难道不是伟大的奇观吗？”意思是（ ）。",o:["这是伟大的奇观（反问表肯定）","这不是奇观","是不是奇观不知道","奇观不大"],a:0,k:"句式：反问",e:"解析：反问句“难道不是……吗”表达肯定意思，即“这是伟大的奇观”，加强语气。"},
{i:130,c:"4yw-12",ch:"四年级·修改病句与修辞手法",f:0,q:"下列句子使用的修辞与其他三项不同的是（ ）。",o:["书是人类进步的阶梯（比喻）","春天像个害羞的小姑娘（比喻）","他像他爸爸（比较，非比喻）","荷叶像伞（比喻）"],a:2,k:"修辞辨析：比喻vs比较",e:"解析：A、B、D均为比喻（甲事物比乙事物）；C“他像他爸爸”是同类比较，不是比喻。比喻要求本体喻体本质不同。"},
{i:131,c:"4yw-12",ch:"四年级·修改病句与修辞手法",f:1,q:"写出一个运用“排比”修辞的例句（课文或自创均可）：____。",o:[],a:"示例：燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候。",k:"修辞：排比",e:"解析：三个或以上结构相似的短语/句子排在一起即排比，如朱自清《匆匆》开篇，增强语势。"}
);

{i:2,c:"6en-1",ch:"六上·第1单元 How can I get there?（问路与方位）",f:0,q:"“science museum”的意思是？",o:["科学博物馆","邮局","书店","医院"],a:0,k:"词汇：science museum 科学博物馆",e:"解析：science 科学 + museum 博物馆 = science museum。post office 邮局、bookstore 书店、hospital 医院。"},
{i:3,c:"6en-1",ch:"六上·第1单元 How can I get there?（问路与方位）",f:0,q:"“直走”应说：____",o:["go straight","turn left","turn right","stop"],a:0,k:"短语：go straight 直走",e:"解析：go straight 直走。turn left 左转、turn right 右转、stop 停。"},
{i:4,c:"6en-1",ch:"六上·第1单元 How can I get there?（问路与方位）",f:0,q:"“在书店左转”应说：____",o:["Turn left at the bookstore.","Turn right at the bookstore.","Turn left at the hospital.","Go straight at the bookstore."],a:0,k:"短语：turn left at...",e:"解析：在某一地点转弯用 turn + 方向 + at + 地点。bookstore 书店，故选第一项。"},
{i:5,c:"6en-1",ch:"六上·第1单元 How can I get there?（问路与方位）",f:0,q:"“post office”的意思是？",o:["邮局","医院","电影院","博物馆"],a:0,k:"词汇：post office 邮局",e:"解析：post office 邮局。hospital 医院、cinema 电影院、museum 博物馆。"},
{i:6,c:"6en-1",ch:"六上·第1单元 How can I get there?（问路与方位）",f:0,q:"—Is there a hospital near here? —____",o:["Yes, there is.","Yes, it is.","No, it isn't.","It's a hospital."],a:0,k:"句型：Is there...? 回答",e:"解析：There be 句型疑问，肯定回答 Yes, there is.。不能用 it is 回答 there be 问句。"},
{i:7,c:"6en-1",ch:"六上·第1单元 How can I get there?（问路与方位）",f:1,q:"—Where is the ____? —It's behind the school.（书店）",o:[],a:"bookstore",k:"词汇填空：bookstore 书店",e:"解析：bookstore 书店，Where is the bookstore? 书店在哪？behind the school 在学校后面。"},
{i:8,c:"6en-1",ch:"六上·第1单元 How can I get there?（问路与方位）",f:0,q:"“crossing”的意思是？",o:["十字路口","电影院","博物馆","邮局"],a:0,k:"词汇：crossing 十字路口",e:"解析：crossing 十字路口（过马路/转弯处）。其余分别为 cinema、museum、post office。"},
{i:9,c:"6en-1",ch:"六上·第1单元 How can I get there?（问路与方位）",f:0,q:"—How can I get to the library? —Go straight and ____ left.",o:["turn","turns","turning","turned"],a:0,k:"动词：turn left 原形",e:"解析：祈使句用动词原形 turn。Go straight and turn left 直走然后左转。"},
{i:10,c:"6en-1",ch:"六上·第1单元 How can I get there?（问路与方位）",f:0,q:"“hospital”的意思是？",o:["医院","邮局","书店","博物馆"],a:0,k:"词汇：hospital 医院",e:"解析：hospital 医院。post office 邮局、bookstore 书店、museum 博物馆。"},
{i:11,c:"6en-1",ch:"六上·第1单元 How can I get there?（问路与方位）",f:1,q:"Turn ____ at the cinema, then you can see the school.（右）",o:[],a:"right",k:"方向填空：turn right 右转",e:"解析：right 右边，turn right 右转。与 turn left（左转）相对。"},

{i:12,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:0,q:"—How do you come to school? —____",o:["I come to school by bike.","I go to school bike.","I by bike come.","By bike I come school."],a:0,k:"句型：How do you...? by + 工具",e:"解析：问交通方式，回答用 by + 交通工具（无冠词）。by bike 骑自行车，结构正确。"},
{i:13,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:0,q:"“步行”的英文是？",o:["on foot","by bus","by bike","by subway"],a:0,k:"短语：on foot 步行",e:"解析：步行用 on foot（固定搭配，不用 by foot）。by bus 公交、by bike 骑车、by subway 地铁。"},
{i:14,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:0,q:"—How does Amy go home? —She goes ____ subway.",o:["by","on","in","with"],a:0,k:"介词：by + 交通工具",e:"解析：乘坐交通工具用 by，by subway 乘地铁。go by subway 正确。"},
{i:15,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:0,q:"“traffic lights”的意思是？",o:["交通信号灯","公交车","地铁","飞机"],a:0,k:"词汇：traffic lights 交通灯",e:"解析：traffic 交通 + lights 灯 = traffic lights 交通信号灯。bus 公交、subway 地铁、plane 飞机。"},
{i:16,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:0,q:"Don't go at the ____ light.",o:["red","yellow","green","blue"],a:0,k:"常识：红灯停",e:"解析：红灯停，Don't go at the red light 红灯时不要走。green 绿灯行、yellow 黄灯等。"},
{i:17,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:0,q:"We must ____ down and stop at a yellow light.",o:["slow","stop","go","wait"],a:0,k:"短语：slow down 慢下来",e:"解析：黄灯要 slow down（慢下来）并停下。slow down 是固定短语。"},
{i:18,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:0,q:"“by plane”的意思是？",o:["乘飞机","乘火车","乘船","乘地铁"],a:0,k:"短语：by plane 乘飞机",e:"解析：plane 飞机，by plane 乘飞机。by train 火车、by ship 船、by subway 地铁。"},
{i:19,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:1,q:"—How do you go to the park? —I go there ____.（步行）",o:[],a:"on foot",k:"短语填空：on foot 步行",e:"解析：步行 on foot，固定搭配，前面不加 by。I go there on foot 我步行去。"},
{i:20,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:0,q:"“subway”的意思是？",o:["地铁","公交车","火车","轮船"],a:0,k:"词汇：subway 地铁",e:"解析：subway 地铁。bus 公交、train 火车、ship 轮船。"},
{i:21,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:0,q:"You must ____ at a red light.",o:["stop","wait","go","slow"],a:0,k:"常识：红灯停 stop",e:"解析：红灯必须停下 stop。go 走是错的，slow 是慢行（黄灯）。"},
{i:22,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:0,q:"“by ship”的意思是？",o:["乘船","乘飞机","乘火车","乘地铁"],a:0,k:"短语：by ship 乘船",e:"解析：ship 船，by ship 乘船。plane 飞机、train 火车、subway 地铁。"},
{i:23,c:"6en-2",ch:"六上·第2单元 Ways to go to school（交通方式）",f:1,q:"We must ____ at the yellow light.（等待）",o:[],a:"wait",k:"动词填空：wait 等待",e:"解析：黄灯时停下等待 wait。wait 等待，与 stop 并列的交通规则用语。"},

{i:24,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:0,q:"—What are your hobbies? —____",o:["I like reading stories.","I like read stories.","I am reading stories.","I reads stories."],a:0,k:"句型：like + doing 爱好",e:"解析：爱好用 like + 动词-ing。reading stories 读故事正确。like 后接动名词不是原形，也不是第三人称 reads（I 不是三单）。"},
{i:25,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:0,q:"“他喜欢唱歌”应说：____",o:["He likes singing.","He like singing.","He likes sing.","He liking singing."],a:0,k:"语法：三单 likes + doing",e:"解析：He 是第三人称单数，like 变 likes；喜欢做某事 like doing。He likes singing 正确。"},
{i:26,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:0,q:"“hobby”的复数是？",o:["hobbies","hobbys","hobbyes","hobies"],a:0,k:"名词复数：hobby→hobbies",e:"解析：以辅音+y 结尾，变 y 为 i 加 es，hobbies。这是规则变化。"},
{i:27,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:0,q:"—What are Peter's hobbies? —____",o:["He likes doing kung fu.","He like doing kung fu.","He likes do kung fu.","He is doing kung fu."],a:0,k:"语法：三单 likes doing",e:"解析：Peter's 第三人称单数，用 He likes + doing。doing kung fu 练功夫。"},
{i:28,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:0,q:"“playing football”的意思是？",o:["踢足球","唱歌","远足","读故事"],a:0,k:"词汇：playing football 踢足球",e:"解析：play football 踢足球，playing 是 -ing 形式。singing 唱歌、hiking 远足、reading stories 读故事。"},
{i:29,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:0,q:"My pen pal ____ in Beijing.",o:["lives","live","living","lived"],a:0,k:"语法：三单 lives",e:"解析：My pen pal 第三人称单数，一般现在时动词加 s，live→lives。lived 是过去式。"},
{i:30,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:0,q:"“hiking”的意思是？",o:["远足；徒步","唱歌","拼图","功夫"],a:0,k:"词汇：hiking 远足",e:"解析：hike 远足，hiking 是 -ing 形式。singing 唱歌、puzzle 拼图、kung fu 功夫。"},
{i:31,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:1,q:"—What are your hobbies? —I like ____.（读故事）",o:[],a:"reading stories",k:"短语填空：reading stories",e:"解析：like + doing，read 双写 t 加 ing = reading，stories 故事（story 复数）。读故事 reading stories。"},
{i:32,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:0,q:"“does”用于 ____。",o:["第三人称单数","第一人称","复数","过去式"],a:0,k:"助动词：does 三单",e:"解析：does 是 do 的第三人称单数形式，用于 he/she/it。I/you/we/they 用 do。"},
{i:33,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:0,q:"She ____ word puzzles every day.",o:["does","do","doing","did"],a:0,k:"语法：三单 does",e:"解析：She 三单，一般现在时用 does。do word puzzles 玩拼图，是固定搭配。"},
{i:34,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:0,q:"“pen pal”的意思是？",o:["笔友","朋友","同学","老师"],a:0,k:"词汇：pen pal 笔友",e:"解析：pen pal 笔友（通过信件/邮件交友的人）。"},
{i:35,c:"6en-3",ch:"六上·第4单元 I have a pen pal（爱好与一般现在时）",f:1,q:"He ____ playing basketball.（喜欢，三单）",o:[],a:"likes",k:"动词填空：likes 三单",e:"解析：He 第三人称单数，like 加 s = likes。like doing 喜欢做某事。"},

{i:36,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:0,q:"—What does your father do? —____",o:["He's a doctor.","He's doctor.","He do a doctor.","He is doctor."],a:0,k:"句型：What does he do? 职业",e:"解析：问职业回答 He's/She's a + 职业。a doctor 前面必须有 a。doctor 医生。"},
{i:37,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:0,q:"“她是一名飞行员”应说：____",o:["She's a pilot.","She's pilot.","She is pilot.","She pilot."],a:0,k:"句型：She's a pilot",e:"解析：职业前加 a/an，pilot 以辅音开头用 a。She's a pilot 正确。"},
{i:38,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:0,q:"“factory worker”的意思是？",o:["工厂工人","邮递员","商人","渔民"],a:0,k:"词汇：factory worker 工厂工人",e:"解析：factory 工厂 + worker 工人 = factory worker。postman 邮递员、businessman 商人、fisherman 渔民。"},
{i:39,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:0,q:"—Where does he work? —____",o:["He works at a hospital.","He work at a hospital.","He working at a hospital.","He is work."],a:0,k:"语法：三单 works",e:"解析：He 三单，work 加 s = works。at a hospital 在医院（工作）。"},
{i:40,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:0,q:"“postman”的意思是？",o:["邮递员","警察","科学家","教练"],a:0,k:"词汇：postman 邮递员",e:"解析：postman 邮递员。police officer 警察、scientist 科学家、coach 教练。"},
{i:41,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:0,q:"What ____ your mother do?",o:["does","do","is","are"],a:0,k:"助动词：三单 does",e:"解析：your mother 第三人称单数，疑问句用 does。do 用于非三单。"},
{i:42,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:0,q:"“police officer”的意思是？",o:["警察","渔民","商人","飞行员"],a:0,k:"词汇：police officer 警察",e:"解析：police officer 警察（警官）。fisherman 渔民、businessman 商人、pilot 飞行员。"},
{i:43,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:1,q:"—What does he do? —He is a ____.（科学家）",o:[],a:"scientist",k:"词汇填空：scientist 科学家",e:"解析：scientist 科学家，以辅音开头，a scientist。回答 He is a scientist。"},
{i:44,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:0,q:"“fisherman”的意思是？",o:["渔民","商人","工人","邮递员"],a:0,k:"词汇：fisherman 渔民",e:"解析：fish 鱼 + man 人 = fisherman 渔民。businessman 商人、worker 工人、postman 邮递员。"},
{i:45,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:0,q:"He is a ____. He teaches us football.",o:["coach","scientist","pilot","postman"],a:0,k:"词汇：coach 教练",e:"解析：教足球的是 coach（教练）。scientist 科学家、pilot 飞行员、postman 邮递员。"},
{i:46,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:0,q:"“businessman”的意思是？",o:["商人","工人","渔民","警察"],a:0,k:"词汇：businessman 商人",e:"解析：business 生意 + man = businessman 商人。worker 工人、fisherman 渔民、police officer 警察。"},
{i:47,c:"6en-4",ch:"六上·第5单元 What does he do?（职业）",f:1,q:"My uncle is a ____. He flies a plane.（飞行员）",o:[],a:"pilot",k:"词汇填空：pilot 飞行员",e:"解析：pilot 飞行员，开飞机 fly a plane。a pilot 一名飞行员。"},

{i:48,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:0,q:"—What are you going to do tomorrow? —____",o:["I'm going to see a film.","I see a film.","I'm seeing a film.","I goes to see a film."],a:0,k:"句型：be going to 将来",e:"解析：问将来打算，回答 I'm going to + 动词原形。see a film 看电影正确。"},
{i:49,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:0,q:"“打算去旅行”应说：____",o:["I'm going to take a trip.","I take a trip.","I taking a trip.","I'm take a trip."],a:0,k:"句型：be going to take a trip",e:"解析：be going to + 动词原形 take a trip 去旅行。going to 后接原形，不是 taking。"},
{i:50,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:0,q:"“tonight”的意思是？",o:["今晚","明天","下周","今天"],a:0,k:"词汇：tonight 今晚",e:"解析：tonight 今晚。tomorrow 明天、next week 下周、today 今天。"},
{i:51,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:0,q:"We ____ going to the supermarket.",o:["are","am","is","be"],a:0,k:"语法：We are going to",e:"解析：We 复数，be 动词用 are。I 用 am、He/She 用 is。"},
{i:52,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:0,q:"“next week”的意思是？",o:["下周","上周","这周","明天"],a:0,k:"词汇：next week 下周",e:"解析：next week 下周。last week 上周、this week 这周、tomorrow 明天。"},
{i:53,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:0,q:"He ____ going to buy a comic book.",o:["is","am","are","be"],a:0,k:"语法：He is going to",e:"解析：He 三单，be 动词用 is。is going to + 原形 buy。"},
{i:54,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:0,q:"“visit my grandparents”的意思是？",o:["看望祖父母","看电影","去旅行","去超市"],a:0,k:"短语：visit my grandparents",e:"解析：visit 看望，grandparents 祖父母。see a film 看电影、take a trip 旅行、supermarket 超市。"},
{i:55,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:1,q:"—What are you going to do ____? —I'm going to visit my friend.（明天）",o:[],a:"tomorrow",k:"词汇填空：tomorrow 明天",e:"解析：tomorrow 明天，常与 be going to 连用表将来计划。问句 What are you going to do tomorrow?"},
{i:56,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:0,q:"—Are you going to the park? —____",o:["Yes, I am.","Yes, I'm.","No, I am.","Yes, I do."],a:0,k:"句型：Are you going to...? 回答",e:"解析：be going to 疑问句，肯定回答 Yes, I am.。不可用 I'm 单独结尾（口语可，但书面用 I am），也不用 do 回答。"},
{i:57,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:0,q:"“dictionary”的意思是？",o:["词典","漫画书","电影","旅行"],a:0,k:"词汇：dictionary 词典",e:"解析：dictionary 词典。comic book 漫画书、film 电影、trip 旅行。"},
{i:58,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:0,q:"“comic book”的意思是？",o:["连环画册；漫画书","词典","杂志","报纸"],a:0,k:"词汇：comic book 漫画书",e:"解析：comic 滑稽/连环 + book = comic book 连环画册。dictionary 词典、magazine 杂志、newspaper 报纸。"},
{i:59,c:"6en-5",ch:"六上·第3单元 My weekend plan（一般将来时）",f:1,q:"I'm going to ____ a film this evening.（看）",o:[],a:"see",k:"动词填空：see a film",e:"解析：see a film 看电影，be going to 后接动词原形 see。"},

{i:60,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:0,q:"—How do you feel? —____",o:["I'm happy.","I'm nine.","I'm fine, thank you.","I like happy."],a:0,k:"句型：How do you feel? 感受",e:"解析：问感受，回答 I'm + 表示情绪的形容词。happy 高兴正确。nine 是年龄，fine 是身体好但此处要情绪词。"},
{i:61,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:0,q:"“你生病了，应该去看医生”应说：____",o:["You should see a doctor.","You should see doctor.","You should to see a doctor.","You should seeing a doctor."],a:0,k:"句型：should + 原形",e:"解析：should 是情态动词，后接动词原形 see。see a doctor 看医生，doctor 前加 a。"},
{i:62,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:0,q:"“afraid”的意思是？",o:["害怕","生气","难过","担心"],a:0,k:"词汇：afraid 害怕",e:"解析：afraid 害怕的。angry 生气、sad 难过、worried 担心。"},
{i:63,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:0,q:"If you are cold, you should ____.",o:["wear warm clothes","wear warm cloth","wears warm clothes","wearing warm clothes"],a:0,k:"句型：should + 原形 wear",e:"解析：should 后接原形 wear（穿）。warm clothes 暖和的衣服。主语 you 不用 wears。"},
{i:64,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:0,q:"“angry”的意思是？",o:["生气的","高兴的","悲伤的","担心的"],a:0,k:"词汇：angry 生气的",e:"解析：angry 生气的。happy 高兴、sad 悲伤、worried 担心。"},
{i:65,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:0,q:"“难过的”英文是？",o:["sad","angry","happy","worried"],a:0,k:"词汇：sad 难过的",e:"解析：sad 难过的/悲伤的。angry 生气、happy 高兴、worried 担心。"},
{i:66,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:0,q:"“担心”的英文是？",o:["worried","afraid","angry","sad"],a:0,k:"词汇：worried 担心的",e:"解析：worried 担心的/焦虑的。afraid 害怕、angry 生气、sad 难过。"},
{i:67,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:1,q:"—How do you feel? —I'm ____ because he broke my pen.（生气的）",o:[],a:"angry",k:"词汇填空：angry 生气的",e:"解析：angry 生气的，因为笔被弄坏而生气。broken 是 break 的过去分词。"},
{i:68,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:0,q:"“do more exercise”的意思是？",o:["多做运动","看医生","穿暖衣服","数到十"],a:0,k:"短语：do more exercise",e:"解析：exercise 锻炼，do more exercise 多做运动。see a doctor 看医生、wear warm clothes 穿暖衣。"},
{i:69,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:0,q:"—I'm ill. —You should ____ a doctor.",o:["see","look","watch","meet"],a:0,k:"搭配：see a doctor",e:"解析：看医生用 see a doctor（固定搭配）。look/watch 不接 doctor。"},
{i:70,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:0,q:"“happy”的意思是？",o:["高兴的","生气的","担心的","害怕的"],a:0,k:"词汇：happy 高兴的",e:"解析：happy 高兴的/快乐的。angry 生气、worried 担心、afraid 害怕。"},
{i:71,c:"6en-6",ch:"六上·第6单元 How do you feel?（情绪与建议）",f:1,q:"You should ____ warm clothes. It's cold outside.（穿）",o:[],a:"wear",k:"动词填空：wear 穿",e:"解析：wear 穿，should 后接原形。wear warm clothes 穿暖和的衣服。"},

{i:72,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:0,q:"—How tall are you? —____",o:["I'm 1.60 metres.","I'm 1.60 metre.","I'm 1.60.","I'm tall."],a:0,k:"句型：How tall 身高",e:"解析：问身高回答 I'm + 数字 + metres（复数）。1.60 metres 一点六米。metre 单数不用于带数字的身高。"},
{i:73,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:0,q:"“我比你高”应说：____",o:["I'm taller than you.","I'm tall than you.","I'm taller you.","I'm tallest than you."],a:0,k:"语法：比较级 taller than",e:"解析：比较级 + than 表示“比……更”。tall 比较级 taller，I'm taller than you 正确。"},
{i:74,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:0,q:"“tall”的比较级是？",o:["taller","tallest","tall","most tall"],a:0,k:"比较级：tall→taller",e:"解析：单音节词直接加 -er，taller。tallest 最高级。"},
{i:75,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:0,q:"He is only 7. He is ____ than me.",o:["younger","older","taller","shorter"],a:0,k:"词汇：younger 更年轻",e:"解析：7 岁比“我”小/年轻，younger 更年轻。older 更年长、taller 更高、shorter 更矮。"},
{i:76,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:0,q:"“heavy”的比较级是？",o:["heavier","heavyer","heavy","heaviest"],a:0,k:"比较级：heavy→heavier",e:"解析：辅音+y 结尾，变 y 为 i 加 er，heavier。heaviest 最高级。"},
{i:77,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:0,q:"Your hair is ____ than mine.",o:["longer","longest","long","most long"],a:0,k:"比较级：long→longer",e:"解析：long 比较级 longer，than 前用比较级。longest 最高级。"},
{i:78,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:0,q:"“thin”的比较级是？",o:["thinner","thiner","thinnest","thin"],a:0,k:"比较级：thin→thinner",e:"解析：重读闭音节辅元辅结尾，双写尾字母加 er，thinner。thinnest 最高级。"},
{i:79,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:1,q:"I'm ____ than my sister.（更高的）",o:[],a:"taller",k:"比较级填空：taller",e:"解析：than 前用比较级，tall 比较级 taller。I'm taller than... 我比……高。"},
{i:80,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:0,q:"“strong”的比较级是？",o:["stronger","strongest","strong","more strong"],a:0,k:"比较级：strong→stronger",e:"解析：单音节加 -er，stronger。strongest 最高级。"},
{i:81,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:0,q:"—Who is ____, your father or your uncle? —My father.",o:["older","old","oldest","most old"],a:0,k:"比较级：old→older",e:"解析：两者比较用 older（更年长）。oldest 最高级用于三者以上。"},
{i:82,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:0,q:"“shorter”的意思是？",o:["更矮的；更短的","更高的","更强的","更重的"],a:0,k:"词汇：shorter 更矮/更短",e:"解析：short 比较级 shorter，可指更矮或更短。taller 更高、stronger 更强、heavier 更重。"},
{i:83,c:"6en-7",ch:"六下·第1单元 How tall are you?（比较级）",f:1,q:"The elephant is ____ than the dog.（更重的）",o:[],a:"heavier",k:"比较级填空：heavier",e:"解析：heavy 比较级 heavier（y 变 i 加 er）。大象比狗重，用 heavier。"},

{i:90,c:"6en-8",ch:"六下·第2单元 Last weekend（一般过去时）",f:0,q:"We ____ at home and watched TV.",o:["stayed","stay","staying","stays"],a:0,k:"过去式：stay→stayed",e:"解析：and 连接并列过去时，watched 提示用 stayed。stay 加 -ed。"},
{i:91,c:"6en-8",ch:"六下·第2单元 Last weekend（一般过去时）",f:1,q:"—What did you do? —I ____ my clothes.（洗）",o:[],a:"washed",k:"过去式填空：washed",e:"解析：wash 的过去式 washed，yesterday/last weekend 等用过去时。"},
{i:92,c:"6en-8",ch:"六下·第2单元 Last weekend（一般过去时）",f:0,q:"“have”的过去式是？",o:["had","has","having","have"],a:0,k:"过去式：have→had",e:"解析：have 不规则过去式 had。has 是三单现在式。"},
{i:93,c:"6en-8",ch:"六下·第2单元 Last weekend（一般过去时）",f:0,q:"She ____ a book last night.",o:["read","reads","readed","reading"],a:0,k:"过去式：read 同形",e:"解析：last night 用过去时，read 过去式同形 read（读 /red/）。reads 是现在三单。"},
{i:94,c:"6en-8",ch:"六下·第2单元 Last weekend（一般过去时）",f:0,q:"“drink”的过去式是？",o:["drank","drinked","drinks","drinking"],a:0,k:"过去式：drink→drank",e:"解析：drink 不规则过去式 drank。drinked 错误。"},
{i:95,c:"6en-8",ch:"六下·第2单元 Last weekend（一般过去时）",f:1,q:"They ____ to the park and played football.（去）",o:[],a:"went",k:"过去式填空：went",e:"解析：go 的过去式 went，与 played 并列用过去时。and 连接两个过去动作。"},

{i:97,c:"6en-9",ch:"六下·第3单元 Where did you go?（过去时·旅行）",f:0,q:"“go camping”的过去式是？",o:["went camping","go camping","went camp","went camped"],a:0,k:"过去式：go camping→went camping",e:"解析：go 变 went，camping 保留，went camping 去野营。"},
{i:98,c:"6en-9",ch:"六下·第3单元 Where did you go?（过去时·旅行）",f:0,q:"“ride a horse”的过去式是？",o:["rode a horse","rided a horse","rode horse","ride a horse"],a:0,k:"过去式：ride→rode",e:"解析：ride 不规则过去式 rode，rode a horse 骑马。"},
{i:99,c:"6en-9",ch:"六下·第3单元 Where did you go?（过去时·旅行）",f:0,q:"“take pictures”的过去式是？",o:["took pictures","taked pictures","took picture","tooked pictures"],a:0,k:"过去式：take→took",e:"解析：take 过去式 took，took pictures 拍照。taked 错误。"},
{i:100,c:"6en-9",ch:"六下·第3单元 Where did you go?（过去时·旅行）",f:0,q:"—What did you do there? —I ____ gifts for my friends.",o:["bought","buy","buied","buying"],a:0,k:"过去式：buy→bought",e:"解析：buy 不规则过去式 bought，bought gifts 买礼物。buied 错误。"},
{i:101,c:"6en-9",ch:"六下·第3单元 Where did you go?（过去时·旅行）",f:0,q:"“eat”的过去式是？",o:["ate","eated","eats","eating"],a:0,k:"过去式：eat→ate",e:"解析：eat 不规则过去式 ate。eated 错误。"},
{i:102,c:"6en-9",ch:"六下·第3单元 Where did you go?（过去时·旅行）",f:0,q:"We ____ a bike in the park.",o:["rode","ride","rodee","riding"],a:0,k:"过去式：ride→rode",e:"解析：rode a bike 骑自行车（过去时）。ride 是现在式。"},
{i:103,c:"6en-9",ch:"六下·第3单元 Where did you go?（过去时·旅行）",f:1,q:"—Where did you go? —I ____ to the zoo.（去）",o:[],a:"went",k:"过去式填空：went",e:"解析：go 的过去式 went，Where did you go 回答 I went to...。"},
{i:104,c:"6en-9",ch:"六下·第3单元 Where did you go?（过去时·旅行）",f:0,q:"“buy”的过去式是？",o:["bought","buyed","buys","buying"],a:0,k:"过去式：buy→bought",e:"解析：buy 不规则过去式 bought。buyed 错误。"},

{i:106,c:"6en-9",ch:"六下·第3单元 Where did you go?（过去时·旅行）",f:0,q:"“fell”是 ____ 的过去式。",o:["fall","fell","falling","felt"],a:0,k:"过去式：fall→fell",e:"解析：fall 摔倒/落下，过去式 fell。felt 是 feel 的过去式。"},
{i:107,c:"6en-9",ch:"六下·第3单元 Where did you go?（过去时·旅行）",f:1,q:"I took many ____ on the Great Wall.（照片）",o:[],a:"pictures",k:"词汇填空：pictures 照片",e:"解析：take pictures 拍照，many 后接复数 pictures。took 是 take 的过去式。"},

{i:108,c:"6en-10",ch:"六下·季节与活动（综合时态·简短阅读）",f:0,q:"一年有几个季节？",o:["Four.","Three.","Two.","Five."],a:0,k:"常识：四季",e:"解析：一年有春夏秋冬四个季节 Four seasons。spring/summer/autumn/fall/winter。"},

{i:111,c:"6en-10",ch:"六下·季节与活动（综合时态·简短阅读）",f:0,q:"Look! The boy ____ a snowman.",o:["is making","makes","making","make"],a:0,k:"时态：现在进行时",e:"解析：Look! 提示此刻正在发生，用现在进行时 be + doing。The boy 用 is making。"},
{i:112,c:"6en-10",ch:"六下·季节与活动（综合时态·简短阅读）",f:0,q:"Yesterday I ____ apples on the farm.",o:["picked","pick","picks","picking"],a:0,k:"时态：一般过去时",e:"解析：yesterday 昨天用过去时，pick 加 -ed = picked 摘。"},

{i:1,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:0,q:"放大镜的放大倍数与什么有关？",o:["镜片的凸度（鼓起程度）","颜色","重量","价格"],a:0,k:"凸度决定放大",e:"解析：放大镜是凸透镜，镜片凸度越大，放大倍数越大。"},
{i:2,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:0,q:"下图中显微镜的总放大倍数等于？",o:["目镜倍数×物镜倍数","目镜倍数+物镜倍数","目镜倍数−物镜倍数","随机"],a:0,k:"显微镜放大倍数",e:"解析：显微镜总放大倍数=目镜放大倍数×物镜放大倍数。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g6sci/microscope.svg"},
{i:3,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:0,q:"用显微镜观察标本时，一般的正确顺序是？",o:["先用低倍镜再换高倍镜","直接用最高倍镜","不用对焦","只盯着目镜"],a:0,k:"先低倍后高倍",e:"解析：先用低倍镜找到目标并调清，再换高倍镜观察细节。"},
{i:4,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:0,q:"显微镜上用来夹住玻片标本的部件在？",o:["载物台的压片夹","目镜","反光镜","镜筒"],a:0,k:"压片夹",e:"解析：载物台上的压片夹用来固定玻片标本。"},
{i:5,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:0,q:"列文虎克与罗伯特·胡克在微观观察上的主要贡献是？",o:["早期用显微镜观察微生物、发现并命名细胞","发明电话","发现万有引力","发明电灯"],a:0,k:"显微先驱",e:"解析：列文虎克最早用显微镜观察微生物，胡克最早观察软木并命名细胞。"},
{i:6,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:0,q:"使用显微镜时，转动哪个部件可使镜筒缓慢升降、便于对焦？",o:["准焦螺旋","目镜","物镜","反光镜"],a:0,k:"准焦螺旋",e:"解析：准焦螺旋调节镜筒升降，使物像清晰。"},
{i:7,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:1,q:"放大镜能把物体图像____，让我们看清肉眼看不清的细节。",o:[],a:"放大",k:"放大镜作用",e:"解析：放大镜是凸透镜，能把物体图像放大。"},
{i:8,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:0,q:"用生物体切成的薄片做成的玻片标本叫？",o:["切片","涂片","装片","照片"],a:0,k:"切片",e:"解析：切片是用从生物体上切取的薄片制成的玻片标本。"},
{i:9,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:0,q:"显微镜下看到的物像通常是倒立的，即上下左右都？",o:["相反（颠倒）","相同","放大变小","消失"],a:0,k:"倒像",e:"解析：显微镜成倒像，物像的上下左右与实物相反。"},
{i:10,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:1,q:"显微镜中贴近眼睛的镜头叫____镜。",o:[],a:"目镜",k:"目镜",e:"解析：显微镜中靠近眼睛的叫目镜，靠近标本的叫物镜。"},
{i:11,c:"6sci-1",ch:"六上·第1单元 微小世界（放大镜与显微镜）",f:0,q:"关于观察工具的发展，正确的是？",o:["从肉眼→放大镜→显微镜，观察范围越来越大","从显微镜→放大镜→肉眼","肉眼能直接看到细胞","放大镜能看到病毒"],a:0,k:"工具进步",e:"解析：观察工具从肉眼到放大镜再到显微镜，能看清的尺度越来越小、范围越来越大。"},

{i:12,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:0,q:"细胞学说的核心观点是？",o:["生物体由细胞构成，细胞是基本单位","细胞是空的","只有动物有细胞","植物没有细胞"],a:0,k:"细胞学说",e:"解析：细胞学说认为细胞是生物体结构和功能的基本单位。"},
{i:13,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:0,q:"下图中一个个小格是洋葱表皮的？",o:["细胞","分子","原子","沙粒"],a:0,k:"细胞结构",e:"解析：洋葱表皮由许多长方形细胞组成，红点是细胞核。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g6sci/cell.svg"},
{i:14,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:0,q:"洋葱表皮细胞与人体口腔细胞相比，特有的结构是？",o:["细胞壁","细胞核","细胞膜","细胞质"],a:0,k:"植物细胞有壁",e:"解析：植物细胞有细胞壁，动物细胞没有细胞壁。"},
{i:15,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:0,q:"下列是单细胞生物的是？",o:["草履虫","大树","人","大象"],a:0,k:"单细胞生物",e:"解析：草履虫身体只由一个细胞构成，是单细胞生物。"},
{i:16,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:0,q:"微生物通常不包括下列哪一类？",o:["岩石","细菌","真菌","病毒"],a:0,k:"微生物种类",e:"解析：微生物包括细菌、真菌、病毒等，岩石不是生物。"},
{i:17,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:0,q:"制作馒头时使面团发酵膨松常用的微生物是？",o:["酵母菌","病毒","石头","食盐"],a:0,k:"酵母菌发酵",e:"解析：酵母菌发酵产生二氧化碳，使面团膨松。"},
{i:18,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:0,q:"关于微生物，正确的是？",o:["既有有益的也有有害的","全都有害","都不是生物","看不见就不是生物"],a:0,k:"微生物利弊",e:"解析：微生物不都是有害的，如酵母菌、乳酸菌有益，也有致病菌有害。"},
{i:19,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:1,q:"绝大多数生物体都是由____构成的。",o:[],a:"细胞",k:"细胞基本单位",e:"解析：除少数病毒外，生物体都是由细胞构成的。"},
{i:20,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:1,q:"动物细胞没有细胞壁，____细胞（如洋葱表皮）有细胞壁。",o:[],a:"植物",k:"动植物细胞区别",e:"解析：植物细胞有细胞壁，动物细胞没有。"},
{i:21,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:0,q:"显微镜下目标偏在左上方，要把它移到视野中央，应把玻片往？",o:["左上方移","右下方移","不动","正下方"],a:0,k:"倒像移片",e:"解析：显微镜成倒像，物像偏哪边就把玻片往哪边移。"},
{i:22,c:"6sci-2",ch:"六上·第1单元 微小世界（细胞与微生物）",f:0,q:"红细胞呈圆饼状、神经细胞伸出许多突起，说明？",o:["细胞形态结构与功能相适应","细胞都一样","细胞没有功能","细胞不能改变"],a:0,k:"结构与功能适应",e:"解析：不同细胞形态不同，是与它们承担的功能相适应的。"},

{i:23,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:0,q:"物理变化和化学变化的本质区别是？",o:["是否产生新物质","是否有声音","是否发光","是否放热"],a:0,k:"本质=新物质",e:"解析：判断是否产生新物质，是区分物理变化和化学变化的根本标准。"},
{i:24,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:0,q:"下图中蓝色框里的“冰融化、玻璃碎”属于？",o:["物理变化","化学变化","核变化","生物变化"],a:0,k:"物理变化",e:"解析：冰融化、玻璃破碎只改变形态或大小，没有新物质生成，是物理变化。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g6sci/changes.svg"},
{i:25,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:0,q:"下列属于物理变化的是？",o:["水蒸发成水蒸气","铁生锈","蜡烛燃烧","米饭变馊"],a:0,k:"物理变化举例",e:"解析：水蒸发只是状态改变，没有新物质，是物理变化。"},
{i:26,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:0,q:"下列属于化学变化的是？",o:["蜡烛燃烧","折纸","冰融化","玻璃破碎"],a:0,k:"化学变化举例",e:"解析：蜡烛燃烧生成二氧化碳和水等新物质，是化学变化。"},
{i:27,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:0,q:"化学变化常伴随的现象不包括？",o:["仅形状改变（如折纸）","产生气体","改变颜色","发光发热"],a:0,k:"化学伴随现象",e:"解析：产生气体、变色、发光发热常是化学变化的迹象；单纯形状改变是物理变化。"},
{i:28,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:0,q:"蜡烛燃烧时蜡先熔化又燃烧，其中蜡熔化属于？",o:["物理变化","化学变化","核变化","生物变化"],a:0,k:"熔化是物理",e:"解析：蜡受热熔化只是状态变化，是物理变化；燃烧生成新物质是化学变化。"},
{i:29,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:0,q:"我们的世界是由什么构成的？",o:["物质","只有生命","只有空气","空无一物"],a:0,k:"世界是物质的",e:"解析：世界是由物质构成的，物质都在不断地变化。"},
{i:30,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:1,q:"没有新物质生成的变化叫____变化。",o:[],a:"物理",k:"物理变化",e:"解析：没有新物质生成的变化叫物理变化，如状态、形状改变。"},
{i:31,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:1,q:"生成了新物质的变化叫____变化。",o:[],a:"化学",k:"化学变化",e:"解析：生成新物质的变化叫化学变化。"},
{i:32,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:0,q:"下列变化中，与其他三个不同的是？",o:["铁生锈（化学）","冰融化（物理）","玻璃破碎（物理）","水结冰（物理）"],a:0,k:"区分变化类型",e:"解析：铁生锈生成铁锈是新物质，属化学变化；其余都是物理变化。"},
{i:33,c:"6sci-3",ch:"六上·第2单元 物质的变化（物理与化学）",f:0,q:"判别一个变化是否为化学变化，最根本看？",o:["有没有新物质生成","有没有声音","是不是固体","是不是热的"],a:0,k:"判别根本",e:"解析：根本标准是是否产生新物质。"},

{i:34,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:0,q:"米饭在口腔中咀嚼久了会有甜味，是因为淀粉变成了？",o:["麦芽糖","沙子","食盐","水"],a:0,k:"唾液淀粉酶",e:"解析：唾液中的淀粉酶把淀粉分解为麦芽糖，所以变甜。"},
{i:35,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:0,q:"检验淀粉常用哪种试剂，遇淀粉会变蓝紫色？",o:["碘酒（碘液）","盐水","醋","酒精"],a:0,k:"淀粉遇碘变蓝",e:"解析：淀粉遇碘酒（碘液）变蓝紫色，可用来检验淀粉。"},
{i:36,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:0,q:"下图中哪根铁钉最容易生锈？",o:["同时接触水和空气的那根","完全泡在油里的","放在干燥处的","涂了漆的"],a:0,k:"铁生锈条件",e:"解析：铁生锈需要水和空气（氧气）同时具备，三者缺一会减缓或防止生锈。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g6sci/rust.svg"},
{i:37,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:0,q:"铁生锈是铁与哪些物质作用形成铁锈？",o:["水和氧气","只有阳光","只有糖","只有盐"],a:0,k:"铁锈成因",e:"解析：铁与水和氧气共同作用生成铁锈（氧化铁），是化学变化。"},
{i:38,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:0,q:"下列做法不能防止铁生锈的是？",o:["把铁放在潮湿处","涂油漆","电镀","擦干并保持干燥"],a:0,k:"防锈",e:"解析：潮湿处会加速生锈；涂漆、电镀、保持干燥都能隔绝水或氧来防锈。"},
{i:39,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:0,q:"小苏打和白醋混合，会观察到？",o:["产生大量二氧化碳气体","变成固体金","没有任何变化","燃烧起来"],a:0,k:"小苏打+白醋",e:"解析：小苏打（碳酸氢钠）与白醋反应产生二氧化碳气体，冒泡。"},
{i:40,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:0,q:"把铁钉浸入硫酸铜溶液，会看到铁钉表面？",o:["附着红色物质（铜）","变成黑色","消失","长出叶子"],a:0,k:"置换反应",e:"解析：铁比铜活泼，能把铜置换出来，铁钉表面出现红色铜，溶液变浅绿，是化学变化。"},
{i:41,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:1,q:"铁生锈是____变化（填“物理”或“化学”）。",o:[],a:"化学",k:"铁生锈是化学",e:"解析：铁生锈生成了新物质铁锈，是化学变化。"},
{i:42,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:1,q:"铁生锈需要水和空气，因此把铁制品____并保持干燥可减缓生锈。",o:[],a:"擦干",k:"防锈方法",e:"解析：擦干、涂油、喷漆、电镀等都能隔绝水或氧气，减缓生锈。"},
{i:43,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:0,q:"米饭、淀粉遇到碘酒发生变化，属于？",o:["化学变化","物理变化","没有变化","生物变化"],a:0,k:"淀粉碘酒反应",e:"解析：淀粉与碘酒反应生成蓝紫色新物质，是化学变化。"},
{i:44,c:"6sci-4",ch:"六上·第2单元 物质的变化（常见的化学变化）",f:0,q:"关于物质变化，正确的是？",o:["物理变化和化学变化在生活中都常见","只有化学变化存在","只有物理变化存在","变化都不重要"],a:0,k:"两类变化都常见",e:"解析：物理变化和化学变化在自然界和生活中都十分常见。"},

{i:45,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:0,q:"月球本身能发光吗？",o:["不能，靠反射太阳光","能，像太阳一样","有时能","永远能"],a:0,k:"月球不发光",e:"解析：月球本身不发光，我们看到的月光是它反射的太阳光。"},
{i:46,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:0,q:"下图中月相变化的顺序大致是？",o:["新月→上弦→满月→下弦→新月","满月→新月→上弦→下弦","新月→满月（中间无过渡）","随机变化"],a:0,k:"月相顺序",e:"解析：月相按新月、上弦月、满月、下弦月再回到新月循环变化。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g6sci/moon_phases.svg"},
{i:47,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:0,q:"月相变化的一个周期大约是？",o:["29.5天（约一个月）","1天","1年","1小时"],a:0,k:"朔望月周期",e:"解析：从新月到下一个新月约29.5天，叫一个朔望月。"},
{i:48,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:0,q:"农历每月十五、十六出现的圆月叫？",o:["满月（望）","新月","上弦月","下弦月"],a:0,k:"满月",e:"解析：农历十五、十六月球被照亮的一面全部朝向地球，是满月（望）。"},
{i:49,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:0,q:"农历初七、初八常见的“半个月亮”是？",o:["上弦月","满月","新月","残月"],a:0,k:"上弦月",e:"解析：农历初七、初八是上弦月，明亮部分约一半。"},
{i:50,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:0,q:"上弦月明亮的部分在月面的？",o:["西（右）半边","东（左）半边","全部","都没有"],a:0,k:"上弦月亮面",e:"解析：上弦月傍晚可见，亮面朝西（右边）；下弦月亮面朝东（左边）。"},
{i:51,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:0,q:"北极星可以用来辨别？",o:["北方","南方","东方","西方"],a:0,k:"北极星指北",e:"解析：北极星几乎在正北方向，可用来辨别北方。"},
{i:52,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:0,q:"北斗七星属于哪个星座？",o:["大熊座","小熊座","猎户座","天蝎座"],a:0,k:"北斗七星",e:"解析：北斗七星是大熊座的一部分，沿勺口两星延长可找到北极星。"},
{i:53,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:1,q:"月球____（填“能”或“不能”）自己发光，月光是它反射的太阳光。",o:[],a:"不能",k:"月球不发光",e:"解析：月球本身不发光，我们看到的月光是它反射太阳的光。"},
{i:54,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:1,q:"天空中被人们划分出的88个区域叫____，如北斗七星属大熊座。",o:[],a:"星座",k:"星座",e:"解析：人们把星空划分为88个星座，方便认星。"},
{i:55,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:0,q:"形成月相变化的原因是？",o:["月球、地球、太阳相对位置变化","月亮自己变色","地球挡住月亮","月亮会消失"],a:0,k:"月相成因",e:"解析：由于日、地、月相对位置变化，我们看到月球被照亮部分形状改变，形成月相。"},
{i:56,c:"6sci-5",ch:"六上·第3单元 宇宙（月相与星座）",f:0,q:"一天中月亮在天空中的位置不断移动，主要是因为？",o:["地球自转带来的天体视运动","月亮自己快速飞行","太阳拉着月亮","星星推动月亮"],a:0,k:"视运动",e:"解析：主要是地球自转使我们看到月亮等天体东升西落。"},

{i:57,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:0,q:"地球自转产生的主要现象是？",o:["昼夜交替","月相变化","星座移动","潮汐（主因月球）"],a:0,k:"自转→昼夜",e:"解析：地球是不透明的球体且不停自转，面向太阳的一半是白天，背向的是黑夜，形成昼夜交替。"},
{i:58,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:0,q:"下图中地球绕太阳公转且地轴倾斜，形成的是？",o:["四季","昼夜交替","月相","日食"],a:0,k:"公转→四季",e:"解析：地球公转时地轴倾斜，使太阳直射点在南北回归线间移动，形成四季。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g6sci/earth_orbit.svg"},
{i:59,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:0,q:"地球自转的方向是？",o:["自西向东","自东向西","由南向北","不动"],a:0,k:"自转方向",e:"解析：地球自转方向是自西向东。"},
{i:60,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:0,q:"在同一天里，位置偏东的地方比偏西的地方？",o:["先迎来黎明","后迎来黎明","同时天亮","随机"],a:0,k:"东边先黎明",e:"解析：地球自西向东转，东边先被太阳照到，先迎来黎明。"},
{i:61,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:0,q:"同一地点正午物体的影子，夏季比冬季？",o:["短","长","一样","消失"],a:0,k:"影长季节变化",e:"解析：夏季太阳高度角大，正午影子短；冬季太阳高度角小，影子长。"},
{i:62,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:0,q:"地球公转时，地轴倾斜的角度约为？",o:["23.5°","0°","90°","45°"],a:0,k:"地轴倾角",e:"解析：地轴相对于公转轨道面倾斜约23.5°。"},
{i:63,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:0,q:"地球公转一周的时间约为？",o:["365天","24小时","1天","10天"],a:0,k:"公转周期",e:"解析：地球绕太阳公转一周约365天，即一年。"},
{i:64,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:1,q:"地球绕地轴转动叫____。",o:[],a:"自转",k:"自转",e:"解析：地球绕地轴旋转叫自转，周期约24小时。"},
{i:65,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:1,q:"地球公转时地轴始终____（填“倾斜”或“竖直”）。",o:[],a:"倾斜",k:"地轴倾斜",e:"解析：地球公转时地轴始终倾斜约23.5°，指向北极星附近。"},
{i:66,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:0,q:"下列能支持“地球是球体”的事实是？",o:["海上先见船帆后见船身、月食时地球影子是弧形","地面看起来是平的","星星位置不变","太阳绕地球转"],a:0,k:"地球是球体",e:"解析：进港船只先见桅杆后见船身、月食时地球投影为弧形，都说明地球是球体。"},
{i:67,c:"6sci-6",ch:"六上·第3单元 宇宙（地球自转与公转）",f:0,q:"昼夜交替现象的根本原因是？",o:["地球不透明且自转","月亮挡光","太阳绕地球","星星发光"],a:0,k:"昼夜成因",e:"解析：地球是不透明球体又不停自转，所以产生昼夜交替。"},

{i:68,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:0,q:"最早发现“通电导线能使磁针偏转”（电生磁）的科学家是？",o:["奥斯特","牛顿","爱因斯坦","爱迪生"],a:0,k:"奥斯特实验",e:"解析：奥斯特发现通电导线周围存在磁场，使旁边磁针偏转。"},
{i:69,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:0,q:"下图中通电线圈绕在铁芯上能吸起铁钉，这叫？",o:["电磁铁","永久磁铁","电池","开关"],a:0,k:"电磁铁",e:"解析：通电线圈产生磁性、断电磁性消失，这种装置叫电磁铁。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g6sci/electromagnet.svg"},
{i:70,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:0,q:"电磁铁磁性强弱与什么有关？",o:["电流大小和线圈匝数","颜色","重量","价格"],a:0,k:"磁性强弱因素",e:"解析：电流越大、线圈匝数越多，电磁铁磁性越强。"},
{i:71,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:0,q:"电磁铁与永久磁铁的主要不同是？",o:["电磁铁通电有磁、断电无磁","永远有磁","不能吸铁","不能控制"],a:0,k:"电磁铁可控",e:"解析：电磁铁磁性随通电、断电可控，永久磁铁磁性强弱基本不变。"},
{i:72,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:0,q:"电动机工作时，主要把电能转化为？",o:["机械能（动能）","光能","化学能","单纯热能"],a:0,k:"电动机能量转化",e:"解析：电动机通电后在磁场中转动，把电能转化为机械能。"},
{i:73,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:0,q:"电铃、电磁起重机主要利用了什么装置？",o:["电磁铁","电池发电","太阳能板","化学反应"],a:0,k:"电磁铁应用",e:"解析：电铃、电磁起重机都利用电磁铁通电产生磁性来工作。"},
{i:74,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:0,q:"电池供电时，主要把什么能转化为电能？",o:["化学能","光能","机械能","热能"],a:0,k:"电池能量转化",e:"解析：电池内部发生化学反应，把化学能转化为电能。"},
{i:75,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:1,q:"奥斯特实验说明：通电导线周围存在____。",o:[],a:"磁场",k:"电生磁",e:"解析：奥斯特实验表明通电导线周围存在磁场，即电生磁。"},
{i:76,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:1,q:"由铁芯和通电线圈组成的装置叫____。",o:[],a:"电磁铁",k:"电磁铁",e:"解析：带铁芯的通电线圈就是电磁铁。"},
{i:77,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:0,q:"要让电磁铁吸起更重的铁块，可以？",o:["增大电流或增加线圈匝数","减小电流","拆掉铁芯","断电"],a:0,k:"增强磁性",e:"解析：增大电流或增加匝数可增强电磁铁磁性；加铁芯也能增强。"},
{i:78,c:"6sci-7",ch:"六上·第4单元 能量（电与磁）",f:0,q:"关于电和磁，正确的是？",o:["电和磁可以相互转化（电生磁、磁生电）","电和磁毫无关系","磁不能由电产生","电不能由磁产生"],a:0,k:"电磁联系",e:"解析：奥斯特发现电生磁，法拉第发现磁生电，电和磁可以相互转化。"},

{i:79,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:0,q:"下列不是能量形式的是？",o:["颜色","动能","热能","电能"],a:0,k:"能量形式",e:"解析：常见的能量形式有机械能、热能、电能、光能、化学能、声能等，颜色不是能量。"},
{i:80,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:0,q:"下图中太阳的光能进入植物体内，转化为？",o:["化学能","核能","声能","磁能"],a:0,k:"光能→化学能",e:"解析：植物光合作用把光能转化为储存在有机物中的化学能。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g6sci/energy.svg"},
{i:81,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:0,q:"双手快速摩擦会发热，这是把什么能转化为热能？",o:["机械能（动能）","光能","化学能","电能"],a:0,k:"摩擦生热",e:"解析：摩擦时机械能转化为热能，所以手会发热。"},
{i:82,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:0,q:"煤、石油、天然气属于？",o:["不可再生能源","可再生能源","取之不尽的能源","人造能源"],a:0,k:"不可再生能源",e:"解析：它们是古代生物遗体经过漫长地质年代形成的，用一点少一点，属不可再生能源。"},
{i:83,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:0,q:"下列属于可再生能源的是？",o:["太阳能","煤","石油","天然气"],a:0,k:"可再生能源",e:"解析：太阳能、风能、水能等可不断补充，属可再生能源。"},
{i:84,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:0,q:"煤、石油、天然气燃烧时，主要把化学能转化为？",o:["热能和光能","机械能","电能","核能"],a:0,k:"燃烧能量转化",e:"解析：燃料燃烧把化学能转化为热能和光能。"},
{i:85,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:1,q:"物体由于运动而具有的能叫____能。",o:[],a:"动",k:"动能",e:"解析：物体由于运动而具有的能叫动能，是机械能的一种。"},
{i:86,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:1,q:"太阳能、风能、水能都属于____（填“可再生”或“不可再生”）能源。",o:[],a:"可再生",k:"可再生能源",e:"解析：太阳能、风能、水能可以源源不断地得到，是可再生能源。"},
{i:87,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:0,q:"发电机工作时，主要把机械能转化为？",o:["电能","光能","化学能","热能"],a:0,k:"发电机",e:"解析：发电机利用电磁感应把机械能转化为电能。"},
{i:88,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:0,q:"关于节约能源，正确的做法是？",o:["随手关灯、使用节能产品","通宵开灯","浪费水电","拒绝节能电器"],a:0,k:"节能",e:"解析：随手关灯、使用节能产品能减少能源消耗。"},
{i:89,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:0,q:"下列过程中，化学能转化为光能的是？",o:["蜡烛燃烧发光","折纸","冰融化","石头下落"],a:0,k:"化学能→光能",e:"解析：蜡烛燃烧是化学变化，把化学能转化为光能和热能。"},
{i:90,c:"6sci-8",ch:"六上·第4单元 能量（能量形式与转化）",f:0,q:"关于能量，正确的说法是？",o:["能量可以相互转化，但总量不变","能量会凭空消失","能量会凭空产生","能量只增不减"],a:0,k:"能量守恒",e:"解析：能量既不能凭空产生也不能凭空消失，只能从一种形式转化为另一种形式。"},

{i:91,c:"6sci-9",ch:"六下·第1单元 环境与保护（垃圾分类）",f:0,q:"可回收物收集容器的颜色通常是？",o:["蓝色","红色","绿色","灰色"],a:0,k:"可回收=蓝",e:"解析：我国分类标准中可回收物用蓝色容器。"},
{i:92,c:"6sci-9",ch:"六下·第1单元 环境与保护（垃圾分类）",f:0,q:"下图中红色垃圾桶应投放？",o:["有害垃圾","可回收物","厨余垃圾","其他垃圾"],a:0,k:"红色=有害",e:"解析：红色桶收有害垃圾，如废电池、废灯管、过期药品。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g6sci/waste_sort.svg"},
{i:93,c:"6sci-9",ch:"六下·第1单元 环境与保护（垃圾分类）",f:0,q:"下列应投入“有害垃圾”的是？",o:["废电池","剩饭","废纸","果皮"],a:0,k:"有害垃圾",e:"解析：废电池含重金属，属有害垃圾，需专门处理。"},
{i:94,c:"6sci-9",ch:"六下·第1单元 环境与保护（垃圾分类）",f:0,q:"剩菜剩饭、果皮属于？",o:["厨余垃圾","可回收物","有害垃圾","其他垃圾"],a:0,k:"厨余垃圾",e:"解析：易腐烂的食物残渣属厨余垃圾（湿垃圾）。"},
{i:95,c:"6sci-9",ch:"六下·第1单元 环境与保护（垃圾分类）",f:0,q:"用过的卫生纸、烟蒂属于？",o:["其他垃圾","可回收物","厨余垃圾","有害垃圾"],a:0,k:"其他垃圾",e:"解析：卫生纸、烟蒂等难以回收也不易腐烂，属其他垃圾（干垃圾）。"},
{i:96,c:"6sci-9",ch:"六下·第1单元 环境与保护（垃圾分类）",f:0,q:"塑料瓶、易拉罐、旧报纸属于？",o:["可回收物","有害垃圾","厨余垃圾","其他垃圾"],a:0,k:"可回收物",e:"解析：塑料、金属、纸张都可回收再利用，属可回收物。"},
{i:97,c:"6sci-9",ch:"六下·第1单元 环境与保护（垃圾分类）",f:0,q:"减少垃圾最有效的方法之一是？",o:["减少使用、重复使用、回收利用","多用一次性用品","不分类","随意丢弃"],a:0,k:"减量化",e:"解析：减量化（少用、复用、回收）能从源头减少垃圾。"},

{i:8,c:"6yw-1",ch:"六上·第1单元 走进自然",f:0,q:"下列作品与作者搭配正确的是（ ）。",o:["《草原》——老舍","《丁香结》——冰心","《宿建德江》——王维","《西江月》——苏轼"],a:0,k:"文学常识",e:"解析：A正确；B《丁香结》作者宗璞；C《宿建德江》作者孟浩然；D《西江月·夜行黄沙道中》作者辛弃疾。"},
{i:9,c:"6yw-1",ch:"六上·第1单元 走进自然",f:0,q:"“结，是解不完的；人生中的问题也是解不完的”出自（ ）。",o:["《丁香结》","《草原》","《白桦》","《绿》"],a:0,k:"课文内容",e:"解析：宗璞《丁香结》由丁香花蕾如结，联想到人生愁怨解不完，主张以豁达处之。"},
{i:10,c:"6yw-1",ch:"六上·第1单元 走进自然",f:1,q:"《六月二十七日望湖楼醉书》写雨过天晴：卷地风来忽吹散，____。",o:[],a:"望湖楼下水如天",k:"古诗默写",e:"解析：原句“卷地风来忽吹散，望湖楼下水如天”，写狂风驱散乌云，湖面如镜与天相接。"},

{i:11,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:0,q:"《七律·长征》“红军不怕远征难，万水千山只等闲”中“等闲”的意思是（ ）。",o:["平常、寻常","空闲","等待","闲事"],a:0,k:"词语理解：等闲",e:"解析：“等闲”意为“平常、不放在眼里”，“只等闲”即只当作平常事，表现红军蔑视困难的英雄气概。"},
{i:12,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:0,q:"《七律·长征》“五岭逶迤腾细浪，乌蒙磅礴走泥丸”使用的修辞是（ ）。",o:["夸张（兼比喻）","拟人","对偶","设问"],a:0,k:"修辞：夸张",e:"解析：把绵延五岭视作“细浪”、磅礴乌蒙视作“泥丸”，极度缩小以显红军豪迈，是夸张（兼比喻）。"},
{i:13,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:0,q:"《狼牙山五壮士》中“五壮士”指的是（ ）。",o:["马宝玉、葛振林、宋学义、胡德林、胡福才","五位将军","五个村民","五个孩子"],a:0,k:"课文内容",e:"解析：五壮士为班长马宝玉，战士葛振林、宋学义、胡德林、胡福才，弹尽跳崖，英名永存。"},
{i:14,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:0,q:"《开国大典》描写的是（ ）在天安门广场举行的开国典礼。",o:["1949年10月1日","1949年9月30日","1950年10月1日","1948年10月1日"],a:0,k:"课文内容",e:"解析：《开国大典》写1949年10月1日中华人民共和国中央人民政府成立大会，毛泽东宣告成立。"},
{i:15,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:0,q:"《灯光》中，郝副营长憧憬的是（ ）。",o:["孩子们能在电灯下学习","自己能当将军","有很多书","去北京"],a:0,k:"课文内容：《灯光》",e:"解析：王愿坚《灯光》中郝副营长想“让孩子们在明亮的电灯下学习”，为此点燃书本暴露自己而牺牲。"},
{i:16,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:1,q:"《七律·长征》中点明中心、总领全诗的诗句：____，万水千山只等闲。",o:[],a:"红军不怕远征难",k:"古诗默写",e:"解析：首联“红军不怕远征难，万水千山只等闲”总写红军不畏艰难，统领全诗。"},
{i:17,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:0,q:"《狼牙山五壮士》按事情发展顺序，下列排在最后的是（ ）。",o:["英勇跳崖","顶峰歼敌","引上绝路","接受任务"],a:0,k:"课文脉络",e:"解析：顺序为接受任务→诱敌上山→引上绝路→顶峰歼敌→英勇跳崖，跳崖是结局。"},
{i:18,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:0,q:"“金沙水拍云崖暖，大渡桥横铁索寒”中“暖”和“寒”分别烘托（ ）。",o:["巧渡金沙江的欢快、飞夺泸定桥的惊险","天气的冷暖","水温和桥温","心情好坏"],a:0,k:"诗意理解",e:"解析：“暖”暗指巧渡金沙江后的喜悦，“寒”写泸定桥铁索凌空、激战艰险，一暖一寒写出不同战斗氛围。"},
{i:19,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:0,q:"《开国大典》中，毛泽东向全世界庄严宣告（ ）。",o:["中华人民共和国中央人民政府今天成立了","中华人民共和国成立了","中国人站起来了","新中国成立了"],a:0,k:"课文内容",e:"解析：原文宣告“中华人民共和国中央人民政府今天成立了！”。"},
{i:20,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:0,q:"下列课文不属于“革命岁月”单元主题的是（ ）。",o:["《草原》","《七律·长征》","《狼牙山五壮士》","《灯光》"],a:0,k:"单元主题",e:"解析：《草原》属“走进自然”单元；其余三篇均属六上第二单元“革命岁月”。"},
{i:21,c:"6yw-2",ch:"六上·第2单元 革命岁月",f:1,q:"《七律·长征》中写红军翻越大雪山的喜悦：更喜岷山千里雪，____。",o:[],a:"三军过后尽开颜",k:"古诗默写",e:"解析：尾联“更喜岷山千里雪，三军过后尽开颜”，写红军过雪山后全军欢笑，收束全诗。"},

{i:22,c:"6yw-3",ch:"六上·第4单元 小说",f:0,q:"《桥》中，老汉把生的希望让给别人，把死的危险留给自己，表现了（ ）。",o:["共产党员无私无畏、舍己为人的品质","自私","胆小","冷漠"],a:0,k:"人物形象：《桥》",e:"解析：老支书在洪水来袭时组织村民过桥，先人后己，最后与儿子被洪水吞没，歌颂其崇高精神。"},
{i:23,c:"6yw-3",ch:"六上·第4单元 小说",f:0,q:"《穷人》的作者是（ ）国作家列夫·托尔斯泰。",o:["俄","法","英","美"],a:0,k:"文学常识：托尔斯泰",e:"解析：列夫·托尔斯泰是俄国批判现实主义作家，代表作《战争与和平》《安娜·卡列尼娜》《复活》。"},
{i:24,c:"6yw-3",ch:"六上·第4单元 小说",f:0,q:"《穷人》中，桑娜和渔夫在自家已穷困的情况下，又收养了（ ）。",o:["邻居西蒙的两个孩子","孤儿院的孩子","自己的侄子","路边的孩子"],a:0,k:"课文内容：《穷人》",e:"解析：邻居西蒙死后，桑娜主动抱回她留下的两个孩子，与丈夫宁可自己受苦也要帮助别人，体现善良。"},
{i:25,c:"6yw-3",ch:"六上·第4单元 小说",f:0,q:"《在柏林》通过写一列火车上老妇人数“一、二、三”，反映的是（ ）。",o:["战争给人民带来的深重灾难","旅途的寂寞","火车的拥挤","老人的糊涂"],a:0,k:"主题理解：《在柏林》",e:"解析：老妇人因三个儿子战死而疯癫数数，揭示一战对普通家庭的摧残，表达反战主题。"},
{i:26,c:"6yw-3",ch:"六上·第4单元 小说",f:0,q:"小说三要素通常指（ ）。",o:["人物、情节、环境","开头、中间、结尾","时间、地点、人物","语言、动作、心理"],a:0,k:"文学常识：小说三要素",e:"解析：小说三要素为人物、情节、环境；通过三要素塑造形象、反映社会。"},
{i:27,c:"6yw-3",ch:"六上·第4单元 小说",f:1,q:"《桥》中，老汉的儿子最终____（结局填空，用课文关键词）。",o:[],a:"被洪水吞没（与父亲一同牺牲）",k:"课文内容：《桥》",e:"解析：文中小伙子是老汉的儿子，危急中老汉先推群众过桥，父子俩最后都被洪水吞没。"},
{i:28,c:"6yw-3",ch:"六上·第4单元 小说",f:0,q:"《穷人》中“嗯，是个问题！”中“问题”指（ ）。",o:["要不要收养西蒙的孩子","经济困难","天气恶劣","丈夫未归"],a:0,k:"文意理解：《穷人》",e:"解析：桑娜抱回孩子后忐忑不安，与丈夫商量时“问题”指自家穷困还要不要再添两张嘴，最终两人一致收养。"},
{i:29,c:"6yw-3",ch:"六上·第4单元 小说",f:0,q:"下列作家与作品搭配正确的是（ ）。",o:["托尔斯泰——《穷人》","鲁迅——《桥》","王愿坚——《在柏林》","老舍——《穷人》"],a:0,k:"文学常识",e:"解析：A正确；B《桥》作者谈歌；C《在柏林》作者奥莱尔（美）；D《穷人》非老舍。"},
{i:30,c:"6yw-3",ch:"六上·第4单元 小说",f:0,q:"《桥》多处描写洪水“像一群受惊的野马”“势不可当”，其作用是（ ）。",o:["渲染紧张气氛，衬托老汉的镇定勇敢","说明洪水不危险","写景色优美","交代时间"],a:0,k:"环境描写作用",e:"解析：环境描写突出灾情危急，反衬老汉临危不乱、指挥有序的崇高品质。"},
{i:31,c:"6yw-3",ch:"六上·第4单元 小说",f:0,q:"《穷人》主要通过（ ）描写表现桑娜的内心活动。",o:["心理活动（忐忑不安）","外貌","景物","对话"],a:0,k:"描写方法",e:"解析：课文大量运用心理描写写桑娜抱回孩子后的“忐忑不安”，细腻展现其善良与矛盾。"},
{i:32,c:"6yw-3",ch:"六上·第4单元 小说",f:1,q:"《穷人》的作者是____（国别）的____，课文赞美了穷人____的品质。",o:[],a:"俄国、列夫·托尔斯泰、善良（宁可自己受苦也要帮助别人）",k:"课文内容",e:"解析：托尔斯泰通过桑娜夫妇收养孤儿，赞美劳动人民善良、淳朴、舍己为人的高尚品格。"},

{i:33,c:"6yw-4",ch:"六上·第6单元 保护环境古诗",f:0,q:"《浪淘沙（其一）》“九曲黄河万里沙，浪淘风簸自天涯”的作者是（ ）。",o:["刘禹锡","杜甫","白居易","李白"],a:0,k:"文学常识：刘禹锡",e:"解析：刘禹锡《浪淘沙》写黄河挟沙、风浪淘洗来自天涯，气势宏大。"},
{i:34,c:"6yw-4",ch:"六上·第6单元 保护环境古诗",f:0,q:"《江南春》“千里莺啼绿映红，水村山郭酒旗风”描绘了（ ）的江南。",o:["明媚的春日","寒冬","秋雨","夏夜"],a:0,k:"诗意理解：杜牧",e:"解析：杜牧《江南春》写江南春天：莺啼、绿树红花、水乡山城、酒旗，生机盎然，后两句转入感慨。"},
{i:35,c:"6yw-4",ch:"六上·第6单元 保护环境古诗",f:0,q:"《书湖阴先生壁》“一水护田将绿绕，两山排闼送青来”中“排闼”的意思是（ ）。",o:["推开门","排队","关闭门","推开窗户"],a:0,k:"词语理解：排闼",e:"解析：“闼”指小门，“排闼”即推开门，写青山仿佛推门送来青绿，运用拟人，对仗工整。"},
{i:36,c:"6yw-4",ch:"六上·第6单元 保护环境古诗",f:0,q:"《书湖阴先生壁》的作者是（ ），他是唐宋八大家之一。",o:["王安石","苏轼","李白","王维"],a:0,k:"文学常识：王安石",e:"解析：王安石，北宋政治家、文学家，“唐宋八大家”之一，此诗题于友人杨德逢（湖阴先生）壁上。"},
{i:37,c:"6yw-4",ch:"六上·第6单元 保护环境古诗",f:0,q:"《浪淘沙》“如今直上银河去，同到牵牛织女家”化用了（ ）的传说。",o:["牛郎织女","嫦娥奔月","精卫填海","后羿射日"],a:0,k:"文学常识",e:"解析：诗人由黄河联想到银河，想逆流直上银河，去牛郎织女家，化用牛郎织女传说，浪漫豪迈。"},
{i:38,c:"6yw-4",ch:"六上·第6单元 保护环境古诗",f:1,q:"《江南春》中写南朝寺庙在烟雨中的诗句：南朝四百八十寺，____。",o:[],a:"多少楼台烟雨中",k:"古诗默写",e:"解析：原句“南朝四百八十寺，多少楼台烟雨中”，于明媚春景中寄寓历史感慨。"},
{i:39,c:"6yw-4",ch:"六上·第6单元 保护环境古诗",f:0,q:"《只有一个地球》说明地球（ ）。",o:["渺小、资源有限、唯一可居，我们要保护它","很大很富有","可以随便搬家","没有生命"],a:0,k:"课文主旨",e:"解析：课文从“地球的渺小”“资源有限”“目前唯一适合人类居住”说明要珍惜地球、保护生态环境。"},
{i:40,c:"6yw-4",ch:"六上·第6单元 保护环境古诗",f:0,q:"下列诗句中，运用了对偶（对仗）修辞的是（ ）。",o:["一水护田将绿绕，两山排闼送青来","九曲黄河万里沙","千里莺啼绿映红","茅檐长扫净无苔"],a:0,k:"修辞：对偶",e:"解析：“一水”对“两山”，“护田”对“排闼”，“将绿绕”对“送青来”，对仗工整；其余不是对偶句。"},
{i:41,c:"6yw-4",ch:"六上·第6单元 保护环境古诗",f:0,q:"《书湖阴先生壁》“茅檐长扫净无苔，花木成畦手自栽”表现了主人（ ）。",o:["勤劳高雅、热爱生活","懒惰","富有","冷漠"],a:0,k:"诗意理解",e:"解析：庭院洁净无苔、花木成行亲手栽，表现湖阴先生勤于劳作、品格高洁。"},
{i:42,c:"6yw-4",ch:"六上·第6单元 保护环境古诗",f:1,q:"《浪淘沙（其一）》前两句：九曲黄河万里沙，____。",o:[],a:"浪淘风簸自天涯",k:"古诗默写",e:"解析：原句“九曲黄河万里沙，浪淘风簸自天涯”，“簸”是颠簸，写黄河风浪之大。"},

{i:43,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:0,q:"《伯牙鼓琴》中，伯牙的知音是（ ）。",o:["锺子期","俞伯牙","成连","孔子"],a:0,k:"文学常识：知音",e:"解析：锺子期能听懂伯牙琴声（志在太山、流水），二人互为知音；子期死，伯牙破琴绝弦。"},
{i:44,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:0,q:"“善哉乎鼓琴，巍巍乎若太山”中“善哉”的意思是（ ）。",o:["好啊","善良","擅长","太好了（贬）"],a:0,k:"文言词义：善哉",e:"解析：“善哉”是赞叹语，“好啊、妙啊”；“巍巍”高大的样子，“若太山”即像泰山。"},
{i:45,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:0,q:"“汤汤乎若流水”中“汤汤”的意思是（ ）。",o:["水流大而急的样子","热水","饭菜汤","流淌"],a:0,k:"文言词义：汤汤",e:"解析：“汤汤”读shāng shāng，形容水流大而急，锺子期以此赞伯牙琴声如流水奔腾。"},
{i:46,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:0,q:"《伯牙鼓琴》“锺子期死，伯牙破琴绝弦，终身不复鼓琴”是因为（ ）。",o:["认为世上再无知音，不必弹琴","琴坏了","忘了曲子","不想让别人听"],a:0,k:"文意理解",e:"解析：“以为世无足复为鼓琴者”——认为世间再没有值得为之弹琴的人（知音已逝），故破琴绝弦。"},
{i:47,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:0,q:"《书戴嵩画牛》中，指出戴嵩画牛错误的人是（ ）。",o:["牧童","杜处士","苏轼","李公麟"],a:0,k:"课文内容",e:"解析：牧童见画中牛“掉尾而斗”，指出牛斗时尾应“搐入两股间”，笑其失真，处士然之。"},
{i:48,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:0,q:"“牛斗，力在角，尾搐入两股间”中“股”的意思是（ ）。",o:["大腿","屁股","尾巴","后腿"],a:0,k:"文言词义：股",e:"解析：文言中“股”指“大腿”，与现代汉语“屁股”不同。牧童说牛相斗时力气在角，尾巴夹在大腿间。"},
{i:49,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:0,q:"“处士笑而然之”中“然之”的意思是（ ）。",o:["认为他说得对","然而","这样","自然"],a:0,k:"文言词义：然之",e:"解析：“然”意动“认为……对”，“然之”即认为牧童说得对，表现杜处士虚心。"},
{i:50,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:1,q:"《伯牙鼓琴》中写子期听懂流水之音：少选之间而志在流水，锺子期又曰：“善哉乎鼓琴，____。”",o:[],a:"汤汤乎若流水",k:"文言默写",e:"解析：原句“汤汤乎若流水”，与“巍巍乎若太山”相对，表现知音相契。"},
{i:51,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:0,q:"《书戴嵩画牛》告诉我们（ ）。",o:["观察要实事求是，要向有经验的人（如牧童）学习","画什么都行","牛不会斗","名画都错"],a:0,k:"寓意",e:"解析：故事说明艺术创作要符合实际、观察生活，“耕当问奴，织当问婢”，实践出真知。"},
{i:52,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:0,q:"“蜀中有杜处士，好书画，所宝以百数”中“所宝”指（ ）。",o:["所珍藏的（书画）","宝贝","宝玉","宝物店"],a:0,k:"文言词义：所宝",e:"解析：“宝”此处作动词“珍藏”，“所宝”即所珍藏的东西，指杜处士珍藏的书画数以百计。"},
{i:53,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:0,q:"“终身不复鼓琴”中“复”的意思是（ ）。",o:["再","复习","恢复","反复"],a:0,k:"文言词义：复",e:"解析：“复”意为“再”，“不复鼓琴”即不再弹琴，写伯牙因知音亡故终身不再弹。"},
{i:54,c:"6yw-5",ch:"六上·第7单元 文言文二则",f:1,q:"《书戴嵩画牛》中牧童指出画牛错误：牛斗力在角，尾____入两股间，今乃____而斗，谬矣。",o:[],a:"搐、掉尾",k:"文言默写",e:"解析：原句“尾搐入两股间，今乃掉尾而斗”，“搐”收缩、夹入，“掉”摆动，点出画作失真。"},

{i:55,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:0,q:"《少年闰土》中，闰土给“我”讲了许多新鲜事，下列没有提到的是（ ）。",o:["下棋","雪地捕鸟","海边拾贝","看瓜刺猹"],a:0,k:"课文内容",e:"解析：闰土讲了看瓜刺猹、雪地捕鸟、海边拾贝、看跳鱼儿等；“下棋”文中未写。"},
{i:56,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:0,q:"《少年闰土》开头描写的经典画面是（ ）。",o:["深蓝天空、金黄圆月、碧绿西瓜地，少年刺猹","雪地捕鸟","海边拾贝壳","书房读书"],a:0,k:"课文内容",e:"解析：开头“深蓝的天空中挂着一轮金黄的圆月，下面是海边的沙地，都种着一望无际的碧绿的西瓜”，少年闰土刺猹，画面鲜明。"},
{i:57,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:0,q:"《少年闰土》的作者是（ ）。",o:["鲁迅","老舍","叶圣陶","巴金"],a:0,k:"文学常识：鲁迅",e:"解析：鲁迅，原名周树人，《少年闰土》选自小说《故乡》，刻画了机智勇敢的农村少年形象。"},
{i:58,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:0,q:"“有的人活着，他已经死了；有的人死了，他还活着”出自臧克家的诗（ ）。",o:["《有的人——纪念鲁迅有感》","《春》","《繁星》","《绿》"],a:0,k:"文学常识",e:"解析：臧克家《有的人》为纪念鲁迅而作，对比两种人，歌颂鲁迅“俯首甘为孺子牛”的精神。"},
{i:59,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:0,q:"《我的伯父鲁迅先生》通过几件小事表现鲁迅（ ）。",o:["为自己想得少、为别人想得多","自私","冷漠","骄傲"],a:0,k:"课文主旨",e:"解析：周晔回忆伯父谈《水浒传》、笑谈碰壁、救助车夫、关心女佣，表现其“为自己想得少，为别人想得多”。"},
{i:60,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:1,q:"《少年闰土》中闰土颈上戴着的饰物：项带____圈。",o:[],a:"银",k:"课文内容",e:"解析：原文“项带银圈，手捏一柄钢叉”，银圈是江南农村孩子的避邪饰物。"},
{i:61,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:0,q:"《好的故事》选自鲁迅的散文诗集（ ）。",o:["《野草》","《朝花夕拾》","《呐喊》","《彷徨》"],a:0,k:"文学常识",e:"解析：“好的故事”选自鲁迅散文诗集《野草》，写梦中“美丽、幽雅、有趣”的意境，寄托对美好生活的向往。"},
{i:62,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:0,q:"鲁迅以笔为武器，被誉为（ ）。",o:["“民族魂”","“诗圣”","“药圣”","“书圣”"],a:0,k:"文学常识：鲁迅",e:"解析：鲁迅被后人誉为“民族魂”，其作品深刻批判封建礼教与国民性。"},
{i:63,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:0,q:"《我的伯父鲁迅先生》中“碰壁”实际指（ ）。",o:["鲁迅在黑暗社会中屡遭迫害、处处受阻","真的撞了墙","走路摔倒","被人打"],a:0,k:"文意理解",e:"解析：“碰壁”表面说鼻子碰墙，实指鲁迅在反动统治下受迫害、革命工作受阻，幽默中见悲愤。"},
{i:64,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:0,q:"下列作品不是鲁迅写的是（ ）。",o:["《海的女儿》","《少年闰土》","《好的故事》","《我的伯父鲁迅先生》（记鲁迅事迹）"],a:0,k:"文学常识",e:"解析：A《海的女儿》作者是安徒生；B、C是鲁迅作品；D虽由周晔写，记的也是鲁迅事迹。故选A。"},
{i:65,c:"6yw-6",ch:"六上·第8单元 走近鲁迅",f:1,q:"《有的人》中对比：有的人，骑在人民头上：“____！”；有的人，俯下身子给人民当牛马。",o:[],a:"啊，我多伟大",k:"诗句默写",e:"解析：原句“有的人/骑在人民头上：‘啊，我多伟大！’”，与“俯首甘为孺子牛”形成鲜明对比。"},

{i:66,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:0,q:"《北京的春节》的作者是（ ），我还读过他的《草原》。",o:["老舍","巴金","鲁迅","沈从文"],a:0,k:"文学常识：老舍",e:"解析：老舍《北京的春节》按时间顺序写腊八到正月十九的民俗，“腊八粥”“除夕”“元宵”等，热闹温馨。"},
{i:67,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:0,q:"《腊八粥》的作者是（ ）。",o:["沈从文","老舍","冰心","叶圣陶"],a:0,k:"文学常识：沈从文",e:"解析：沈从文《腊八粥》细致描写八儿盼粥、看粥、吃粥的过程，充满生活情趣。"},
{i:68,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:0,q:"《寒食》“春城无处不飞花，寒食东风御柳斜”写的是（ ）节前的景象。",o:["寒食节","春节","中秋","端午"],a:0,k:"文学常识：寒食",e:"解析：韩翃《寒食》写寒食节（清明前一二日）长安柳絮飞舞、东风拂柳，后写宫中传烛，暗含讽喻。"},
{i:69,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:0,q:"《迢迢牵牛星》选自（ ）。",o:["《古诗十九首》","《诗经》","《楚辞》","《乐府诗集》"],a:0,k:"文学常识",e:"解析：“迢迢牵牛星”是《古诗十九首》之一，借牛郎织女抒发离别相思。"},
{i:70,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:0,q:"《十五夜望月》“今夜月明人尽望，不知秋思落谁家”表达的是（ ）。",o:["中秋望月怀人的思念之情","春节的欢喜","对春天的喜爱","对战争的厌恶"],a:0,k:"诗意理解：王建",e:"解析：王建《十五夜望月》写中秋月夜，“秋思”指望月引发的思念，委婉动人。"},
{i:71,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:1,q:"《寒食》中写日暮宫中传烛的诗句：日暮汉宫传蜡烛，____。",o:[],a:"轻烟散入五侯家",k:"古诗默写",e:"解析：原句“日暮汉宫传蜡烛，轻烟散入五侯家”，写寒食禁火而宫廷赐烛，暗含对特权的不满。"},
{i:72,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:0,q:"《藏戏》主要介绍了（ ）地区的传统戏剧。",o:["西藏","北京","陕西","安徽"],a:0,k:"课文内容：《藏戏》",e:"解析：《藏戏》介绍藏族戏剧，以面具、演出无固定舞台、一部戏演三五天为特色，相传由唐东杰布开创。"},
{i:73,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:0,q:"下列诗句中，与牛郎织女传说有关的是（ ）。",o:["迢迢牵牛星，皎皎河汉女","春城无处不飞花","今夜月明人尽望","千磨万击还坚劲"],a:0,k:"文学常识",e:"解析：A出自《迢迢牵牛星》，写牵牛星与织女星（河汉女）；其余分别写寒食、中秋、竹石。"},
{i:74,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:0,q:"《北京的春节》中，“除夕真热闹”主要体现在（ ）。",o:["做年菜、穿新衣、贴对联、放鞭炮、吃团圆饭、守岁","睡觉","外出打工","上学"],a:0,k:"课文内容",e:"解析：文中写除夕家家赶做年菜、穿新衣、贴对联年画、放鞭炮、吃团圆饭、守岁，一片热闹。"},
{i:75,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:0,q:"“纤纤擢素手，札札弄机杼”中“擢”的意思是（ ）。",o:["伸出","举起","放下","织"],a:0,k:"词语理解：擢",e:"解析：“擢”意为“伸出、举起”，写织女（河汉女）伸出白皙的手织布，“札札”是织机声。"},
{i:76,c:"6yw-7",ch:"六下·第1单元 民风民俗",f:1,q:"《十五夜望月》前两句写月夜静景：中庭地白树栖鸦，____。",o:[],a:"冷露无声湿桂花",k:"古诗默写",e:"解析：原句“中庭地白树栖鸦，冷露无声湿桂花”，“地白”写月光照地如霜，意境清寂。"},

{i:77,c:"6yw-8",ch:"六下·第2单元 外国名著",f:0,q:"《鲁滨逊漂流记》的作者是（ ）国作家笛福。",o:["英","法","美","俄"],a:0,k:"文学常识：笛福",e:"解析：丹尼尔·笛福是英国作家，《鲁滨逊漂流记》是其代表作，写鲁滨逊荒岛求生28年。"},
{i:78,c:"6yw-8",ch:"六下·第2单元 外国名著",f:0,q:"《鲁滨逊漂流记》中，鲁滨逊在荒岛上救下的野人叫（ ）。",o:["星期五","星期六","星期日","星期一"],a:0,k:"课文内容",e:"解析：鲁滨逊救下被追杀的野人，因当天是星期五而取名“星期五”，成为他忠实的伙伴。"},
{i:79,c:"6yw-8",ch:"六下·第2单元 外国名著",f:0,q:"《骑鹅旅行记》的主人公是（ ），他变成小矮人后骑鹅旅行。",o:["尼尔斯","鲁滨逊","汤姆","格列佛"],a:0,k:"文学常识：骑鹅旅行记",e:"解析：塞尔玛·拉格洛芙（瑞典）著，淘气男孩尼尔斯被小狐仙变小，骑家鹅跟随大雁周游瑞典，终成善良孩子。"},
{i:80,c:"6yw-8",ch:"六下·第2单元 外国名著",f:0,q:"《汤姆·索亚历险记》的作者是（ ）国作家马克·吐温。",o:["美","英","法","德"],a:0,k:"文学常识：马克·吐温",e:"解析：马克·吐温是美国作家，代表作《汤姆·索亚历险记》《哈克贝利·费恩历险记》，以幽默讽刺见长。"},
{i:81,c:"6yw-8",ch:"六下·第2单元 外国名著",f:0,q:"下列名著与作者搭配正确的是（ ）。",o:["《鲁滨逊漂流记》——笛福","《骑鹅旅行记》——马克·吐温","《汤姆·索亚历险记》——笛福","《西游记》——笛福"],a:0,k:"文学常识",e:"解析：A正确；B《骑鹅》作者拉格洛芙；C《汤姆》作者马克·吐温；D《西游记》作者吴承恩。"},
{i:82,c:"6yw-8",ch:"六下·第2单元 外国名著",f:1,q:"《鲁滨逊漂流记》中鲁滨逊在荒岛上生活了____年（课文梗概提示的数字）。",o:[],a:"28",k:"课文内容",e:"解析：梗概写鲁滨逊在荒岛生活了28年，建房、种麦、养羊、救“星期五”，最终返乡。"},
{i:83,c:"6yw-8",ch:"六下·第2单元 外国名著",f:0,q:"《骑鹅旅行记》中，尼尔斯变成小矮人的原因是（ ）。",o:["得罪了小狐仙（精灵）","被魔法师变","自己施法","睡过头"],a:0,k:"课文内容",e:"解析：尼尔斯因捉弄小狐仙（小精灵）被变成拇指大的人，由此开始骑鹅旅行、改掉坏毛病。"},
{i:84,c:"6yw-8",ch:"六下·第2单元 外国名著",f:0,q:"汤姆·索亚和（ ）一起在坟场目睹了凶杀案。",o:["哈克贝利·费恩","星期五","尼尔斯","贝琪"],a:0,k:"课文内容",e:"解析：汤姆与好友哈克在坟场亲见印江·乔埃杀人，后法庭上勇敢指证，是其勇敢正直的体现。"},
{i:85,c:"6yw-8",ch:"六下·第2单元 外国名著",f:0,q:"这几部外国名著的共同特点是（ ）。",o:["都塑造了在困境中成长的主人公，充满奇遇与冒险","都是爱情小说","都写战争","都是诗歌"],a:0,k:"名著主题",e:"解析：三部均为成长/冒险小说，主人公在经历中成长，想象丰富、引人入胜。"},
{i:86,c:"6yw-8",ch:"六下·第2单元 外国名著",f:0,q:"《鲁滨逊漂流记》“梗概”部分采用的叙述顺序是（ ）。",o:["时间顺序（流落荒岛→建房→畜牧→救星期五→回乡）","倒叙","插叙","空间顺序"],a:0,k:"课文结构",e:"解析：梗概按时间顺序概述鲁滨逊遇险上岛、建房定居、畜牧种植、救星期五、回到英国的过程。"},
{i:87,c:"6yw-8",ch:"六下·第2单元 外国名著",f:1,q:"《汤姆·索亚历险记》中，汤姆和____在山洞迷路，最终靠____找到出口（课文情节关键词）。",o:[],a:"贝琪、风筝线（或细心与风筝线）",k:"课文内容",e:"解析：汤姆带贝琪在山洞迷路，他用风筝线探路、相互鼓励，最终脱险，表现其机智勇敢。"},

{i:88,c:"6yw-9",ch:"六下·第3单元 真情流露",f:0,q:"《匆匆》的作者是（ ），他还写了《背影》《荷塘月色》（散文）。",o:["朱自清","鲁迅","老舍","冰心"],a:0,k:"文学常识：朱自清",e:"解析：朱自清《匆匆》以细腻笔触写时间流逝之快，“燕子去了……有再来的时候”用排比起笔。"},
{i:89,c:"6yw-9",ch:"六下·第3单元 真情流露",f:0,q:"《匆匆》“燕子去了，有再来的时候；杨柳枯了，有再青的时候；桃花谢了，有再开的时候”使用的修辞是（ ）。",o:["排比","比喻","夸张","设问"],a:0,k:"修辞：排比",e:"解析：三个“……了，有……的时候”结构相似、意义相关，构成排比，增强语势，引出对时间“一去不返”的感叹。"},
{i:90,c:"6yw-9",ch:"六下·第3单元 真情流露",f:0,q:"《那个星期天》的作者是（ ）。",o:["史铁生","朱自清","沈从文","巴金"],a:0,k:"文学常识：史铁生",e:"解析：史铁生《那个星期天》写“我”盼着母亲带“我”出去玩，从早到晚等待中的心理变化，细腻感人。"},
{i:91,c:"6yw-9",ch:"六下·第3单元 真情流露",f:0,q:"《那个星期天》中，“我”的心情变化大致是（ ）。",o:["期盼→焦急→失望","高兴→愤怒→平静","无聊→兴奋→害怕","难过→开心→生气"],a:0,k:"课文脉络",e:"解析：“我”一早期盼外出，随时间流逝渐渐焦急、暗自失落，天黑母亲仍忙，最终失望委屈。"},
{i:92,c:"6yw-9",ch:"六下·第3单元 真情流露",f:0,q:"下列句子与《匆匆》表达“时光易逝”主题一致的是（ ）。",o:["少壮不努力，老大徒伤悲","谁知盘中餐，粒粒皆辛苦","春眠不觉晓，处处闻啼鸟","床前明月光，疑是地上霜"],a:0,k:"主题理解",e:"解析：“少壮不努力，老大徒伤悲”劝人惜时，与《匆匆》惜时主题一致；B写节俭，C写春眠，D写思乡。"},
{i:93,c:"6yw-9",ch:"六下·第3单元 真情流露",f:1,q:"《匆匆》中写时间悄然溜走：洗手的时候，日子从____里过去；吃饭的时候，日子从____里过去。",o:[],a:"水盆、饭碗",k:"课文默写",e:"解析：原句“洗手的时候，日子从水盆里过去；吃饭的时候，日子从饭碗里过去”，以日常细节写时间飞逝。"},
{i:94,c:"6yw-9",ch:"六下·第3单元 真情流露",f:0,q:"《那个星期天》通过（ ）来表现“我”的等待与失落。",o:["对光线、环境的细腻描写烘托心情","直接喊叫","写别人故事","写作业"],a:0,k:"写作手法",e:"解析：课文借“光线漫长而急遽的变化”“母亲忙碌的背影”等环境与动作描写，间接烘托“我”由盼到落空的心情。"},
{i:95,c:"6yw-9",ch:"六下·第3单元 真情流露",f:0,q:"“在默默里算着，八千多日子已经从我手中溜去”中“溜”字好在以（ ）写时间。",o:["拟人，生动写出时间无声逝去","比喻","夸张","反问"],a:0,k:"词语赏析",e:"解析：“溜”把时间当人写（拟人），形象表现日子悄悄、不知不觉地逝去，含惋惜之情。"},
{i:96,c:"6yw-9",ch:"六下·第3单元 真情流露",f:0,q:"下列作品体裁与其他不同的一项是（ ）。",o:["《那个星期天》（小说）","《匆匆》（散文）","《春》（散文）","《背影》（散文）"],a:0,k:"体裁辨析",e:"解析：《那个星期天》是小说（史铁生），其余《匆匆》《春》《背影》皆为散文。"},
{i:97,c:"6yw-9",ch:"六下·第3单元 真情流露",f:1,q:"《匆匆》结尾：你聪明的，告诉我，我们的日子为什么____呢？",o:[],a:"一去不复返",k:"课文默写",e:"解析：原句“你聪明的，告诉我，我们的日子为什么一去不复返呢？”以问收束，强化惜时之叹。"},
{i:98,c:"6yw-9",ch:"六下·第3单元 真情流露",f:0,q:"史铁生的作品常表达对生命与时间的思考，下列属于他的是（ ）。",o:["《我与地坛》（课外科普）","《草原》","《腊八粥》","《繁星》"],a:0,k:"文学常识",e:"解析：《我与地坛》是史铁生代表作；B老舍、C沈从文、D冰心，均非史铁生。"},

{i:99,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:0,q:"《马诗》“大漠沙如雪，燕山月似钩”中“何当金络脑”的“何当”意思是（ ）。",o:["何时才能","什么东西","为什么","应当"],a:0,k:"词语理解：何当",e:"解析：“何当”意为“何时才能够”，诗人借骏马渴望金络脑、驰骋清秋，抒发自己渴望建功立业。"},
{i:100,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:0,q:"《马诗》的作者是（ ）代诗人李贺，有“诗鬼”之称。",o:["唐","宋","元","明"],a:0,k:"文学常识：李贺",e:"解析：李贺，唐代诗人，诗风奇诡，称“诗鬼”。《马诗》共23首，此为第五首，托物言志。"},
{i:101,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:0,q:"《石灰吟》“粉骨碎身浑不怕，要留清白在人间”中“清白”（ ）。",o:["既指石灰的白色，又双关指高尚的品格","只指颜色白","指天气","指衣服"],a:0,k:"词语理解：清白（双关）",e:"解析：“清白”表面写石灰经烧炼后洁白，实际双关诗人于谦坚贞不屈、清白做人的高尚节操。"},
{i:102,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:0,q:"《石灰吟》的作者是（ ）代于谦。",o:["明","唐","宋","清"],a:0,k:"文学常识：于谦",e:"解析：于谦是明代民族英雄、诗人，官至兵部尚书，《石灰吟》借物咏怀，表明宁死不屈的志向。"},
{i:103,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:0,q:"《竹石》“千磨万击还坚劲，任尔东西南北风”中“任尔”的意思是（ ）。",o:["任凭你","任何","任务","忍耐"],a:0,k:"词语理解：任尔",e:"解析：“任”是“任凭”，“尔”是“你”，“任尔”即“任凭你（指狂风）”，写竹石坚韧、不怕任何打击。"},
{i:104,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:0,q:"《竹石》的作者是（ ），号板桥，为“扬州八怪”之一。",o:["郑燮","于谦","李贺","王冕"],a:0,k:"文学常识：郑燮",e:"解析：郑燮，字克柔，号板桥，清代书画家、“扬州八怪”之一，《竹石》借岩竹写顽强坚韧。"},
{i:105,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:1,q:"《马诗》中表达渴望驰骋沙场：何当金络脑，____。",o:[],a:"快走踏清秋",k:"古诗默写",e:"解析：原句“何当金络脑，快走踏清秋”，“金络脑”指贵重的马笼头，寄托建功立业之志。"},
{i:106,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:0,q:"这三首古诗《马诗》《石灰吟》《竹石》的共同写法是（ ）。",o:["托物言志（借物抒怀）","叙事抒情","写景状物不抒情","讽刺时弊"],a:0,k:"写作手法：托物言志",e:"解析：三诗均借马、石灰、竹石等物来表达诗人的志向品格，属“托物言志”。"},
{i:107,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:0,q:"《十六年前的回忆》写的是（ ）被捕前后的事迹。",o:["李大钊","毛泽东","周恩来","刘少奇"],a:0,k:"课文内容",e:"解析：李星华回忆父亲李大钊在1927年4月被捕牺牲，表现其忠于革命、坚贞不屈。"},
{i:108,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:0,q:"《为人民服务》是毛泽东在（ ）同志追悼会上作的演讲。",o:["张思德","白求恩","雷锋","李大钊"],a:0,k:"课文内容",e:"解析：毛泽东《为人民服务》为纪念中央警备团战士张思德而作，阐述“为人民服务”的宗旨。"},
{i:109,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:0,q:"下列诗句中，不是“托物言志”的一项是（ ）。",o:["千里莺啼绿映红，水村山郭酒旗风","千磨万击还坚劲，任尔东西南北风","粉骨碎身浑不怕，要留清白在人间","何当金络脑，快走踏清秋"],a:0,k:"写作手法",e:"解析：A是杜牧《江南春》纯写景抒情；B、C、D分别为竹石、石灰、马诗，均托物言志。"},
{i:110,c:"6yw-10",ch:"六下·第4单元 志向与诗言志",f:1,q:"《竹石》中写竹子立根牢固：咬定青山不放松，____。",o:[],a:"立根原在破岩中",k:"古诗默写",e:"解析：原句“咬定青山不放松，立根原在破岩中”，“破岩”指破裂的岩石缝，突出竹之坚韧。"},

{i:111,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:0,q:"《学弈》中，两人跟弈秋学下棋，结果（ ）。",o:["专心者学得好，分心者不如他","两人都学得好","分心者更好","两人都不会"],a:0,k:"文意理解：《学弈》",e:"解析：一人“专心致志惟弈秋之为听”，一人“一心以为有鸿鹄将至”想射雁，故前者学得好、后者差，说明专心重要。"},
{i:112,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:0,q:"“使弈秋诲二人弈”中“诲”的意思是（ ）。",o:["教导","后悔","毁坏","晦气"],a:0,k:"文言词义：诲",e:"解析：“诲”意为“教导”，“使弈秋诲二人弈”即让弈秋教两个人下棋。"},
{i:113,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:0,q:"“一心以为有鸿鹄将至，思援弓缴而射之”中“鸿鹄”指（ ）。",o:["天鹅","大雁","乌鸦","麻雀"],a:0,k:"文言词义：鸿鹄",e:"解析：“鸿鹄”指天鹅，比喻志向远大者；文中指那个分心的学生想着天上飞来天鹅要去射。"},
{i:114,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:0,q:"《两小儿辩日》中，两小儿争论的问题是（ ）。",o:["太阳什么时候离人近、什么时候远","太阳为什么是圆的","天为什么亮","太阳有多大"],a:0,k:"课文内容",e:"解析：一儿以“日初出大如车盖”认为晨近，一儿以“日中如探汤”认为午近，孔子不能决，说明学无止境。"},
{i:115,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:0,q:"“孔子不能决也”中“决”的意思是（ ）。",o:["判断、裁决","决定","坚决","决斗"],a:0,k:"文言词义：决",e:"解析：“决”意为“判断、判定”，连孔子也无法判定两小儿谁对，表现实事求是也说明知识无穷。"},
{i:116,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:0,q:"“孰为汝多知乎”中“知”的意思是（ ）。",o:["同“智”，智慧","知道","知己","通知"],a:0,k:"文言词义：知",e:"解析：“知”通“智”，“多知”即“知识渊博”，两小儿笑问“谁说你知识丰富呢”，体现求知精神。"},
{i:117,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:1,q:"《学弈》点明原因的设问：为是其智弗若与？曰：____。",o:[],a:"非然也",k:"文言默写",e:"解析：原句自问自答“为是其智弗若与？曰：非然也”，“非然也”即“不是这样的”，强调成败在专心与否而非智力。"},
{i:118,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:0,q:"《真理诞生于一百个问号之后》的中心观点是（ ）。",o:["真理源于敏锐观察、不断发问与探索","真理是天生的","问号没用","只要提问就有真理"],a:0,k:"课文主旨",e:"解析：叶永烈以谢皮罗、波义耳等例说明：从细微现象提出疑问、反复探索，就能发现真理，即“真理诞生于一百个问号之后”。"},
{i:119,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:0,q:"《表里的生物》中，“我”认为父亲的表里藏着（ ）。",o:["一个会发声的小生物","齿轮","发条","钻石"],a:0,k:"课文内容",e:"解析：冯至《表里的生物》写童年“我”猜想表内关着神秘小生物，表现孩子的好奇心与探索欲。"},
{i:120,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:0,q:"下列成语与“专心致志”意思相近的是（ ）。",o:["聚精会神","三心二意","心不在焉","走马观花"],a:0,k:"词语理解",e:"解析：“专心致志”与“聚精会神”都指注意力高度集中；B、C表不专心，D表粗略观察。"},
{i:121,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:1,q:"《两小儿辩日》结语：两小儿笑曰：“孰为汝____乎？”",o:[],a:"多知",k:"文言默写",e:"解析：原句“孰为汝多知乎”，“多知”即知识渊博，两小儿以此调侃孔子，凸显求知与质疑精神。"},
{i:122,c:"6yw-11",ch:"六下·第5单元 文言文与科学精神",f:0,q:"《学弈》选自（ ）。",o:["《孟子》","《论语》","《庄子》","《列子》"],a:0,k:"文学常识：《学弈》",e:"解析：《学弈》选自《孟子·告子上》，通过学棋说明学习须专心致志。"},

{i:123,c:"6yw-12",ch:"六下·第6单元 句子改写与口语交际",f:0,q:"把“难道我们不应该保护地球吗？”改为陈述句，正确的是（ ）。",o:["我们应该保护地球","我们不应该保护地球","地球保护我们","我们不能保护地球"],a:0,k:"句式转换：反问→陈述",e:"解析：反问句“难道不……吗”表肯定，改为陈述即“我们应该保护地球”，意思不变、语气减弱。"},

(function migrate(){
  ["yw","sx","en"].forEach(function(s){
    if(window.QA[s]){ window.QA["5"+s] = window.QA[s]; delete window.QA[s]; }
  });
  GRADES.forEach(function(g){ SUBJECTS.forEach(function(s){ if(!window.QA[key(g,s)]) window.QA[key(g,s)] = []; }); });
})();

/* ============ 章节元数据 ============ */
var CHAPTERS = {};
function rebuildChapters(){
  CHAPTERS = {};
  GRADES.forEach(function(g){ SUBJECTS.forEach(function(s){ CHAPTERS[key(g,s)] = []; }); });
  Object.keys(QA).forEach(function(k){
    if(!CHAPTERS[k]) CHAPTERS[k] = [];
    var seen = {};
    QA[k].forEach(function(q){
      if(!seen[q.c]){ seen[q.c] = 1; CHAPTERS[k].push({ c:q.c, ch:q.ch }); }
    });
  });
}
rebuildChapters();

/* ============ 状态 ============ */
var STORE_KEY = "hz_daily_v2";
var state = load();
function defaultState(){
  return { done:{}, flowers:0, checkins:{}, review:{} };
}
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ var s = JSON.parse(raw); if(s && s.done){ return s; } }
  }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function doneArr(k){ if(!state.done[k]) state.done[k] = []; return state.done[k]; }
function todayKey(){ var d = new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function todayDoneSubjects(){ return state.checkins[todayKey()] || []; }
function isSubjectDoneToday(k){ return todayDoneSubjects().indexOf(k) >= 0; }
function markSubjectDone(k){
  var arr = state.checkins[todayKey()] || [];
  if(arr.indexOf(k) < 0) arr.push(k);
  state.checkins[todayKey()] = arr;
  save();
}

/* ============ 视图切换 ============ */
var VIEWS = ["view-home","view-chapters","view-quiz","view-result"];
function showView(id){
  VIEWS.forEach(function(v){ document.getElementById(v).classList.add("hidden"); });
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo(0,0);
}

/* ============ 主页 ============ */
var currentGrade = "5";
function renderGradeTabs(){
  var html = "";
  GRADES.forEach(function(g){
    html += '<div class="grade-tab'+(g===currentGrade?' active':'')+'" onclick="selectGrade(\''+g+'\')">'+g+'年级</div>';
  });
  document.getElementById("gradeTabs").innerHTML = html;
}
function selectGrade(g){ currentGrade = g; renderHome(); }

function renderHome(){
  renderGradeTabs();
  var g = currentGrade;
  var done = todayDoneSubjects();
  var segsHtml = "";
  var subHtml = "";
  var activeCount = 0, doneCount = 0;
  SUBJECTS.forEach(function(s){
    var k = key(g,s);
    var meta = SUB_META[s];
    var chs = CHAPTERS[k] || [];
    var hasCh = chs.length > 0;
    if(hasCh) activeCount++;
    if(hasCh && done.indexOf(k) >= 0) doneCount++;
    segsHtml += '<div class="tseg'+(done.indexOf(k)>=0?' done':'')+'" data-k="'+k+'"></div>';
    var stateTxt, stateCls;
    if(!hasCh){ stateTxt = "暂无题目"; stateCls = " empty"; }
    else {
      var allDone = chs.every(function(ch){
        var all = QA[k].filter(function(q){ return q.c===ch.c; });
        return all.every(function(q){ return doneArr(k).indexOf(q.i)>=0; });
      });
      if(allDone){ stateTxt = "🎉 已通关"; stateCls = " done"; }
      else if(done.indexOf(k) >= 0){ stateTxt = "✅ 已完成"; stateCls = " done"; }
      else { stateTxt = "未完成"; stateCls = ""; }
    }
    subHtml += '<div class="subj-card '+meta.cls+'" onclick="openSubject(\''+s+'\')">'
      + '<div class="subj-left"><div class="subj-icon">'+meta.icon+'</div>'
      + '<div><div class="subj-name">'+meta.name+'</div><div class="subj-desc">'+meta.desc+' · '+g+'年级</div></div></div>'
      + '<div class="subj-state'+stateCls+'">'+stateTxt+'</div></div>';
  });
  document.getElementById("todayLine").textContent = "今天已练 "+doneCount+" / "+(activeCount||SUBJECTS.length)+" 科";
  document.getElementById("todayProgress").innerHTML = segsHtml;
  document.getElementById("flowerCount").textContent = state.flowers;
  document.getElementById("cheer").classList.toggle("hidden", state.flowers < 10);
  document.getElementById("subjectCards").innerHTML = subHtml;
  renderCalendar();
}
function renderCalendar(){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  document.getElementById("calTitle").textContent = y+" 年 "+(m+1)+" 月 打卡";
  var first = new Date(y,m,1).getDay();
  var days = new Date(y,m+1,0).getDate();
  var html = "";
  for(var i=0;i<first;i++) html += '<div class="cal-cell empty"></div>';
  for(var d=1; d<=days; d++){
    var key2 = y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+d).slice(-2);
    var checked = state.checkins[key2] && state.checkins[key2].length > 0;
    var isToday = (d === now.getDate());
    var cls = "cal-cell";
    if(isToday) cls += " today";
    if(checked) cls += " checked";
    html += '<div class="'+cls+'">'+d+'</div>';
  }
  document.getElementById("calGrid").innerHTML = html;
}

/* ============ 章节页 ============ */
var currentSubject = null;
var SUBJECT_NAMES = { yw:"语文", sx:"数学", en:"英语", sci:"科学" };

function openSubject(sub){
  currentSubject = sub;
  var k = key(currentGrade, sub);
  document.getElementById("chSubjectTitle").textContent = currentGrade+"年级 " + SUBJECT_NAMES[sub] + " · 选章节";
  var list = CHAPTERS[k] || [];
  if(list.length === 0){
    document.getElementById("chaptersBody").innerHTML = '<div class="part-label">这个年级的'+SUBJECT_NAMES[sub]+'题目还在整理中，敬请期待～</div>';
    showView("view-chapters");
    return;
  }
  var allDone = list.every(function(ch){
    var all = QA[k].filter(function(q){ return q.c===ch.c; });
    return all.every(function(q){ return doneArr(k).indexOf(q.i)>=0; });
  });
  if(allDone && !state.review[k]){
    if(confirm("这科的章节全都练完啦！要开始第二轮复习吗？复习时题目会重新出现。")){
      state.review[k] = true; save();
    }
  }
  var reviewTip = state.review[k] ? '<div class="part-label" style="color:#b8860b;">🔁 复习模式：所有章节题目重新出现</div>' : "";
  var html = reviewTip;
  var part = null;
  list.forEach(function(ch, idx){
    var isSecondHalf = (ch.ch.indexOf("下") >= 0);
    var pLabel = isSecondHalf ? "下册" : "上册";
    if(pLabel !== part){ part = pLabel; html += '<div class="part-label">'+pLabel+'</div>'; }
    var all = QA[k].filter(function(q){ return q.c===ch.c; });
    var doneCount = all.filter(function(q){ return doneArr(k).indexOf(q.i)>=0; }).length;
    var badge, cls;
    if(doneCount >= all.length){ cls="badge-ok"; badge="✅ 已完成"; }
    else if(doneCount > 0){ cls="badge-ing"; badge="进行中 "+doneCount+"/"+all.length; }
    else { cls="badge-new"; badge="未练习"; }
    html += '<div class="chapter-item" onclick="startChapter(\''+sub+'\',\''+ch.c+'\')">'
      + '<div class="chapter-name">'+ch.ch+'</div>'
      + '<div class="chapter-badge '+cls+'">'+badge+'</div></div>';
  });
  document.getElementById("chaptersBody").innerHTML = html;
  showView("view-chapters");
}

/* ============ 做题页 ============ */
var currentChapter = null;
var quizQuestions = [];
var quizIndex = 0;
var quizCorrect = 0;

function startChapter(sub, c){
  currentSubject = sub;
  var k = key(currentGrade, sub);
  var pool;
  if(state.review[k]){
    pool = QA[k].filter(function(q){ return q.c===c; });
  } else {
    pool = QA[k].filter(function(q){ return q.c===c && doneArr(k).indexOf(q.i)<0; });
  }
  shuffle(pool);
  quizQuestions = pool.slice(0,10);
  if(quizQuestions.length === 0){
    alert("这个章节的题都练完啦，换个章节吧！");
    return;
  }
  currentChapter = c;
  quizIndex = 0;
  quizCorrect = 0;
  document.getElementById("quizSubjectTitle").textContent = currentGrade+"年级 " + SUBJECT_NAMES[sub] + " · 练习";
  showView("view-quiz");
  renderQuestion();
}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
}
function renderQuestion(){
  var q = quizQuestions[quizIndex];
  document.getElementById("quizProgress").textContent = "第 "+(quizIndex+1)+" / "+quizQuestions.length+" 题";
  document.getElementById("quizFill").style.width = (quizIndex/quizQuestions.length*100)+"%";
  document.getElementById("quizChapter").textContent = q.ch;
  document.getElementById("quizImg").innerHTML = q.img ? '<img class="quiz-img" src="'+q.img+'" alt="题目配图">' : "";
  document.getElementById("quizQ").textContent = q.q;
  document.getElementById("quizFeedback").className = "feedback";
  document.getElementById("quizExplain").className = "explain";
  document.getElementById("quizNext").classList.add("hidden");
  document.getElementById("quizFinish").classList.add("hidden");

  var body = document.getElementById("quizBody");
  body.innerHTML = "";
  if(q.f === 1){
    body.innerHTML = '<div class="fill-box"><input class="fill-input" id="fillInput" placeholder="在这里填写答案" autocomplete="off"></div>'
      + '<button class="btn" id="fillSubmit" onclick="submitFill()">提交答案</button>';
    var inp = document.getElementById("fillInput");
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 60);
  } else {
    var letters = ["A","B","C","D"];
    q.o.forEach(function(opt, idx){
      var el = document.createElement("button");
      el.className = "option";
      el.textContent = letters[idx]+". "+opt;
      el.onclick = function(){ answer(idx); };
      body.appendChild(el);
    });
  }
}
function answer(idx){
  var q = quizQuestions[quizIndex];
  var opts = document.querySelectorAll("#quizBody .option");
  opts.forEach(function(el, i){ el.classList.add("disabled"); if(i===q.a) el.classList.add("correct"); });
  if(idx === q.a){
    quizCorrect++;
    showFeedback("✅ 答对了！", true);
  } else {
    opts[idx].classList.add("wrong");
    showFeedback("❌ 答错了，正确答案是 "+(q.f===1?q.a:(["A","B","C","D"][q.a]+". "+q.o[q.a])), false);
  }
  afterAnswer();
}
function submitFill(){
  var q = quizQuestions[quizIndex];
  var val = document.getElementById("fillInput").value.trim();
  if(val === ""){ alert("先填上答案再提交哦"); return; }
  var ok = (val === q.a);
  if(ok) quizCorrect++;
  showFeedback(ok ? "✅ 答对了！" : "❌ 正确答案是："+q.a, ok);
  document.getElementById("fillSubmit").classList.add("hidden");
  document.getElementById("fillInput").disabled = true;
  afterAnswer();
}
function showFeedback(msg, right){
  var fb = document.getElementById("quizFeedback");
  fb.textContent = msg;
  fb.className = right ? "feedback right" : "feedback wrong";
  showExplain(quizQuestions[quizIndex]);
}
function showExplain(q){
  var kp = q.k || "本章节知识点";
  var ex = q.e || "（该题暂无解析）";
  document.getElementById("exKp").textContent = "📌 知识点：" + kp;
  document.getElementById("exText").textContent = "💡 解析：" + ex;
  document.getElementById("quizExplain").className = "explain show";
}
function afterAnswer(){
  if(quizIndex < quizQuestions.length-1){
    document.getElementById("quizNext").classList.remove("hidden");
  } else {
    document.getElementById("quizFinish").classList.remove("hidden");
  }
}
function nextQuestion(){
  quizIndex++;
  renderQuestion();
}
function finishQuiz(){
  var k = key(currentGrade, currentSubject);
  quizQuestions.forEach(function(q){ doneArr(k).push(q.i); });
  var total = quizQuestions.length;
  var flowers = total>=10 ? (quizCorrect===total?3:(quizCorrect>=8?2:1)) : (quizCorrect===total?2:1);
  state.flowers += flowers;
  markSubjectDone(k);
  save();

  document.getElementById("resultScore").textContent = quizCorrect+"/"+total;
  document.getElementById("resultFlowers").innerHTML = '<span class="icon">🌸</span> 获得 '+flowers+' 朵小红花（共 '+state.flowers+' 朵）';
  var tip = quizCorrect===total ? "太棒了，全对！" : (quizCorrect>=8 ? "真不错，继续保持！" : "完成就很棒，明天再来！");
  document.getElementById("resultTip").textContent = tip;
  showView("view-result");
}
function confirmQuit(){
  if(confirm("退出后这次没做完的题不会记入成绩，确定退出吗？")){ goHome(); }
}
function backToChapters(){
  renderHome();
  openSubject(currentSubject);
}
function goHome(){
  renderHome();
  showView("view-home");
}

/* ============ 外置题库：启动时自动拉取最新版，失败则用内置兜底 ============ */
function loadExternalBank(){
  if(!window.fetch || !EXTERNAL_BANK_URL){ return; }
  fetch(EXTERNAL_BANK_URL)
    .then(function(r){ if(!r.ok){ throw new Error('http ' + r.status); } return r.json(); })
    .then(function(data){
      if(data && Object.keys(data).length > 0){
        window.QA = data;
        QA = window.QA;
        rebuildChapters();
        var total = 0;
        Object.keys(data).forEach(function(k){ if(Array.isArray(data[k])) total += data[k].length; });
        var s = document.getElementById("bankStatus");
        if(s){ s.textContent = "题库：在线最新版（共 " + total + " 题）"; }
        if(currentSubject){ openSubject(currentSubject); }
        else { renderHome(); }
      }
    })
    .catch(function(){
      var s = document.getElementById("bankStatus");
      if(s){ s.textContent = "题库：备用版（在线题库暂时连不上，题目未更新）"; }
    });
}

/* ============ 启动 ============ */
renderHome();
loadExternalBank();
</script>

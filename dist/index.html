{i:11,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:0,q:"“a o e”属于哪一类拼音？",o:["单韵母","声母","复韵母","整体认读音节"],a:0,k:"拼音：单韵母",e:"解析：a、o、e是单韵母，单韵母共有6个：a o e i u ü。"},
{i:12,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:0,q:"下面哪个是声母？",o:["b","a","o","e"],a:0,k:"拼音：声母",e:"解析：b是声母，a、o、e是单韵母。声母有b p m f等23个。"},
{i:13,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:0,q:"“i u ü”属于哪一类？",o:["单韵母","声母","复韵母","整体认读音节"],a:0,k:"拼音：单韵母",e:"解析：i、u、ü都是单韵母，和a、o、e一起组成6个单韵母。"},
{i:14,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:0,q:"“b”和“p”的不同点是？",o:["p发音时送气，b不送气","b是声母p不是","p比b多一笔","没有不同"],a:0,k:"拼音：声母b p",e:"解析：b和p都是声母，区别是发音时p要送气（有一股气），b不送气。"},
{i:15,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:0,q:"“m”的发音和下面哪个部位有关？",o:["嘴唇闭合","牙齿","舌头卷起","喉咙"],a:0,k:"拼音：声母m",e:"解析：m是鼻音，发音时双唇闭合，气流从鼻子出来。"},
{i:16,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:0,q:"“爸”的拼音，正确的是？",o:["bà","pà","dà","mà"],a:0,k:"拼音：bà(爸)",e:"解析：“爸”读bà，声母是b，第四声。"},
{i:17,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:0,q:"“d”和“b”的形状区别是？",o:["d半圆在右，b半圆在左","d半圆在左，b半圆在右","一样","d是复韵母"],a:0,k:"拼音：声母d b",e:"解析：d的半圆在右边，b的半圆在左边，可以用“左下半圆ddd，右下半圆bbb”来记。"},
{i:18,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:0,q:"下面拼音拼写正确的是“妈”？",o:["mā","nā","lā","fā"],a:0,k:"拼音：mā(妈)",e:"解析：“妈”读mā，声母m，第一声。"},
{i:19,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:1,q:"单韵母共有6个，它们是：a、o、e、i、u、____。",o:[],a:"ü",k:"拼音：单韵母",e:"解析：6个单韵母是 a、o、e、i、u、ü。"},
{i:20,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:0,q:"“n”和“l”的发音区别是？",o:["n是鼻音，l是边音","l是鼻音n不是","都是复韵母","没有区别"],a:0,k:"拼音：声母n l",e:"解析：n是鼻音（气流从鼻子出），l是边音（舌尖抵上齿龈，气流从舌头两边出）。"},
{i:21,c:"1yw-2",ch:"一上·第2单元 汉语拼音（一）",f:0,q:"“f”和“t”中，哪个是送气音？",o:["t","f","都不是","都是"],a:0,k:"拼音：声母t",e:"解析：t是送气音（发音吐气），f不送气。"},

{i:22,c:"1yw-3",ch:"一上·第3单元 汉语拼音（二）",f:0,q:"下面哪个是复韵母？",o:["ai","a","b","zhi"],a:0,k:"拼音：复韵母",e:"解析：ai是复韵母（由两个单韵母组成），a是单韵母，b是声母，zhi是整体认读音节。"},
{i:23,c:"1yw-3",ch:"一上·第3单元 汉语拼音（二）",f:0,q:"“ü”和“j、q、x”相拼时，上面的两点？",o:["要去掉","要保留","变成u","变成üe"],a:0,k:"拼音规则：jqx去两点",e:"解析：ü和j、q、x相拼时两点要去掉，如jū(居)、qù(去)、xū(须)，但和n、l相拼时两点保留。"},
{i:24,c:"1yw-3",ch:"一上·第3单元 汉语拼音（二）",f:0,q:"下面哪个是整体认读音节？",o:["zhi","ba","ma","he"],a:0,k:"拼音：整体认读",e:"解析：zhi是整体认读音节，直接读“织”，不拼读。ba、ma、he都是拼读音节。"},
{i:25,c:"1yw-3",ch:"一上·第3单元 汉语拼音（二）",f:0,q:"“ang、eng、ing、ong”属于哪类韵母？",o:["后鼻韵母","前鼻韵母","单韵母","复韵母"],a:0,k:"拼音：后鼻韵母",e:"解析：ang、eng、ing、ong是后鼻韵母，发音时舌头后缩，鼻音重。"},
{i:26,c:"1yw-3",ch:"一上·第3单元 汉语拼音（二）",f:0,q:"“an、en、in、un、ün”属于哪类韵母？",o:["前鼻韵母","后鼻韵母","单韵母","声母"],a:0,k:"拼音：前鼻韵母",e:"解析：an、en、in、un、ün是前鼻韵母，发音时舌尖抵上齿龈，鼻音轻。"},
{i:27,c:"1yw-3",ch:"一上·第3单元 汉语拼音（二）",f:0,q:"标调时，“iu”并列标在谁头上？",o:["标在u上","标在i上","都不标","标在中间"],a:0,k:"拼音：标调规则",e:"解析：标调规则有“i、u并列标在后”，如“liú”标在u上，“jiū”也标在u上。"},
{i:28,c:"1yw-3",ch:"一上·第3单元 汉语拼音（二）",f:0,q:"“yi、wu、yu”属于哪类音节？",o:["整体认读音节","声母","复韵母","前鼻韵母"],a:0,k:"拼音：整体认读",e:"解析：yi、wu、yu都是整体认读音节，直接认读，不拼读。"},
{i:29,c:"1yw-3",ch:"一上·第3单元 汉语拼音（二）",f:0,q:"“ie、üe、er”中，哪个是特殊韵母，不和声母相拼？",o:["er","ie","üe","都和声母拼"],a:0,k:"拼音：特殊韵母er",e:"解析：er是卷舌韵母，可以独立成音节（如“ér”儿、“ěr”耳），不跟声母相拼。"},
{i:30,c:"1yw-3",ch:"一上·第3单元 汉语拼音（二）",f:1,q:"整体认读音节中，和“z、c、s”对应的分别是：zi、ci、____。",o:[],a:"si",k:"拼音：整体认读",e:"解析：z、c、s对应的整体认读音节是zi、ci、si。"},
{i:31,c:"1yw-3",ch:"一上·第3单元 汉语拼音（二）",f:0,q:"下面拼音中，声调标错位置的是？",o:["dà（大）","mā（妈）","hú（湖）","jīu（究）"],a:3,k:"拼音：标调规则",e:"解析：“究”应标为jiū（i、u并列标在后，标在u上），写成jīu是错误的，正确是jiū。"},

{i:32,c:"1yw-4",ch:"一上·第5单元 阅读（一）",f:0,q:"《秋天》中，大雁往南飞，一会儿排成个“人”字，一会儿排成个？",o:["“一”字","“大”字","“二”字","“个”字"],a:0,k:"课文：秋天",e:"解析：《秋天》：“一群大雁往南飞，一会儿排成个‘人’字，一会儿排成个‘一’字。”"},

{i:35,c:"1yw-4",ch:"一上·第5单元 阅读（一）",f:0,q:"《雪地里的小画家》中，青蛙为什么没参加？",o:["他在洞里睡着啦","他不会画","他出去玩了","他被小羊叫走了"],a:0,k:"课文：雪地里的小画家",e:"解析：青蛙在冬眠，所以“他在洞里睡着啦”，没有来画画。"},
{i:36,c:"1yw-4",ch:"一上·第5单元 阅读（一）",f:0,q:"《四季》中，“草芽尖尖”描写的是哪个季节？",o:["春天","夏天","秋天","冬天"],a:0,k:"课文：四季",e:"解析：草芽尖尖是春天，荷叶圆圆是夏天，谷穗弯弯是秋天，雪人是冬天。"},

{i:38,c:"1yw-4",ch:"一上·第5单元 阅读（一）",f:0,q:"《秋天》中“天气凉了，树叶黄了”，说明是什么季节？",o:["秋天","春天","夏天","冬天"],a:0,k:"课文：秋天",e:"解析：《秋天》写天气变凉、树叶变黄落下，是秋天的景象。"},

{i:42,c:"1yw-4",ch:"一上·第5单元 阅读（一）",f:1,q:"《秋天》：一片片叶子从树上____下来。",o:[],a:"落",k:"课文：秋天",e:"解析：原文“一片片叶子从树上落下来”。"},

{i:45,c:"1yw-5",ch:"一上·第6单元 识字（二）",f:0,q:"《大小多少》中“一个大，一个小，一头黄牛一只猫”，黄牛和猫比？",o:["黄牛大，猫小","黄牛小，猫大","一样大","分不清"],a:0,k:"课文：大小多少",e:"解析：《大小多少》通过对比教大小、多少，黄牛大、猫小。"},

{i:49,c:"1yw-5",ch:"一上·第6单元 识字（二）",f:0,q:"《升国旗》时，我们应怎样做？",o:["立正、敬礼","坐下","说话","跑开"],a:0,k:"常识：升国旗礼仪",e:"解析：升国旗时少先队员要立正、敬队礼，表达对国旗的尊敬。"},

{i:52,c:"1yw-5",ch:"一上·第6单元 识字（二）",f:1,q:"《升国旗》：五星红旗，我们的____。",o:[],a:"国旗",k:"课文：升国旗",e:"解析：原文“五星红旗，我们的国旗。”"},

{i:53,c:"1yw-6",ch:"一上·第7-8单元 阅读（二）",f:0,q:"《小小的船》中“弯弯的月儿小小的船”，月儿像什么？",o:["小船","大船","圆盘","太阳"],a:0,k:"课文：小小的船",e:"解析：《小小的船》：“弯弯的月儿小小的船，小小的船儿两头尖。”把弯月比作小船。"},
{i:54,c:"1yw-6",ch:"一上·第7-8单元 阅读（二）",f:0,q:"《影子》中“影子在前，影子在后，影子常常跟着我，就像一条____”？",o:["小黑狗","小猫","小鸟","小鱼"],a:0,k:"课文：影子",e:"解析：《影子》：“影子常常跟着我，就像一条小黑狗。”"},
{i:55,c:"1yw-6",ch:"一上·第7-8单元 阅读（二）",f:0,q:"《两件宝》中，人有两件宝，是双手和？",o:["大脑","脚","眼睛","耳朵"],a:0,k:"课文：两件宝",e:"解析：《两件宝》：“人有两件宝，双手和大脑。”双手会做工，大脑会思考。"},

{i:57,c:"1yw-6",ch:"一上·第7-8单元 阅读（二）",f:0,q:"《比尾巴》中，谁的尾巴长？",o:["猴子","兔子","松鼠","鸭子"],a:0,k:"课文：比尾巴",e:"解析：《比尾巴》：“谁的尾巴长？猴子的尾巴长。”兔子的尾巴短。"},
{i:58,c:"1yw-6",ch:"一上·第7-8单元 阅读（二）",f:0,q:"《乌鸦喝水》中，乌鸦是怎样喝到水的？",o:["把小石子放进瓶子，水升高","用吸管","等下雨","把瓶子打破"],a:0,k:"课文：乌鸦喝水",e:"解析：乌鸦把小石子一颗一颗放进瓶子里，瓶子里的水渐渐升高，它就喝到水了。"},
{i:59,c:"1yw-6",ch:"一上·第7-8单元 阅读（二）",f:0,q:"《雨点儿》中，大雨点儿去了哪里？",o:["没有花没有草的地方","有花有草的地方","大海","天上"],a:0,k:"课文：雨点儿",e:"解析：《雨点儿》：大雨点儿要去没有花没有草的地方，让那里长出花草；小雨点儿去有花有草的地方。"},

{i:61,c:"1yw-6",ch:"一上·第7-8单元 阅读（二）",f:1,q:"《小小的船》：我在小小的船里坐，只看见闪闪的星星____的天。",o:[],a:"蓝蓝",k:"课文：小小的船",e:"解析：原文“只看见闪闪的星星蓝蓝的天”，填“蓝蓝”。"},
{i:62,c:"1yw-6",ch:"一上·第7-8单元 阅读（二）",f:1,q:"《两件宝》：人有两件宝，双手和____。",o:[],a:"大脑",k:"课文：两件宝",e:"解析：原文“人有两件宝，双手和大脑”，填“大脑”。"},
{i:63,c:"1yw-6",ch:"一上·第7-8单元 阅读（二）",f:0,q:"《影子》中“影子在左，影子在右”，影子是怎么来的？",o:["光被身体挡住形成的","自己长出来的","画上去的","月亮变的"],a:0,k:"常识：影子",e:"解析：影子是光被不透明的身体挡住后，在地面形成的暗区，所以有光才有影子。"},

{i:65,c:"1yw-7",ch:"一下·第1单元 识字（一）",f:0,q:"《姓氏歌》中“你姓什么？我姓李。什么李？____”？",o:["木子李","弓长张","古月胡","口天吴"],a:0,k:"课文：姓氏歌",e:"解析：《姓氏歌》：“你姓什么？我姓李。什么李？木子李。”用部件组合记姓氏。"},
{i:66,c:"1yw-7",ch:"一下·第1单元 识字（一）",f:0,q:"《姓氏歌》中“他姓什么？他姓张。什么张？____”？",o:["弓长张","木子李","古月胡","立早章"],a:0,k:"课文：姓氏歌",e:"解析：《姓氏歌》：“他姓什么？他姓张。什么张？弓长张。”"},
{i:67,c:"1yw-7",ch:"一下·第1单元 识字（一）",f:0,q:"《小青蛙》中“河水清清天气晴，小小青蛙大眼睛”，小青蛙能？",o:["吃害虫保护禾苗","吃鱼","唱歌","游泳"],a:0,k:"课文：小青蛙",e:"解析：《小青蛙》写小青蛙大眼睛，吃害虫，保护禾苗，是益虫。"},
{i:68,c:"1yw-7",ch:"一下·第1单元 识字（一）",f:0,q:"《小青蛙》中“请、清、情、晴”都带有哪个部件？",o:["青","月","日","水"],a:0,k:"识字：形声字",e:"解析：请、清、情、晴都是形声字，右半边都是“青”，读音相近；左边偏旁表意思。"},
{i:69,c:"1yw-7",ch:"一下·第1单元 识字（一）",f:0,q:"猜字谜：“画时圆，写时方，冬时短，夏时长。”谜底是？",o:["日（太阳）","月","水","火"],a:0,k:"字谜：日",e:"解析：太阳画出来是圆的，写成“日”字是方的，冬天白天短夏天白天长，谜底是“日”。"},
{i:70,c:"1yw-7",ch:"一下·第1单元 识字（一）",f:0,q:"《春夏秋冬》中“秋霜降”说的是哪个季节？",o:["秋天","春天","夏天","冬天"],a:0,k:"课文：春夏秋冬",e:"解析：秋霜是秋天的景象，“秋霜降”对应秋天。"},
{i:71,c:"1yw-7",ch:"一下·第1单元 识字（一）",f:1,q:"《姓氏歌》：古月____，口天吴。",o:[],a:"胡",k:"课文：姓氏歌",e:"解析：原文“古月胡，口天吴”，“胡”由古和月组成，“吴”由口和天组成。"},
{i:72,c:"1yw-7",ch:"一下·第1单元 识字（一）",f:0,q:"《小青蛙》中“保护禾苗吃害虫”，说明青蛙是？",o:["益虫","害虫","鸟类","鱼类"],a:0,k:"常识：青蛙",e:"解析：青蛙吃害虫，保护庄稼，是对人类有益的动物，叫益虫。"},
{i:73,c:"1yw-7",ch:"一下·第1单元 识字（一）",f:1,q:"《春夏秋冬》：春风吹，夏雨落，秋霜降，冬雪____。",o:[],a:"飘",k:"课文：春夏秋冬",e:"解析：原文“冬雪飘”，填“飘”。"},
{i:74,c:"1yw-7",ch:"一下·第1单元 识字（一）",f:0,q:"下面哪个字谜的谜底是“明”？",o:["日月光","两小人","一口田","十张嘴"],a:0,k:"字谜：明",e:"解析：“日”加“月”为“明”，所以“日月光”谜底是明。“一口田”构不成明，“十张嘴”是“古”。"},

{i:75,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:0,q:"《吃水不忘挖井人》中，乡亲们想念谁？",o:["毛主席","周总理","朱德","雷锋"],a:0,k:"课文：吃水不忘挖井人",e:"解析：毛主席带领战士和乡亲们挖井，乡亲们立碑“吃水不忘挖井人，时刻想念毛主席”。"},
{i:76,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:0,q:"《我多想去看看》中，天山的孩子想去北京的哪里？",o:["天安门（看升旗）","天山","海边","草原"],a:0,k:"课文：我多想去看看",e:"解析：住天山的孩子想去遥远的北京城，看天安门广场的升旗仪式。"},
{i:77,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:0,q:"《一个接一个》中，正玩着踩影子，大人对“我”说？",o:["该回家睡觉了","再玩一会儿","去吃饭","去上学"],a:0,k:"课文：一个接一个",e:"解析：《一个接一个》写孩子正玩踩影子，被大人叫回家睡觉，但想到睡觉能做梦也挺好，体现积极心态。"},
{i:78,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:0,q:"《四个太阳》中，“我”给夏天画了个什么颜色的太阳？",o:["绿绿的","金黄的","红红的","彩色的"],a:0,k:"课文：四个太阳",e:"解析：《四个太阳》：夏天画绿绿的太阳（清凉），秋天画金黄的（丰收），冬天画红红的（温暖），春天画彩色的。"},
{i:79,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:0,q:"《四个太阳》中，冬天画什么颜色的太阳？",o:["红红的","绿绿的","金黄的","白色的"],a:0,k:"课文：四个太阳",e:"解析：冬天画红红的太阳，带来温暖。"},
{i:80,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:0,q:"《小公鸡和小鸭子》中，小公鸡会什么，小鸭子会什么？",o:["公鸡捉虫，鸭子游泳","公鸡游泳，鸭子捉虫","都会游泳","都会捉虫"],a:0,k:"课文：小公鸡和小鸭子",e:"解析：小公鸡的嘴尖，会捉虫；小鸭子的脚有蹼，会游泳。它们互相帮助。"},
{i:81,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:0,q:"《树和喜鹊》中，后来树多了、喜鹊多了，它们变得？",o:["快乐","孤单","伤心","生气"],a:0,k:"课文：树和喜鹊",e:"解析：《树和喜鹊》写从前只有一棵树、一只喜鹊，很孤单；后来树多了、喜鹊多了，它们很快乐。"},
{i:82,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:1,q:"《吃水不忘挖井人》：吃水不忘挖井人，时刻想念____。",o:[],a:"毛主席",k:"课文：吃水不忘挖井人",e:"解析：原文“吃水不忘挖井人，时刻想念毛主席”，填“毛主席”。"},
{i:83,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:0,q:"《怎么都快乐》告诉我们？",o:["一个人玩、两个人玩、许多人玩都快乐","只有许多人玩才快乐","一个人玩不快乐","玩要吵架"],a:0,k:"课文：怎么都快乐",e:"解析：《怎么都快乐》说明一个人玩、两个人玩、许多人玩，各有各的快乐。"},
{i:84,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:1,q:"《四个太阳》：我画了个绿绿的太阳，挂在____的天空。",o:[],a:"夏天",k:"课文：四个太阳",e:"解析：《四个太阳》：夏天画绿绿的太阳，“挂在夏天的天空”，带来清凉。"},
{i:85,c:"1yw-8",ch:"一下·第2-3单元 课文（一）",f:0,q:"《小公鸡和小鸭子》中，小鸭子为什么捉不到虫？",o:["嘴扁，不会捉虫","不会走","眼睛不好","不想捉"],a:0,k:"课文：小公鸡和小鸭子",e:"解析：小鸭子的嘴是扁的，不像小鸡嘴尖，所以捉不到虫，但小鸭子会游泳。"},

{i:87,c:"1yw-9",ch:"一下·第4单元 课文（三）",f:0,q:"《静夜思》中“举头望明月”的下一句是？",o:["低头思故乡","低头看地上","举头看天上","低头睡觉"],a:0,k:"古诗：静夜思",e:"解析：《静夜思》：“举头望明月，低头思故乡。”"},
{i:88,c:"1yw-9",ch:"一下·第4单元 课文（三）",f:0,q:"《静夜思》表达了诗人怎样的感情？",o:["思念故乡","喜欢月亮","高兴","生气"],a:0,k:"古诗：静夜思",e:"解析：诗人看到明月，低头思念远方的故乡，表达的是思乡之情。"},
{i:89,c:"1yw-9",ch:"一下·第4单元 课文（三）",f:0,q:"《夜色》中，从前“我”怎样？",o:["胆子很小，怕黑","胆子很大","不怕黑","喜欢晚上"],a:0,k:"课文：夜色",e:"解析：《夜色》写从前“我”胆子很小，天一黑就不敢往外瞧；后来爸爸带“我”散步，发现夜晚也美丽。"},
{i:90,c:"1yw-9",ch:"一下·第4单元 课文（三）",f:0,q:"《端午粽》中，外婆包的粽子是哪个节日的？",o:["端午节","春节","中秋节","重阳节"],a:0,k:"课文：端午粽",e:"解析：《端午粽》写端午节外婆包粽子，粽子花样多、十分好吃，体现亲情。"},
{i:91,c:"1yw-9",ch:"一下·第4单元 课文（三）",f:0,q:"端午节是为了纪念谁？",o:["屈原","李白","杜甫","孔子"],a:0,k:"常识：端午节",e:"解析：端午节吃粽子、赛龙舟，是为了纪念爱国诗人屈原。"},
{i:92,c:"1yw-9",ch:"一下·第4单元 课文（三）",f:0,q:"《彩虹》中，“我”想象把彩虹当作什么？",o:["一座桥","一条河","一把伞","一张床"],a:0,k:"课文：彩虹",e:"解析：《彩虹》写雨停后天上出现彩虹，“我”想象彩虹是一座桥，可以走到天上。"},
{i:93,c:"1yw-9",ch:"一下·第4单元 课文（三）",f:1,q:"《静夜思》：床前明月光，疑是地上____。",o:[],a:"霜",k:"古诗：静夜思",e:"解析：原文“床前明月光，疑是地上霜”，填“霜”。"},
{i:94,c:"1yw-9",ch:"一下·第4单元 课文（三）",f:0,q:"《夜色》中，爸爸晚上拉“我”去干什么？",o:["散步","睡觉","看书","吃饭"],a:0,k:"课文：夜色",e:"解析：《夜色》：“爸爸晚上偏要拉我去散步”，“我”发现花草都像白天一样微笑，从此不再怕黑。"},
{i:95,c:"1yw-9",ch:"一下·第4单元 课文（三）",f:1,q:"《静夜思》：举头望明月，低头思____。",o:[],a:"故乡",k:"古诗：静夜思",e:"解析：原文“低头思故乡”，填“故乡”。"},
{i:96,c:"1yw-9",ch:"一下·第4单元 课文（三）",f:0,q:"《端午粽》中，粽子外面裹着什么，里面是糯米？",o:["箬竹叶","塑料","布","纸"],a:0,k:"课文：端午粽",e:"解析：《端午粽》：粽子是用青青的箬竹叶包的，里面是白白的糯米，中间有一颗红红的枣。"},

{i:97,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:0,q:"《动物儿歌》中“蜻蜓半空展翅飞”，蜻蜓在哪里飞？",o:["半空","水里","地下","树上"],a:0,k:"课文：动物儿歌",e:"解析：《动物儿歌》：“蜻蜓半空展翅飞，蝴蝶花间捉迷藏。蚯蚓土里造宫殿……”"},
{i:98,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:0,q:"《古对今》中“古对今，圆对方”，“圆”的反义词是？",o:["方","长","大","高"],a:0,k:"对子：圆对方",e:"解析：《古对今》：“古对今，圆对方，严寒对酷暑，春暖对秋凉。”"},
{i:99,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:0,q:"《操场上》中，下课了同学们在操场上做什么？",o:["拔河、拍皮球、跳绳等","睡觉","看书","吃饭"],a:0,k:"课文：操场上",e:"解析：《操场上》写课间同学们在操场上跳绳、踢毽、丢沙包、拔河、拍皮球，锻炼身体。"},
{i:100,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:0,q:"《人之初》中“人之初，性本善”的下一句是？",o:["性相近，习相远","性本恶","习相近","人不学"],a:0,k:"三字经：人之初",e:"解析：《人之初》选自《三字经》：“人之初，性本善。性相近，习相远。”"},
{i:101,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:0,q:"《古对今》中“严寒对酷暑”，“严寒”指？",o:["很冷","很热","温暖","凉快"],a:0,k:"对子：严寒酷暑",e:"解析：“严寒”是非常冷（冬天），“酷暑”是非常热（夏天），是一对反义对子。"},
{i:102,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:0,q:"《动物儿歌》中“蚯蚓土里造宫殿”，蚯蚓生活在哪里？",o:["土里","空中","水里","树上"],a:0,k:"课文：动物儿歌",e:"解析：《动物儿歌》：“蚯蚓土里造宫殿，蚂蚁地上运食粮。”蚯蚓在泥土里活动。"},
{i:103,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:1,q:"《人之初》：人之初，性本____。",o:[],a:"善",k:"三字经：人之初",e:"解析：原文“人之初，性本善”，填“善”。"},
{i:104,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:0,q:"《操场上》告诉我们什么？",o:["要多锻炼身体","要睡觉","要读书","要吃饭"],a:0,k:"课文：操场上",e:"解析：《操场上》描写各种体育活动，鼓励小朋友天天锻炼身体好。"},
{i:105,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:1,q:"《古对今》：古对今，圆对____。",o:[],a:"方",k:"对子：古对今",e:"解析：原文“古对今，圆对方”，填“方”。"},
{i:106,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:0,q:"《人之初》中“苟不教，性乃迁”意思是？",o:["如果不教育，本性会变坏","教育没用","本性不变","要上学"],a:0,k:"三字经：人之初",e:"解析：“苟不教，性乃迁”意思是如果不好好教育，人的善良本性就会改变（变坏）。"},
{i:107,c:"1yw-10",ch:"一下·第5单元 识字（二）",f:0,q:"《动物儿歌》中“蜘蛛房前结网忙”，蜘蛛结网是为了？",o:["捉虫子","睡觉","玩","织布"],a:0,k:"课文：动物儿歌",e:"解析：蜘蛛结网是为了粘住小飞虫当食物，“蜘蛛房前结网忙”。"},

{i:108,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:0,q:"《池上》的作者是谁？",o:["白居易","李白","杜甫","杨万里"],a:0,k:"文学常识：池上",e:"解析：《池上》是唐代诗人白居易的作品：“小娃撑小艇，偷采白莲回。”"},
{i:109,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:0,q:"《小池》中“小荷才露尖尖角，早有蜻蜓立上头”，写的是哪个季节？",o:["初夏","深冬","秋天","春天"],a:0,k:"古诗：小池",e:"解析：《小池》写泉水、树阴、小荷、蜻蜓，是初夏（夏天刚到）的景色，作者杨万里。"},
{i:110,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:0,q:"《荷叶圆圆》中，小水珠把荷叶当作什么？",o:["摇篮","停机坪","歌台","凉伞"],a:0,k:"课文：荷叶圆圆",e:"解析：《荷叶圆圆》：小水珠说荷叶是我的摇篮，小蜻蜓说我的停机坪，小青蛙说我的歌台，小鱼儿说我的凉伞。"},
{i:111,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:0,q:"《荷叶圆圆》中，小蜻蜓把荷叶当作什么？",o:["停机坪","摇篮","歌台","凉伞"],a:0,k:"课文：荷叶圆圆",e:"解析：小蜻蜓说“荷叶是我的停机坪”（小蜻蜓像飞机停在上面）。"},
{i:112,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:0,q:"《要下雨了》中，哪些现象说明要下雨？",o:["燕子低飞、鱼游水面、蚂蚁搬家","燕子高飞、蚂蚁睡觉","出太阳","刮大风"],a:0,k:"课文：要下雨了",e:"解析：要下雨时，空气潮湿，虫翅沾水飞不高，燕子低飞捉虫；水里闷，鱼游到水面；蚂蚁搬家到高处。"},
{i:113,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:0,q:"《文具的家》告诉我们？",o:["要爱护文具，放在文具盒里","文具不用管","丢了好买","文具会自己回家"],a:0,k:"课文：文具的家",e:"解析：《文具的家》写贝贝总丢文具，妈妈让她给文具找“家”（文具盒），要爱护文具。"},
{i:114,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:0,q:"《一分钟》中，元元多睡了一分钟，结果？",o:["迟到了二十分钟","没迟到","早到了","迟到了一分钟"],a:0,k:"课文：一分钟",e:"解析：《一分钟》写元元贪睡一分钟，结果错过红绿灯、公交车，最后迟到了二十分钟，说明要珍惜时间。"},
{i:115,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:0,q:"《小猴子下山》中，小猴子最后怎样？",o:["什么也没得到","抱回大西瓜","抓住小兔子","摘到桃子"],a:0,k:"课文：小猴子下山",e:"解析：小猴子见一样爱一样，扔了玉米追桃子、扔桃子摘西瓜、扔西瓜追兔子，最后什么也没得到。"},
{i:116,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:1,q:"《小池》：小荷才露尖尖角，早有____立上头。",o:[],a:"蜻蜓",k:"古诗：小池",e:"解析：原文“早有蜻蜓立上头”，填“蜻蜓”。"},
{i:117,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:0,q:"《棉花姑娘》中，是谁帮棉花姑娘治好了病（吃掉蚜虫）？",o:["七星瓢虫","燕子","啄木鸟","青蛙"],a:0,k:"课文：棉花姑娘",e:"解析：棉花姑娘生病（长蚜虫），燕子、啄木鸟、青蛙都帮不上，最后是七星瓢虫吃光蚜虫治好她。"},
{i:118,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:1,q:"《池上》：小娃撑小艇，偷采白____回。",o:[],a:"莲",k:"古诗：池上",e:"解析：原文“偷采白莲回”，填“莲”。"},
{i:119,c:"1yw-11",ch:"一下·第6-8单元 阅读（三）",f:0,q:"《小壁虎借尾巴》中，小壁虎最后尾巴怎样了？",o:["自己长出来了","没长出来","借到兔子的","借到鱼的"],a:0,k:"课文：小壁虎借尾巴",e:"解析：小鱼、牛、燕子的尾巴各有用处不能借，小壁虎的尾巴断了能再生，最后自己长出新尾巴。"},

{i:120,c:"1yw-12",ch:"一年级·古诗积累",f:0,q:"《咏鹅》的作者是谁？",o:["骆宾王","李白","杜甫","白居易"],a:0,k:"文学常识：咏鹅",e:"解析：《咏鹅》是唐代诗人骆宾王七岁时写的：“鹅鹅鹅，曲项向天歌。”"},
{i:121,c:"1yw-12",ch:"一年级·古诗积累",f:0,q:"《咏鹅》中“白毛浮绿水，红掌拨清波”写的是鹅的什么？",o:["白色羽毛浮在绿水上，红脚掌划水","鹅在天上飞","鹅在睡觉","鹅在唱歌"],a:0,k:"古诗：咏鹅",e:"解析：写白鹅白色的毛浮在绿水中，红色的脚掌划动清波，描写鹅在水中游。"},
{i:122,c:"1yw-12",ch:"一年级·古诗积累",f:0,q:"《悯农》中“谁知盘中餐，粒粒皆辛苦”告诉我们？",o:["粮食来得不容易，要爱惜","米饭很好吃","农民很闲","不用节约"],a:0,k:"古诗：悯农",e:"解析：《悯农》（李绅）写农民种粮辛苦，提醒我们爱惜粮食、不浪费。"},
{i:123,c:"1yw-12",ch:"一年级·古诗积累",f:0,q:"《春晓》中“春眠不觉晓，处处闻啼鸟”写的是什么时候？",o:["春天早晨","夏天中午","秋天傍晚","冬天夜里"],a:0,k:"古诗：春晓",e:"解析：《春晓》（孟浩然）写春天的早晨睡得香，醒来听到处处鸟叫。"},
{i:124,c:"1yw-12",ch:"一年级·古诗积累",f:0,q:"《赠汪伦》的作者是谁？",o:["李白","杜甫","王维","白居易"],a:0,k:"文学常识：赠汪伦",e:"解析：《赠汪伦》是李白写给定汪伦的送别诗：“桃花潭水深千尺，不及汪伦送我情。”"},
{i:125,c:"1yw-12",ch:"一年级·古诗积累",f:0,q:"《寻隐者不遇》中，童子说师父去哪里了？",o:["上山采药去了","去赶集","在家睡觉","去远方"],a:0,k:"古诗：寻隐者不遇",e:"解析：《寻隐者不遇》（贾岛）：“松下问童子，言师采药去。只在此山中，云深不知处。”"},
{i:126,c:"1yw-12",ch:"一年级·古诗积累",f:0,q:"《画鸡》中“头上红冠不用裁，满身雪白走将来”写的是？",o:["公鸡","鸭子","鹅","鸟"],a:0,k:"古诗：画鸡",e:"解析：《画鸡》（唐寅，明代）写公鸡，红冠、雪白羽毛，一叫千门万户开。"},
{i:127,c:"1yw-12",ch:"一年级·古诗积累",f:1,q:"《咏鹅》：鹅鹅鹅，曲项向天____。",o:[],a:"歌",k:"古诗：咏鹅",e:"解析：原文“曲项向天歌”，填“歌”。"},
{i:128,c:"1yw-12",ch:"一年级·古诗积累",f:0,q:"《风》中“解落三秋叶，能开二月花”，这“风”能？",o:["吹落秋叶、吹开春花","下雨","打雷","下雪"],a:0,k:"古诗：风",e:"解析：《风》（李峤）写风的力量：能吹落秋天的叶子，能吹开二月的鲜花。"},
{i:129,c:"1yw-12",ch:"一年级·古诗积累",f:1,q:"《悯农》：谁知盘中餐，粒粒皆____。",o:[],a:"辛苦",k:"古诗：悯农",e:"解析：原文“粒粒皆辛苦”，填“辛苦”。"},
{i:130,c:"1yw-12",ch:"一年级·古诗积累",f:1,q:"《古朗月行》：小时不识月，呼作白玉____。",o:[],a:"盘",k:"古诗：古朗月行",e:"解析：李白《古朗月行》：“小时不识月，呼作白玉盘”，把月亮比作白玉盘。"}

{i:44,c:"2sci-4",ch:"二年级·天气",f:1,q:"风吹动红旗，说明空气在____。",o:[],a:"流动",k:"风是空气流动",e:"解析：空气流动形成风，所以旗子会飘。"},
{i:45,c:"2sci-4",ch:"二年级·天气",f:0,q:"气象站测量下了多少雨，用（ ）。",o:["雨量器","温度计","尺子","天平"],a:0,k:"雨量器测雨量",e:"解析：雨量器收集雨水，量出降雨量多少。"},
{i:46,c:"2sci-4",ch:"二年级·天气",f:0,q:"关于天气，下列说法正确的是（ ）。",o:["天气每天会变化","天气永远不变","只有一种天气","人不需关心天气"],a:0,k:"天气多变",e:"解析：晴、阴、雨、雪会变化，看预报安排活动。"},
// ===== 第5章 二年级·我们的地球 =====
{i:47,c:"2sci-5",ch:"二年级·我们的地球",f:0,q:"地球是（ ）。",o:["人类和生物的家园","一个玩具","敌人的星球","一本书"],a:0,k:"地球是家园",e:"解析：地球上有水、空气和生命，是我们的家。"},
{i:48,c:"2sci-5",ch:"二年级·我们的地球",f:0,q:"我们每天看到太阳（ ）。",o:["从东边升起、西边落下","从西边升起","不动","乱转"],a:0,k:"太阳东升西落",e:"解析：因为地球自西向东自转，太阳看起来东升西落。"},
{i:49,c:"2sci-5",ch:"二年级·我们的地球",f:0,q:"我们能在夜晚看到月亮，是因为月亮（ ）。",o:["反射太阳的光","自己会发光","是电灯","在燃烧"],a:0,k:"月光来自太阳",e:"解析：月亮本身不发光，靠反射太阳光才被我们看见。"},
{i:50,c:"2sci-5",ch:"二年级·我们的地球",f:0,q:"月亮的形状有时会圆有时会缺，这叫（ ）。",o:["月相变化","天气","季节","潮水"],a:0,k:"月相",e:"解析：月亮圆缺的规律变化叫月相。"},
{i:51,c:"2sci-5",ch:"二年级·我们的地球",f:0,q:"一年里大自然有（ ）的变化。",o:["春、夏、秋、冬四季","只有两季","只有一个季节","一月一变"],a:0,k:"一年有四季",e:"解析：地球公转带来春夏秋冬四季更替。"},
{i:52,c:"2sci-5",ch:"二年级·我们的地球",f:0,q:"下列天体中自己会发光的是（ ）。",o:["太阳","月亮","镜子","白墙"],a:0,k:"太阳自行发光",e:"解析：太阳是恒星会发光；月亮、镜子、墙都不会自己发光。"},
{i:53,c:"2sci-5",ch:"二年级·我们的地球",f:1,q:"地球表面大部分被____覆盖（海洋）。",o:[],a:"海洋",k:"地球多海洋",e:"解析：地球约七成是海洋，剩下是陆地。"},
{i:54,c:"2sci-5",ch:"二年级·我们的地球",f:0,q:"爱护地球，我们应该（ ）。",o:["节约水、爱护花草","乱砍树","往河里倒垃圾","浪费电"],a:0,k:"保护地球",e:"解析：节约资源、爱护环境就是保护地球家园。"},
{i:55,c:"2sci-5",ch:"二年级·我们的地球",f:0,q:"晴朗的（ ）更容易看到满天的星星。",o:["夜晚","正午太阳下","下午","白天"],a:0,k:"夜晚看星星",e:"解析：夜晚没有太阳光干扰，星星看得清。"},
{i:56,c:"2sci-5",ch:"二年级·我们的地球",f:1,q:"太阳、地球、月亮中，____是人类生活的家园。",o:[],a:"地球",k:"地球是家",e:"解析：地球有适宜的温度、水和空气，适合人类生活。"},
{i:57,c:"2sci-5",ch:"二年级·我们的地球",f:0,q:"季节变化的主要原因是（ ）。",o:["地球绕太阳公转","月亮变大","星星移动","风变大"],a:0,k:"公转致四季",e:"解析：地球绕太阳转，加上地轴倾斜，产生四季。"},
{i:58,c:"2sci-5",ch:"二年级·我们的地球",f:0,q:"地球家园里有（ ）。",o:["动物、植物、水和空气","只有火星","只有月亮","只有太阳"],a:0,k:"家园构成",e:"解析：地球家园包含生物、水、空气、土壤等。"},
// ===== 第6章 二年级·常见材料 =====
{i:59,c:"2sci-6",ch:"二年级·常见材料",f:0,q:"纸的特点是（ ）。",o:["轻、薄、能写字","重如铁","透明","会发光"],a:0,k:"纸轻能写",e:"解析：纸轻又薄，能写字画画，书多用纸印。"},
{i:60,c:"2sci-6",ch:"二年级·常见材料",f:0,q:"塑料做的物品通常（ ）。",o:["轻便、不易摔碎","很重会沉","会生锈","透明如玻璃必碎"],a:0,k:"塑料轻便",e:"解析：塑料轻、防水、不易碎，用途很广。"},
{i:61,c:"2sci-6",ch:"二年级·常见材料",f:0,q:"金属的特点是（ ）。",o:["比较硬、能导电","软如棉花","不导电","透明"],a:0,k:"金属硬导电",e:"解析：金属坚硬、能导电导热，如铁、铜、铝。"},
{i:62,c:"2sci-6",ch:"二年级·常见材料",f:0,q:"木头做的物品一般（ ）。",o:["较轻、能浮在水面","很重会沉","透明","会导电"],a:0,k:"木头轻浮水",e:"解析：木头比水轻能浮起，也比较轻。"},
{i:63,c:"2sci-6",ch:"二年级·常见材料",f:1,q:"生活中最常见的四种材料是纸、塑料、金属和____。",o:[],a:"木头",k:"四种材料",e:"解析：纸、塑料、金属、木头随处可见。"},
{i:64,c:"2sci-6",ch:"二年级·常见材料",f:0,q:"电线里面用铜丝，是因为金属（ ）。",o:["能导电","吸水","透明","轻飘"],a:0,k:"金属导电",e:"解析：铜等金属导电好，适合做电线。"},
{i:65,c:"2sci-6",ch:"二年级·常见材料",f:0,q:"我们做饭用的铁锅是用（ ）做的。",o:["金属","纸","塑料","木头"],a:0,k:"铁锅是金属",e:"解析：铁锅用铁等金属，耐热坚硬。"},
{i:66,c:"2sci-6",ch:"二年级·常见材料",f:0,q:"下列遇到水会变软、容易破的是（ ）。",o:["纸","塑料","金属","玻璃"],a:0,k:"纸怕水",e:"解析：纸吸水变软易破，所以书要防潮。"},
{i:67,c:"2sci-6",ch:"二年级·常见材料",f:1,q:"塑料袋、塑料瓶是用____材料做的。",o:[],a:"塑料",k:"塑料制品",e:"解析：塑料袋、瓶都是塑料，轻便防水。"},
{i:68,c:"2sci-6",ch:"二年级·常见材料",f:0,q:"木头的原料来自（ ）。",o:["树木","工厂直接造出来","石头","水"],a:0,k:"木头来自树",e:"解析：木头砍伐树木加工而来，要节约用。"},
{i:69,c:"2sci-6",ch:"二年级·常见材料",f:0,q:"金属勺子舀热汤不熔化，说明金属（ ）。",o:["硬且耐热","软如泥","不导热","透明"],a:0,k:"金属耐热",e:"解析：金属坚硬、熔点高，能导热但不易熔化。"},
{i:70,c:"2sci-6",ch:"二年级·常见材料",f:0,q:"节约用纸可以（ ）。",o:["少砍树木、保护环境","多砍树","没用处","浪费更好"],a:0,k:"节纸护树",e:"解析：纸来自树木，节约用纸就是保护森林。"},
// ===== 第7章 二年级·空气 =====
{i:71,c:"2sci-7",ch:"二年级·空气",f:0,q:"空气（ ）。",o:["充满我们周围的每个地方","只在水里有","其实不存在","只在冬天出现"],a:0,k:"空气无处不在",e:"解析：空气看不见，却充满我们周围。"},
{i:72,c:"2sci-7",ch:"二年级·空气",f:0,q:"空气是（ ）。",o:["无色无味的气体","红色的液体","黑色的固体","甜甜的气体"],a:0,k:"空气无色无味",e:"解析：空气没有颜色、没有气味，是气体。"},
{i:73,c:"2sci-7",ch:"二年级·空气",f:0,q:"用塑料袋快速兜一下，袋子鼓起来，说明兜到了（ ）。",o:["空气","水","火","糖"],a:0,k:"兜气证存在",e:"解析：袋子鼓起来是因为装进了空气。"},
{i:74,c:"2sci-7",ch:"二年级·空气",f:0,q:"把空杯倒扣压进水中，杯里的纸没湿，说明杯里原有（ ）占着地方。",o:["空气","水","火","糖"],a:0,k:"空气占据空间",e:"解析：杯里有空气占了空间，水进不去，纸就不湿。"},
{i:75,c:"2sci-7",ch:"二年级·空气",f:0,q:"风形成的原因是（ ）。",o:["空气流动","水流动","沙子流动","太阳光"],a:0,k:"风=空气流动",e:"解析：空气从一处流向另一处，就形成了风。"},
{i:76,c:"2sci-7",ch:"二年级·空气",f:1,q:"人呼吸时，鼻子吸进____，呼出二氧化碳。",o:[],a:"空气",k:"呼吸空气",e:"解析：吸进的空气含氧气，身体用后呼出二氧化碳。"},
{i:77,c:"2sci-7",ch:"二年级·空气",f:0,q:"下列靠空气托着飞起来的是（ ）。",o:["风筝","石头","铁块","沙袋"],a:0,k:"风筝借空气",e:"解析：风筝靠空气的压力托起；石头铁块会掉。"},
{i:78,c:"2sci-7",ch:"二年级·空气",f:0,q:"吹大的气球里面装的是（ ）。",o:["空气","水","糖","沙子"],a:0,k:"气球装空气",e:"解析：吹气球是把空气吹进去才鼓起来。"},
{i:79,c:"2sci-7",ch:"二年级·空气",f:0,q:"空气对我们（ ）。",o:["非常重要，一刻也离不了","没用","有害","无所谓"],a:0,k:"空气重要",e:"解析：人和动植物都要呼吸空气，非常重要。"},
{i:80,c:"2sci-7",ch:"二年级·空气",f:1,q:"空气看不见摸不着，却____着我们周围。",o:[],a:"充满",k:"空气充满",e:"解析：空气无处不在，充满每个角落。"},
{i:81,c:"2sci-7",ch:"二年级·空气",f:0,q:"下列利用了空气流动的是（ ）。",o:["风车转动","石头滚下","冰融化","糖溶解"],a:0,k:"风车用空气",e:"解析：风车靠风吹动叶片转；其余与空气流动无关。"},
{i:82,c:"2sci-7",ch:"二年级·空气",f:0,q:"植物也需要空气，用来（ ）。",o:["呼吸、帮助生长","睡觉","发光","变成金属"],a:0,k:"植物需空气",e:"解析：植物也要呼吸空气，才能进行生命活动。"},
// ===== 第8章 二年级·植物（根、茎、叶的作用） =====
{i:83,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:0,q:"植物的根主要作用是（ ）。",o:["吸收水养分并固定植物","开花","结果","飞行"],a:0,k:"根吸水固定",e:"解析：根扎进土里吸水和养分，还把植物固定在地上。"},
{i:84,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:0,q:"植物的茎主要作用是（ ）。",o:["把水和养分运送到叶、花、果","吸收阳光","呼吸","繁殖"],a:0,k:"茎运输",e:"解析：茎像水管，把根吸的水养分送到各处。"},
{i:85,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:0,q:"植物的叶主要作用是（ ）。",o:["利用阳光制造养分","喝水","走路","发声"],a:0,k:"叶制造养分",e:"解析：叶里的叶绿素利用阳光把水和二氧化碳变成养分（光合作用）。"},
{i:86,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:1,q:"植物的____把根吸收的水分运到上面的叶。",o:[],a:"茎",k:"茎运水",e:"解析：茎连通根和叶，负责输送水分和养分。"},
{i:87,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:0,q:"叶大多是绿色的，因为里面有（ ）。",o:["叶绿素","红色素","黑色素","白色素"],a:0,k:"叶绿素致绿",e:"解析：叶绿素是绿色的，能进行光合作用。"},
{i:88,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:0,q:"下列我们吃的是植物根的是（ ）。",o:["胡萝卜","苹果","油菜叶","桃子"],a:0,k:"胡萝卜是根",e:"解析：胡萝卜是植物的肉质根；苹果、桃是果实，油菜吃叶。"},
{i:89,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:0,q:"大树能牢牢站在地上，主要靠（ ）。",o:["根扎进土里","叶子","花朵","种子"],a:0,k:"根固定",e:"解析：庞大的根系把树固定在土壤里。"},
{i:90,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:1,q:"叶通过____作用，把阳光变成植物需要的养分。",o:[],a:"光合",k:"光合作用",e:"解析：光合作用是叶在阳光下制造养分的过程。"},
{i:91,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:0,q:"茎把养料送到（ ）。",o:["花和果实","地底下","月亮上","云里"],a:0,k:"茎供花果",e:"解析：茎把养分运给花、果实和种子。"},
{i:92,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:0,q:"植物需要阳光，最主要因为（ ）。",o:["叶要进行光合作用","根要睡觉","花要发光","种子要游泳"],a:0,k:"光合作需光",e:"解析：没有阳光，叶不能光合作用，植物难生存。"},
{i:93,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:0,q:"如果把树枝的皮环割一圈，会出现（ ）。",o:["养分运输中断、枝叶枯","长得更旺","马上开花","没有变化"],a:0,k:"树皮运输",e:"解析：树皮里有筛管运养分，割断后上下运输受阻。"},
{i:94,c:"2sci-8",ch:"二年级·植物（根、茎、叶的作用）",f:1,q:"植物的根除了吸水，还能把植物____在土壤里。",o:[],a:"固定",k:"根固定植物",e:"解析：根像爪子抓住土，使植物不倒。"},
// ===== 第9章 二年级·动物（分类、特征、栖息地） =====
{i:95,c:"2sci-9",ch:"二年级·动物（分类、特征、栖息地）",f:0,q:"鱼生活在水里，用（ ）呼吸。",o:["鳃","肺","鼻子","皮肤"],a:0,k:"鱼用鳃呼吸",e:"解析：鱼用鳃从水中取氧气。"},
{i:96,c:"2sci-9",ch:"二年级·动物（分类、特征、栖息地）",f:0,q:"鸟的身体表面覆盖（ ），有翅膀会飞。",o:["羽毛","鳞片","鳍","硬壳"],a:0,k:"鸟有羽毛",e:"解析：鸟长羽毛、有翅膀，多数会飞。"},
{i:97,c:"2sci-9",ch:"二年级·动物（分类、特征、栖息地）",f:0,q:"猫、狗、人这类动物，繁殖方式是（ ）。",o:["胎生、幼时喝奶","卵生","用鳃呼吸","用鳍游"],a:0,k:"哺乳动物胎生",e:"解析：猫狗人是哺乳动物，胎生、幼崽喝母乳。"},
{i:98,c:"2sci-9",ch:"二年级·动物（分类、特征、栖息地）",f:1,q:"青蛙小时候生活在水里，叫____。",o:[],a:"蝌蚪",k:"蝌蚪是蛙幼体",e:"解析：青蛙的幼体是蝌蚪，用鳃呼吸，长大后上陆地。"},
{i:99,c:"2sci-9",ch:"二年级·动物（分类、特征、栖息地）",f:0,q:"昆虫的身体分为（ ）三部分。",o:["头、胸、腹","头、身、脚","上、中、下","左、中、右"],a:0,k:"昆虫分三段",e:"解析：昆虫身体是头、胸、腹三段，有6条腿。"},
{i:100,c:"2sci-9",ch:"二年级·动物（分类、特征、栖息地）",f:0,q:"蚂蚁属于（ ）。",o:["昆虫","鱼类","鸟类","哺乳动物"],a:0,k:"蚂蚁是昆虫",e:"解析：蚂蚁身体分三段、6条腿，是昆虫。"},
{i:101,c:"2sci-9",ch:"二年级·动物（分类、特征、栖息地）",f:0,q:"蚯蚓喜欢生活在（ ）。",o:["潮湿的土壤里","高高的树上","深海里","火焰中"],a:0,k:"蚯蚓居土壤",e:"解析：蚯蚓在土里钻行，疏松土壤、吃腐殖质。"},
{i:102,c:"2sci-9",ch:"二年级·动物（分类、特征、栖息地）",f:1,q:"动物安家的地方叫____（如森林、河流、洞穴）。",o:[],a:"栖息地",k:"栖息地",e:"解析：每种动物都有自己的栖息地，提供食物和 shelter。"},

{i:1,c:"2yw-1",ch:"二上·第1单元 大自然的秘密",f:0,q:"《小蝌蚪找妈妈》中，小蝌蚪最后找到了谁？",o:["青蛙","鲤鱼","乌龟","鸭子"],a:0,k:"课文：小蝌蚪找妈妈",e:"解析：小蝌蚪找妈妈，问了鲤鱼、乌龟，最后发现荷叶上蹲着的是自己的妈妈——青蛙。"},

{i:3,c:"2yw-1",ch:"二上·第1单元 大自然的秘密",f:0,q:"《我是什么》中，水变成小硬球打下来，叫？",o:["冰雹","雨","雪","露"],a:0,k:"课文：我是什么",e:"解析：水变成小硬球打下来是“冰雹”；变成小水滴落下来是雨，变成小花朵飘下来是雪。"},
{i:4,c:"2yw-1",ch:"二上·第1单元 大自然的秘密",f:0,q:"《植物妈妈有办法》中，蒲公英妈妈靠什么送孩子去旅行？",o:["风（降落伞）","动物皮毛","太阳晒","水"],a:0,k:"课文：植物妈妈有办法",e:"解析：蒲公英种子带绒毛像降落伞，靠风传播；苍耳靠动物皮毛；豌豆靠太阳晒炸开。"},
{i:5,c:"2yw-1",ch:"二上·第1单元 大自然的秘密",f:0,q:"《植物妈妈有办法》中，苍耳妈妈靠什么传播种子？",o:["挂在动物皮毛上","风","水","鸟吃"],a:0,k:"课文：植物妈妈有办法",e:"解析：苍耳种子有刺，能挂住动物的皮毛，被带到别处，靠动物传播。"},
{i:6,c:"2yw-1",ch:"二上·第1单元 大自然的秘密",f:0,q:"《植物妈妈有办法》中，豌豆妈妈靠什么传播种子？",o:["太阳晒，豆荚炸开","风","动物","水"],a:0,k:"课文：植物妈妈有办法",e:"解析：豌豆成熟后豆荚在太阳下晒得炸开，种子蹦着跳着离开，靠自身弹射传播。"},
{i:7,c:"2yw-1",ch:"二上·第1单元 大自然的秘密",f:1,q:"《小蝌蚪找妈妈》：小蝌蚪先长出两条____腿。",o:[],a:"后",k:"课文：小蝌蚪找妈妈",e:"解析：小蝌蚪先长出两条后腿，再长前腿，填“后”。"},
{i:8,c:"2yw-1",ch:"二上·第1单元 大自然的秘密",f:0,q:"《我是什么》中，水变成汽飞上天空，连成一片叫？",o:["云","雨","雪","冰"],a:0,k:"课文：我是什么",e:"解析：水变成极小的水汽飞上天空，聚集连成一片就是“云”；云变成雨、冰雹、雪落下来。"},

{i:10,c:"2yw-1",ch:"二上·第1单元 大自然的秘密",f:1,q:"《我是什么》：我会变。太阳一晒，我就变成____。",o:[],a:"汽",k:"课文：我是什么",e:"解析：原文“太阳一晒，我就变成汽”，“我”是水，填“汽”。"},
{i:11,c:"2yw-1",ch:"二上·第1单元 大自然的秘密",f:0,q:"《植物妈妈有办法》告诉我们？",o:["不同的植物有不同的传播办法","植物都一样","只有风传播","只有动物传播"],a:0,k:"课文：植物妈妈有办法",e:"解析：课文介绍蒲公英（风）、苍耳（动物）、豌豆（弹射）等不同的传播方式，植物办法真多。"},

{i:14,c:"2yw-2",ch:"二上·第2单元 识字",f:0,q:"《田家四季歌》中“夏季里，农事忙”，农民在忙什么？",o:["采桑养蚕又插秧","睡觉","赏花","收割"],a:0,k:"课文：田家四季歌",e:"解析：《田家四季歌》写四季农事：夏季采桑、养蚕、插秧，很忙碌。"},
{i:15,c:"2yw-2",ch:"二上·第2单元 识字",f:0,q:"《拍手歌》告诉我们动物和人类怎样？",o:["是朋友，要保护","可以吃","要远离","没关系"],a:0,k:"课文：拍手歌",e:"解析：《拍手歌》通过拍手念儿歌，告诉我们“人和动物是朋友”，要保护动物。"},
{i:16,c:"2yw-2",ch:"二上·第2单元 识字",f:0,q:"《场景歌》中“一只海鸥，一片沙滩，一艘军舰，一条帆船”，哪个量词用错？",o:["都正确","海鸥用“条”","沙滩用“只”","军舰用“个”"],a:0,k:"课文：场景歌",e:"解析：《场景歌》的量词搭配：一只海鸥、一片沙滩、一艘军舰、一条帆船，都正确。"},
{i:17,c:"2yw-2",ch:"二上·第2单元 识字",f:0,q:"《田家四季歌》中，哪个季节“雪初晴，新制棉衣暖又轻”？",o:["冬季","春季","夏季","秋季"],a:0,k:"课文：田家四季歌",e:"解析：《田家四季歌》冬季段：“冬季里，雪初晴，新制棉衣暖又轻。”"},

{i:19,c:"2yw-2",ch:"二上·第2单元 识字",f:0,q:"《场景歌》中，描写海边场景用到的量词有？",o:["一只、一片、一艘、一条","一朵、一棵、一座、一本","一个个、一只只","头、匹、只、条"],a:0,k:"课文：场景歌",e:"解析：海边场景：一只海鸥、一片沙滩、一艘军舰、一条帆船。"},
{i:20,c:"2yw-2",ch:"二上·第2单元 识字",f:1,q:"《田家四季歌》：夏季里，农事忙，采了蚕桑又____秧。",o:[],a:"插",k:"课文：田家四季歌",e:"解析：原文“采了蚕桑又插秧”，填“插”。"},

{i:22,c:"2yw-3",ch:"二上·第3单元 儿童生活",f:0,q:"《曹冲称象》中，曹冲用什么办法称象？",o:["把象赶上船画线，再装石头称石头","直接抱起来称","用刀切开","用秤称"],a:0,k:"课文：曹冲称象",e:"解析：曹冲把大象赶到船上，在船沉到的地方画线；再装石头到画线处，称石头的重量，就是大象的重量。"},
{i:23,c:"2yw-3",ch:"二上·第3单元 儿童生活",f:0,q:"《曹冲称象》中，曹操的儿子曹冲是怎样的孩子？",o:["聪明、爱动脑筋","力气大","不爱说话","调皮"],a:0,k:"课文：曹冲称象",e:"解析：曹冲才七岁，用巧妙的办法称象，说明他聪明、善于观察和思考。"},
{i:24,c:"2yw-3",ch:"二上·第3单元 儿童生活",f:0,q:"《玲玲的画》中，玲玲不小心把画弄脏了，爸爸建议她？",o:["在脏的地方画点什么（如小狗）","扔掉重画","不管它","骂人"],a:0,k:"课文：玲玲的画",e:"解析：《玲玲的画》：爸爸让玲玲在弄脏的地方画一只小花狗，画更好看了，说明“只要肯动脑，坏事也能变好事”。"},
{i:25,c:"2yw-3",ch:"二上·第3单元 儿童生活",f:0,q:"《玲玲的画》告诉我们的道理是？",o:["只要肯动脑筋，坏事有时能变成好事","画画要小心","不能弄脏","爸爸最聪明"],a:0,k:"课文：玲玲的画",e:"解析：课文结尾点明：“好多事情并不像我们想象的那么糟。只要肯动脑筋，坏事有时也能变成好事。”"},
{i:26,c:"2yw-3",ch:"二上·第3单元 儿童生活",f:0,q:"《一封信》中，露西给爸爸写信，后来在妈妈的帮助下写了？",o:["一封开心的信，说家里很好","一封抱怨的信","没寄出","两封都一样"],a:0,k:"课文：一封信",e:"解析：《一封信》中露西先写想爸爸的伤心话，后来在妈妈引导下写了封快乐的信，告诉爸爸家里很好、她和妈妈很开心。"},
{i:27,c:"2yw-3",ch:"二上·第3单元 儿童生活",f:0,q:"《妈妈睡了》中，睡梦中的妈妈是什么样子？",o:["真美丽、好温柔、好累","很凶","在生气","在笑"],a:0,k:"课文：妈妈睡了",e:"解析：《妈妈睡了》写妈妈哄孩子睡后自己睡着了，睡梦中的妈妈真美丽、好温柔、好累，表达孩子对妈妈的爱。"},
{i:28,c:"2yw-3",ch:"二上·第3单元 儿童生活",f:1,q:"《曹冲称象》：把大象____上船，在船舷上画线。",o:[],a:"赶",k:"课文：曹冲称象",e:"解析：曹冲“把大象赶到船上”，在船沉到的位置画线，填“赶”。"},
{i:29,c:"2yw-3",ch:"二上·第3单元 儿童生活",f:0,q:"《一封信》中，露西的爸爸在哪里？",o:["国外（出差工作）","在家","在学校","在爷爷家"],a:0,k:"课文：一封信",e:"解析：《一封信》中露西的爸爸出国工作了，露西和妈妈在家，所以写信给爸爸。"},
{i:30,c:"2yw-3",ch:"二上·第3单元 儿童生活",f:1,q:"《玲玲的画》：只要肯动脑____，坏事有时也能变成好事。",o:[],a:"筋",k:"课文：玲玲的画",e:"解析：课文道理“只要肯动脑筋，坏事有时也能变成好事”，填“筋”。"},
{i:31,c:"2yw-3",ch:"二上·第3单元 儿童生活",f:0,q:"《妈妈睡了》表达了什么感情？",o:["孩子对妈妈的爱","妈妈对老师的爱","爸爸的爱","同学之爱"],a:0,k:"课文：妈妈睡了",e:"解析：孩子细致观察熟睡的妈妈，字里行间流露出对妈妈的爱与体贴。"},

{i:32,c:"2yw-4",ch:"二上·第4单元 家乡",f:0,q:"《登鹳雀楼》的作者是谁？",o:["王之涣","李白","杜甫","王维"],a:0,k:"古诗：登鹳雀楼",e:"解析：《登鹳雀楼》是唐代诗人王之涣的作品。"},
{i:33,c:"2yw-4",ch:"二上·第4单元 家乡",f:0,q:"《登鹳雀楼》中“欲穷千里目”的下一句是？",o:["更上一层楼","黄河入海流","白日依山尽","更上一层天"],a:0,k:"古诗：登鹳雀楼",e:"解析：“欲穷千里目，更上一层楼”，想要看到更远，就要再登上一层楼，含有进取的道理。"},
{i:34,c:"2yw-4",ch:"二上·第4单元 家乡",f:0,q:"《望庐山瀑布》中“飞流直下三千尺，疑是银河落九天”用了什么修辞？",o:["夸张","比喻","拟人","排比"],a:0,k:"古诗：望庐山瀑布",e:"解析：“三千尺”“落九天”是夸张，极言瀑布又高又长、气势磅礴；作者李白。"},
{i:35,c:"2yw-4",ch:"二上·第4单元 家乡",f:0,q:"《望庐山瀑布》的作者是谁？",o:["李白","杜甫","白居易","王维"],a:0,k:"古诗：望庐山瀑布",e:"解析：《望庐山瀑布》是唐代诗人李白写的。"},
{i:36,c:"2yw-4",ch:"二上·第4单元 家乡",f:0,q:"《黄山奇石》中，像猴子蹲在山顶望云海的是哪块石头？",o:["猴子观海","仙桃石","仙人指路","金鸡叫天都"],a:0,k:"课文：黄山奇石",e:"解析：《黄山奇石》写了许多怪石：仙桃石、猴子观海、仙人指路、金鸡叫天都等，“猴子观海”像猴子蹲着望云海。"},
{i:37,c:"2yw-4",ch:"二上·第4单元 家乡",f:0,q:"《日月潭》中，日月潭在我国的哪里？",o:["台湾省","海南省","浙江省","四川省"],a:0,k:"课文：日月潭",e:"解析：《日月潭》写台湾省最大的湖日月潭，风光秀丽。"},
{i:38,c:"2yw-4",ch:"二上·第4单元 家乡",f:0,q:"《葡萄沟》中，葡萄沟出产很多水果，最有名的是？",o:["葡萄","苹果","香蕉","橘子"],a:0,k:"课文：葡萄沟",e:"解析：《葡萄沟》（新疆吐鲁番）写那里盛产水果，最有名的是葡萄，五光十色，老乡热情好客。"},
{i:39,c:"2yw-4",ch:"二上·第4单元 家乡",f:1,q:"《登鹳雀楼》：白日依山尽，黄____入海流。",o:[],a:"河",k:"古诗：登鹳雀楼",e:"解析：原文“黄河入海流”，填“河”。"},
{i:40,c:"2yw-4",ch:"二上·第4单元 家乡",f:0,q:"《葡萄沟》中，葡萄为什么五光十色？",o:["品种多、颜色多","只有一种颜色","没熟","晚上发光"],a:0,k:"课文：葡萄沟",e:"解析：《葡萄沟》：葡萄“有红的、白的、紫的、暗红的、淡绿的，五光十色”，因为品种多、颜色多，美丽极了。"},
{i:41,c:"2yw-4",ch:"二上·第4单元 家乡",f:1,q:"《望庐山瀑布》：飞流直下三千尺，疑是____河落九天。",o:[],a:"银",k:"古诗：望庐山瀑布",e:"解析：原文“疑是银河落九天”，把瀑布比作银河，填“银”。"},
{i:42,c:"2yw-4",ch:"二上·第4单元 家乡",f:0,q:"《日月潭》中，湖中央的光华岛把湖分成两半，北边像圆圆的太阳叫日潭，南边像弯弯的月亮叫？",o:["月潭","星潭","云潭","湖潭"],a:0,k:"课文：日月潭",e:"解析：北边像太阳叫日潭，南边像月亮叫月潭，合起来叫“日月潭”。"},

{i:43,c:"2yw-5",ch:"二上·第5单元 思维方法",f:0,q:"《坐井观天》中，青蛙认为天？",o:["只有井口那么大","无边无际","像锅盖","很大"],a:0,k:"课文：坐井观天",e:"解析：《坐井观天》青蛙在井底，以为天只有井口那么大；小鸟说天无边无际。比喻眼光狭小。"},
{i:44,c:"2yw-5",ch:"二上·第5单元 思维方法",f:0,q:"《坐井观天》告诉我们？",o:["看问题要全面，不能目光短浅","青蛙最聪明","小鸟说错","天很小"],a:0,k:"课文：坐井观天",e:"解析：这则寓言说明，坐在井里看天目光短浅，看问题要开阔、全面。"},
{i:45,c:"2yw-5",ch:"二上·第5单元 思维方法",f:0,q:"《寒号鸟》中，寒号鸟为什么在冬天冻死了？",o:["只顾玩乐，不听喜鹊劝，不筑窝","出去玩了","被人抓走","生病"],a:0,k:"课文：寒号鸟",e:"解析：《寒号鸟》写寒号鸟懒惰，秋天喜鹊劝它垒窝它不听，冬天严寒冻死，说明“现在懒惰，将来难过”，要提早准备。"},
{i:46,c:"2yw-5",ch:"二上·第5单元 思维方法",f:0,q:"《我要的是葫芦》中，种葫芦的人葫芦掉了，是因为？",o:["不管叶子上的蚜虫，叶子枯了","没浇水","被风吹走","没晒太阳"],a:0,k:"课文：我要的是葫芦",e:"解析：种葫芦的人只要葫芦，不管叶子上的蚜虫，蚜虫吃光叶子，葫芦因没有养分掉了，说明事物有联系，不能只看局部。"},
{i:47,c:"2yw-5",ch:"二上·第5单元 思维方法",f:0,q:"《我要的是葫芦》告诉我们？",o:["事物之间是有联系的，不能只顾结果不管原因","葫芦不重要","蚜虫无害","叶子没用"],a:0,k:"课文：我要的是葫芦",e:"解析：寓言说明事物相互联系，叶子和葫芦有关，只盯葫芦不顾叶子上的虫，结果什么也得不到。"},
{i:48,c:"2yw-5",ch:"二上·第5单元 思维方法",f:0,q:"《寒号鸟》中，谁劝寒号鸟垒窝？",o:["喜鹊","青蛙","松鼠","乌鸦"],a:0,k:"课文：寒号鸟",e:"解析：《寒号鸟》里喜鹊趁天气暖和垒窝，并劝寒号鸟也垒窝，寒号鸟不听。"},
{i:49,c:"2yw-5",ch:"二上·第5单元 思维方法",f:1,q:"《坐井观天》：青蛙坐在井里，认为天只有____那么大。",o:[],a:"井口",k:"课文：坐井观天",e:"解析：青蛙在井底，看到天只有井口那么大，填“井口”。"},
{i:50,c:"2yw-5",ch:"二上·第5单元 思维方法",f:0,q:"《寒号鸟》中，喜鹊在什么时候垒窝？",o:["秋天天气暖和时","冬天","夏天","春天"],a:0,k:"课文：寒号鸟",e:"解析：喜鹊在秋天天还暖和时就衔草垒窝，提前准备过冬，所以冬天不受冻。"},
{i:51,c:"2yw-5",ch:"二上·第5单元 思维方法",f:1,q:"《我要的是葫芦》：有一天，他看见叶子上爬着一些蚜____。",o:[],a:"虫",k:"课文：我要的是葫芦",e:"解析：原文“他看见叶子上爬着一些蚜虫”，填“虫”。"},
{i:52,c:"2yw-5",ch:"二上·第5单元 思维方法",f:0,q:"“坐井观天”现在常用来比喻？",o:["目光短浅、见识少","很聪明","看得远","有学问"],a:0,k:"成语：坐井观天",e:"解析：“坐井观天”比喻眼界狭小、见识有限的人。"},

{i:53,c:"2yw-6",ch:"二上·第6单元 伟人",f:0,q:"《大禹治水》中，大禹治水多少年，三过家门而不入？",o:["十三年","三年","三十年","一年"],a:0,k:"课文：大禹治水",e:"解析：大禹治水十三年，三次经过家门都没有进去，一心治水，终于成功。"},
{i:54,c:"2yw-6",ch:"二上·第6单元 伟人",f:0,q:"《大禹治水》中，大禹采用什么方法治水成功？",o:["疏通河道（疏导）","堵住水","不管它","搬家"],a:0,k:"课文：大禹治水",e:"解析：大禹改用“疏导”的方法，开挖河道把洪水引入大海，不像父亲鲧用堵的方法，终于治好水。"},
{i:55,c:"2yw-6",ch:"二上·第6单元 伟人",f:0,q:"《朱德的扁担》中，朱德同志怎样和战士们一起？",o:["挑粮上山","睡觉","读书","看病"],a:0,k:"课文：朱德的扁担",e:"解析：《朱德的扁担》写朱德军长带头和战士们挑粮上山，战士们敬爱他，把他的扁担藏起来，他又做了一根写上名字。"},
{i:56,c:"2yw-6",ch:"二上·第6单元 伟人",f:0,q:"《难忘的泼水节》中，和傣族人民一起过泼水节的是谁？",o:["周总理","毛主席","朱德","邓小平"],a:0,k:"课文：难忘的泼水节",e:"解析：《难忘的泼水节》写1961年周总理和傣族人民一起过泼水节，泼水祝福，十分难忘。"},
{i:57,c:"2yw-6",ch:"二上·第6单元 伟人",f:0,q:"《难忘的泼水节》中，泼水节是哪个民族的传统节日？",o:["傣族","汉族","蒙古族","藏族"],a:0,k:"常识：泼水节",e:"解析：泼水节是傣族的传统节日，人们互相泼水表示祝福，周总理曾和傣族人民共度。"},
{i:58,c:"2yw-6",ch:"二上·第6单元 伟人",f:0,q:"《朱德的扁担》中，战士们为什么藏朱德的扁担？",o:["心疼军长，不让他太累","不喜欢扁担","想自己用","开玩笑"],a:0,k:"课文：朱德的扁担",e:"解析：战士们心疼朱德军长年纪大还挑粮，把他的扁担藏起来；朱德又做一根写上“朱德扁担不准乱拿”。"},
{i:59,c:"2yw-6",ch:"二上·第6单元 伟人",f:1,q:"《大禹治水》：禹离开了家乡，一去就是____年。",o:[],a:"十三",k:"课文：大禹治水",e:"解析：大禹治水“十三年”，三过家门而不入，填“十三”。"},
{i:60,c:"2yw-6",ch:"二上·第6单元 伟人",f:0,q:"《大禹治水》中，鲧用什么方法治水失败？",o:["筑坝挡水（堵）","疏导","挖河","搬家"],a:0,k:"课文：大禹治水",e:"解析：禹的父亲鲧用“筑坝挡水”（堵）的方法，洪水退了又来，失败了；禹改用疏导成功。"},
{i:61,c:"2yw-6",ch:"二上·第6单元 伟人",f:1,q:"《难忘的泼水节》：周总理和傣族人民一起____水。",o:[],a:"泼",k:"课文：难忘的泼水节",e:"解析：泼水节上人们互相泼水祝福，周总理也和人民一起泼水，填“泼”。"},
{i:62,c:"2yw-6",ch:"二上·第6单元 伟人",f:0,q:"《朱德的扁担》表现了朱德怎样的品质？",o:["与战士同甘共苦、带头吃苦","高高在上","不爱劳动","怕累"],a:0,k:"课文：朱德的扁担",e:"解析：朱德军长亲自挑粮，和战士同甘共苦，以身作则，深受爱戴。"},

{i:63,c:"2yw-7",ch:"二上·第7单元 想象",f:0,q:"《夜宿山寺》的作者是谁？",o:["李白","杜甫","白居易","王维"],a:0,k:"古诗：夜宿山寺",e:"解析：《夜宿山寺》是唐代诗人李白的作品：“危楼高百尺，手可摘星辰。”"},
{i:64,c:"2yw-7",ch:"二上·第7单元 想象",f:0,q:"《夜宿山寺》中“手可摘星辰”用了什么写法？",o:["夸张，写楼很高","比喻","拟人","写实"],a:0,k:"古诗：夜宿山寺",e:"解析：“手可摘星辰”夸张地写山寺楼很高，好像一伸手就能摘到星星。"},
{i:65,c:"2yw-7",ch:"二上·第7单元 想象",f:0,q:"《敕勒歌》中“天苍苍，野茫茫，风吹草低见牛羊”描写的是哪里风光？",o:["北方草原","江南水乡","高山","海边"],a:0,k:"古诗：敕勒歌",e:"解析：《敕勒歌》是北朝民歌，写敕勒川（今内蒙古一带）草原广阔、牛羊成群的景象。"},
{i:66,c:"2yw-7",ch:"二上·第7单元 想象",f:0,q:"《敕勒歌》中“天似穹庐，笼盖四野”，“穹庐”指？",o:["蒙古包（圆顶帐篷）","天空","山","房子"],a:0,k:"古诗：敕勒歌",e:"解析：“穹庐”是游牧民族住的圆形帐篷（蒙古包），这里把天空比作穹庐笼罩大地。"},
{i:67,c:"2yw-7",ch:"二上·第7单元 想象",f:0,q:"《雾在哪里》中，雾把什么藏起来了？",o:["大海、天空、城市等，什么都藏","只藏太阳","只藏山","什么也没藏"],a:0,k:"课文：雾在哪里",e:"解析：《雾在哪里》写雾像个淘气的孩子，把大海、天空、城市、自己都藏起来，最后消失了。"},
{i:68,c:"2yw-7",ch:"二上·第7单元 想象",f:0,q:"《雪孩子》中，雪孩子为了救谁融化了？",o:["小白兔","小松鼠","小鸟","小熊"],a:0,k:"课文：雪孩子",e:"解析：《雪孩子》写小白兔家着火，雪孩子冲进去救出小白兔，自己却融化成了水（后来变成白云）。"},
{i:69,c:"2yw-7",ch:"二上·第7单元 想象",f:1,q:"《夜宿山寺》：危楼高百尺，手可摘____。",o:[],a:"星辰",k:"古诗：夜宿山寺",e:"解析：原文“手可摘星辰”，填“星辰”。"},
{i:70,c:"2yw-7",ch:"二上·第7单元 想象",f:0,q:"《敕勒歌》中“风吹草低见牛羊”的“见”意思是？",o:["出现、显露","看见","见面","再见"],a:0,k:"古诗：敕勒歌",e:"解析：“见”通“现”，是出现、显露的意思，风吹开草露出牛羊。"},
{i:71,c:"2yw-7",ch:"二上·第7单元 想象",f:1,q:"《雾在哪里》：雾把大海藏了起来，无论是海水、船只，还是蓝____的远方，都看不见了。",o:[],a:"色",k:"课文：雾在哪里",e:"解析：原文“无论是海水、船只，还是蓝色的远方，都看不见了”，填“色”。"},
{i:72,c:"2yw-7",ch:"二上·第7单元 想象",f:0,q:"《雪孩子》告诉我们什么？",o:["雪孩子勇敢、舍己救人，很善良","雪孩子很坏","小白兔不小心","雪不会化"],a:0,k:"课文：雪孩子",e:"解析：雪孩子为救朋友不惜融化自己，表现了勇敢、善良、舍己为人的品质。"},

{i:73,c:"2yw-8",ch:"二上·第8单元 相处",f:0,q:"《狐假虎威》中，狐狸借着谁的威风吓跑百兽？",o:["老虎","狮子","大象","熊"],a:0,k:"课文：狐假虎威",e:"解析：《狐假虎威》写狐狸骗老虎跟在身后，百兽看见老虎就跑，狐狸便“借”老虎的威风吓跑百兽。比喻倚仗别人势力欺压人。"},
{i:74,c:"2yw-8",ch:"二上·第8单元 相处",f:0,q:"“狐假虎威”现在比喻？",o:["倚仗别人势力欺压人","狐狸很聪明","老虎胆小","动物友好"],a:0,k:"成语：狐假虎威",e:"解析：“狐假虎威”比喻倚仗别人的势力来欺压、吓唬人。"},
{i:75,c:"2yw-8",ch:"二上·第8单元 相处",f:0,q:"《狐狸分奶酪》中，狐狸把奶酪分得怎样？",o:["两块不一样大，自己吃光了","公平分好","留给熊","分给兔子"],a:0,k:"课文：狐狸分奶酪",e:"解析：《狐狸分奶酪》写狐狸借口帮两只小熊分奶酪，故意分不均，一口口把奶酪吃光，讽刺爱吵架、让外人得利。"},
{i:76,c:"2yw-8",ch:"二上·第8单元 相处",f:0,q:"《纸船和风筝》中，松鼠和小熊用什么传递友谊？",o:["纸船和风筝","信和电话","鸽子","气球"],a:0,k:"课文：纸船和风筝",e:"解析：《纸船和风筝》写松鼠折纸船、小熊放风筝，互相问候成为朋友；吵架后又用它们和好。"},
{i:77,c:"2yw-8",ch:"二上·第8单元 相处",f:0,q:"《纸船和风筝》告诉我们？",o:["朋友之间要学会宽容、主动和好","朋友不能吵架","纸船更好","风筝更好"],a:0,k:"课文：纸船和风筝",e:"解析：松鼠和小熊闹别扭后又用纸船风筝和好，说明友谊可贵，要宽容、主动化解矛盾。"},
{i:78,c:"2yw-8",ch:"二上·第8单元 相处",f:0,q:"《风娃娃》中，风娃娃做的好事有？",o:["吹风车、吹船帆帮忙","吹跑风筝","吹折小树","吹走衣服"],a:0,k:"课文：风娃娃",e:"解析：《风娃娃》写风娃娃帮风车抽水、帮船帆吹船（好事），但也吹跑风筝、吹折小树（坏事），说明做事要看对别人有没有用。"},
{i:79,c:"2yw-8",ch:"二上·第8单元 相处",f:1,q:"《狐假虎威》：狐狸____着老虎的威风，把百兽吓跑了。",o:[],a:"借",k:"课文：狐假虎威",e:"解析：“狐假虎威”中“假”是“借”的意思，狐狸借老虎的威风，填“借”。"},
{i:80,c:"2yw-8",ch:"二上·第8单元 相处",f:0,q:"《风娃娃》告诉我们做事要怎样？",o:["看对别人有没有用","越快越好","越用力越好","随便做"],a:0,k:"课文：风娃娃",e:"解析：风娃娃好心却办坏事，妈妈告诉它“做事情光有好的愿望不行，还要看是不是真的对别人有用”。"},
{i:81,c:"2yw-8",ch:"二上·第8单元 相处",f:1,q:"《纸船和风筝》：松鼠折了一只____，放在小溪里。",o:[],a:"纸船",k:"课文：纸船和风筝",e:"解析：原文“松鼠折了一只纸船”送给小熊，填“纸船”。"},
{i:82,c:"2yw-8",ch:"二上·第8单元 相处",f:0,q:"《狐狸分奶酪》中，最后奶酪被谁吃光了？",o:["狐狸","两只小熊","熊哥哥","没人吃"],a:0,k:"课文：狐狸分奶酪",e:"解析：狐狸以“分公平”为名，一口口把整块奶酪吃光了，两只小熊什么也没得到。"},

{i:83,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:0,q:"《村居》的作者是谁？",o:["高鼎","贺知章","杜甫","白居易"],a:0,k:"古诗：村居",e:"解析：《村居》是清代诗人高鼎的作品，写春天儿童放风筝。"},
{i:84,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:0,q:"《村居》中“儿童散学归来早，忙趁东风放纸鸢”，“纸鸢”指？",o:["风筝","小鸟","纸船","气球"],a:0,k:"古诗：村居",e:"解析：“纸鸢”就是风筝，“忙趁东风放纸鸢”指孩子们趁着春风放风筝。"},
{i:85,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:0,q:"《咏柳》中“不知细叶谁裁出，二月春风似剪刀”用了什么修辞？",o:["比喻（把春风比剪刀）","夸张","拟人","排比"],a:0,k:"古诗：咏柳",e:"解析：《咏柳》（贺知章）把二月的春风比作剪刀，裁出细细的柳叶，是比喻。"},
{i:86,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:0,q:"《咏柳》的作者是谁？",o:["贺知章","李白","杜甫","王维"],a:0,k:"古诗：咏柳",e:"解析：《咏柳》是唐代诗人贺知章的作品。"},
{i:87,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:0,q:"《雷锋叔叔，你在哪里》中，雷锋的精神是？",o:["乐于助人、做好事","出名","赚钱","游玩"],a:0,k:"课文：雷锋叔叔",e:"解析：诗歌寻找雷锋，赞美他乐于助人、到哪里就把好事做到哪里，“哪里需要献出爱心，雷锋叔叔就出现在哪里”。"},
{i:88,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:0,q:"《千人糕》中，一块普通的糕为什么叫“千人糕”？",o:["需要很多人的劳动才能做成","要一千个人吃","很大","有一千层"],a:0,k:"课文：千人糕",e:"解析：《千人糕》说明一块糕要经过农民种稻、工人制糖、师傅制作等很多人的劳动，所以叫千人糕，要珍惜劳动成果。"},
{i:89,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:0,q:"《神州谣》中“我神州，称中华”，“神州”指？",o:["中国","北京","长江","黄河"],a:0,k:"课文：神州谣",e:"解析：《神州谣》中“神州”“中华”都是中国的美称，“山川美，可入画”。"},
{i:90,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:0,q:"《传统节日》中“清明节，雨纷纷，先人墓前去祭扫”，清明节在什么时候？",o:["春暖花开的四月前后","夏天","冬天","八月"],a:0,k:"课文：传统节日",e:"解析：《传统节日》按时间写春节、元宵、清明、端午、七夕、中秋、重阳，清明在春暖时，人们扫墓踏青。"},
{i:91,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:1,q:"《咏柳》：碧玉妆成一树高，万条垂下绿丝____。",o:[],a:"绦",k:"古诗：咏柳",e:"解析：原文“万条垂下绿丝绦”，把柳条比丝带，填“绦”。"},
{i:92,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:0,q:"《中国美食》中，“烤、烧、炒、煮、蒸”都是？",o:["烹饪方法","餐具","食材","调料"],a:0,k:"课文：中国美食",e:"解析：《中国美食》介绍各种菜肴和做法，烤、烧、炒、煮、蒸、炸都是烹饪方法。"},
{i:93,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:1,q:"《神州谣》：黄河奔，长江____，长城长，珠峰耸。",o:[],a:"涌",k:"课文：神州谣",e:"解析：原文“黄河奔，长江涌，长城长，珠峰耸”，填“涌”。"},
{i:94,c:"2yw-9",ch:"二下·第1-3单元 春天·关爱·识字",f:0,q:"《传统节日》中，端午节是为了纪念谁，习俗有吃粽子、赛龙舟？",o:["屈原","李白","杜甫","雷锋"],a:0,k:"课文：传统节日",e:"解析：《传统节日》写“过端午，赛龙舟，粽子艾香满堂飘”，端午为纪念屈原。"},

{i:95,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:0,q:"《彩色的梦》中，“我”的彩色铅笔画出了什么？",o:["草坪、野花、天空等美丽的梦","只有黑色","一座房子","一棵枯树"],a:0,k:"课文：彩色的梦",e:"解析：《彩色的梦》写“我”用彩色铅笔画出大块的绿草坪、大朵的野花、蓝蓝的天空，充满想象。"},
{i:96,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:0,q:"《枫树上的喜鹊》中，“我”喜欢枫树上的什么？",o:["喜鹊阿姨和喜鹊弟弟","枫叶","鸟窝","风"],a:0,k:"课文：枫树上的喜鹊",e:"解析：《枫树上的喜鹊》写“我”喜欢枫树上的喜鹊，还懂得喜鹊“说话”，充满童真。"},
{i:97,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:0,q:"《寓言二则》中“亡羊补牢”的意思是？",o:["丢羊后修补羊圈，还不算晚","羊丢了不用管","牢房","不修补"],a:0,k:"寓言：亡羊补牢",e:"解析：“亡羊补牢”指羊丢了再修补羊圈，还不算晚，比喻出了问题及时补救，可以防止继续受损失。"},
{i:98,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:0,q:"《寓言二则》中“揠苗助长”告诉我们？",o:["违反规律急于求成反而坏事","要多浇水","苗要拔高","不用管苗"],a:0,k:"寓言：揠苗助长",e:"解析：“揠苗助长”写宋人把苗拔高想让它快长，结果苗都枯死，说明违反事物规律、急于求成反而把事办坏。"},
{i:99,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:0,q:"《画杨桃》中，“我”把杨桃画成什么形状，同学却笑“我”？",o:["五角星（杨桃一端的样子）","圆形","方形","三角形"],a:0,k:"课文：画杨桃",e:"解析：《画杨桃》写“我”从正面看杨桃画成五角星，同学笑；老师让大家换个角度看，发现真像五角星。说明看问题角度不同结果不同，要实事求是。"},
{i:100,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:0,q:"《小马过河》中，小马最后怎样过了河？",o:["自己下河试试，安全过了","没过","让牛驮","让松鼠驮"],a:0,k:"课文：小马过河",e:"解析：《小马过河》写老牛说水浅、松鼠说水深，小马犹豫；妈妈让它自己试，结果水既不深也不浅，安全过了。说明遇事要亲自尝试。"},
{i:101,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:0,q:"《小马过河》告诉我们？",o:["别人的经验不一定适合自己，要动脑试一试","听别人的就行","水都深","水都浅"],a:0,k:"课文：小马过河",e:"解析：老牛高大觉得浅、松鼠矮小觉得深，小马自己试才知深浅，说明不能光听别人，要亲身实践。"},
{i:102,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:1,q:"《亡羊补牢》：羊____了，才把羊圈修好，还不晚。",o:[],a:"丢",k:"寓言：亡羊补牢",e:"解析：“亡羊补牢”中羊丢了（亡）才补圈，比喻出问题及时补救，填“丢”。"},
{i:103,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:0,q:"《画杨桃》中老师的做法让我们明白？",o:["看的角度不同，样子不同，要实事求是","杨桃是圆的","同学都对","不用听老师"],a:0,k:"课文：画杨桃",e:"解析：老师让同学轮流到“我”座位看，发现杨桃真像五角星，教育大家角度不同结果不同，要相信事实。"},
{i:104,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:1,q:"《小马过河》：妈妈对小马说：“孩子，光听别人说，自己不动脑____，是不行的。”",o:[],a:"筋",k:"课文：小马过河",e:"解析：原文妈妈让小马“光听别人说，自己不动脑筋，是不行的”，要亲自试，填“筋”。"},
{i:105,c:"2yw-10",ch:"二下·第4-5单元 童心与办法",f:0,q:"《枫树上的喜鹊》表现了孩子怎样的想象？",o:["把喜鹊当成人，能听懂它们说话","讨厌喜鹊","喜欢睡觉","爱画画"],a:0,k:"课文：枫树上的喜鹊",e:"解析：孩子把喜鹊阿姨、喜鹊弟弟当成人，想象它们在说话、教本领，充满童心与想象。"},

{i:106,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:0,q:"《晓出净慈寺送林子方》的作者是谁？",o:["杨万里","杜甫","李白","白居易"],a:0,k:"古诗：晓出净慈寺",e:"解析：这首诗是宋代诗人杨万里写的，写西湖六月荷花。"},
{i:107,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:0,q:"《晓出净慈寺送林子方》中“接天莲叶无穷碧，映日荷花别样红”写的是？",o:["西湖六月荷花","早春桃花","秋菊","冬雪"],a:0,k:"古诗：晓出净慈寺",e:"解析：写西湖六月莲叶无边碧绿、荷花在阳光下格外红，是盛夏荷花景。"},
{i:108,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:0,q:"《绝句》（两个黄鹂鸣翠柳）的作者是谁？",o:["杜甫","李白","王维","白居易"],a:0,k:"古诗：绝句",e:"解析：“两个黄鹂鸣翠柳，一行白鹭上青天”是唐代诗人杜甫的《绝句》。"},
{i:109,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:0,q:"《雷雨》中，雷雨前、雷雨中、雷雨后的顺序是？",o:["先闷热起风，再打雷下雨，最后天晴","先下雨后打雷","先晴后雨","只打雷不下雨"],a:0,k:"课文：雷雨",e:"解析：《雷雨》按时间写：雷雨前（闷热、乌云、大风、闪电）、雷雨中（哗哗下）、雷雨后（天晴、彩虹、蝉叫）。"},
{i:110,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:0,q:"《要是你在野外迷了路》中，可以帮我们辨别方向的有？",o:["太阳、北极星、大树、积雪","只有指南针","只有手机","只有地图"],a:0,k:"课文：要是你在野外迷了路",e:"解析：课文介绍天然指南针：中午太阳在南、北极星指北、大树枝叶稠稀、沟渠里积雪等能帮我们辨方向。"},
{i:111,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:0,q:"《要是你在野外迷了路》中，北极星挂在哪个方向？",o:["北方","南方","东方","西方"],a:0,k:"课文：要是你在野外迷了路",e:"解析：北极星永远挂在北方，是夜晚可靠的指南针。"},
{i:112,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:0,q:"《大象的耳朵》中，大象的耳朵像什么，它最后怎样？",o:["像扇子，最后明白各人有各样，不再学别人","像圆球，割掉","像叶子，竖起来","没变化"],a:0,k:"课文：大象的耳朵",e:"解析：《大象的耳朵》写大象耳朵像扇子耷拉着，被别的动物说“有病”，它学竖起来反而不舒服，明白“人家是人家，我是我”，做回自己。"},
{i:113,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:1,q:"《绝句》：两个黄鹂鸣翠柳，一行白鹭上青____。",o:[],a:"天",k:"古诗：绝句",e:"解析：原文“一行白鹭上青天”，填“天”。"},
{i:114,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:0,q:"《青蛙卖泥塘》中，青蛙最后把泥塘卖了吗？",o:["没卖，自己住下了","卖给老牛","卖给野鸭","卖给小鸟"],a:0,k:"课文：青蛙卖泥塘",e:"解析：青蛙听取大家建议，种草、引水、栽树、盖房，把泥塘变美了，最后决定不卖，自己住。"},
{i:115,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:1,q:"《要是你在野外迷了路》：北极星是盏指____灯，它永远高挂在北方。",o:[],a:"路",k:"课文：要是你在野外迷了路",e:"解析：原文“北极星是盏指路灯”，填“路”。"},
{i:116,c:"2yw-11",ch:"二下·第6-8单元 自然与改变",f:0,q:"《羿射九日》中，羿射下几个太阳拯救了人类？",o:["九个（留一个）","十个全射","一个","三个"],a:0,k:"课文：羿射九日",e:"解析：神话《羿射九日》写天上十个太阳烤焦大地，羿射下九个，留下一个，人间恢复生机。"},

{i:117,c:"2yw-12",ch:"二年级·语文知识",f:0,q:"把下面的句子改成“被”字句：“风把树叶吹落了。”正确的是？",o:["树叶被风吹落了","风被树叶吹落了","树叶把风吹落了","被风吹落树叶"],a:0,k:"句式：被字句",e:"解析：“把”字句改“被”字句，把“风”和“树叶”换位，“把”变“被”：树叶被风吹落了。"},
{i:118,c:"2yw-12",ch:"二年级·语文知识",f:0,q:"把“我 把 书 桌上 放到”连成一句正确通顺的话？",o:["我把书放到桌上。","书把我放到桌上。","桌上把书放我。","我放书到把桌上。"],a:0,k:"句式：连词成句",e:"解析：连词成句要注意谁做动作：“我”把“书”放到“桌上”，应为“我把书放到桌上。”"},
{i:119,c:"2yw-12",ch:"二年级·语文知识",f:0,q:"下面句子标点用对的是？",o:["今天天气真好！","今天天气真好。？","今天天气真好，","今天天气真好??"],a:0,k:"标点：感叹号",e:"解析：“今天天气真好！”表达赞美、高兴，句末用感叹号（！）合适。"},
{i:120,c:"2yw-12",ch:"二年级·语文知识",f:0,q:"下面哪句话末尾应该用问号（？）？",o:["你去过北京吗？","这里的风景真美。","他跑了。","花儿开了！"],a:0,k:"标点：问号",e:"解析：表示疑问的句子末尾用问号，“你去过北京吗？”是提问，用问号。"},
{i:121,c:"2yw-12",ch:"二年级·语文知识",f:0,q:"“狐假虎威、坐井观天、揠苗助长”都是？",o:["成语（寓言故事）","水果名","动物名","地名"],a:0,k:"成语积累",e:"解析：这些都是出自寓言故事的成语：狐假虎威、坐井观天、揠苗助长。"},
{i:122,c:"2yw-12",ch:"二年级·语文知识",f:0,q:"下面哪个词语不是描写天气的？",o:["兴高采烈","万里无云","狂风暴雨","电闪雷鸣"],a:0,k:"词语积累",e:"解析：“兴高采烈”形容人高兴的心情，不是天气；其余都描写天气。"},
{i:123,c:"2yw-12",ch:"二年级·语文知识",f:0,q:"“把”字句中，动作的发出者（主语）在“把”的哪边？",o:["前面（如“我”把…）","后面","两边都有","没有主语"],a:0,k:"句式：把字句",e:"解析：“把”字句格式：主语+把+宾语+动作，如“我把门打开”，主语“我”在“把”前面。"},
{i:124,c:"2yw-12",ch:"二年级·语文知识",f:1,q:"连词成句：①小鸟 ②树上 ③在 ④唱歌 → ____",o:[],a:"小鸟在树上唱歌。",k:"句式：连词成句",e:"解析：按“谁+在哪+做什么”连成“小鸟在树上唱歌。”，注意句末加句号。"},
{i:125,c:"2yw-12",ch:"二年级·语文知识",f:0,q:"下面书名号使用正确的是？",o:["我喜欢读《西游记》。","我喜欢读‘西游记’。","我喜欢读西游记。","我喜欢读＜西游记＞。"],a:0,k:"标点：书名号",e:"解析：书名、篇名用书名号《》，应为“我喜欢读《西游记》。”"},
{i:126,c:"2yw-12",ch:"二年级·语文知识",f:1,q:"改“被”字句：课本被我____在书包里。",o:[],a:"放",k:"句式：被字句",e:"解析：对应“我把课本放在书包里”，被字句为“课本被我放在书包里”，填“放”。"}

{i:20,c:"3sci-2",ch:"三上·植物（种子结构）",f:0,q:"种子发芽需要（ ）。",o:["水、空气和适宜温度","只有石头","只有火","只有风"],a:0,k:"发芽三条件",e:"解析：水、空气、适宜温度是种子萌发的基本条件。"},
{i:21,c:"3sci-2",ch:"三上·植物（种子结构）",f:0,q:"下列能长成一棵新植物的是（ ）。",o:["完整的种子","一块石头","一片金属","一杯水"],a:0,k:"种子繁殖",e:"解析：种子里有胚，条件合适就能长成新植株。"},
{i:22,c:"3sci-2",ch:"三上·植物（种子结构）",f:1,q:"胚芽将来发育成植物的茎和____。",o:[],a:"叶",k:"胚芽成茎叶",e:"解析：胚芽向上生长，形成茎和叶。"},
{i:23,c:"3sci-2",ch:"三上·植物（种子结构）",f:0,q:"我们吃的花生米，其实是花生的（ ）。",o:["种子","果实的皮","根","叶子"],a:0,k:"花生米是种子",e:"解析：花生米是花生荚果里的种子，两瓣是子叶。"},
// ===== 第3章 三上·动物（蚕的生命周期） =====
{i:24,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:0,q:"蚕宝宝是从（ ）里孵化出来的。",o:["卵","石头","水","火"],a:0,k:"蚕从卵出",e:"解析：蚕的生命从卵开始，破壳成幼虫。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g3sci/silkworm.svg"},
{i:25,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:0,q:"刚从卵里出来的小蚕叫（ ）。",o:["幼虫","成虫","蛹","蛾"],a:0,k:"幼虫阶段",e:"解析：刚孵出的是幼虫，就是会吃桑叶的蚕宝宝。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g3sci/silkworm.svg"},
{i:26,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:0,q:"蚕长到一定时候吐丝结茧，在里面变成（ ）。",o:["蛹","卵","幼虫","蛾"],a:0,k:"结茧变蛹",e:"解析：幼虫吐丝结茧，在茧里变成蛹。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g3sci/silkworm.svg"},
{i:27,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:0,q:"蚕茧里的蛹最后变成（ ）钻出来。",o:["蛾","鱼","鸟","青蛙"],a:0,k:"蛹变蛾",e:"解析：蛹羽化成蚕蛾，破茧而出，成虫交配产卵。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g3sci/silkworm.svg"},
{i:28,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:1,q:"蚕的一生经历卵、____、蛹、蛾四个阶段。",o:[],a:"幼虫",k:"蚕四阶段",e:"解析：蚕属完全变态，经历卵→幼虫→蛹→成虫（蛾）。"},
{i:29,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:0,q:"蚕宝宝爱吃（ ）。",o:["桑叶","石头","肉","塑料"],a:0,k:"蚕吃桑叶",e:"解析：蚕主要吃桑叶，也能吃少量其它叶子。"},
{i:30,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:0,q:"蚕的形态从幼虫到蛾变化很大，属于（ ）。",o:["完全变态发育","不变态","只变一次","两栖"],a:0,k:"完全变态",e:"解析：幼虫和成虫差别大，经历蛹期，是完全变态。"},
{i:31,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:1,q:"蚕蛾的身体和昆虫一样分头、胸、____三部分。",o:[],a:"腹",k:"昆虫分三段",e:"解析：蚕蛾是昆虫，身体分头、胸、腹。"},
{i:32,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:0,q:"蚕宝宝长大过程中要（ ）。",o:["蜕皮几次","睡觉不动","吃饭","飞走"],a:0,k:"蚕蜕皮",e:"解析：蚕表皮不能长大，要蜕皮才能继续生长。"},
{i:33,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:0,q:"蚕吐丝结茧主要是为了（ ）。",o:["保护自己变成蛹","睡觉","立刻产卵","飞走"],a:0,k:"结茧目的",e:"解析：茧保护蛹安全度过变化阶段。"},
{i:34,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:1,q:"幼体和成体差别很大的发育方式叫____发育。",o:[],a:"变态",k:"变态发育",e:"解析：蚕、蝴蝶等都经历明显变态。"},
{i:35,c:"3sci-3",ch:"三上·动物（蚕的生命周期）",f:0,q:"关于蚕蛾，正确的是（ ）。",o:["口器退化，不怎么吃东西","大吃桑叶","会游泳","会爬树"],a:0,k:"蛾不进食",e:"解析：蚕蛾主要任务是交配产卵，基本不吃东西。"},
// ===== 第4章 三上·动物（青蛙生命周期） =====
{i:36,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:0,q:"青蛙把卵产在（ ）。",o:["水里","树上","火里","金属上"],a:0,k:"蛙卵产水中",e:"解析：青蛙卵产在水里，孵出蝌蚪。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g3sci/frog.svg"},
{i:37,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:0,q:"青蛙的卵孵化出来的是（ ）。",o:["蝌蚪","小鱼","小鸟","小兔"],a:0,k:"卵孵蝌蚪",e:"解析：蛙卵孵出蝌蚪，像小鱼有尾。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g3sci/frog.svg"},
{i:38,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:0,q:"蝌蚪用（ ）呼吸，像鱼一样。",o:["鳃","肺","鼻子","鳍"],a:0,k:"蝌蚪用鳃",e:"解析：蝌蚪生活在水中，用鳃呼吸。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g3sci/frog.svg"},
{i:39,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:0,q:"蝌蚪先长出（ ），再长前肢。",o:["后腿","翅膀","羽毛","角"],a:0,k:"先长后腿",e:"解析：蝌蚪变态先长后腿，再长前肢、尾消失。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g3sci/frog.svg"},
{i:40,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:1,q:"蝌蚪变成成蛙的过程叫____发育。",o:[],a:"变态",k:"蛙也变态",e:"解析：蛙从蝌蚪到成蛙形态大变，也是变态发育。"},
{i:41,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:0,q:"成蛙主要用（ ）呼吸。",o:["肺和皮肤","鳃","鼻子","鳍"],a:0,k:"成蛙肺皮呼吸",e:"解析：成蛙用肺呼吸，皮肤也能辅助呼吸。"},
{i:42,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:0,q:"青蛙小时候在水里、长大能在陆地，属于（ ）。",o:["两栖动物","鱼类","鸟类","哺乳动物"],a:0,k:"两栖动物",e:"解析：青蛙幼体水生、成体水陆两栖，是两栖动物。"},
{i:43,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:1,q:"青蛙的一生经历卵、蝌蚪、幼蛙、____。",o:[],a:"成蛙",k:"蛙四阶段",e:"解析：青蛙生命周期为卵→蝌蚪→幼蛙→成蛙。"},
{i:44,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:0,q:"蝌蚪长有尾巴，用来（ ）。",o:["游泳","飞","跑","爬树"],a:0,k:"尾助游泳",e:"解析：蝌蚪靠尾巴摆动在水中游泳。"},
{i:45,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:0,q:"成蛙的运动方式是（ ）。",o:["跳跃和游泳","只飞","只爬","只走"],a:0,k:"蛙跳跃游泳",e:"解析：青蛙后腿发达，能跳能游。"},
{i:46,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:1,q:"青蛙是____（庄稼）的好朋友，吃田间害虫。",o:[],a:"庄稼",k:"蛙吃害虫",e:"解析：青蛙捕食害虫，保护庄稼，应爱护。"},
{i:47,c:"3sci-4",ch:"三上·动物（青蛙生命周期）",f:0,q:"下列和青蛙一样经历变态发育的是（ ）。",o:["蚕","鸡","牛","人"],a:0,k:"蚕也变态",e:"解析：蚕和蛙都经历明显变态；鸡牛人变化不大。"},
// ===== 第5章 三上·水（三态、沸腾、结冰） =====
{i:48,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:0,q:"水被加热到约100℃会（ ）。",o:["沸腾","结冰","凝固","消失"],a:0,k:"水沸腾",e:"解析：水到沸点（约100℃）剧烈汽化，叫沸腾。"},
{i:49,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:0,q:"水沸腾时大量变成（ ）。",o:["水蒸气","冰","石头","糖"],a:0,k:"沸腾变蒸汽",e:"解析：沸腾时水迅速变成水蒸气跑走。"},
{i:50,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:0,q:"水冷却到0℃会（ ）。",o:["结冰","沸腾","蒸发","变甜"],a:0,k:"水结冰",e:"解析：水温降到冰点结为固态冰。"},
{i:51,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:1,q:"水变成水蒸气散失到空气中，这种现象叫____。",o:[],a:"蒸发",k:"蒸发",e:"解析：常温下水面也会慢慢变成水蒸气，叫蒸发。"},
{i:52,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:0,q:"冰是水的（ ）状态。",o:["固态","液态","气态","金属态"],a:0,k:"冰是固态",e:"解析：冰是水的固体形态。"},
{i:53,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:0,q:"水蒸气遇冷会变成（ ）。",o:["小水滴（凝结）","火焰","石头","糖"],a:0,k:"凝结成水滴",e:"解析：水蒸气遇冷凝结成小水滴，如镜面水珠。"},
{i:54,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:0,q:"下列属于蒸发现象的是（ ）。",o:["湿衣服晾干","水结成冰","铁生锈","糖溶解"],a:0,k:"蒸发实例",e:"解析：湿衣变干是水蒸发的缘故。"},
{i:55,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:1,q:"水、冰、水蒸气是同一种物质的____种状态。",o:[],a:"三",k:"水的三态",e:"解析：同一物质水有固、液、气三种状态。"},
{i:56,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:0,q:"把水加热，会（ ）蒸发速度。",o:["加快","停止","变慢","不变"],a:0,k:"加热快蒸发",e:"解析：温度越高，水蒸发越快。"},
{i:57,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:0,q:"冬天湖面结冰，冰通常（ ）。",o:["浮在水面上","沉到湖底","消失","变热"],a:0,k:"冰浮水面",e:"解析：冰比水轻，所以浮在水面，保护水下生物。"},
{i:58,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:1,q:"水蒸气在高空遇冷凝结的小水滴聚在一起，变成天上的____。",o:[],a:"云",k:"云由水滴成",e:"解析：云是空中许多小水滴或小冰晶的集合。"},
{i:59,c:"3sci-5",ch:"三上·水（三态、沸腾、结冰）",f:0,q:"通常情况下，水的沸点是（ ）。",o:["100℃","0℃","50℃","200℃"],a:0,k:"沸点100℃",e:"解析：标准大气压下水的沸点约100℃。"},
// ===== 第6章 三上·空气（占据空间、质量、流动） =====
{i:60,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:0,q:"空气会（ ）。",o:["占据空间","没有体积","变成水","消失不见"],a:0,k:"空气占空间",e:"解析：空气虽然轻，但占据一定空间。"},
{i:61,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:0,q:"纸团塞在杯底，杯子倒扣压入水中纸不湿，说明（ ）。",o:["杯中空气占据了空间","水进满杯子","纸是干的没用","没有东西"],a:0,k:"证明占空间",e:"解析：空气占了杯子空间，水进不去，纸才不湿。"},
{i:62,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:0,q:"空气虽然很轻，但也有（ ）。",o:["质量（重量）","颜色","味道","固定形状"],a:0,k:"空气有质量",e:"解析：空气有质量，只是很小，大量空气就有明显重量。"},
{i:63,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:1,q:"用天平可以称出空气有____。",o:[],a:"质量",k:"空气有质量",e:"解析：充气气球比不充气重，证明空气有质量。"},
{i:64,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:0,q:"打气筒能把（ ）打进篮球里。",o:["空气","水","糖","沙子"],a:0,k:"打进空气",e:"解析：打气筒压缩空气打进球的内部。"},
{i:65,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:0,q:"空气流动就形成了（ ）。",o:["风","火","冰","电"],a:0,k:"风=空气流",e:"解析：空气从一个地方流向另一个地方就是风。"},
{i:66,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:0,q:"下列利用空气浮力升空的是（ ）。",o:["热气球","石头","铁块","沙袋"],a:0,k:"热气球用空气",e:"解析：热空气轻，热气球靠空气浮力上升。"},
{i:67,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:1,q:"空气虽然轻，但和我们一样受到地球的____（引力）。",o:[],a:"重力",k:"空气受重力",e:"解析：地球引力（重力）也作用于空气，所以大气包裹地球。"},
{i:68,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:0,q:"压缩空气具有（ ），如篮球、轮胎。",o:["弹性","会消失","重如铁","变固体"],a:0,k:"压缩空气有弹性",e:"解析：被压缩的空气有弹性，能支撑篮球、轮胎。"},
{i:69,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:0,q:"证明空气有质量，可以比较（ ）。",o:["充气的气球和不充气的气球","两块石头","两滴水","两张纸"],a:0,k:"对比证质量",e:"解析：一边放充气气球、一边放不充气的，天平会倾斜。"},
{i:70,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:1,q:"风车叶片转动，说明空气在____。",o:[],a:"流动",k:"风车证流动",e:"解析：空气流动推动风车转，说明空气在运动。"},
{i:71,c:"3sci-6",ch:"三上·空气（占据空间、质量、流动）",f:0,q:"空气对人类很重要，因为（ ）。",o:["要呼吸、助燃烧、流动成风","没用","有害","只是装饰"],a:0,k:"空气重要",e:"解析：人呼吸、火燃烧、风形成都离不开空气。"},
// ===== 第7章 三下·天气（气温、风向、云量） =====
{i:72,c:"3sci-7",ch:"三下·天气（气温、风向、云量）",f:0,q:"测量气温要用（ ），单位是摄氏度。",o:["温度计","尺子","天平","放大镜"],a:0,k:"气温用温度计",e:"解析：气温计（温度计）测空气冷热，单位℃。"},
{i:73,c:"3sci-7",ch:"三下·天气（气温、风向、云量）",f:1,q:"气温的单位是____（摄氏度）。",o:[],a:"摄氏度",k:"单位摄氏度",e:"解析：气温常用摄氏度（℃）表示高低。"},
{i:74,c:"3sci-7",ch:"三下·天气（气温、风向、云量）",f:0,q:"风向标箭头指向（ ）。",o:["风吹来的方向","风吹去的方向","温度高低","雨量多少"],a:0,k:"箭头指来向",e:"解析：风向标箭头指哪儿，风就从哪儿吹来。"},

{i:14,c:"3yw-2",ch:"三上·第2单元 金秋时节",f:0,q:"《赠刘景文》的作者是谁？",o:["苏轼","杜牧","李白","王维"],a:0,k:"古诗：赠刘景文",e:"解析：《赠刘景文》是宋代诗人苏轼写给朋友刘景文的，劝勉他珍惜好时光。"},
{i:15,c:"3yw-2",ch:"三上·第2单元 金秋时节",f:0,q:"《夜书所见》中“知有儿童挑促织”的“促织”指？",o:["蟋蟀（蛐蛐）","蝴蝶","蚂蚁","蜜蜂"],a:0,k:"古诗：夜书所见",e:"解析：《夜书所见》（叶绍翁）中“促织”是蟋蟀（蛐蛐），儿童夜里提着灯捉蟋蟀。"},
{i:16,c:"3yw-2",ch:"三上·第2单元 金秋时节",f:0,q:"《铺满金色巴掌的水泥道》中，“金色巴掌”指什么？",o:["法国梧桐的落叶","真的巴掌","枫叶","太阳"],a:0,k:"课文：铺满金色巴掌的水泥道",e:"解析：课文把法国梧桐的落叶比作“金色巴掌”，铺满水泥道，很美。"},
{i:17,c:"3yw-2",ch:"三上·第2单元 金秋时节",f:0,q:"《秋天的雨》中，秋天的雨被比作什么？",o:["一把钥匙（打开秋天的大门）","一把刀","一滴眼泪","一朵花"],a:0,k:"课文：秋天的雨",e:"解析：《秋天的雨》开头“秋天的雨，是一把钥匙”，轻轻打开秋天的大门，运用比喻。"},
{i:18,c:"3yw-2",ch:"三上·第2单元 金秋时节",f:1,q:"《山行》：停车坐爱枫林晚，霜叶红于二月____。",o:[],a:"花",k:"古诗：山行",e:"解析：原文“霜叶红于二月花”，填“花”。"},
{i:19,c:"3yw-2",ch:"三上·第2单元 金秋时节",f:0,q:"《秋天的雨》写了秋天的哪些方面？",o:["颜色、气味、声音（丰收景象）","只有冷","只有雨大","只有落叶"],a:0,k:"课文：秋天的雨",e:"解析：《秋天的雨》从秋雨带来的颜色（五彩缤纷）、好闻的气味（果实香）、吹起金色的喇叭（动物准备过冬）写秋天。"},
{i:20,c:"3yw-2",ch:"三上·第2单元 金秋时节",f:1,q:"《赠刘景文》：一年好景君须记，最是橙黄橘____时。",o:[],a:"绿",k:"古诗：赠刘景文",e:"解析：原文“最是橙黄橘绿时”，填“绿”。"},
{i:21,c:"3yw-2",ch:"三上·第2单元 金秋时节",f:0,q:"《赠刘景文》中“荷尽已无擎雨盖，菊残犹有傲霜枝”赞美了什么？",o:["菊花傲霜、品格坚强","荷花好","橘子甜","柳树美"],a:0,k:"古诗：赠刘景文",e:"解析：荷花谢了、菊花残了仍傲霜挺立，苏轼借景勉励朋友虽处逆境仍要乐观坚强。"},

{i:22,c:"3yw-3",ch:"三上·第3单元 童话世界",f:0,q:"《去年的树》中，小鸟答应树什么，第二年回来却找不到树了？",o:["唱歌给树听","送礼物","写信","搬走"],a:0,k:"课文：去年的树",e:"解析：《去年的树》写小鸟和树约定明年回来唱歌，树被砍做成火柴、灯火，小鸟对着灯火唱完歌，信守诺言。"},
{i:23,c:"3yw-3",ch:"三上·第3单元 童话世界",f:0,q:"《去年的树》告诉我们什么？",o:["要信守诺言、珍惜友谊","树不重要","鸟很笨","不用守信"],a:0,k:"课文：去年的树",e:"解析：小鸟历经艰辛找到树变成的灯火，唱起去年的歌，赞美信守诺言和真挚友谊。"},
{i:24,c:"3yw-3",ch:"三上·第3单元 童话世界",f:0,q:"《在牛肚子里旅行》中，红头被牛吃到肚子里，是谁救了它？",o:["青头（朋友）","蚂蚁","蝴蝶","小虫"],a:0,k:"课文：在牛肚子里旅行",e:"解析：《在牛肚子里旅行》写红头被牛吞下，朋友青头冷静指导它利用牛反刍（四个胃）的机会逃出来，体现友谊与科普知识。"},
{i:25,c:"3yw-3",ch:"三上·第3单元 童话世界",f:0,q:"《在牛肚子里旅行》中提到的科学知识是？",o:["牛有四个胃，会反刍","牛只有一个胃","牛不吃草","牛不会咀嚼"],a:0,k:"课文：在牛肚子里旅行",e:"解析：课文介绍牛有四个胃，吃草后先存着，休息时返回嘴里再嚼（反刍），红头借机从第二个胃回到嘴里逃出。"},
{i:26,c:"3yw-3",ch:"三上·第3单元 童话世界",f:0,q:"《那一定会很好》中，种子经历了哪些变化？",o:["树→手推车→椅子→木地板","花→草→树","鸟→鱼","石→山"],a:0,k:"课文：那一定会很好",e:"解析：《那一定会很好》写一粒种子不断梦想、变化：大树→手推车→椅子→木地板，每次都感到“那一定会很好”，体会奉献的快乐。"},
{i:27,c:"3yw-3",ch:"三上·第3单元 童话世界",f:0,q:"《一块奶酪》中，蚂蚁队长面对掉下的奶酪渣怎样做？",o:["不让自己吃，让最小的蚂蚁吃，以身作则","自己吃掉","扔掉","分给敌人"],a:0,k:"课文：一块奶酪",e:"解析：《一块奶酪》写蚂蚁队长发现奶酪渣，本想吃又忍住，命令最小的蚂蚁吃，以身作则，大家更听指挥。"},
{i:28,c:"3yw-3",ch:"三上·第3单元 童话世界",f:1,q:"《去年的树》：小鸟对着的灯____唱起了去年唱过的歌。",o:[],a:"火",k:"课文：去年的树",e:"解析：树被做成火柴点燃成灯火，小鸟“对着灯火唱起了去年唱过的歌”，填“火”。"},
{i:29,c:"3yw-3",ch:"三上·第3单元 童话世界",f:0,q:"《一块奶酪》表现了蚂蚁队长什么品质？",o:["纪律严明、以身作则","贪吃","胆小","自私"],a:0,k:"课文：一块奶酪",e:"解析：蚂蚁队长严于律己、不搞特殊，把奶酪渣让给小蚂蚁，赢得大家尊敬。"},
{i:30,c:"3yw-3",ch:"三上·第3单元 童话世界",f:1,q:"《在牛肚子里旅行》：牛有____个胃，吃草时先不细嚼。",o:[],a:"四",k:"课文：在牛肚子里旅行",e:"解析：牛有四个胃，会反刍，红头借此逃出，填“四”。"},
{i:31,c:"3yw-3",ch:"三上·第3单元 童话世界",f:0,q:"《那一定会很好》中，种子最后变成什么，觉得很舒服？",o:["木地板","大树","椅子","手推车"],a:0,k:"课文：那一定会很好",e:"解析：种子的最后一站是变成阳台上的木地板，舒展身子晒太阳，“那一定会很好”。"},

{i:32,c:"3yw-4",ch:"三上·第4单元 阅读策略·预测",f:0,q:"《总也倒不了的老屋》中，老屋为什么总也倒不了？",o:["它不断帮助小动物（小猫、老母鸡、小蜘蛛），被需要","很结实","没人推","被锁住"],a:0,k:"课文：总也倒不了的老屋",e:"解析：《总也倒不了的老屋》写老屋准备倒下，却一次次答应小猫避雨、老母鸡孵蛋、小蜘蛛织网，因为被需要而坚持站着，学习“预测”。"},
{i:33,c:"3yw-4",ch:"三上·第4单元 阅读策略·预测",f:0,q:"《总也倒不了的老屋》教给我们什么阅读方法？",o:["边读边预测，顺着情节猜想","只读不猜","先看结尾","跳过不读"],a:0,k:"课文：总也倒不了的老屋",e:"解析：这是预测策略单元课文，鼓励读者根据题目、插图、上文预测故事发展。"},
{i:34,c:"3yw-4",ch:"三上·第4单元 阅读策略·预测",f:0,q:"《胡萝卜先生的长胡子》中，胡萝卜先生的长胡子被用来做什么？",o:["放风筝的线、晾衣绳等（帮助别人）","没用","做绳子拴牛","做围巾"],a:0,k:"课文：胡萝卜先生的长胡子",e:"解析：胡萝卜先生漏刮的一根胡子越长越长，被男孩剪去做风筝线、被鸟太太做晾衣绳，帮助了别人。"},
{i:35,c:"3yw-4",ch:"三上·第4单元 阅读策略·预测",f:0,q:"《不会叫的狗》中，狗为了学会叫，跟谁学？",o:["小公鸡、杜鹃等","猫","牛","羊"],a:0,k:"课文：不会叫的狗",e:"解析：《不会叫的狗》写一只不会叫的狗向小公鸡学喔喔叫、向杜鹃学咕咕叫，引发一连串预测故事，结局开放。"},
{i:36,c:"3yw-4",ch:"三上·第4单元 阅读策略·预测",f:0,q:"预测故事时，我们可以根据什么来猜想？",o:["题目、插图、上下文线索","随便猜","只看图","不猜测"],a:0,k:"阅读策略：预测",e:"解析：预测不是乱猜，要根据文章的题目、插图、已读内容和生活经验合理猜想。"},
{i:37,c:"3yw-4",ch:"三上·第4单元 阅读策略·预测",f:0,q:"《总也倒不了的老屋》中，最后是谁让老屋一直没倒下？",o:["小蜘蛛（织网讲故事）","大风","工人","小猫"],a:0,k:"课文：总也倒不了的老屋",e:"解析：小猫、老母鸡走后，小蜘蛛来织网捉虫并给老屋讲故事，老屋至今还站在那儿。"},
{i:38,c:"3yw-4",ch:"三上·第4单元 阅读策略·预测",f:1,q:"《总也倒不了的老屋》：老屋低头看看，眼睛____成一条缝。",o:[],a:"眯",k:"课文：总也倒不了的老屋",e:"解析：原文“老屋低头看看，眼睛眯成一条缝”，填“眯”。"},
{i:39,c:"3yw-4",ch:"三上·第4单元 阅读策略·预测",f:0,q:"《胡萝卜先生的长胡子》说明了什么？",o:["看似麻烦的事也可能帮助别人、有用处","胡子没用","胡萝卜不能吃","狗最聪明"],a:0,k:"课文：胡萝卜先生的长胡子",e:"解析：漏刮的长胡子本是个小麻烦，却接连帮助了男孩和鸟太太，说明事物常有意想不到的用处。"},
{i:40,c:"3yw-4",ch:"三上·第4单元 阅读策略·预测",f:1,q:"《不会叫的狗》：狗跟着小公鸡，学起了____的叫声。",o:[],a:"喔喔",k:"课文：不会叫的狗",e:"解析：狗跟小公鸡学“喔喔”叫，填“喔喔”。"},
{i:41,c:"3yw-4",ch:"三上·第4单元 阅读策略·预测",f:0,q:"《不会叫的狗》的结尾有什么特点？",o:["开放结尾，让读者继续预测","已经写完","只有一种结局","没有结尾"],a:0,k:"阅读策略：预测",e:"解析：故事给出几种可能的结局，让读者自己选择并继续预测，是预测单元的开放设计。"},

{i:42,c:"3yw-5",ch:"三上·第5单元 留心观察",f:0,q:"《搭船的鸟》中，这只鸟是什么鸟？",o:["翠鸟","麻雀","燕子","鸽子"],a:0,k:"课文：搭船的鸟",e:"解析：《搭船的鸟》写一只彩色的小鸟站在船头，是翠鸟，作者观察它美丽的外形和捕鱼的敏捷动作。"},
{i:43,c:"3yw-5",ch:"三上·第5单元 留心观察",f:0,q:"《搭船的鸟》中，作者观察翠鸟抓住了什么？",o:["外形（彩色羽毛）和动作（冲进水里捕鱼）","只听叫声","只看书","没观察"],a:0,k:"课文：搭船的鸟",e:"解析：作者细致观察翠鸟：羽毛翠绿、翅膀蓝色（外形），以及“一下子冲进水里”捕鱼的敏捷动作。"},
{i:44,c:"3yw-5",ch:"三上·第5单元 留心观察",f:0,q:"《金色的草地》中，草地为什么是金色的？",o:["开满金黄的蒲公英花","种了金子","太阳照的","落叶"],a:0,k:"课文：金色的草地",e:"解析：《金色的草地》写窗前草地开满蒲公英，花儿张开时草地一片金黄。"},
{i:45,c:"3yw-5",ch:"三上·第5单元 留心观察",f:0,q:"《金色的草地》中，蒲公英的花张开和合拢，草地颜色怎样变化？",o:["张开时金色，合拢时变绿","一直金色","一直绿色","变红"],a:0,k:"课文：金色的草地",e:"解析：蒲公英花瓣张开时草地金黄，合拢时花瓣包住金色的花蕊，草地就变成绿色，体现细心观察的发现。"},
{i:46,c:"3yw-5",ch:"三上·第5单元 留心观察",f:0,q:"这两篇课文（搭船的鸟、金色的草地）都强调？",o:["留心观察周围事物","不要观察","只看书本","随便看"],a:0,k:"习作单元：观察",e:"解析：本单元是观察习作单元，两篇课文都教我们留心、细致地观察，才能发现事物的特点和变化。"},
{i:47,c:"3yw-5",ch:"三上·第5单元 留心观察",f:0,q:"《搭船的鸟》中，翠鸟捕鱼的动作给你什么感觉？",o:["又快又准（敏捷）","很慢","笨拙","不捕鱼"],a:0,k:"课文：搭船的鸟",e:"解析：翠鸟“一下子冲进水里，不见了。可是，没一会儿，它飞起来了，红色的长嘴衔着一条小鱼”，动作敏捷。"},
{i:48,c:"3yw-5",ch:"三上·第5单元 留心观察",f:1,q:"《搭船的鸟》：它的羽毛是____绿的，翅膀带着一些蓝色。",o:[],a:"翠",k:"课文：搭船的鸟",e:"解析：原文写翠鸟“羽毛是翠绿的，翅膀带着一些蓝色”，填“翠”。"},
{i:49,c:"3yw-5",ch:"三上·第5单元 留心观察",f:0,q:"《金色的草地》中，兄弟俩发现草地变色的秘密后心情怎样？",o:["开心、感到有趣","生气","害怕","无所谓"],a:0,k:"课文：金色的草地",e:"解析：兄弟俩通过观察发现蒲公英让草地变色，感到大自然真有趣，也明白了观察的重要。"},
{i:50,c:"3yw-5",ch:"三上·第5单元 留心观察",f:1,q:"《金色的草地》：蒲公英的花就像我们的手掌，可以张开、合____。",o:[],a:"拢",k:"课文：金色的草地",e:"解析：原文“蒲公英的花就像我们的手掌，可以张开、合上”，填“拢”（合拢）。"},
{i:51,c:"3yw-5",ch:"三上·第5单元 留心观察",f:0,q:"《金色的草地》中，蒲公英张开时草地是金色，合拢时草地变成？",o:["绿色","金色","红色","黄色"],a:0,k:"课文：金色的草地",e:"解析：花瓣合拢时金色花蕊被包住，草地显出绿色的叶子，变成绿色。"},

{i:52,c:"3yw-6",ch:"三上·第6单元 祖国河山",f:0,q:"《望天门山》的作者是谁？",o:["李白","杜甫","苏轼","刘禹锡"],a:0,k:"古诗：望天门山",e:"解析：《望天门山》是唐代诗人李白写的，写长江穿过天门山的壮景。"},
{i:53,c:"3yw-6",ch:"三上·第6单元 祖国河山",f:0,q:"《饮湖上初晴后雨》中“欲把西湖比西子”，把西湖比做什么？",o:["西施（美女）","月亮","镜子","玉盘"],a:0,k:"古诗：饮湖上初晴后雨",e:"解析：苏轼把西湖比作美人西施（西子），“淡妆浓抹总相宜”，说西湖晴雨都美。"},
{i:54,c:"3yw-6",ch:"三上·第6单元 祖国河山",f:0,q:"《饮湖上初晴后雨》的作者是谁？",o:["苏轼","李白","杜甫","白居易"],a:0,k:"古诗：饮湖上初晴后雨",e:"解析：这首诗是宋代诗人苏轼写的。"},
{i:55,c:"3yw-6",ch:"三上·第6单元 祖国河山",f:0,q:"《望洞庭》中“白银盘里一青螺”把什么比作青螺？",o:["君山（湖中的小山）","月亮","船","鱼"],a:0,k:"古诗：望洞庭",e:"解析：刘禹锡《望洞庭》把洞庭湖比作白银盘，湖中的君山比作青螺（螺蛳），写月下洞庭的宁静美。"},
{i:56,c:"3yw-6",ch:"三上·第6单元 祖国河山",f:0,q:"《富饶的西沙群岛》中，西沙群岛有什么特点？",o:["风景优美、物产丰富","荒凉","寒冷","没有鱼"],a:0,k:"课文：富饶的西沙群岛",e:"解析：课文写西沙群岛“风景优美，物产丰富”，海水五光十色，海里鱼多、鸟多。"},
{i:57,c:"3yw-6",ch:"三上·第6单元 祖国河山",f:0,q:"《美丽的小兴安岭》按什么顺序写小兴安岭的四季？",o:["春、夏、秋、冬","冬、秋、夏、春","只写春天","只写冬天"],a:0,k:"课文：美丽的小兴安岭",e:"解析：课文按春、夏、秋、冬的顺序写小兴安岭一年四季的美丽景色和丰富物产。"},
{i:58,c:"3yw-6",ch:"三上·第6单元 祖国河山",f:1,q:"《望天门山》：天门中断楚江开，碧水东流至此____。",o:[],a:"回",k:"古诗：望天门山",e:"解析：原文“碧水东流至此回”，写江水到此回旋，填“回”。"},
{i:59,c:"3yw-6",ch:"三上·第6单元 祖国河山",f:0,q:"《海滨小城》写了哪里的景象？",o:["海边小城的美丽整洁","高山","沙漠","草原"],a:0,k:"课文：海滨小城",e:"解析：《海滨小城》写一座靠海小城的大海、沙滩、庭院、公园、街道，美丽又整洁。"},
{i:60,c:"3yw-6",ch:"三上·第6单元 祖国河山",f:1,q:"《饮湖上初晴后雨》：水光潋滟晴方好，山色空____雨亦奇。",o:[],a:"蒙",k:"古诗：饮湖上初晴后雨",e:"解析：原文“山色空蒙雨亦奇”，填“蒙”。"},
{i:61,c:"3yw-6",ch:"三上·第6单元 祖国河山",f:0,q:"《富饶的西沙群岛》中，海水为什么五光十色？",o:["海底地形不同，深浅不一，阳光折射","鱼多","有宝石","天晴"],a:0,k:"课文：富饶的西沙群岛",e:"解析：海水五光十色是因为海底有高有低、海水深浅不同，阳光照射反射出不同颜色。"},

{i:62,c:"3yw-7",ch:"三上·第7单元 我与自然",f:0,q:"《大自然的声音》中，谁被比作“音乐家”？",o:["风、水、动物","只有人","只有风","只有雨"],a:0,k:"课文：大自然的声音",e:"解析：《大自然的声音》写风、水、动物都是大自然的音乐家：风演奏手风琴，水玩打击乐，动物唱歌。"},
{i:63,c:"3yw-7",ch:"三上·第7单元 我与自然",f:0,q:"《大自然的声音》中，风是怎样“演奏”的？",o:["吹过不同树叶发出不同声音（像手风琴）","弹钢琴","敲鼓","唱歌"],a:0,k:"课文：大自然的声音",e:"解析：微风拂过轻轻柔柔，狂风刮过充满力量，风“翻动树叶”像手风琴一样演奏。"},
{i:64,c:"3yw-7",ch:"三上·第7单元 我与自然",f:0,q:"《父亲、树林和鸟》中，父亲为什么能很快发现树林里有鸟？",o:["他十分了解鸟，爱鸟","他眼睛特别亮","他听见人说话","他看见了鸟窝"],a:0,k:"课文：父亲、树林和鸟",e:"解析：父亲熟悉鸟的生活习性，能从树叶动、气味等判断有鸟，体现他对鸟的喜爱和了解。"},
{i:65,c:"3yw-7",ch:"三上·第7单元 我与自然",f:0,q:"《父亲、树林和鸟》表达了什么？",o:["人对鸟的喜爱与保护","讨厌鸟","吃鸟","怕鸟"],a:0,k:"课文：父亲、树林和鸟",e:"解析：父亲懂鸟、爱鸟，“我真高兴，父亲不是猎人”，表达爱护鸟类、与自然和谐相处。"},
{i:66,c:"3yw-7",ch:"三上·第7单元 我与自然",f:0,q:"《带刺的朋友》中，“带刺的朋友”指谁？",o:["刺猬","猫","狗","兔"],a:0,k:"课文：带刺的朋友",e:"解析：《带刺的朋友》写一只刺猬夜里偷枣，作者亲切称它“带刺的朋友”，观察它怎样运枣。"},
{i:67,c:"3yw-7",ch:"三上·第7单元 我与自然",f:0,q:"《带刺的朋友》中，刺猬偷枣的过程是怎样的？",o:["爬树、摇枣、扎枣、滚走","直接捡","用篮子装","等人给"],a:0,k:"课文：带刺的朋友",e:"解析：刺猬偷枣：爬上树→用爪摇枣→从树上掉下→把枣扎在背上→驮着跑走，可爱又聪明。"},
{i:68,c:"3yw-7",ch:"三上·第7单元 我与自然",f:1,q:"《大自然的声音》：风，是大自然的音乐家，他会在森林里____奏他的手风琴。",o:[],a:"演",k:"课文：大自然的声音",e:"解析：原文“他会在森林里演奏他的手风琴”，填“演”。"},
{i:69,c:"3yw-7",ch:"三上·第7单元 我与自然",f:0,q:"《带刺的朋友》表达了作者怎样的态度？",o:["喜爱、觉得刺猬可爱","讨厌","害怕","想抓它"],a:0,k:"课文：带刺的朋友",e:"解析：作者把刺猬当“朋友”，细致观察它偷枣，字里行间充满喜爱。"},
{i:70,c:"3yw-7",ch:"三上·第7单元 我与自然",f:1,q:"《父亲、树林和鸟》：父亲突然____下脚步，朝幽深的树林望了望。",o:[],a:"站",k:"课文：父亲、树林和鸟",e:"解析：原文“父亲突然站定”（停下脚步）望树林，发现有鸟，填“站”。"},
{i:71,c:"3yw-7",ch:"三上·第7单元 我与自然",f:0,q:"《大自然的声音》中，动物们怎样“唱”？",o:["鸟叫、虫鸣、蝈蝈唱等，像在开演唱会","不发声","只风声","只水声"],a:0,k:"课文：大自然的声音",e:"解析：课文写树上鸟叫、空中虫鸣、蝈蝈唱，动物们是大自然的歌手，一起开“音乐会”。"},

{i:72,c:"3yw-8",ch:"三上·第8单元 美好品质",f:0,q:"《司马光》中，伙伴掉进水缸，司马光怎样救他？",o:["用石头砸破缸，水流出来","跑去找人","跳进去","不管"],a:0,k:"课文：司马光",e:"解析：“群儿戏于庭，一儿登瓮，足跌没水中”，司马光“持石击瓮破之”，水流出来，孩子得救，表现机智。"},
{i:73,c:"3yw-8",ch:"三上·第8单元 美好品质",f:0,q:"《司马光》中“持石击瓮破之”的“瓮”指？",o:["大缸（水缸）","碗","杯子","盆"],a:0,k:"课文：司马光",e:"解析：“瓮”是大肚子的陶制容器（水缸），小孩掉进去，司马光砸破它救人。"},
{i:74,c:"3yw-8",ch:"三上·第8单元 美好品质",f:0,q:"《掌声》中，同学们为什么给英子掌声？",o:["鼓励她、赞美她的故事好","嘲笑她","让她坐下","批评她"],a:0,k:"课文：掌声",e:"解析：《掌声》写腿有残疾的英子起初自卑，上台讲故事时同学鼓掌鼓励，讲完后再次鼓掌赞美，掌声让她变得自信。"},
{i:75,c:"3yw-8",ch:"三上·第8单元 美好品质",f:0,q:"《掌声》告诉我们？",o:["掌声能给人鼓励和自信","掌声没用","不要鼓掌","嘲笑别人"],a:0,k:"课文：掌声",e:"解析：同学两次掌声让英子感受到关爱，从此开朗，说明真诚的掌声能鼓励、温暖别人。"},
{i:76,c:"3yw-8",ch:"三上·第8单元 美好品质",f:0,q:"《灰雀》中，列宁发现灰雀不见了，是怎么做的？",o:["循循善诱，让男孩主动放回灰雀","直接骂男孩","报告警察","不管"],a:0,k:"课文：灰雀",e:"解析：《灰雀》写列宁发现灰雀被男孩捉走，没有直接批评，而是用温和的话让男孩自己觉悟，放回灰雀，体现对儿童的尊重与智慧。"},
{i:77,c:"3yw-8",ch:"三上·第8单元 美好品质",f:0,q:"《手术台就是阵地》中，白求恩在什么情况下坚持手术？",o:["炮火纷飞的战场上，坚守阵地似的做手术","在平静医院","在家里","在船上"],a:0,k:"课文：手术台就是阵地",e:"解析：《手术台就是阵地》写加拿大医生白求恩在抗日战争前线，炮火中连续做手术，把手术台当阵地，表现国际主义精神。"},
{i:78,c:"3yw-8",ch:"三上·第8单元 美好品质",f:1,q:"《司马光》：群儿戏于____，一儿登瓮，足跌没水中。",o:[],a:"庭",k:"课文：司马光",e:"解析：原文“群儿戏于庭”（孩子们在庭院里玩），填“庭”。"},
{i:79,c:"3yw-8",ch:"三上·第8单元 美好品质",f:0,q:"《灰雀》中，男孩最后怎样对待灰雀？",o:["把它送回白桦树上","藏起来","放走不管","吃掉"],a:0,k:"课文：灰雀",e:"解析：男孩被列宁的话触动，第二天把灰雀送回树上，列宁高兴地没再追问，保护了男孩的自尊。"},
{i:80,c:"3yw-8",ch:"三上·第8单元 美好品质",f:1,q:"《掌声》：英子犹豫了一会儿，慢吞吞地____到了讲台上。",o:[],a:"站",k:"课文：掌声",e:"解析：原文“英子犹豫了一会儿，慢吞吞地站了起来，眼圈红红的”走上讲台，填“站”。"},
{i:81,c:"3yw-8",ch:"三上·第8单元 美好品质",f:0,q:"《手术台就是阵地》表现了白求恩什么精神？",o:["不顾个人安危、对工作极端负责","怕死","随便做","想回国"],a:0,k:"课文：手术台就是阵地",e:"解析：敌机轰炸、师卫生部长劝撤，白求恩坚持“手术台就是阵地”，连续工作，表现无私奉献、极端负责。"},

{i:82,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:0,q:"《绝句》（迟日江山丽）的作者是谁？",o:["杜甫","李白","苏轼","朱熹"],a:0,k:"古诗：绝句",e:"解析：“迟日江山丽，春风花草香”是唐代诗人杜甫的《绝句》，写春日美景。"},
{i:83,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:0,q:"《惠崇春江晚景》中“春江水暖鸭先知”说明什么？",o:["鸭子最先感到江水变暖，春天来了","鱼先知","人先知","风先知"],a:0,k:"课文：惠崇春江晚景",e:"解析：苏轼题画诗，写鸭子下水嬉戏最先察觉江水回暖，点出早春气息。"},
{i:84,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:0,q:"《三衢道中》的作者是谁？",o:["曾几","杜甫","李白","苏轼"],a:0,k:"古诗：三衢道中",e:"解析：《三衢道中》是宋代诗人曾几写的，写夏日山行。"},
{i:85,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:0,q:"《燕子》中，燕子的尾巴被比作什么？",o:["剪刀","扇子","月亮","叶子"],a:0,k:"课文：燕子",e:"解析：郑振铎《燕子》写“尾巴似剪刀”，用比喻写燕子外形轻快灵活。"},
{i:86,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:0,q:"《荷花》中，荷叶被比作什么？",o:["碧绿的大圆盘","雨伞","镜子","扇子"],a:0,k:"课文：荷花",e:"解析：叶圣陶《荷花》写“荷叶挨挨挤挤的，像一个个碧绿的大圆盘”，用比喻写荷叶多而圆。"},
{i:87,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:0,q:"《守株待兔》中，农夫为什么被嘲笑？",o:["妄想不劳而获，守着树桩等兔","勤劳","聪明","种得好"],a:0,k:"寓言：守株待兔",e:"解析：农夫偶然捡到撞死的兔，便放下农活守株等兔，结果田地荒了也没再得到兔，讽刺妄想不劳而获。"},
{i:88,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:0,q:"《陶罐和铁罐》中，最后怎样？",o:["陶罐完好，铁罐氧化消失了","铁罐完好，陶罐碎了","都完好","都碎了"],a:0,k:"课文：陶罐和铁罐",e:"解析：铁罐骄傲奚落陶罐，多年后陶罐被挖出仍光亮，铁罐却氧化无影无踪，说明骄傲必败、各有长短。"},
{i:89,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:1,q:"《绝句》：泥融飞燕子，沙暖睡____。",o:[],a:"鸳鸯",k:"古诗：绝句",e:"解析：原文“沙暖睡鸳鸯”，填“鸳鸯”。"},
{i:90,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:0,q:"《鹿角和鹿腿》中，鹿最后明白什么？",o:["美丽的角差点儿害命，难看的腿救了命，各有所长","角最有用","腿最没用","外表最重要"],a:0,k:"课文：鹿角和鹿腿",e:"解析：鹿嫌腿丑、爱角美，遇狮时角被树枝挂住险丧命，靠腿逃脱，明白不能只看外表，各有长处短处。"},
{i:91,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:1,q:"《守株待兔》：兔走触____，折颈而死。",o:[],a:"株",k:"寓言：守株待兔",e:"解析：原文“兔走触株，折颈而死”，“株”是树桩，填“株”。"},
{i:92,c:"3yw-9",ch:"三下·第1-2单元 生灵与寓言",f:0,q:"《惠崇春江晚景》中，除了鸭，还写了哪种植物报春？",o:["蒌蒿、芦芽","荷花","菊花","梅花"],a:0,k:"古诗：惠崇春江晚景",e:"解析：诗写“蒌蒿满地芦芽短，正是河豚欲上时”，蒌蒿、芦芽是早春植物。"},

{i:93,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:0,q:"《元日》写的是哪个节日？",o:["春节（正月初一）","中秋","端午","重阳"],a:0,k:"古诗：元日",e:"解析：王安石《元日》写“爆竹声中一岁除”，是春节（农历正月初一），有放鞭炮、喝屠苏酒、换桃符习俗。"},
{i:94,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:0,q:"《元日》中“总把新桃换旧符”指的是什么习俗？",o:["换桃符（春联前身）","吃月饼","赛龙舟","登高"],a:0,k:"古诗：元日",e:"解析：“新桃换旧符”指换桃符，是古代春节在门上挂桃木板驱邪，后来演变成贴春联。"},
{i:95,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:0,q:"《清明》的作者是谁？",o:["杜牧","杜甫","李白","王维"],a:0,k:"古诗：清明",e:"解析：《清明》是唐代诗人杜牧写的：“清明时节雨纷纷，路上行人欲断魂。”"},
{i:96,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:0,q:"《九月九日忆山东兄弟》写的是哪个节日？",o:["重阳节","春节","中秋","端午"],a:0,k:"古诗：九月九日忆山东兄弟",e:"解析：王维写重阳佳节思念亲人，“独在异乡为异客，每逢佳节倍思亲”，重阳有登高、插茱萸习俗。"},
{i:97,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:0,q:"《纸的发明》中，改进造纸术、让纸好用又便宜的是谁？",o:["蔡伦","毕昇","张衡","祖冲之"],a:0,k:"课文：纸的发明",e:"解析：西汉有纸，东汉蔡伦改进造纸术，用树皮、破布等原料造出轻便便宜的纸，流传世界。"},
{i:98,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:0,q:"《赵州桥》的建造者是谁，是什么桥？",o:["李春建造的石拱桥","鲁班建的木桥","蔡伦建的","李白建的"],a:0,k:"课文：赵州桥",e:"解析：《赵州桥》写隋朝李春设计并建造的赵州桥，是一座世界闻名的石拱桥，距今一千四百多年。"},
{i:99,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:1,q:"《元日》：千门万户曈曈日，总把新桃换旧____。",o:[],a:"符",k:"古诗：元日",e:"解析：原文“总把新桃换旧符”，填“符”。"},
{i:100,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:0,q:"《清明》中“借问酒家何处有”，牧童怎么回答？",o:["遥指杏花村","说不知道","指天上","不理他"],a:0,k:"古诗：清明",e:"解析：“借问酒家何处有，牧童遥指杏花村”，牧童远远指向杏花村。"},
{i:101,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:1,q:"《九月九日忆山东兄弟》：独在异乡为异客，每逢佳____倍思亲。",o:[],a:"节",k:"古诗：九月九日忆山东兄弟",e:"解析：原文“每逢佳节倍思亲”，填“节”。"},
{i:102,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:0,q:"《赵州桥》的设计有什么特点？",o:["没有桥墩，一个大拱加小拱，既减轻重量又防洪","有很多桥墩","是木的","很小"],a:0,k:"课文：赵州桥",e:"解析：赵州桥大桥洞两边各有两个小桥洞，既减轻重量、节省石料，又能在发大水时分流，设计科学。"},
{i:103,c:"3yw-10",ch:"三下·第3单元 中华优秀传统文化",f:0,q:"《纸的发明》说明了什么？",o:["中国古代造纸术对世界文明的贡献","纸是美国发明","蔡伦发明纸","纸没用"],a:0,k:"课文：纸的发明",e:"解析：蔡伦改进的造纸术传到世界各地，极大促进了文化传播，是中国古代四大发明之一。"},

{i:104,c:"3yw-11",ch:"三下·第4单元 观察与发现",f:0,q:"《花钟》中，“花钟”指什么？",o:["不同花在不同时间开放，可看成钟","用花做的钟","钟表店","种花的地方"],a:0,k:"课文：花钟",e:"解析：《花钟》写不同的花在一天中不同时间开放（如牵牛花清晨开、午时花中午开），把花开放的时间连起来就像钟。"},
{i:105,c:"3yw-11",ch:"三下·第4单元 观察与发现",f:0,q:"《蜜蜂》中，法布尔做实验想证明什么？",o:["蜜蜂能辨认方向，靠本能回家","蜜蜂会说话","蜜蜂怕光","蜜蜂不采蜜"],a:0,k:"课文：蜜蜂",e:"解析：法布尔做实验：带蜜蜂到远处放掉，看它们能否回家，证明蜜蜂有辨认方向的能力（本能），体现科学观察精神。"},
{i:106,c:"3yw-11",ch:"三下·第4单元 观察与发现",f:0,q:"《蜜蜂》的作者是谁？",o:["法布尔（法国昆虫学家）","达尔文","牛顿","爱迪生"],a:0,k:"课文：蜜蜂",e:"解析：《蜜蜂》节选自法国昆虫学家法布尔的《昆虫记》。"},
{i:107,c:"3yw-11",ch:"三下·第4单元 观察与发现",f:0,q:"《小虾》中，作者观察小虾的什么很有趣？",o:["吃东西、打架、睡觉的样子","只观察颜色","不观察","只数数量"],a:0,k:"课文：小虾",e:"解析：《小虾》细致观察小虾的外形、吃食、打架、休息的样子，体现留心观察。"},
{i:108,c:"3yw-11",ch:"三下·第4单元 观察与发现",f:0,q:"《花钟》告诉我们不同花开放时间不同的原因？",o:["与温度、湿度、光照等有关系","随机的","看心情","没有原因"],a:0,k:"课文：花钟",e:"解析：课文说明植物开花时间不同，与温度、湿度、光照及昆虫活动等有关。"},
{i:109,c:"3yw-11",ch:"三下·第4单元 观察与发现",f:0,q:"《蜜蜂》中，法布尔的实验体现了什么态度？",o:["严谨、求实的科学精神","随便猜","不验证","听别人说"],a:0,k:"课文：蜜蜂",e:"解析：法布尔认真设计实验、记录结果、得出结论，体现实事求是、严谨的科学态度。"},
{i:110,c:"3yw-11",ch:"三下·第4单元 观察与发现",f:1,q:"《花钟》：凌晨四点，牵牛花吹起了紫色的____。",o:[],a:"小喇叭",k:"课文：花钟",e:"解析：原文“凌晨四点，牵牛花吹起了紫色的小喇叭”，填“小喇叭”。"},
{i:111,c:"3yw-11",ch:"三下·第4单元 观察与发现",f:0,q:"《小虾》中，小虾生气或打架时样子怎样？",o:["钳子一张一张，胡须翘，眼突","很安静","睡觉","不动"],a:0,k:"课文：小虾",e:"解析：小虾打架时“钳子一张一张的，胡须也翘起来，连眼珠子也突出来”，活泼有趣。"},
{i:112,c:"3yw-11",ch:"三下·第4单元 观察与发现",f:1,q:"《蜜蜂》：蜜蜂靠的不是超常的记忆力，而是一种我无法解释的____。",o:[],a:"本能",k:"课文：蜜蜂",e:"解析：法布尔得出结论“蜜蜂靠的不是超常的记忆力，而是一种我无法解释的本能”，填“本能”。"},
{i:113,c:"3yw-11",ch:"三下·第4单元 观察与发现",f:0,q:"《蜜蜂》实验的结果是？",o:["大部分蜜蜂准确飞回，证明能辨认方向","全迷路","都没回","飞到别处"],a:0,k:"课文：蜜蜂",e:"解析：法布尔放出的蜜蜂，大部分准确飞回蜂窝，证明蜜蜂有辨认方向的本能。"},

{i:114,c:"3yw-12",ch:"三年级·语文知识与修辞",f:0,q:"下面哪句是比喻句？",o:["荷叶像一个个碧绿的大圆盘","他像他爸爸","小明和小红一样高","今天像昨天"],a:0,k:"修辞：比喻",e:"解析：比喻要有本体、喻体和相似点，“荷叶像大圆盘”把荷叶比作圆盘；“他像爸爸”是比较不是比喻。"},
{i:115,c:"3yw-12",ch:"三年级·语文知识与修辞",f:0,q:"下面哪句是拟人句？",o:["花朵在雨中跳舞","月亮像玉盘","他跑得像风","树很高"],a:0,k:"修辞：拟人",e:"解析：拟人把物当人写，“花朵在雨中跳舞”给花赋予人的动作；“月亮像玉盘”是比喻。"},
{i:116,c:"3yw-12",ch:"三年级·语文知识与修辞",f:0,q:"“秋天的雨，是一把钥匙”运用的修辞是？",o:["比喻","拟人","夸张","排比"],a:0,k:"修辞：比喻",e:"解析：把“秋天的雨”比作“钥匙”，是比喻。"},
{i:117,c:"3yw-12",ch:"三年级·语文知识与修辞",f:0,q:"下面词语中，和“看”有关的是？",o:["注视、仰望、俯视","奔跑、跳跃","吃饭、喝水","高兴、难过"],a:0,k:"词语辨析",e:"解析：注视、仰望、俯视都表示“看”的不同方式；其余组不是。"},
{i:118,c:"3yw-12",ch:"三年级·语文知识与修辞",f:0,q:"“的、地、得”的用法，正确的是？",o:["美丽（的）花朵、开心（地）笑、跑（得）快","美丽的笑、开心地花、跑得的快","都一样","随便用"],a:0,k:"字词：的得地",e:"解析：“的”后接名词（美丽的花），“地”后接动词（开心地笑），“得”后接补语（跑得快）。"},
{i:119,c:"3yw-12",ch:"三年级·语文知识与修辞",f:0,q:"下面哪组是反义词？",o:["谦虚——骄傲","高大——高大","快乐——快乐","认真——仔细"],a:0,k:"词语：反义词",e:"解析：谦虚和骄傲意思相反，是反义词；“认真——仔细”是近义词。"},
{i:120,c:"3yw-12",ch:"三年级·语文知识与修辞",f:1,q:"修辞填空：红红的枫叶像一枚枚邮____。",o:[],a:"票",k:"修辞：比喻",e:"解析：《秋天的雨》“红红的枫叶像一枚枚邮票”，把枫叶比作邮票，填“票”。"},
{i:121,c:"3yw-12",ch:"三年级·语文知识与修辞",f:0,q:"阅读一段话要找出中心意思，可以看？",o:["关键语句（如开头、结尾的总起句）","随便一句","只看图","最后一行"],a:0,k:"阅读：找中心句",e:"解析：一段话常有关键语句（总起句、总结句）点明中心，阅读时要抓住它理解段落意思。"},
{i:122,c:"3yw-12",ch:"三年级·语文知识与修辞",f:1,q:"修辞填空：松柏穿上厚厚的、油亮亮的____裳。",o:[],a:"衣",k:"修辞：拟人",e:"解析：《秋天的雨》“松柏穿上厚厚的、油亮亮的衣裳”，用拟人，填“衣”（衣裳）。"},
{i:123,c:"3yw-12",ch:"三年级·语文知识与修辞",f:0,q:"“美丽的小兴安岭”中“的”用在什么词前面？",o:["名词（美丽的小兴安岭）","动词","形容词","副词"],a:0,k:"字词：的得地",e:"解析：“的”用在形容词和名词之间，“美丽的”修饰名词“小兴安岭”。"},
{i:124,c:"3yw-12",ch:"三年级·语文知识与修辞",f:0,q:"下面哪个句子没有运用拟人？",o:["太阳像个大火球","小鸟在枝头歌唱","小草从土里探出头","花儿向我们点头"],a:0,k:"修辞：拟人",e:"解析：“太阳像个大火球”是比喻；其余把小鸟、小草、花儿当人写，是拟人。"}
);

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>惠州小学每日练</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:#f2f6f4; color:#2f3b34; font-size:18px;
    -webkit-font-smoothing:antialiased;
  }
  .app { max-width:560px; margin:0 auto; min-height:100%; padding:18px 16px 40px; }
  .hidden { display:none !important; }

  /* 顶部 */
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .topbar .logo { font-size:22px; font-weight:800; color:#2f7d5d; }
  .topbar .sub { font-size:13px; color:#7b8a80; margin-top:2px; }
  .flower-badge {
    background:#fff; border:2px solid #f3c74f; color:#b8860b;
    padding:6px 14px; border-radius:999px; font-size:16px; font-weight:700;
    display:flex; align-items:center; gap:6px;
  }
  .flower-badge .icon { font-size:20px; }

  /* 年级选择 */
  .grade-tabs { display:flex; gap:6px; margin-bottom:14px; }
  .grade-tab {
    flex:1; text-align:center; padding:10px 0; border-radius:12px;
    background:#fff; font-weight:800; font-size:15px; cursor:pointer;
    border:2px solid transparent; color:#7b8a80;
    box-shadow:0 2px 8px rgba(47,61,52,.05);
  }
  .grade-tab.active { background:#2f7d5d; color:#fff; }

  /* 卡片 */
  .card {
    background:#fff; border-radius:18px; padding:18px;
    box-shadow:0 2px 10px rgba(47,61,52,.06);
    margin-bottom:14px;
  }

  /* 今日进度 */
  .today-line { font-size:17px; font-weight:700; color:#2f3b34; margin-bottom:4px; }
  .today-progress { display:flex; gap:8px; margin-top:10px; }
  .tseg { flex:1; height:12px; border-radius:8px; background:#e6ece8; overflow:hidden; }
  .tseg.done { background:#2f7d5d; }

  /* 三科/四科卡片 */
  .subjects { display:flex; flex-direction:column; gap:12px; }
  .subj-card {
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:18px; padding:18px 20px; cursor:pointer;
    border:2px solid transparent; box-shadow:0 2px 10px rgba(47,61,52,.06);
    transition:transform .08s ease;
  }
  .subj-card:active { transform:scale(.98); }
  .subj-left { display:flex; align-items:center; gap:14px; }
  .subj-icon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff; font-weight:800; }
  .yw .subj-icon { background:#e88a6a; }
  .sx .subj-icon { background:#4a90d9; }
  .en .subj-icon { background:#58a97c; }
  .sci .subj-icon { background:#c77fd6; }
  .subj-name { font-size:20px; font-weight:800; }
  .subj-desc { font-size:13px; color:#8a978e; margin-top:2px; }
  .subj-state {
    font-size:14px; font-weight:700; padding:5px 12px; border-radius:999px;
    background:#eef2ef; color:#7b8a80;
  }
  .subj-state.done { background:#dff0e6; color:#2f7d5d; }
  .subj-state.empty { background:#f4f4f4; color:#b3bcb5; }

  /* 日历 */
  .cal-title { font-size:17px; font-weight:800; margin-bottom:10px; color:#2f3b34; }
  .cal-week { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:13px; color:#8a978e; margin-bottom:6px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell {
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:10px; font-size:15px; color:#2f3b34; position:relative;
  }
  .cal-cell.empty { visibility:hidden; }
  .cal-cell.today { background:#2f7d5d; color:#fff; font-weight:800; }
  .cal-cell.checked { background:#dff0e6; color:#2f7d5d; font-weight:700; }
  .cal-cell.today.checked { background:#2f7d5d; color:#fff; }
  .cal-cell.checked::after {
    content:""; position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    width:6px; height:6px; border-radius:50%; background:#f3c74f;
  }
  .cal-cell.today.checked::after { background:#f3c74f; }

  /* 鼓励语 */
  .cheer {
    background:linear-gradient(135deg,#fff6e0,#fff); border:2px solid #f3c74f;
    border-radius:16px; padding:14px 18px; font-size:17px; font-weight:800; color:#b8860b;
    text-align:center;
  }

  /* 章节页 */
  .page-title { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .back-btn {
    background:#fff; border:none; border-radius:12px; padding:8px 14px;
    font-size:15px; font-weight:700; color:#2f7d5d; cursor:pointer;
    box-shadow:0 2px 8px rgba(47,61,52,.08);
  }
  .page-title h1 { font-size:20px; font-weight:800; }
  .part-label { font-size:15px; font-weight:800; color:#2f7d5d; margin:14px 2px 8px; }
  .chapter-list { display:flex; flex-direction:column; gap:8px; }
  .chapter-item {
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:14px; padding:14px 16px; cursor:pointer;
    box-shadow:0 2px 8px rgba(47,61,52,.05);
  }
  .chapter-item:active { transform:scale(.98); }
  .chapter-name { font-size:16px; font-weight:700; }
  .chapter-badge {
    font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .badge-new { background:#eef2ef; color:#7b8a80; }
  .badge-ing { background:#e8f1fb; color:#2f6fb8; }
  .badge-ok { background:#dff0e6; color:#2f7d5d; }

  /* 做题页 */
  .quiz-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .quiz-progress { font-size:15px; font-weight:700; color:#7b8a80; }
  .progress-track { height:10px; background:#e6ece8; border-radius:8px; overflow:hidden; margin-bottom:16px; }
  .progress-fill { height:100%; background:#2f7d5d; border-radius:8px; transition:width .2s ease; }
  .quiz-card { background:#fff; border-radius:18px; padding:22px 20px; box-shadow:0 2px 10px rgba(47,61,52,.06); }
  .quiz-chapter { font-size:13px; color:#8a978e; margin-bottom:8px; }
  .quiz-img { width:100%; max-width:300px; margin:0 auto 16px; display:block; border-radius:12px; background:#fff; border:1px solid #e3eae6; }
  .quiz-q { font-size:19px; font-weight:700; line-height:1.6; margin-bottom:18px; }
  .option {
    display:block; width:100%; text-align:left;
    background:#f6f9f7; border:2px solid #e3eae6; border-radius:14px;
    padding:14px 16px; margin-bottom:10px; font-size:17px; color:#2f3b34; cursor:pointer;
    transition:border-color .1s, background .1s;
  }
  .option.correct { background:#dff0e6; border-color:#2f7d5d; color:#2f7d5d; font-weight:700; }
  .option.wrong { background:#fdeaea; border-color:#d95555; color:#d95555; }
  .option.disabled { pointer-events:none; }
  .fill-box { display:flex; gap:10px; margin-bottom:14px; }
  .fill-input {
    flex:1; font-size:19px; padding:13px 14px; border:2px solid #e3eae6; border-radius:12px;
    outline:none; color:#2f3b34; background:#f6f9f7;
  }
  .fill-input:focus { border-color:#2f7d5d; }
  .btn {
    background:#2f7d5d; color:#fff; border:none; border-radius:14px;
    padding:14px 20px; font-size:18px; font-weight:800; cursor:pointer; width:100%;
  }
  .btn:active { transform:scale(.98); }
  .btn.secondary { background:#eef2ef; color:#2f3b34; }
  .btn.gray { background:#cfd8d2; color:#2f3b34; }
  .feedback { margin-top:14px; padding:12px 14px; border-radius:12px; font-size:16px; font-weight:700; display:none; }
  .feedback.right { display:block; background:#dff0e6; color:#2f7d5d; }
  .feedback.wrong { display:block; background:#fdeaea; color:#d95555; }
  .explain { margin-top:12px; padding:14px 16px; border-radius:12px; background:#f0f4f9; border:1px solid #dde6ef; display:none; }
  .explain.show { display:block; }
  .ex-kp { font-size:14px; font-weight:800; color:#2f6fb8; margin-bottom:8px; line-height:1.6; }
  .ex-text { font-size:15px; color:#3d4a43; line-height:1.8; }

  /* 成绩单 */
  .result-wrap { text-align:center; padding-top:10px; }
  .result-score { font-size:52px; font-weight:900; color:#2f7d5d; line-height:1.1; }
  .result-label { font-size:16px; color:#7b8a80; margin-bottom:6px; }
  .result-flowers { font-size:22px; font-weight:800; color:#b8860b; margin:16px 0 4px; }
  .result-flowers .icon { font-size:26px; }
  .result-tip { font-size:15px; color:#8a978e; margin-bottom:22px; }
  .result-actions { display:flex; flex-direction:column; gap:10px; }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 主页 -->
  <div id="view-home">
    <div class="topbar">
      <div>
        <div class="logo">惠州小学每日练</div>
        <div class="sub">1~6 年级 · 语数英科四科</div>
      </div>
      <div class="flower-badge"><span class="icon">🌸</span><span id="flowerCount">0</span></div>
    </div>
    <div id="bankStatus" style="font-size:12px;color:#8a978e;margin:2px 2px 12px;">题库：加载中…</div>

    <div class="grade-tabs" id="gradeTabs"></div>

    <div class="card">
      <div class="today-line" id="todayLine">今天已练 0 科</div>
      <div class="today-progress" id="todayProgress"></div>
    </div>

    <div class="card subjects" id="subjectCards"></div>

    <div class="cheer hidden" id="cheer">🏆 坚持之星！继续加油！</div>

    <div class="card">
      <div class="cal-title" id="calTitle"></div>
      <div class="cal-week">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- 章节页 -->
  <div id="view-chapters" class="hidden">
    <div class="page-title">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <h1 id="chSubjectTitle"></h1>
    </div>
    <div id="chaptersBody"></div>
  </div>

  <!-- 做题页 -->
  <div id="view-quiz" class="hidden">
    <div class="page-title">
      <button class="back-btn" onclick="confirmQuit()">← 退出</button>
      <h1 id="quizSubjectTitle"></h1>
    </div>
    <div class="quiz-head"><span class="quiz-progress" id="quizProgress"></span></div>
    <div class="progress-track"><div class="progress-fill" id="quizFill"></div></div>
    <div class="quiz-card">
      <div class="quiz-chapter" id="quizChapter"></div>
      <div id="quizImg"></div>
      <div class="quiz-q" id="quizQ"></div>
      <div id="quizBody"></div>
      <div class="feedback" id="quizFeedback"></div>
      <div class="explain" id="quizExplain">
        <div class="ex-kp" id="exKp"></div>
        <div class="ex-text" id="exText"></div>
      </div>
      <button class="btn gray hidden" id="quizNext" onclick="nextQuestion()">下一题 →</button>
      <button class="btn hidden" id="quizFinish" onclick="finishQuiz()">看成绩 →</button>
    </div>
  </div>

  <!-- 成绩单 -->
  <div id="view-result" class="hidden">
    <div class="card result-wrap">
      <div class="result-label">这科做对了</div>
      <div class="result-score" id="resultScore">0/10</div>
      <div class="result-flowers" id="resultFlowers"></div>
      <div class="result-tip" id="resultTip"></div>
      <div class="result-actions">
        <button class="btn" onclick="goHome()">返回主页</button>
        <button class="btn secondary" onclick="backToChapters()">继续练这一科</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ============ 年级 / 科目 定义 ============ */
var GRADES = ["1","2","3","4","5","6"];
var SUBJECTS = ["yw","sx","en","sci"];
var SUB_META = {
  yw:  { name:"语文", icon:"语", cls:"yw",  desc:"统编版" },
  sx:  { name:"数学", icon:"数", cls:"sx",  desc:"人教版" },
  en:  { name:"英语", icon:"英", cls:"en",  desc:"人教PEP" },
  sci: { name:"科学", icon:"科", cls:"sci", desc:"教科版" }
};
function key(g,s){ return g + s; }

/* ============ 题库（合并时注入；运行时把旧五年级 yw/sx/en 迁移到 5yw/5sx/5en） ============ */
var EXTERNAL_BANK_URL = "https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/questions.json";
window.QA = { yw:[], sx:[], en:[] };
var QA = window.QA;
// 兼容题库文件里的 global.QA 引用：浏览器没有 global，这里给一个 window 的别名
var global = window;
/* 语文题库 批1：五上 第1课-第10课（选项顺序已打乱，答案位置随机） */
QA.yw.push(
{i:0,c:"yw-1",ch:"五上·第1课 白鹭",f:0,q:"“白鹭”的“鹭”正确读音是？",o:["lù","nù","lǜ","lú"],a:0,k:"字音辨析：白鹭的“鹭”",e:"“鹭”是左右结构“路+鸟”，读 lù，是鸟类（鹭科）的通称，如白鹭、苍鹭。"},
{i:1,c:"yw-1",ch:"五上·第1课 白鹭",f:0,q:"下列词语书写正确的一项是？",o:["蔬毛","衰毛","蓑毛","簑毛"],a:2,k:"字形辨析：“蓑毛”",e:"“蓑”是草字头加“衰”，指棕毛做成的雨衣，课文写白鹭“蓑毛”指背上的羽毛像蓑衣。“衰”表衰弱，不能混用。"},
{i:2,c:"yw-1",ch:"五上·第1课 白鹭",f:1,q:"白鹭是一首精巧的____。",o:[],a:"诗",k:"课文句子填空：开头总起句",e:"课文开篇即点题：“白鹭是一首精巧的诗。”作者用“诗”比喻白鹭，总领全文，突出白鹭的韵味之美。"},
{i:3,c:"yw-1",ch:"五上·第1课 白鹭",f:0,q:"作者写白鹭的美，主要写它的（　）恰到好处。",o:["颜色和身段","眼睛和嘴","叫声和飞行","羽毛和脚"],a:0,k:"课文理解：白鹭的美体现在颜色和身段",e:"课文写白鹭“色素配合”“身段大小”一切都很适宜，即颜色和身段恰到好处，这是白鹭外形的美。"},
{i:4,c:"yw-1",ch:"五上·第1课 白鹭",f:0,q:"文中把白鹭和什么鸟作对比？",o:["天鹅、海鸥、大雁","麻雀、燕子、喜鹊","乌鸦、孔雀、画眉","白鹤、朱鹭、苍鹭"],a:3,k:"课文理解：对比衬托白鹭",e:"课文用白鹤太大而嫌生硬，朱鹭、苍鹭太大而嫌稍大，与白鹭对比，衬托出白鹭身段的精巧适宜。"},
{i:5,c:"yw-1",ch:"五上·第1课 白鹭",f:0,q:"“增之一分则嫌长，减之一分则嫌短”写出了白鹭的（　）。",o:["颜色恰到好处","身段恰到好处","鸣声悦耳动听","飞行姿态优美"],a:1,k:"句子理解：白鹭身段的精巧",e:"这句话用夸张的手法写白鹭的身段不多一分不少一分，恰到好处，突出其外形之美。"},
{i:6,c:"yw-1",ch:"五上·第1课 白鹭",f:1,q:"白鹭实在是一首诗，一首____在骨子里的散文诗。",o:[],a:"韵",k:"课文句子填空：结尾点题句",e:"课文结尾：“白鹭实在是一首诗，一首韵在骨子里的散文诗。”既呼应开头，又升华主题，赞美白鹭的美是融入骨子里的。"},
{i:7,c:"yw-1",ch:"五上·第1课 白鹭",f:0,q:"“嵌在玻璃框里”的“嵌”读音是？",o:["zhàn","qiàn","kān","qiān"],a:1,k:"字音辨析：“嵌”",e:"“嵌”读 qiàn，意思是把较小的东西卡进较大东西的凹处，如镶嵌、嵌入。"},
{i:8,c:"yw-1",ch:"五上·第1课 白鹭",f:0,q:"与“精巧”意思最相近的词是？",o:["粗笨","精致","粗糙","笨拙"],a:1,k:"近义词辨析：“精巧”",e:"“精巧”指精细巧妙，与“精致”意思相近；“粗笨”“笨拙”“粗糙”都是反义方向。"},
{i:9,c:"yw-1",ch:"五上·第1课 白鹭",f:0,q:"课文结尾说白鹭“实在是一首诗”，表达了作者（　）的感情。",o:["喜爱和赞美","平淡","嘲笑","厌恶"],a:0,k:"课文理解：作者的情感",e:"全文表达作者对白鹭的喜爱与赞美之情，首尾呼应，把白鹭比作“诗”，充满诗情画意。"},
{i:10,c:"yw-2",ch:"五上·第2课 落花生",f:0,q:"“吩咐”的正确读音是？",o:["fēng fù","fēn fù","fēn fu","fēn fú"],a:1,k:"字音辨析：“吩咐”",e:"“吩咐”读 fēn fù（第二个字读轻声 fù），意思是口头指派或命令。"},
{i:11,c:"yw-2",ch:"五上·第2课 落花生",f:0,q:"父亲说，花生的好处很多，最可贵的是（　）。",o:["好看漂亮","价钱便宜","味道香甜","不图虚名、默默奉献"],a:3,k:"课文理解：花生的可贵之处",e:"父亲认为花生最可贵的是它朴实无华、不图虚名、默默奉献，这是本文借物喻人的核心。"},
{i:12,c:"yw-2",ch:"五上·第2课 落花生",f:1,q:"人要做有用的人，不要做只讲____，而对别人没有好处的人。",o:[],a:"体面",k:"课文句子填空：中心句",e:"“人要做有用的人，不要做只讲体面，而对别人没有好处的人。”这是全文的中心句，点明做人要脚踏实地、有益于人。"},
{i:13,c:"yw-2",ch:"五上·第2课 落花生",f:0,q:"课文《落花生》主要运用了什么写法？",o:["借物喻人","借景抒情","对比衬托","托物言志"],a:0,k:"写法辨析：借物喻人",e:"课文借花生朴实无华、默默奉献的特点，来比喻要做有用的人，这种写法叫“借物喻人”。"},
{i:14,c:"yw-2",ch:"五上·第2课 落花生",f:0,q:"母亲吩咐“我们”在后园的什么地方过收获节？",o:["茅亭","菜园","屋后","凉棚"],a:0,k:"课文细节理解",e:"课文写母亲说：“让它荒着怪可惜的……所以吩咐‘我们’在后园的茅亭里过这个收获节。”"},
{i:15,c:"yw-2",ch:"五上·第2课 落花生",f:0,q:"“榨油”的“榨”读音是？",o:["zà","zhà","zhá","zhā"],a:1,k:"字音辨析：“榨”",e:"“榨”读 zhà，指压出物体里的汁液或油，如榨油、榨汁。"},
{i:16,c:"yw-2",ch:"五上·第2课 落花生",f:0,q:"课文借花生告诉我们：人要做有用的人，不要做（　）。",o:["贪图安逸的人","默默无闻的人","只讲体面而对别人没有好处的人","讲究吃穿的人"],a:2,k:"课文理解：做人的道理",e:"父亲的话点明主旨：人要做有用的人，不要做只讲体面而对别人没有好处的人，要像花生一样朴实奉献。"},
{i:17,c:"yw-2",ch:"五上·第2课 落花生",f:0,q:"“爱慕”一词的意思是？",o:["嫉妒","羡慕","讨厌","喜爱而倾慕"],a:3,k:"词语理解：“爱慕”",e:"“爱慕”指因喜爱而愿意接近、倾慕，如“爱慕之心”。注意与“羡慕”（看见别人有而希望自己也有）区分。"},
{i:18,c:"yw-2",ch:"五上·第2课 落花生",f:0,q:"父亲拿桃子、石榴、苹果与花生对比，是为了突出花生（　）。",o:["朴实无华、不计较名利","果实不好吃","长得难看","价钱便宜"],a:0,k:"课文理解：对比写法",e:"桃子、石榴、苹果把果实挂在枝上显耀自己，花生却埋在地里，对比突出花生朴实无华、默默奉献的品格。"},
{i:19,c:"yw-2",ch:"五上·第2课 落花生",f:1,q:"花生生长在____里，不像桃子、石榴、苹果那样把果实挂在枝头。",o:[],a:"泥土",k:"课文句子填空",e:"课文写花生“它的果实埋在地里”，不像桃子、石榴、苹果那样把鲜红嫩绿的果实高高地挂在枝头上。"},
{i:20,c:"yw-3",ch:"五上·第3课 桂花雨",f:0,q:"“箩筐”的“箩”读音是？",o:["lóu","luō","lòu","luó"],a:3,k:"字音辨析：“箩”",e:"“箩”读 luó，是竹子编的盛东西的器具，如箩筐、稻箩。"},
{i:21,c:"yw-3",ch:"五上·第3课 桂花雨",f:0,q:"母亲说：“这里的桂花再香，也比不上（　）。”",o:["公园里的桂花","家乡院子里的桂花","花园里的桂花","山上的桂花"],a:1,k:"课文理解：母亲的话",e:"母亲的话“这里的桂花再香，也比不上家乡院子里的桂花”表达了深深的思乡之情，家乡的桂花寄托着乡愁。"},
{i:22,c:"yw-3",ch:"五上·第3课 桂花雨",f:1,q:"桂花盛开的时候，不说____，至少前后十几家邻居，没有不浸在桂花香里的。",o:[],a:"香飘十里",k:"课文句子填空",e:"原句：“桂花盛开的时候，不说香飘十里，至少前后十几家邻居，没有不浸在桂花香里的。”用夸张手法写桂花香。"},
{i:23,c:"yw-3",ch:"五上·第3课 桂花雨",f:0,q:"课文中的“桂花雨”指的是什么？",o:["桂花做的雨伞","桂花泡的茶","下雨时的桂花","摇桂花时纷纷落下的桂花"],a:3,k:"课文理解：“桂花雨”的含义",e:"“桂花雨”指摇桂花时，桂花像雨一样纷纷飘落的情景，是作者童年最快乐的记忆。"},
{i:24,c:"yw-3",ch:"五上·第3课 桂花雨",f:0,q:"“浸”在句子“整个村子都浸在桂花的香气里”中的读音是？",o:["jìn","qīn","jǐn","qìn"],a:0,k:"字音辨析：“浸”",e:"“浸”读 jìn，本指泡在液体里，这里形象地写出桂花香气弥漫整个村子，无处不在。"},
{i:25,c:"yw-3",ch:"五上·第3课 桂花雨",f:0,q:"作者长大后为什么忘不了故乡的桂花？",o:["因为故乡的桂花最贵","因为桂花寄托了她的思乡之情","因为别处没有桂花","因为桂花能做成糕饼"],a:1,k:"课文理解：思乡主题",e:"作者忘不了故乡的桂花，实质是忘不了故乡和童年，桂花是思乡之情的寄托。"},
{i:26,c:"yw-3",ch:"五上·第3课 桂花雨",f:0,q:"下列词语书写正确的一项是？",o:["杭洲","杭周","杭州","杭舟"],a:2,k:"字形辨析：“州”与“洲”",e:"“杭州”是地名，用“州”（古代行政区划）；“洲”指水中的陆地，如亚洲、沙洲。"},
{i:27,c:"yw-3",ch:"五上·第3课 桂花雨",f:0,q:"“糕饼”的“饼”读音是？",o:["bǐng","píng","bǐn","bìng"],a:0,k:"字音辨析：“饼”",e:"“饼”读 bǐng，指扁圆形的面制食品，如糕饼、月饼、烧饼。"},
{i:28,c:"yw-3",ch:"五上·第3课 桂花雨",f:0,q:"母亲的话表达了怎样的感情？",o:["对糕饼的喜爱","对桂花的讨厌","对家乡的思念","对邻居的不满"],a:2,k:"课文理解：母亲话中的情感",e:"母亲认为杭州的桂花再香也比不上家乡的，实际是思念家乡，这句话把思乡之情推向高潮。"},
{i:29,c:"yw-3",ch:"五上·第3课 桂花雨",f:1,q:"作者喜欢桂花的原因是桂花不仅香，还能____。",o:[],a:"做糕饼",k:"课文内容理解",e:"课文写“我”喜欢桂花不仅因为香，还因为桂花可以泡茶、做糕饼，给童年带来许多乐趣。"},
{i:30,c:"yw-4",ch:"五上·第4课 珍珠鸟",f:0,q:"“垂蔓”的“蔓”读音是？",o:["mán","wàn","mǎn","màn"],a:3,k:"字音辨析：“蔓”",e:"“垂蔓”指下垂的藤蔓，“蔓”读 màn（也读 wàn 指细长能缠绕的茎，如瓜蔓）。这里指吊兰垂下的枝叶。"},
{i:31,c:"yw-4",ch:"五上·第4课 珍珠鸟",f:0,q:"课文开头说，珍珠鸟是一种（　）的鸟。",o:["爱叫","怕人","不怕人","凶猛"],a:1,k:"课文理解：珍珠鸟的特点",e:"课文开头写“珍珠鸟是一种怕人的鸟”，为后文它逐渐信赖“我”做铺垫，形成对比。"},
{i:32,c:"yw-4",ch:"五上·第4课 珍珠鸟",f:1,q:"信赖，往往创造出美好的____。",o:[],a:"境界",k:"课文句子填空：中心句",e:"“信赖，往往创造出美好的境界。”是全文中心句，点明人与动物和谐相处的主题。"},
{i:33,c:"yw-4",ch:"五上·第4课 珍珠鸟",f:0,q:"“扒开”的“扒”读音是？",o:["pā","pá","bā","bà"],a:2,k:"字音辨析：“扒”",e:"“扒开”的“扒”读 bā，意思是拨开、推开；读 pá 时指用手或工具抓挠。"},
{i:34,c:"yw-4",ch:"五上·第4课 珍珠鸟",f:0,q:"小珍珠鸟最后在什么地方睡着了？",o:["书桌上","笼子里","“我”的肩头","窗台上"],a:2,k:"课文理解：信赖的结局",e:"小珍珠鸟最后落在“我”的肩头睡着了，说明它已完全信赖“我”，人与鸟和谐共处。"},
{i:35,c:"yw-4",ch:"五上·第4课 珍珠鸟",f:0,q:"“信赖”的意思是？",o:["怀疑","害怕","信任并依靠","疏远"],a:2,k:"词语理解：“信赖”",e:"“信赖”指信任并依靠，比“相信”程度更深。珍珠鸟对“我”由怕到信赖，是全文主线。"},
{i:36,c:"yw-4",ch:"五上·第4课 珍珠鸟",f:0,q:"课文表达了怎样的主题？",o:["人与动物和谐相处","养鸟很麻烦","鸟会咬人","珍珠鸟很好看"],a:0,k:"课文主题：人与动物和谐相处",e:"课文通过“我”与珍珠鸟建立信赖的过程，表达了“信赖，往往创造出美好的境界”的主题。"},
{i:37,c:"yw-4",ch:"五上·第4课 珍珠鸟",f:0,q:"“愈发”的意思是？",o:["渐渐","更加","忽然","已经"],a:1,k:"词语理解：“愈发”",e:"“愈发”意思是“更加”，如“小珍珠鸟愈发胆大了”，写出信赖逐步加深的过程。"},
{i:38,c:"yw-4",ch:"五上·第4课 珍珠鸟",f:0,q:"作者是怎样赢得珍珠鸟信赖的？",o:["把它关在笼子里","天天抓它","逗它玩","不惊动、不伤害、细心照料"],a:3,k:"课文理解：获得信赖的方法",e:"作者不惊动、不伤害珍珠鸟，给予它自由和关爱，才渐渐赢得了它的信赖。"},
{i:39,c:"yw-4",ch:"五上·第4课 珍珠鸟",f:1,q:"我轻轻抬一抬肩，它没醒，睡得好熟！还____，难道在做梦？",o:[],a:"咂咂嘴",k:"课文句子填空",e:"原句：“我轻轻抬一抬肩，它没醒，睡得好熟！还咂咂嘴，难道在做梦？”写出小珍珠鸟对“我”的完全信赖。"},
{i:40,c:"yw-5",ch:"五上·第5课 搭石",f:0,q:"“间隔”的“间”读音是？",o:["jiān","jiàn","jàn","jiǎn"],a:1,k:"多音字辨析：“间”",e:"“间隔”的“间”读 jiàn（表示空隙、隔开）；读 jiān 时表示中间，如“房间”“时间”。"},
{i:41,c:"yw-5",ch:"五上·第5课 搭石",f:1,q:"一排排搭石，任人走，任人踏，它们联结着故乡的小路，也联结着____美好的情感。",o:[],a:"乡亲们",k:"课文句子填空：结尾点题句",e:"原句结尾：“它们联结着故乡的小路，也联结着乡亲们美好的情感。”点明搭石承载着乡亲们的美好情谊。"},
{i:42,c:"yw-5",ch:"五上·第5课 搭石",f:0,q:"“汛期”的“汛”读音是？",o:["shún","xùn","xìn","xūn"],a:1,k:"字音辨析：“汛”",e:"“汛”读 xùn，指江河定期上涨的水，如汛期、防汛、潮汛。"},
{i:43,c:"yw-5",ch:"五上·第5课 搭石",f:0,q:"人们走搭石的样子是怎样的？",o:["飞快奔跑","协调有序，像轻快的音乐","小心翼翼慢走","排成一队唱歌"],a:1,k:"课文理解：走搭石的美",e:"课文写人们走搭石“协调有序”“像轻快的音乐”，表现出乡亲们配合默契、淳朴善良。"},
{i:44,c:"yw-5",ch:"五上·第5课 搭石",f:0,q:"上了年岁的人发现不平稳的搭石会怎么做？",o:["绕道走","把石头踢开","找来合适的石头搭上","大声提醒别人"],a:2,k:"课文理解：老人修搭石",e:"课文写上了年岁的人发现搭石不平稳，会“找来合适的石头搭上”，体现乡亲们为他人着想的品质。"},
{i:45,c:"yw-5",ch:"五上·第5课 搭石",f:0,q:"“理所当然”的意思是？",o:["理所当然","很自然","不讲道理","按道理应当这样"],a:3,k:"词语理解：“理所当然”",e:"“理所当然”指按道理应当这样。乡亲们觉得互相帮助是理所当然的事，不图回报。"},
{i:46,c:"yw-5",ch:"五上·第5课 搭石",f:0,q:"课文通过走搭石表现了乡亲们的什么品质？",o:["勤劳勇敢","乐观开朗","淳朴善良、互助谦让","聪明机智"],a:2,k:"课文主题：乡亲们的品质",e:"课文通过摆搭石、走搭石、让搭石等细节，表现乡亲们淳朴善良、互相帮助、谦让有礼的品质。"},
{i:47,c:"yw-5",ch:"五上·第5课 搭石",f:0,q:"下列词语书写正确的一项是？",o:["懒堕","濑惰","懒隋","懒惰"],a:3,k:"字形辨析：“懒惰”",e:"“懒惰”指不爱劳动和工作，“惰”是忄旁加“左”，注意“懒”是忄旁，不能写成“堕”“隋”。"},
{i:48,c:"yw-5",ch:"五上·第5课 搭石",f:0,q:"“协调有序”的“协”意思是？",o:["十分","共同、和谐","整理","帮助"],a:1,k:"词语理解：“协”",e:"“协”有共同、和谐的意思，“协调”指配合得适当，“协调有序”形容配合默契、井井有条。"},
{i:49,c:"yw-5",ch:"五上·第5课 搭石",f:1,q:"搭石，原本就是____石块，踩上去难免会活动。",o:[],a:"天然",k:"课文句子填空",e:"原句：“搭石，原本就是天然石块，踩上去难免会活动。”点出搭石的由来和特点。"},
{i:50,c:"yw-6",ch:"五上·第6课 将相和",f:0,q:"“蔺相如”的“蔺”读音是？",o:["lìn","lín","lǐn","líng"],a:0,k:"字音辨析：“蔺”",e:"“蔺”读 lìn，是姓氏，也指一种多年生草本植物。注意不要误读成 lín。"},
{i:51,c:"yw-6",ch:"五上·第6课 将相和",f:0,q:"《将相和》讲了哪三个故事？",o:["卧薪尝胆、渑池之会、负荆请罪","完璧归赵、渑池之会、负荆请罪","三顾茅庐、草船借箭、火烧赤壁","完璧归赵、三顾茅庐、负荆请罪"],a:1,k:"课文内容：三个小故事",e:"《将相和》由“完璧归赵”“渑池之会”“负荆请罪”三个小故事组成，层层推进，最后将相和好。"},
{i:52,c:"yw-6",ch:"五上·第6课 将相和",f:1,q:"您现在离我只有五步远。您不答应，我就跟您____了！",o:[],a:"拼",k:"课文句子填空",e:"这是渑池之会上蔺相如逼迫秦王击缶时说的话，表现他临危不惧、机智勇敢。"},
{i:53,c:"yw-6",ch:"五上·第6课 将相和",f:0,q:"“渑池”的“渑”读音是？",o:["miàn","shěng","shéng","miǎn"],a:3,k:"字音辨析：“渑”",e:"“渑”读 miǎn，渑池是地名，在河南。注意不要读成 shéng。"},
{i:54,c:"yw-6",ch:"五上·第6课 将相和",f:0,q:"蔺相如是个怎样的人？",o:["胆小怕事","机智勇敢、顾全大局","骄傲自大","自私自利"],a:1,k:"人物形象：蔺相如",e:"蔺相如完璧归赵、逼秦王击缶，机智勇敢；面对廉颇挑衅一再退让，顾全大局。"},
{i:55,c:"yw-6",ch:"五上·第6课 将相和",f:0,q:"廉颇知道自己错了后是怎么做的？",o:["写道歉信","躲着不见人","请人调解","背着荆条向蔺相如请罪"],a:3,k:"课文理解：负荆请罪",e:"廉颇知错就改，脱下战袍、背着荆条到蔺相如门上请罪，体现了知错能改的品质。"},
{i:56,c:"yw-6",ch:"五上·第6课 将相和",f:0,q:"“完璧归赵”的意思是？",o:["把璧完好地送回赵国，比喻原物完整归还","把璧卖掉","把璧藏起来","把璧打破"],a:0,k:"成语理解：“完璧归赵”",e:"“完璧归赵”本指蔺相如把和氏璧完好地送回赵国，后来比喻把原物完整地归还本人。"},
{i:57,c:"yw-6",ch:"五上·第6课 将相和",f:0,q:"将相和好的根本原因是什么？",o:["都以国家利益为重","廉颇打不过蔺相如","蔺相如害怕廉颇","别人劝说"],a:0,k:"课文理解：和好的原因",e:"蔺相如以国家利益为重避让廉颇，廉颇也认识到以国家利益为重，将相才和好如初。"},
{i:58,c:"yw-6",ch:"五上·第6课 将相和",f:0,q:"“允诺”的“诺”读音是？",o:["nò","nuò","luò","ruò"],a:1,k:"字音辨析：“诺”",e:"“诺”读 nuò，意思是答应、允许，如允诺、诺言、一诺千金。"},
{i:59,c:"yw-6",ch:"五上·第6课 将相和",f:1,q:"廉颇静下心来想了想，觉得自己为了争一口气，就不顾国家的利益，真不应该。于是他____，到蔺相如门上请罪。",o:[],a:"脱下战袍",k:"课文句子填空：负荆请罪",e:"课文写廉颇“脱下战袍，背上荆条，到蔺相如门上请罪”，表现他知错就改的品格。"},
{i:60,c:"yw-7",ch:"五上·第7课 什么比猎豹的速度更快",f:0,q:"“游隼”的“隼”读音是？",o:["sǔn","sùn","zǔn","zhǔn"],a:0,k:"字音辨析：“隼”",e:"“隼”读 sǔn，是一种猛禽，飞行速度很快。注意“隼”的下面是“十”，不要和“准”混淆。"},
{i:61,c:"yw-7",ch:"五上·第7课 什么比猎豹的速度更快",f:0,q:"陆地上跑得最快的动物是？",o:["猎豹","斑马","狮子","鸵鸟"],a:0,k:"课文内容：速度排名",e:"课文说猎豹是陆地上跑得最快的动物，但鸵鸟、游隼等比它更快，速度不是绝对的。"},

{i:170,c:"yw-18",ch:"五上·第18课 父爱之舟",f:0,q:"《父爱之舟》的作者是？",o:["老舍","季羡林","梁晓声","吴冠中"],a:3,k:"文学常识：作者吴冠中",e:"《父爱之舟》是著名画家吴冠中写的回忆性散文，回忆了父亲用船送“我”求学等往事。"},

{i:201,c:"yw-21",ch:"五上·第21课 四季之美",f:1,q:"春天最美是____。",o:[],a:"黎明",k:"课文内容：春天最美是黎明",e:"课文写“春天最美是黎明”，东方天空泛着鱼肚色，染上红晕，飘着彩云，景色清新淡雅。"},
{i:202,c:"yw-21",ch:"五上·第21课 四季之美",f:1,q:"夏天最美是____。",o:[],a:"夜晚",k:"课文内容：夏天最美是夜晚",e:"课文写“夏天最美是夜晚”，明亮的月夜固然美，漆黑漆黑的暗夜也有无数的萤火虫翩翩飞舞。"},
{i:203,c:"yw-21",ch:"五上·第21课 四季之美",f:0,q:"秋天最美的是？",o:["清晨","黄昏","正午","夜晚"],a:1,k:"课文内容：秋天最美是黄昏",e:"课文写“秋天最美是黄昏”，夕阳斜照、归鸦急飞、大雁比翼，还有风声虫鸣，充满诗意。"},
{i:204,c:"yw-21",ch:"五上·第21课 四季之美",f:1,q:"冬天最美是____。",o:[],a:"早晨",k:"课文内容：冬天最美是早晨",e:"课文写“冬天最美是早晨”，落雪的早晨、铺满白霜的早晨、凛冽的清晨，生起熊熊炭火格外暖和。"},
{i:205,c:"yw-21",ch:"五上·第21课 四季之美",f:0,q:"“红晕”的“晕”读音是？",o:["yūn","yún","hūn","yùn"],a:3,k:"多音字辨析：“晕”",e:"“红晕”的“晕”读 yùn，指光影、色彩四周模糊的部分；读 yūn 指头晕、晕倒。"},
{i:206,c:"yw-21",ch:"五上·第21课 四季之美",f:0,q:"夏天夜晚最美的是什么景象？",o:["明亮的月光","萤火虫翩翩飞舞","点点繁星","凉爽的风"],a:1,k:"课文理解：夏夜之美",e:"课文写夏夜最动人的是萤火虫，即使是漆黑漆黑的暗夜，也有无数的萤火虫翩翩飞舞。"},
{i:207,c:"yw-21",ch:"五上·第21课 四季之美",f:0,q:"“窠”在文中指？",o:["山洞","树","鸟巢","房子"],a:2,k:"词语理解：“窠”",e:"“窠”读 kē，指鸟兽昆虫的窝。“归鸦急急匆匆地朝窠里飞去”中的“窠”就是鸟巢。"},
{i:208,c:"yw-21",ch:"五上·第21课 四季之美",f:0,q:"课文表达了作者怎样的感情？",o:["对春天的抱怨","对冬天的讨厌","对四季美景的喜爱","对生活的厌倦"],a:2,k:"课文主旨",e:"课文细腻描写四季最美时刻的景色，表达了作者对大自然的热爱和对生活的赞美。"},
{i:209,c:"yw-21",ch:"五上·第21课 四季之美",f:1,q:"夕阳斜照西山时，动人的是点点归鸦急急匆匆地朝____里飞去。",o:[],a:"窠",k:"课文句子填空",e:"原句：“夕阳斜照西山时，动人的是点点归鸦急急匆匆地朝窠里飞去。”画面感极强。"},
{i:210,c:"yw-22",ch:"五上·第22课 鸟的天堂",f:0,q:"《鸟的天堂》的作者是？",o:["巴金","冰心","朱自清","老舍"],a:0,k:"文学常识：作者巴金",e:"《鸟的天堂》是现代作家巴金的散文，写“我”两次经过广东新会天马河大榕树的见闻。"},
{i:211,c:"yw-22",ch:"五上·第22课 鸟的天堂",f:0,q:"“鸟的天堂”实际上指的是？",o:["一个鸟笼","一株大榕树","一片树林","一座小岛"],a:1,k:"课文理解：“鸟的天堂”的含义",e:"“鸟的天堂”实际上是指一株枝干不可计数的大榕树，许多鸟栖息其上，成了鸟的天堂。"},
{i:212,c:"yw-22",ch:"五上·第22课 鸟的天堂",f:1,q:"那翠绿的颜色，明亮地照耀着我们的眼睛，似乎每一片绿叶上都有一个新的生命在____。",o:[],a:"颤动",k:"课文句子填空",e:"这句话写榕树叶子翠绿鲜活，仿佛每片叶子上都有生命在颤动，是作者对大榕树的赞美。"},
{i:213,c:"yw-22",ch:"五上·第22课 鸟的天堂",f:0,q:"“不可计数”的“数”读音是？",o:["shǔ","shu","shù","shuò"],a:0,k:"多音字辨析：“数”",e:"“不可计数”的“数”读 shǔ，是动词，意思是数（数目）；读 shù 时是名词，如数字。"},
{i:214,c:"yw-22",ch:"五上·第22课 鸟的天堂",f:1,q:"昨天是我的眼睛骗了我，那“鸟的天堂”的确是鸟的____啊！",o:[],a:"天堂",k:"课文句子填空：点题句",e:"这句话点明“鸟的天堂”名副其实，表达作者对大榕树和鸟的赞美之情。"},
{i:215,c:"yw-22",ch:"五上·第22课 鸟的天堂",f:0,q:"作者第一次经过“鸟的天堂”是在什么时间？",o:["深夜","中午","傍晚","清晨"],a:2,k:"课文理解：第一次经过",e:"第一次是傍晚经过，只看到大榕树没看到鸟；第二次是早晨去，才看到群鸟纷飞的壮观场面。"},
{i:216,c:"yw-22",ch:"五上·第22课 鸟的天堂",f:0,q:"作者第二次去看鸟，看到了什么？",o:["大榕树倒了","只有一只鸟","到处都是鸟声鸟影","什么也没有"],a:2,k:"课文理解：第二次经过",e:"第二次早晨去，作者看到“到处都是鸟声，到处都是鸟影”，大榕树果然是鸟的天堂。"},
{i:217,c:"yw-22",ch:"五上·第22课 鸟的天堂",f:0,q:"“应接不暇”的意思是？",o:["很清闲","很忙碌","很着急","来人或事情太多，接待应付不过来"],a:3,k:"词语理解：“应接不暇”",e:"“应接不暇”指景物繁多，看不过来。课文写鸟儿多得让“我”眼睛都看不过来了。"},
{i:218,c:"yw-22",ch:"五上·第22课 鸟的天堂",f:0,q:"课文表达了作者怎样的感情？",o:["对水乡的怀念","对鸟的害怕","对大自然的热爱和赞美","对榕树的讨厌"],a:2,k:"课文主旨",e:"课文表达了对大榕树的赞美和对群鸟的喜爱，抒发了对大自然的热爱之情。"},
{i:219,c:"yw-22",ch:"五上·第22课 鸟的天堂",f:1,q:"大榕树茂盛地生长着，那么多的绿叶，一簇堆在另一簇上面，不留一点____。",o:[],a:"缝隙",k:"课文句子填空",e:"原句：“那么多的绿叶，一簇堆在另一簇上面，不留一点缝隙。”写出榕树枝叶繁茂。"},
{i:220,c:"yw-23",ch:"五上·第23课 月迹",f:0,q:"《月迹》的作者是？",o:["莫言","铁凝","余华","贾平凹"],a:3,k:"文学常识：作者贾平凹",e:"《月迹》是当代作家贾平凹的散文，写孩子们在院子里追寻月亮踪迹的趣事。"},
{i:221,c:"yw-23",ch:"五上·第23课 月迹",f:0,q:"“悄没声儿”的“悄”读音是？",o:["qiāo","xiāo","qiǎo","qiào"],a:2,k:"多音字辨析：“悄”",e:"“悄没声儿”的“悄”读 qiǎo，意思是静、没有声音；读 qiāo 时用于“悄悄”。"},
{i:222,c:"yw-23",ch:"五上·第23课 月迹",f:1,q:"噢，月亮竟是这么多：只要你愿意，它就有了____。",o:[],a:"哩",k:"课文句子填空",e:"这句话写出孩子们发现月亮无处不在的惊喜，“只要你愿意，它就有了哩”充满童趣。"},
{i:223,c:"yw-23",ch:"五上·第23课 月迹",f:0,q:"文中“我们”在哪些地方找到了月亮？",o:["穿衣镜上、院子里、水里","水里","天上","远处"],a:0,k:"课文理解：找月亮",e:"孩子们在穿衣镜上、院子里、葡萄叶上、水里、眼睛里都找到了月亮，月亮无处不在。"},
{i:224,c:"yw-23",ch:"五上·第23课 月迹",f:1,q:"我突然觉得，我们有了月亮，那无边无际的天空也是____的了。",o:[],a:"我们",k:"课文句子填空",e:"结尾写“我们有了月亮，那无边无际的天空也是我们的了”，表现孩子们拥有月亮的满足与自豪。"},
{i:225,c:"yw-23",ch:"五上·第23课 月迹",f:0,q:"“面面相觑”的“觑”读音是？",o:["xū","qū","qù","jù"],a:2,k:"字音辨析：“觑”",e:"“觑”读 qù，意思是看、瞧。“面面相觑”指你看我、我看你，形容无可奈何。"},
{i:226,c:"yw-23",ch:"五上·第23课 月迹",f:0,q:"课文通过找月亮，表达了怎样的主题？",o:["美好的事物要靠自己去发现","月亮很大","夜晚很美","孩子们贪玩"],a:0,k:"课文主旨",e:"课文借孩子们寻月、得月，告诉我们：美好的事物处处存在，关键在于自己去发现、去追寻。"},
{i:227,c:"yw-23",ch:"五上·第23课 月迹",f:0,q:"“锨”字的读音是？",o:["xiān","xīn","jīn","qīn"],a:0,k:"字音辨析：“锨”",e:"“锨”读 xiān，指铲东西用的工具，如铁锨、木锨。"},
{i:228,c:"yw-23",ch:"五上·第23课 月迹",f:0,q:"课文中月亮是（　）地溜进来的。",o:["款款、悄没声儿","悄悄地大声","猛烈","飞快"],a:0,k:"课文理解：月亮进来的样子",e:"课文写月亮“款款地、悄没声儿地溜进来”，突出月光的柔和与安静，富有诗意。"},
{i:229,c:"yw-23",ch:"五上·第23课 月迹",f:1,q:"我们看时，那竹窗帘儿里，果然有了月亮，款款地，____地溜进来。",o:[],a:"悄没声儿",k:"课文句子填空",e:"原句：“那竹窗帘儿里，果然有了月亮，款款地，悄没声儿地溜进来。”写出月亮出现的轻柔。"},
{i:230,c:"yw-24",ch:"五上·第24课 古人谈读书",f:1,q:"敏而好学，不耻下____。",o:[],a:"问",k:"文言文默写：《论语》",e:"全句：“敏而好学，不耻下问。”出自《论语》，意思是天资聪明而又好学，不以向地位、学问不如自己的人请教为耻。"},
{i:231,c:"yw-24",ch:"五上·第24课 古人谈读书",f:1,q:"知之为知之，不知为不知，是____也。",o:[],a:"知",k:"文言文默写：《论语》",e:"全句：“知之为知之，不知为不知，是知也。”最后一个“知”同“智”，指智慧，意思是知道就是知道，不知道就是不知道，这才是明智的。"},
{i:232,c:"yw-24",ch:"五上·第24课 古人谈读书",f:0,q:"“默而识之”的“识”读音是？",o:["chì","shí","zhì","shì"],a:2,k:"文言字音辨析：“识”",e:"“默而识之”的“识”读 zhì，同“志”，意思是记住；读 shí 时是认识、知识。"},
{i:233,c:"yw-24",ch:"五上·第24课 古人谈读书",f:0,q:"朱熹认为读书有三到，是指？",o:["心到、手到、口到","心到、眼到、口到","耳到、眼到、手到","眼到、耳到、心到"],a:1,k:"文言文内容：读书三到",e:"朱熹说“读书有三到，谓心到、眼到、口到”，三到之中“心到最急”（心到最重要）。"},
{i:234,c:"yw-24",ch:"五上·第24课 古人谈读书",f:1,q:"三到之中，____到最急。",o:[],a:"心",k:"文言文默写：读书三到",e:"朱熹认为“三到之中，心到最急”，心到了，眼和口自然就到了，强调专心致志。"},
{i:235,c:"yw-24",ch:"五上·第24课 古人谈读书",f:0,q:"“学而不厌，诲人不倦”出自？",o:["《中庸》","《论语》","《孟子》","《大学》"],a:1,k:"文学常识：出处《论语》",e:"“学而不厌，诲人不倦”出自《论语·述而》，意思是学习不满足，教导人不知疲倦。"},
{i:236,c:"yw-24",ch:"五上·第24课 古人谈读书",f:0,q:"“余尝谓读书有三到”中“尝”的意思是？",o:["曾经","尝试","品尝","经常"],a:0,k:"文言词语理解：“尝”",e:"“尝”在文言文中常表示“曾经”。“余尝谓”即“我曾经说过”。"},
{i:237,c:"yw-24",ch:"五上·第24课 古人谈读书",f:1,q:"心眼既不专一，却只漫浪诵读，决不能记，记亦不能____也。",o:[],a:"久",k:"文言文默写：读书三到",e:"全句意思是心不专一、随便读读，就记不住，记住了也不能持久，强调读书要用心专一。"},
{i:238,c:"yw-24",ch:"五上·第24课 古人谈读书",f:0,q:"这篇课文告诉我们要怎样读书？",o:["边玩边读","死记硬背","一目十行","专心致志，勤学好问"],a:3,k:"课文主旨：读书方法",e:"课文通过孔子和朱熹的话，告诉我们读书要勤学好问、专心致志、心到眼到口到。"},
{i:239,c:"yw-24",ch:"五上·第24课 古人谈读书",f:0,q:"“不耻下问”的意思是？",o:["经常问问题","不把向地位比自己低、学识比自己差的人请教当作耻辱","不害羞","不怕问问题"],a:1,k:"成语理解：“不耻下问”",e:"“不耻下问”指不以向不如自己的人请教为耻，形容谦虚好学，出自《论语》。"},
{i:240,c:"yw-25",ch:"五上·第25课 忆读书",f:0,q:"《忆读书》的作者是？",o:["冰心","老舍","叶圣陶","巴金"],a:0,k:"文学常识：作者冰心",e:"《忆读书》是现代作家冰心的散文，回忆了自己一生的读书经历和体会。"},
{i:241,c:"yw-25",ch:"五上·第25课 忆读书",f:1,q:"读书好，多读书，读____。",o:[],a:"好书",k:"课文句子填空：中心句",e:"“读书好，多读书，读好书”是全文的中心，告诉我们要多读有益的好书。"},
{i:242,c:"yw-25",ch:"五上·第25课 忆读书",f:0,q:"冰心读书的座右铭是什么？",o:["开卷有益","书山有路勤为径","读书好，多读书，读好书","活到老学到老"],a:2,k:"课文内容：读书座右铭",e:"冰心把“读书好，多读书，读好书”作为读书的座右铭，勉励青少年多读书、读好书。"},
{i:243,c:"yw-25",ch:"五上·第25课 忆读书",f:0,q:"“一知半解”的意思是？",o:["知道一半","知道得不全面，理解得也不透彻","全部了解","完全不懂"],a:1,k:"词语理解：“一知半解”",e:"“一知半解”指知道得不全面、理解得不透彻。冰心小时候读《三国演义》就是一知半解地读。"},
{i:244,c:"yw-25",ch:"五上·第25课 忆读书",f:1,q:"我永远感到读书是我生命中最大的____！",o:[],a:"快乐",k:"课文句子填空",e:"冰心说“我永远感到读书是我生命中最大的快乐”，表达了对读书的热爱。"},
{i:245,c:"yw-25",ch:"五上·第25课 忆读书",f:0,q:"冰心小时候看《三国演义》时，因为字不认识，就？",o:["不读了","一知半解地读下去","问大人","只看图画"],a:1,k:"课文理解：读《三国演义》",e:"冰心七八岁读《三国演义》，因为字认不全，就一知半解地读下去，还因此哭了好几次。"},
{i:246,c:"yw-25",ch:"五上·第25课 忆读书",f:0,q:"“津津有味”的“津”读音是？",o:["jīng","jīn","jìng","jǐn"],a:1,k:"字音辨析：“津”",e:"“津”读 jīn，本指渡口、唾液，“津津有味”形容有兴趣、有滋味。"},
{i:247,c:"yw-25",ch:"五上·第25课 忆读书",f:0,q:"冰心认为什么书才值得读？",o:["故事书","好书","漫画书","图画书"],a:1,k:"课文理解：读好书",e:"冰心认为读书要挑“好书”读，能引发感情共鸣、让人有收获的书才值得反复读。"},
{i:248,c:"yw-25",ch:"五上·第25课 忆读书",f:0,q:"“栩栩如生”的“栩”读音是？",o:["yǔ","xù","xǔ","jǔ"],a:2,k:"字音辨析：“栩”",e:"“栩”读 xǔ，“栩栩如生”形容描写、刻画得非常逼真，像活的一样。"},
{i:249,c:"yw-25",ch:"五上·第25课 忆读书",f:1,q:"冰心写的《忆读书》告诉我们要____读书。",o:[],a:"热爱",k:"课文主旨",e:"《忆读书》通过作者一生的读书经历，告诉我们要热爱读书、多读书、读好书。"},
{i:250,c:"yw-26",ch:"五上·第26课 我的“长生果”",f:0,q:"书，被人们称为人类文明的“____”。",o:["营养品","长生果","精神食粮","智慧果"],a:1,k:"课文理解：书是“长生果”",e:"课文把书比作人类文明的“长生果”，形象地说明书能让人的精神“长生”，滋养人的心灵。"},
{i:251,c:"yw-26",ch:"五上·第26课 我的“长生果”",f:1,q:"我最早的读物是被孩子们叫做“____书”的小画片。",o:[],a:"香烟",k:"课文内容：最早的读物",e:"作者最早的读物是“香烟人”小画片，后来是连环画、文艺书籍，读书伴随她成长。"},

{i:400,c:"yw-41",ch:"五下·第15课 自相矛盾",f:1,q:"吾盾之坚，物莫能____也。",o:[],a:"陷",k:"文言文默写：《自相矛盾》",e:"全句：“吾盾之坚，物莫能陷也。”意思是我的盾很坚固，没有什么东西能刺穿它。"},
{i:401,c:"yw-41",ch:"五下·第15课 自相矛盾",f:1,q:"吾矛之利，于物无不____也。",o:[],a:"陷",k:"文言文默写：《自相矛盾》",e:"全句：“吾矛之利，于物无不陷也。”意思是我的矛很锋利，没有什么东西不能刺穿。"},
{i:402,c:"yw-41",ch:"五下·第15课 自相矛盾",f:0,q:"“鬻盾与矛”的“鬻”意思是？",o:["卖","藏","造","买"],a:0,k:"文言词语理解：“鬻”",e:"“鬻”读 yù，意思是卖。“鬻盾与矛”就是卖盾牌和矛（古代兵器）。"},
{i:403,c:"yw-41",ch:"五下·第15课 自相矛盾",f:0,q:"有人问“以子之矛，陷子之盾，何如”，卖矛和盾的人？",o:["逃跑","大笑","弗能应也","生气"],a:2,k:"文言文理解：其人弗能应也",e:"有人问“用你的矛刺你的盾，怎么样”，卖者无法回答，“弗能应也”就是不能回答。"},
{i:404,c:"yw-41",ch:"五下·第15课 自相矛盾",f:0,q:"“夫不可陷之盾与无不陷之矛，不可同世而立”说明什么？",o:["说话做事要前后一致，不能自相抵触","矛和盾不能一起卖","盾很坚固","矛很锋利"],a:0,k:"文言文主旨：寓意",e:"这句话点明寓意：说话做事要前后一致、实事求是，不能互相抵触、自相矛盾。"},
{i:405,c:"yw-41",ch:"五下·第15课 自相矛盾",f:0,q:"“誉之曰”的“誉”意思是？",o:["名誉","称赞","夸奖别人","荣誉"],a:1,k:"文言词语理解：“誉”",e:"“誉”这里作动词，意思是称赞、夸耀。“誉之曰”就是夸耀它（自己的盾）说。"},
{i:406,c:"yw-41",ch:"五下·第15课 自相矛盾",f:1,q:"这篇寓言告诉我们，说话办事要____一致。",o:[],a:"前后",k:"文言文主旨",e:"寓言讽刺了说话前后抵触的人，告诉我们说话做事要前后一致，不能自相矛盾。"},
{i:407,c:"yw-41",ch:"五下·第15课 自相矛盾",f:0,q:"“其人弗能应也”的“弗”意思是？",o:["能","多","不","快"],a:2,k:"文言词语理解：“弗”",e:"“弗”表示否定，意思是不。“弗能应”就是不能回答。"},
{i:408,c:"yw-41",ch:"五下·第15课 自相矛盾",f:1,q:"楚人夸他的盾：“吾盾之坚，物莫能____也。”",o:[],a:"陷",k:"文言文默写：《自相矛盾》",e:"楚人先夸盾坚固：“物莫能陷也”，又夸矛锋利：“于物无不陷也”，两句话自相抵触。"},
{i:409,c:"yw-41",ch:"五下·第15课 自相矛盾",f:0,q:"《自相矛盾》选自？",o:["《孟子》","《韩非子》","《论语》","《庄子》"],a:1,k:"文学常识：出处《韩非子》",e:"《自相矛盾》选自《韩非子·难一》，是一则著名的寓言故事。"},
{i:410,c:"yw-42",ch:"五下·第16课 田忌赛马",f:1,q:"孙膑让田忌用____等马对齐威王的上等马。",o:[],a:"下",k:"课文内容：赛马策略",e:"孙膑的计策：用田忌的下等马对齐威王的上等马，先输一场，再用上等马对中等马、中等马对下等马。"},
{i:411,c:"yw-42",ch:"五下·第16课 田忌赛马",f:0,q:"孙膑给田忌出的主意是？",o:["用上等马对上等马","用下等马对上等马，上等马对中等马，中等马对下等马","随便比","多跑几场"],a:1,k:"课文内容：调换马的出场顺序",e:"孙膑发现双方马的实力相当，只是田忌的马稍弱，于是调整马的出场顺序，以弱对强、以强对中、以中对弱。"},

{i:414,c:"yw-42",ch:"五下·第16课 田忌赛马",f:0,q:"“摩拳擦掌”的意思是？",o:["形容战斗或劳动前精神振奋的样子","很紧张","很饿","很累"],a:0,k:"词语理解：“摩拳擦掌”",e:"“摩拳擦掌”形容战斗或劳动前精神振奋、跃跃欲试的样子。"},
{i:415,c:"yw-42",ch:"五下·第16课 田忌赛马",f:1,q:"孙膑是一个善于____的人。",o:[],a:"谋划",k:"人物形象：孙膑",e:"孙膑善于观察分析、运筹帷幄，是著名的军事家，他的“围魏救赵”等计策名垂青史。"},

{i:417,c:"yw-42",ch:"五下·第16课 田忌赛马",f:0,q:"齐威王的马比田忌的马？",o:["差一些","弱很多","每个等级都要强一些","一样"],a:2,k:"课文理解：马的实力对比",e:"齐威王的马每个等级都比田忌的强一些，但差距不大，所以孙膑能靠策略取胜。"},

{i:441,c:"yw-45",ch:"五下·第19课 牧场之国",f:0,q:"课文中反复出现的一句话是？",o:["牧场真好","牛儿真多","荷兰真美","这就是真正的荷兰"],a:3,k:"课文写法：反复出现的句子",e:"“这就是真正的荷兰”在文中反复出现，既是线索，又表达了对荷兰牧场的赞美。"},

{i:679,c:"sx-7",ch:"五上·第7单元 数学广角—植树问题",f:0,q:"一条 17 米的小路，每隔 3 米栽一棵树（两端都栽），一共要栽多少棵树？",o:["5","6","7","4"],a:1,k:"植树问题：两端都栽，棵数 = 间隔数 + 1",e:"间隔数 = 全长 ÷ 间距 = 17 ÷ 3 = 5（个），两端都栽时棵数 = 间隔数 + 1 = 5 + 1 = 6（棵）。"},

{i:714,c:"sx-9",ch:"五下·第2单元 因数与倍数",f:0,q:"下列哪个数是 57 的因数？",o:["19","18","14","39"],a:0,k:"因数与倍数：能整除一个数（除得尽没有余数）的数就是这个数的因数",e:"57 ÷ 19 = 3，能整除没有余数，所以 19 是 57 的因数。"},

{i:920,c:"en-1",ch:"五上·Unit 1 What's he like?",f:1,q:"——What's he like?——He's ____（和蔼的）.",o:[],a:"kind",k:"句型：What's he like? 回答用 He's + 形容词",e:"What's he like? 问“他是什么样的人”，回答用 “He's + 形容词”，如 He's kind.（他和蔼。）"},
{i:921,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"问“你的数学老师是谁？”用英语怎么说？",o:["Who's your maths teacher?","What's your maths teacher?","Where's your maths teacher?","How is your maths teacher?"],a:0,k:"句型：Who's...? 问“是谁”",e:"询问人是谁用 Who's...?（Who is 的缩写），Who's your maths teacher? 意为“你的数学老师是谁？”。"},
{i:922,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"——Is she young?——____",o:["No, she is.","Yes, she is.","Yes, she isn't.","Yes, he is."],a:1,k:"句型：Is she...? 的肯定回答",e:"Is she young? 问“她年轻吗？”，肯定回答 Yes, she is.，注意 she 对应 is。"},
{i:923,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“What's he like?” 的答语是？",o:["He likes apples.","He's my father.","He's 10.","He's funny."],a:3,k:"句型：What's he like? 的答语",e:"What's he like? 问外貌或性格，答语用 He's + 形容词，He's funny.（他很滑稽。）正确。"},
{i:924,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"Mr Li 很严格，我们可以说：",o:["Mr Li is clever.","Mr Li is strict.","Mr Li is polite.","Mr Li is shy."],a:1,k:"句型：用 is + 形容词描述人",e:"描述 Mr Li 很严格：Mr Li is strict.，strict 是“严格的”。"},
{i:925,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“Do you know her?” 的意思是？",o:["你是她吗？","你认识她吗？","你喜欢她吗？","你了解她吗？"],a:1,k:"句型：Do you know...?",e:"Do you know her? 意为“你认识她吗？”，know 是“认识、知道”。"},
{i:926,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“sometimes” 的意思是？",o:["经常","总是","从不","有时候"],a:3,k:"词汇：频度副词 sometimes",e:"sometimes 意为“有时候”，是频度副词；always 总是、never 从不。"},
{i:927,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"——Who's that man?——He's ____. 下面哪个答语正确？",o:["young","my uncle","funny","kind"],a:1,k:"句型：Who's that man? 的答语",e:"问“那个男人是谁？”答语应回答身份，He's my uncle.（他是我叔叔。）正确。"},
{i:928,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“be like” 在 What's he like? 中表示？",o:["喜欢","想要","像……一样","是什么样的人"],a:3,k:"语法：What...like? 句型",e:"What is sb like? 问“某人是什么样的人”，like 是介词“像”，不是“喜欢”。"},
{i:929,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"形容一个人又聪明又勤奋，应说：",o:["He is clever and hard-working.","He is polite and young.","He is old and strict.","He is shy and funny."],a:0,k:"句型：and 连接两个形容词",e:"用 and 连接两个形容词：He is clever and hard-working.（他又聪明又勤奋。）"},
{i:930,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“Ms Wang” 中的 Ms 表示？",o:["女士（不知婚否）","夫人（已婚）","小姐（年轻）","先生"],a:0,k:"文化常识：称谓 Ms/Mr/Mrs/Miss",e:"Ms 用于女士（不表明婚否），Mr 先生，Mrs 夫人（已婚），Miss 小姐（未婚）。"},
{i:931,c:"en-1",ch:"五上·Unit 1 What's he like?",f:1,q:"“What's she like?” “She's ____（漂亮的）.”",o:[],a:"pretty",k:"词汇：pretty 漂亮的",e:"pretty 意为“漂亮的、可爱的”，回答 What's she like? 用 She's pretty."},
{i:932,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"——Is your English teacher strict?——____",o:["No, he is kind.","Yes, she is young.","Yes, she is kind.","No, she isn't. She's kind."],a:3,k:"句型：Is...strict? 的回答",e:"问“你的英语老师严格吗？”否定回答 No, she isn't. 后补充 She's kind.（她和蔼。）注意 she 用 isn't。"},
{i:933,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“He makes us laugh.” 的意思是？",o:["他让我们哭","他让我们学习","他让我们生气","他让我们笑（他很有趣）"],a:3,k:"句型：make sb do sth",e:"make sb laugh 意为“让某人笑”，laugh 是动词原形（make 后接动词原形）。"},
{i:934,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"下列哪组都是形容人的词？",o:["book, pen, ruler","apple, banana, pear","red, blue, green","kind, funny, polite"],a:3,k:"词汇分类：形容词",e:"kind（和蔼）、funny（滑稽）、polite（礼貌）都是形容人的形容词。"},
{i:935,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“know” 的意思是？",o:["喜欢","认识、知道","听到","看见"],a:1,k:"词汇：know 认识",e:"know 意为“认识、知道”，Do you know...? 就是“你认识……吗？”。"},
{i:936,c:"en-1",ch:"五上·Unit 1 What's he like?",f:1,q:"——What's your father like?——He's ____（强壮的）.",o:[],a:"strong",k:"词汇：strong 强壮的",e:"strong 意为“强壮的”，He's strong. 他很强壮。"},
{i:937,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"形容老师很和蔼，用哪个词？",o:["strict","tall","kind","old"],a:2,k:"词汇辨析：kind 和蔼",e:"和蔼用 kind；strict 严格、old 年老、tall 高，都不合题意。"},
{i:938,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“He's very helpful at home.” 意思是？",o:["他在家很乐于助人","他在家很懒惰","他在家很安静","他在家很调皮"],a:0,k:"句型：helpful 的用法",e:"He's very helpful at home. 意为“他在家很乐于助人”，helpful 是“乐于助人的”。"},
{i:939,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“What's she like?” 问的是？",o:["她在哪里","她几岁","她是什么样的人","她想要什么"],a:2,k:"句型：What's she like?",e:"What's she like? 问“她是什么样的人”，like 是介词，不是“喜欢”。"},
{i:940,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“Is he young?” 的否定回答是？",o:["No, he isn't.","Yes, he isn't.","Yes, she is.","No, he is."],a:0,k:"句型：一般疑问句的回答",e:"Is he young? 否定回答 No, he isn't.（不，他不年轻。）注意 he 用 isn't。"},
{i:941,c:"en-1",ch:"五上·Unit 1 What's he like?",f:0,q:"“He has big eyes.” 的意思是？",o:["他有两只眼睛","他的眼睛很小","他喜欢大眼睛","他有一双大眼睛"],a:3,k:"句型：have/has 表示拥有",e:"He has big eyes. 意为“他有一双大眼睛”，主语 he 用 has（have 的第三人称单数）。"},
{i:942,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“星期一”用英语怎么说？",o:["Tuesday","Saturday","Monday","Sunday"],a:2,k:"词汇：星期 Monday",e:"星期一 Monday，缩写 Mon.。记法：mon 像月亮，星期一 moon day。"},
{i:943,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“Wednesday” 的意思是？",o:["星期五","星期四","星期二","星期三"],a:3,k:"词汇：星期 Wednesday",e:"Wednesday 星期三，缩写 Wed.，注意拼写中间有 d。"},
{i:944,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“星期五”用英语怎么说？",o:["Sunday","Thursday","Friday","Tuesday"],a:2,k:"词汇：星期 Friday",e:"星期五 Friday，缩写 Fri.，Friday 与朋友 friend 相似，周五是快乐的一天。"},
{i:945,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“weekend” 的意思是？",o:["工作日","周末","假期","一周"],a:1,k:"词汇：weekend 周末",e:"weekend 由 week（周）+ end（结束）组成，意为“周末”，指周六、周日。"},
{i:946,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“watch TV” 的意思是？",o:["看电影","看书","看电视","玩电脑"],a:2,k:"短语：watch TV 看电视",e:"watch TV 看电视，watch 是“观看”，TV 是 television 的缩写。"},
{i:947,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“做作业”用英语怎么说？",o:["read books","watch TV","do homework","play football"],a:2,k:"短语：do homework 做作业",e:"do homework 做作业，homework 是不可数名词，不能说 a homework。"},
{i:948,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“read books” 的意思是？",o:["写字","画画","读书","唱歌"],a:2,k:"短语：read books 读书",e:"read books 读书、看书，read 读 /riːd/。"},
{i:949,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“play football” 的意思是？",o:["打排球","打篮球","打乒乓球","踢足球"],a:3,k:"短语：play football 踢足球",e:"play football 踢足球。球类运动前不加 the，如 play basketball 打篮球。"},
{i:950,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“wash my clothes” 的意思是？",o:["洗我的衣服","洗我的头发","洗我的手","洗我的脸"],a:0,k:"短语：wash my clothes",e:"wash 洗，clothes 衣服，wash my clothes 意为“洗我的衣服”。"},
{i:951,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“Saturday” 的意思是？",o:["星期三","星期一","星期日","星期六"],a:3,k:"词汇：星期 Saturday",e:"Saturday 星期六，缩写 Sat.，周六 often 是休息日。"},
{i:952,c:"en-2",ch:"五上·Unit 2 My week",f:1,q:"I have maths and English on ____（星期一）.",o:[],a:"Mondays",k:"句型：on + 星期",e:"在星期几前用介词 on，on Mondays 意为“在星期一”（习惯用复数）。"},
{i:953,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"——What do you have on Mondays?——____",o:["I have maths and English.","I go to school.","It's Monday.","I like Mondays."],a:0,k:"句型：What do you have on...?",e:"问“星期一你上什么课？”答语用 I have + 课程：I have maths and English.（我上数学和英语。）"},
{i:954,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"——What do you do on the weekend?——____",o:["I am ten.","I have lunch.","It's sunny.","I often read books."],a:3,k:"句型：What do you do on the weekend?",e:"问“周末你做什么？”答语用 I + 动词短语：I often read books.（我经常读书。）"},
{i:955,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“often” 的意思是？",o:["总是","从不","经常","偶尔"],a:2,k:"词汇：频度副词 often",e:"often 经常，always 总是，never 从不，usually 通常，都是频度副词。"},
{i:956,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“Do you often play football?” 的肯定回答是？",o:["Yes, I do.","Yes, I can.","No, I don't.","Yes, I am."],a:0,k:"句型：Do you...? 的回答",e:"Do you...? 开头的问句，肯定回答 Yes, I do.，do 对应助动词 do。"},
{i:957,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“Sunday” 是一周的星期几？",o:["星期日","星期一","星期六","星期五"],a:0,k:"词汇：星期 Sunday",e:"Sunday 星期日，缩写 Sun.，英语习惯把周日作为一周的第一天。"},
{i:958,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“I have a cooking class.” 意思是？",o:["我有一节烹饪课","我有一节体育课","我有一节英语课","我有一节数学课"],a:0,k:"句型：have a class 上课",e:"I have a cooking class. 意为“我有一节烹饪课”，cooking 是烹饪。"},
{i:959,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“Tuesday” 的意思是？",o:["星期一","星期二","星期四","星期三"],a:1,k:"词汇：星期 Tuesday",e:"Tuesday 星期二，缩写 Tue.，注意拼写 Tuesday。"},
{i:960,c:"en-2",ch:"五上·Unit 2 My week",f:1,q:"I often do homework and ____（读书）on the weekend.",o:[],a:"read books",k:"短语：read books 读书",e:"and 连接两个并列的动作：do homework and read books（做作业和读书）。"},
{i:961,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"一周的第一天（英语习惯）是？",o:["Sunday","Friday","Monday","Saturday"],a:0,k:"文化常识：一周的第一天",e:"英语国家习惯把 Sunday（星期日）作为一周的第一天，Sunday 在最前。"},
{i:962,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“Thursday” 的意思是？",o:["星期二","星期三","星期五","星期四"],a:3,k:"词汇：星期 Thursday",e:"Thursday 星期四，缩写 Thu.，注意拼写与 Tuesday 区分。"},
{i:963,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"——Do you often watch TV?——____",o:["Yes, I do homework.","No, I can't.","Yes, I am.","No, I don't. I often read books."],a:3,k:"句型：Do you often...? 的回答",e:"问“你经常看电视吗？”否定回答 No, I don't.，补充 I often read books.。"},
{i:964,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“play sports” 的意思是？",o:["做运动","做作业","玩玩具","看电视"],a:0,k:"短语：play sports 做运动",e:"play sports 意为“做运动、锻炼”，sports 是 sport 的复数。"},
{i:965,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“What do you have on Thursdays?” 中 have 的意思是？",o:["吃","拥有","有","上（课）"],a:3,k:"句型：have 的用法",e:"问课程时 What do you have...? 中 have 表示“上（课）”，I have maths. 我上数学课。"},
{i:966,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“I like weekends.” 意思是？",o:["我喜欢工作日","我喜欢周末","我喜欢放假","我喜欢星期一"],a:1,k:"句型：like + 名词",e:"I like weekends. 意为“我喜欢周末”，weekends 是周末（复数泛指）。"},
{i:967,c:"en-2",ch:"五上·Unit 2 My week",f:1,q:"——What do you do on the weekend?——I often ____（洗衣服）.",o:[],a:"wash my clothes",k:"短语：wash my clothes 洗衣服",e:"wash my clothes 洗我的衣服，wash 洗，clothes 衣服。"},
{i:968,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“on the weekend” 的意思是？",o:["在晚上","在周末","在工作日","在早上"],a:1,k:"短语：on the weekend 在周末",e:"on the weekend 在周末（英式也用 at the weekend），on + 具体时间。"},
{i:969,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"下面哪个不是课程？",o:["maths","Chinese","English","football"],a:3,k:"词汇分类：课程",e:"English（英语）、maths（数学）、Chinese（语文）是课程，football（足球）是运动。"},
{i:970,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“I often play football with my friends.” 意思是？",o:["我经常一个人踢足球","我不会踢足球","我经常和朋友踢足球","我讨厌踢足球"],a:2,k:"句型：with 和……一起",e:"I often play football with my friends. 意为“我经常和朋友踢足球”，with 是和……一起。"},
{i:971,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“You should play sports every day.” 中 should 意思是？",o:["可以","想要","必须","应该"],a:3,k:"词汇：情态动词 should",e:"should 意为“应该”，You should... 是“你应该……”，表示建议。"},
{i:972,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"——What day is it today?——____",o:["I like it.","It's sunny.","I have English.","It's Monday."],a:3,k:"句型：What day is it today?",e:"问“今天星期几？”答语用 It's + 星期：It's Monday.（星期一。）"},
{i:973,c:"en-2",ch:"五上·Unit 2 My week",f:0,q:"“We have art on Fridays.” 意思是？",o:["我们星期五有科学课","我们星期五有体育课","我们星期五有美术课","我们星期五有音乐课"],a:2,k:"句型：have art 上美术课",e:"We have art on Fridays. 意为“我们星期五有美术课”，art 是美术。"},
{i:974,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“sandwich” 的意思是？",o:["汉堡包","三明治","沙拉","冰淇淋"],a:1,k:"词汇：食物 sandwich",e:"sandwich 三明治，注意拼写，复数 sandwiches。"},
{i:975,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“salad” 的意思是？",o:["三明治","面条","米饭","沙拉"],a:3,k:"词汇：食物 salad",e:"salad 沙拉，如 vegetable salad（蔬菜沙拉）。"},
{i:976,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“汉堡包”用英语怎么说？",o:["cake","sandwich","hamburger","bread"],a:2,k:"词汇：食物 hamburger",e:"hamburger 汉堡包，口语常说 burger。"},
{i:977,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“ice cream” 的意思是？",o:["牛奶","冰淇淋","果汁","蛋糕"],a:1,k:"词汇：食物 ice cream",e:"ice cream 冰淇淋，由 ice（冰）+ cream（奶油）组成。"},
{i:978,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“tea” 的意思是？",o:["牛奶","水","咖啡","茶"],a:3,k:"词汇：饮品 tea",e:"tea 茶，green tea 绿茶、milk tea 奶茶。"},
{i:979,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“fresh” 的意思是？",o:["新鲜的","甜的","辣的","美味的"],a:0,k:"词汇：fresh 新鲜的",e:"fresh 新鲜的，如 fresh vegetables（新鲜蔬菜）。"},
{i:980,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“healthy” 的意思是？",o:["好吃的","健康的","便宜的","大的"],a:1,k:"词汇：healthy 健康的",e:"healthy 健康的，由 health（健康）+ y 组成，healthy food 健康食品。"},
{i:981,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“delicious” 的意思是？",o:["辣的","美味的","甜的","新鲜的"],a:1,k:"词汇：delicious 美味的",e:"delicious 美味的、可口的，是形容食物好吃的常用词。"},
{i:982,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“甜的”用英语怎么说？",o:["hot","healthy","fresh","sweet"],a:3,k:"词汇：sweet 甜的",e:"sweet 甜的，反义词是 sour（酸的）。"},
{i:983,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“hot” 在食物中意思是？",o:["冷的","热的","辣的","甜的"],a:2,k:"词汇：hot 双义",e:"hot 有两个意思：热的（天气热）和辣的（食物辣）。"},
{i:984,c:"en-3",ch:"五上·Unit 3 What would you like?",f:1,q:"——What would you like to eat?——I'd like a ____（三明治）.",o:[],a:"sandwich",k:"句型：I'd like... 想要",e:"I'd like = I would like，意为“我想要”，I'd like a sandwich.（我想要一个三明治。）"},
{i:985,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"——What would you like to drink?——____",o:["I like tea.","I want tea.","I'd like some tea.","I'd like a sandwich."],a:2,k:"句型：What would you like to drink?",e:"问“你想喝什么？”答语用 I'd like some + 饮品：I'd like some tea.（我想要点茶。）"},
{i:986,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"——Would you like some salad?——____",o:["Yes, I do.","Yes, I am.","No, I don't.","Yes, please."],a:3,k:"句型：Would you like...? 的回答",e:"Would you like...? 是“你想要……吗？”肯定回答 Yes, please.，否定 No, thanks.。"},
{i:987,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“What would you like to eat?” 的意思是？",o:["你喜欢什么？","你想喝什么？","你想吃什么？","你要什么？"],a:2,k:"句型：What would you like to eat?",e:"eat 吃、drink 喝，问“你想吃什么？”用 What would you like to eat?。"},
{i:988,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“I'd like” 是哪个的缩写？",o:["I would like","I had like","I will like","I do like"],a:0,k:"语法：I'd like 的构成",e:"I'd like 是 I would like 的缩写，意为“我想要”，是礼貌的表达。"},
{i:989,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“I love ice cream. It's sweet.” 意思是？",o:["冰淇淋很健康","我爱吃冰淇淋，它是辣的","我讨厌冰淇淋","我爱吃冰淇淋，它是甜的"],a:3,k:"句型：love + 名词",e:"I love ice cream. 我爱吃冰淇淋。It's sweet. 它是甜的。"},
{i:990,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“My favourite food is beef noodles.” 意思是？",o:["我最喜欢的食物是牛肉面","我不喜欢牛肉面","我最喜欢的食物是米饭","牛肉面很贵"],a:0,k:"句型：My favourite food is...",e:"My favourite food is... 意为“我最喜欢的食物是……”，favourite 最喜欢的。"},
{i:991,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“favourite” 的意思是？",o:["讨厌的","最喜欢的","特别的","普通的"],a:1,k:"词汇：favourite 最喜欢的",e:"favourite 最喜欢的，英式拼写；美式拼写 favorite。"},
{i:992,c:"en-3",ch:"五上·Unit 3 What would you like?",f:1,q:"——What's your favourite food?——I like ____（沙拉）best.",o:[],a:"salad",k:"句型：like...best 最喜欢",e:"like...best 意为“最喜欢”，I like salad best.（我最喜欢沙拉。）"},
{i:993,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“It's hot.” 形容辣椒（chilli）时表示？",o:["热的","甜的","辣的","凉的"],a:2,k:"词汇：hot 辣的",e:"形容食物时 hot 表示“辣的”，The chilli is hot.（辣椒很辣。）"},
{i:994,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“I'm hungry.” 意思是？",o:["我累了","我饱了","我渴了","我饿了"],a:3,k:"词汇：hungry 饿的",e:"hungry 饿的，thirsty 渴的，I'm hungry.（我饿了。）"},
{i:995,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"——What's your favourite drink?——____",o:["I'm thirsty.","I drink water.","I like milk best.","I want tea."],a:2,k:"句型：favourite drink",e:"问“你最喜欢的饮品是什么？”答语 I like milk best.（我最喜欢牛奶。）"},
{i:996,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“eat” 和 “drink” 分别表示？",o:["跑、跳","吃、喝","看、听","喝、吃"],a:1,k:"词汇：eat/drink",e:"eat 吃，drink 喝，eat and drink 吃喝。"},
{i:997,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“A hamburger, please.” 用于什么场景？",o:["问路","告别","点餐","打招呼"],a:2,k:"句型：点餐用语",e:"“A hamburger, please.” 是点餐用语，意为“请给我一个汉堡包”。"},
{i:998,c:"en-3",ch:"五上·Unit 3 What would you like?",f:1,q:"Tomatoes are ____（新鲜的）and healthy.",o:[],a:"fresh",k:"词汇：fresh 新鲜的",e:"Tomatoes are fresh and healthy.（西红柿新鲜又健康。）fresh 新鲜的。"},
{i:999,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“Here you are.” 的意思是？",o:["给你","你好","谢谢","再见"],a:0,k:"交际用语：Here you are.",e:"Here you are. 意为“给你”，是递东西时的常用语。"},
{i:1000,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“Thank you.” 的回应是？",o:["Thank you.","OK.","Sorry.","You're welcome."],a:3,k:"交际用语：感谢的回应",e:"回应 Thank you. 用 You're welcome.（不客气。）"},
{i:1001,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“I don't like grapes. They're sour.” 中 sour 意思是？",o:["甜的","辣的","酸的","苦的"],a:2,k:"词汇：sour 酸的",e:"sour 酸的，反义词 sweet 甜的，grapes 葡萄。"},
{i:1002,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“What would you like to drink?” 的答语是？",o:["Some juice, please.","I like dogs.","A book, please.","I am fine."],a:0,k:"句型：drink 饮品的答语",e:"问想喝什么，答 Some juice, please.（来点果汁。）juice 是饮品。"},
{i:1003,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“vegetables” 的意思是？",o:["肉类","面包","水果","蔬菜"],a:3,k:"词汇：vegetables 蔬菜",e:"vegetables 蔬菜，单数 vegetable，如 tomatoes、potatoes 都是蔬菜。"},
{i:1004,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“We should eat healthy food.” 意思是？",o:["我们应该吃健康的食物","我们应该吃很多食物","我们应该少吃","我们应该吃辣的食物"],a:0,k:"句型：should + 动词原形",e:"We should eat healthy food. 意为“我们应该吃健康的食物”，should 后接动词原形。"},
{i:1005,c:"en-3",ch:"五上·Unit 3 What would you like?",f:0,q:"“Can I have some water, please?” 中 Can I 意思是？",o:["我想要","我可以……吗","我能……","我需要"],a:1,k:"句型：Can I...? 请求",e:"Can I have...? 意为“我可以要……吗？”，是礼貌请求的句型。"},
{i:1006,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“sing” 的意思是？",o:["唱歌","跑步","跳舞","画画"],a:0,k:"词汇：sing 唱歌",e:"sing 唱歌，sing a song 唱一首歌。"},
{i:1007,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“跳舞”用英语怎么说？",o:["swim","draw","sing","dance"],a:3,k:"词汇：dance 跳舞",e:"dance 跳舞，dance to the music 随着音乐跳舞。"},
{i:1008,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“draw” 的意思是？",o:["画画","写字","唱歌","跳舞"],a:0,k:"词汇：draw 画画",e:"draw 画画，draw a picture 画一幅画。"},
{i:1009,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“cook” 的意思是？",o:["吃","做饭","洗","买"],a:1,k:"词汇：cook 做饭",e:"cook 做饭，cook dinner 做晚饭。"},
{i:1010,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“swim” 的意思是？",o:["打球","跑步","游泳","跳高"],a:2,k:"词汇：swim 游泳",e:"swim 游泳，现在分词 swimming（双写 m）。"},
{i:1011,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“打篮球”用英语怎么说？",o:["play football","play ping-pong","play basketball","play volleyball"],a:2,k:"短语：play basketball 打篮球",e:"play basketball 打篮球，球类运动前不加 the。"},
{i:1012,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“speak English” 的意思是？",o:["说英语","学英语","写英语","读英语"],a:0,k:"短语：speak English 说英语",e:"speak English 说英语，speak + 语言，如 speak Chinese 说中文。"},
{i:1013,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“do kung fu” 的意思是？",o:["练武术","打篮球","跑步","跳舞"],a:0,k:"短语：do kung fu 练武术",e:"do kung fu 练武术、打功夫，kung fu 是外来词。"},
{i:1014,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“play the pipa” 的意思是？",o:["弹钢琴","拉小提琴","弹琵琶","打鼓"],a:2,k:"短语：play the pipa 弹琵琶",e:"play the pipa 弹琵琶。乐器前要加 the，如 play the piano 弹钢琴。"},
{i:1015,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“What can you do?” 的意思是？",o:["你是谁？","你想要什么？","你喜欢什么？","你会做什么？"],a:3,k:"句型：What can you do?",e:"What can you do? 意为“你会做什么？”，can 是情态动词“能、会”。"},
{i:1016,c:"en-4",ch:"五上·Unit 4 What can you do?",f:1,q:"——What can you do?——I can ____（唱歌）.",o:[],a:"sing",k:"句型：I can + 动词原形",e:"回答 What can you do? 用 I can + 动词原形：I can sing.（我会唱歌。）"},
{i:1017,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"——Can you swim?——____",o:["Yes, I can.","Yes, I am.","Yes, I do.","Yes, I will."],a:0,k:"句型：Can you...? 的回答",e:"Can you...? 问“你会……吗？”肯定回答 Yes, I can.，否定 No, I can't.。"},
{i:1018,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“I can play the piano.” 中 the 说明 piano 是？",o:["运动","食物","动物","乐器"],a:3,k:"语法：乐器前加 the",e:"play + the + 乐器（如 the piano、the pipa）；play + 球类不加 the。"},
{i:1019,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“I can't dance.” 的否定形式，can't 是？",o:["不会、不能","必须","想要","会"],a:0,k:"词汇：can't 不会",e:"can't = cannot，意为“不会、不能”，I can't dance.（我不会跳舞。）"},
{i:1020,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“What about you?” 的意思是？",o:["你是谁？","你几岁？","你呢？","你在哪？"],a:2,k:"句型：What about you?",e:"What about you? 意为“你呢？”，用于反问对方同样的问题。"},
{i:1021,c:"en-4",ch:"五上·Unit 4 What can you do?",f:1,q:"——Can you ____（游泳）?——Yes, I can.",o:[],a:"swim",k:"句型：Can you...? 问能力",e:"Can you swim? 你会游泳吗？can 后接动词原形 swim。"},
{i:1022,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“I can sing English songs.” 意思是？",o:["我会唱英文歌","我会写英文歌","我喜欢英文歌","我会唱中文歌"],a:0,k:"句型：I can sing...",e:"I can sing English songs. 意为“我会唱英文歌”，song 歌。"},
{i:1023,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“party” 的意思是？",o:["比赛","聚会","作业","考试"],a:1,k:"词汇：party 聚会",e:"party 聚会、派对，have a party 举行聚会。"},
{i:1024,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"——Can you do any kung fu?——____",o:["No, I don't.","No, I can't.","No, I am not.","No, I won't."],a:1,k:"句型：Can you...? 否定回答",e:"Can you...? 的否定回答 No, I can't.，助动词用 can。"},
{i:1025,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“I can draw cartoons.” 中 cartoon 意思是？",o:["照片","地图","卡通画","表格"],a:2,k:"词汇：cartoon 卡通",e:"cartoon 卡通画、漫画，draw cartoons 画卡通画。"},
{i:1026,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“next” 在 “next Tuesday” 中意思是？",o:["前（个）","这（个）","上（个）","下（个）"],a:3,k:"词汇：next 下一个",e:"next 下一个，next Tuesday 下周二，last Tuesday 上周二。"},
{i:1027,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“wonderful” 的意思是？",o:["安静的","普通的","糟糕的","精彩的"],a:3,k:"词汇：wonderful 精彩的",e:"wonderful 精彩的、极好的，a wonderful party 精彩的聚会。"},
{i:1028,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“I can cook delicious food.” 意思是？",o:["我会吃美味的食物","我喜欢美味的食物","我不会做饭","我会做美味的食物"],a:3,k:"句型：can + 动词原形",e:"I can cook delicious food. 意为“我会做美味的食物”，cook 做饭。"},
{i:1029,c:"en-4",ch:"五上·Unit 4 What can you do?",f:1,q:"I can do ____ ____（武术）.",o:[],a:"kung fu",k:"短语：do kung fu 练武术",e:"do kung fu 练武术，固定搭配，注意拼写 kung fu。"},
{i:1030,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“Can you play basketball?” 的否定回答是？",o:["No, I am not.","No, I don't.","No, I can't.","No, I didn't."],a:2,k:"句型：Can 问句的回答",e:"Can 开头的一般疑问句，否定回答用 No, I can't.。"},
{i:1031,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“I can help you.” 的意思是？",o:["我不帮你","我能帮助你","你能帮助我","谢谢你的帮助"],a:1,k:"句型：I can help you.",e:"I can help you. 意为“我能帮助你”，help 帮助。"},
{i:1032,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“Let's have a party!” 中 Let's 是？",o:["我们","他们","你们","让我们"],a:3,k:"句型：Let's = Let us",e:"Let's = Let us，意为“让我们”，Let's have a party! 让我们开个派对吧！"},
{i:1033,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“I can't do any kung fu.” 中 any 用于？",o:["问句","肯定句","否定句","感叹句"],a:2,k:"语法：any 用于否定句和疑问句",e:"any 常用于否定句和疑问句，I can't do any kung fu.（我一点武术也不会。）"},
{i:1034,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“What can you do for the party?” 意思是？",o:["你能为聚会做些什么？","聚会在哪？","聚会在什么时候？","你在哪聚会？"],a:0,k:"句型：What can you do for...?",e:"What can you do for the party? 意为“你能为聚会做些什么？”，for 为、为了。"},
{i:1035,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“I can draw pictures.” 中 draw pictures 意思是？",o:["拍照","写字","画画","看书"],a:2,k:"短语：draw pictures 画画",e:"draw pictures 画画，draw 画，picture 图画。"},
{i:1036,c:"en-4",ch:"五上·Unit 4 What can you do?",f:0,q:"“have a try” 的意思是？",o:["试一试","想一想","看一看","玩一玩"],a:0,k:"短语：have a try 试一试",e:"have a try 试一试，try 尝试，Let me have a try. 让我试试。"},

{i:1139,c:"en-8",ch:"五下·Unit 2 My favourite season",f:0,q:"“It's cold and snowy.” 意思是？",o:["天气下雨","天气又热又晴","天气很凉爽","天气又冷又下雪"],a:3,k:"句型：It's + 天气",e:"It's cold and snowy. 意为“天气寒冷又下雪”，snowy 下雪的。"},

{i:1144,c:"en-8",ch:"五下·Unit 2 My favourite season",f:1,q:"I like ____（秋天）because the leaves are pretty.",o:[],a:"autumn",k:"词汇：autumn 秋天",e:"I like autumn because the leaves are pretty.（我喜欢秋天，因为叶子很美。）"},
{i:1145,c:"en-8",ch:"五下·Unit 2 My favourite season",f:0,q:"“the leaves fall” 的意思是？",o:["叶子很多","叶子长大","树叶很绿","叶子落下"],a:3,k:"词汇：leaves/fall",e:"leaves 是 leaf 的复数“树叶”，fall 落下、掉落，秋天树叶落下。"},

{i:1155,c:"en-8",ch:"五下·Unit 2 My favourite season",f:0,q:"“go skiing” 的意思是？",o:["去滑冰","去滑雪","去跑步","去游泳"],a:1,k:"短语：go skiing 去滑雪",e:"go skiing 去滑雪，ski 滑雪，在冬天进行。"},
{i:1156,c:"en-8",ch:"五下·Unit 2 My favourite season",f:0,q:"“It's warm in spring.” 中 warm 意思是？",o:["凉爽的","炎热的","暖和的","寒冷的"],a:2,k:"词汇：warm 暖和的",e:"warm 暖和的，It's warm in spring.（春天天气暖和。）"},
{i:1157,c:"en-8",ch:"五下·Unit 2 My favourite season",f:0,q:"“I can pick apples in autumn.” 意思是？",o:["秋天我可以摘苹果","秋天我可以种花","秋天我可以滑雪","秋天我可以游泳"],a:0,k:"句型：pick apples 摘苹果",e:"I can pick apples in autumn. 意为“秋天我可以摘苹果”，摘苹果是秋天的活动。"},

{i:1182,c:"en-9",ch:"五下·Unit 3 My school calendar",f:1,q:"——When is the trip?——It's in ____（十月）.",o:[],a:"October",k:"句型：When is...? It's in...",e:"问“旅行什么时候？”答语用 It's in + 月份：It's in October.（在十月。）"},
{i:1183,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“When is the party?” 中 When 问？",o:["地点","原因","时间","人物"],a:2,k:"句型：When 问时间",e:"When is the party? 问“聚会是什么时候？”，When 询问时间。"},
{i:1184,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“Easter” 的意思是？",o:["复活节","感恩节","春节","圣诞节"],a:0,k:"文化常识：Easter 复活节",e:"Easter 复活节，在每年春季，人们会画复活节彩蛋（Easter eggs）。"},
{i:1185,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“There are twelve months in a year.” 意思是？",o:["一年有十二个月","一周有七天","一年有四个季节","一个月有三十天"],a:0,k:"句型：There are... in a year",e:"There are twelve months in a year. 意为“一年有十二个月”。"},
{i:1186,c:"en-9",ch:"五下·Unit 3 My school calendar",f:1,q:"My birthday is in ____（五月）.",o:[],a:"May",k:"句型：My birthday is in...",e:"My birthday is in May.（我的生日在五月。）in + 月份。"},
{i:1187,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“in October” 表示？",o:["到十月","在十月一号","在十月","从十月"],a:2,k:"介词：in + 月份",e:"in + 月份表示“在……月”，in October 在十月；具体某日用 on。"},
{i:1188,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“We'll go to the Great Wall.” 中 We'll 是？",o:["我们正在","我们能够","我们曾经","我们将要"],a:3,k:"语法：We'll = We will",e:"We'll 是 We will 的缩写，意为“我们将要”，表示将来。"},
{i:1189,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“a few” 的意思是？",o:["没有","一些（修饰不可数名词）","许多","一些（修饰可数名词）"],a:3,k:"语法：a few 修饰可数名词",e:"a few 一些（修饰可数名词复数），a little 一些（修饰不可数名词）。"},
{i:1190,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“the Great Wall” 的意思是？",o:["高墙","围墙","长城","大墙"],a:2,k:"专有名词：the Great Wall 长城",e:"the Great Wall 长城，We'll go to the Great Wall.（我们将去长城。）"},
{i:1191,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“When is Children's Day?” 正确答案是？",o:["It's in June.","It's in April.","It's in May.","It's in July."],a:0,k:"文化常识：儿童节",e:"Children's Day（儿童节）在 June 1st（六月一日），所以答 It's in June.。"},
{i:1192,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“Teachers' Day” 在几月？",o:["October","July","September","August"],a:2,k:"文化常识：教师节",e:"Teachers' Day（教师节）在 September 10th（九月十日）。"},
{i:1193,c:"en-9",ch:"五下·Unit 3 My school calendar",f:1,q:"——When is the sports meet?——It's in ____（四月）.",o:[],a:"April",k:"句型：When is the sports meet?",e:"When is the sports meet? 问“运动会什么时候？”答 It's in April.（在四月。）"},
{i:1194,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“English test” 的意思是？",o:["英语课","英语测试","英语老师","英语书"],a:1,k:"短语：English test 英语测试",e:"English test 英语测试，test 测试、考试。"},
{i:1195,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“I'll make a card.” 中 make a card 意思是？",o:["做一张卡片","画一幅画","买一本书","写一封信"],a:0,k:"短语：make a card 做卡片",e:"make a card 做卡片，I'll make a card for my mum.（我要给妈妈做一张卡片。）"},
{i:1196,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“What will you do for your mum?” 中 mum 意思是？",o:["老师","爸爸","奶奶","妈妈"],a:3,k:"词汇：mum 妈妈",e:"mum 妈妈（英式），美式 mom。"},
{i:1197,c:"en-9",ch:"五下·Unit 3 My school calendar",f:0,q:"“I'll cook for my mother.” 意思是？",o:["我要买饭给妈妈","我要为妈妈做饭","妈妈为我做饭","我要和妈妈一起吃饭"],a:1,k:"句型：I'll + 动词原形",e:"I'll cook for my mother. 意为“我要为妈妈做饭”，cook for 为……做饭。"},
{i:1198,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“第一”的序数词是？",o:["first","third","one","second"],a:0,k:"语法：序数词 first",e:"first 第一，基数词 one 变序数词 first（不规则变化）。"},
{i:1199,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“second” 的意思是？",o:["第一","第四","第三","第二"],a:3,k:"语法：序数词 second",e:"second 第二，基数词 two 变序数词 second（不规则变化）。"},
{i:1200,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“第三”的序数词是？",o:["first","three","third","fourth"],a:2,k:"语法：序数词 third",e:"third 第三，基数词 three 变序数词 third（不规则变化）。"},
{i:1201,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“fourth” 的意思是？",o:["第四","第五","第三","第二"],a:0,k:"语法：序数词 fourth",e:"fourth 第四，four 变 fourth，直接在基数词后加 th。"},
{i:1202,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“第五”的序数词是？",o:["five","fifth","sixth","fourth"],a:1,k:"语法：序数词 fifth",e:"fifth 第五，five 变 fifth，注意把 ve 改成 f 再加 th。"},
{i:1203,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“twelfth” 的意思是？",o:["第二十","第十二","第二","第十"],a:1,k:"语法：序数词 twelfth",e:"twelfth 第十二，twelve 变 twelfth，ve 改 f 再加 th。"},
{i:1204,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“第二十”的序数词是？",o:["twenty-first","twentieth","twenty","twelfth"],a:1,k:"语法：序数词 twentieth",e:"twentieth 第二十，twenty 变 y 为 i 再加 eth。"},
{i:1205,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“twenty-first” 的意思是？",o:["第二十一","第二十","第三十","第十二"],a:0,k:"语法：twenty-first 第二十一",e:"twenty-first 第二十一，几十几的序数词只变个位：twenty-first。"},
{i:1206,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“special” 的意思是？",o:["特别的","忙碌的","高兴的","普通的"],a:0,k:"词汇：special 特别的",e:"special 特别的、特殊的，a special day 特别的一天。"},
{i:1207,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“festival” 的意思是？",o:["节日","生日","假期","周末"],a:0,k:"词汇：festival 节日",e:"festival 节日，the Spring Festival 春节。"},
{i:1208,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“show” 在 “art show” 中意思是？",o:["观看","展示","告诉","展览、演出"],a:3,k:"词汇：show 展览",e:"show 展览、演出，art show 艺术展、美术展。"},
{i:1209,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“contest” 的意思是？",o:["聚会","旅行","比赛","展览"],a:2,k:"词汇：contest 比赛",e:"contest 比赛、竞赛，a singing contest 歌唱比赛。"},
{i:1210,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:1,q:"——When is the art show?——It's on May ____（第一）.",o:[],a:"first",k:"句型：日期表达 on May 1st",e:"It's on May first.（在五月一日。）具体某日用 on + 月 + 序数词。"},
{i:1211,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“on May 1st” 中 on 表示？",o:["在月份","在具体某天","在年份","在季节"],a:1,k:"介词：on + 具体日期",e:"on + 具体某天（on May 1st），in + 月份（in May）。"},
{i:1212,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"——When is your birthday?——____",o:["It's in spring.","I'm ten.","It's on March 3rd.","It's sunny."],a:2,k:"句型：When is your birthday?",e:"问“你的生日是什么时候？”答 It's on + 具体日期：It's on March 3rd.。"},
{i:1213,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“birthday” 的意思是？",o:["星期日","生日","节日","假日"],a:1,k:"词汇：birthday 生日",e:"birthday 生日，Happy birthday! 生日快乐！"},
{i:1214,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:1,q:"“October 2nd” 读作 October the ____.",o:[],a:"second",k:"日期读法：2nd 读 second",e:"2nd 是 second（第二）的缩写，October 2nd 读作 October the second。"},
{i:1215,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“There are special days in April.” 意思是？",o:["四月有很多天","四月里有一些特别的日子","四月是节日","四月很特别"],a:1,k:"句型：There are special days",e:"There are special days in April. 意为“四月里有一些特别的日子”。"},
{i:1216,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“The singing contest will be in May.” 中 singing 意思是？",o:["跑步","跳舞","歌唱","画画"],a:2,k:"词汇：singing 歌唱",e:"singing 歌唱（sing 的 ing 形式），a singing contest 歌唱比赛。"},
{i:1217,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“on April 1st” 是愚人节，英语是？",o:["New Year's Day","April Fool's Day","Easter Day","Christmas Day"],a:1,k:"文化常识：愚人节",e:"April Fool's Day 愚人节（4月1日），人们会开善意的玩笑。"},
{i:1218,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“first, second, third” 是？",o:["地点词","序数词","基数词","时间词"],a:1,k:"语法：序数词",e:"first、second、third 都是序数词（表顺序），对应基数词 one、two、three。"},
{i:1219,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“one, two, three” 是？",o:["时间词","地点词","序数词","基数词"],a:3,k:"语法：基数词",e:"one、two、three 是基数词（表数量），对应序数词 first、second、third。"},
{i:1220,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“When is the English test?” 中 test 意思是？",o:["比赛","演出","测试","聚会"],a:2,k:"词汇：test 测试",e:"test 测试、考试，an English test 英语测试。"},
{i:1221,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:1,q:"——When is your birthday?——It's on June ____（第十二）.",o:[],a:"twelfth",k:"语法：序数词 twelfth",e:"第十二 twelfth，June 12th 读作 June the twelfth。"},
{i:1222,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“We'll have an English party.” 意思是？",o:["英语很难","我们正在上英语课","我们将举行英语聚会","我们喜欢英语"],a:2,k:"句型：We'll have...",e:"We'll have an English party. 意为“我们将举行英语聚会”，We'll = We will。"},
{i:1223,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“What's the date today?” 问的是？",o:["今天星期几","几点钟","今天天气","今天几月几号"],a:3,k:"句型：What's the date? 问日期",e:"What's the date today? 问“今天几月几号？”（日期）；What day is it today? 问星期。"},
{i:1224,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“It's on May 5th.” 中 5th 读作？",o:["fifth of May","the fifth of May","five","the fifth"],a:3,k:"日期读法：5th 读 fifth",e:"5th 是 fifth（第五）的缩写，May 5th 读作 May the fifth。"},
{i:1225,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“New Year's Day” 是几月几日？",o:["12月25日","5月1日","1月1日","2月1日"],a:2,k:"文化常识：元旦",e:"New Year's Day 元旦在 January 1st（1月1日）。"},
{i:1226,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“National Day” 是几月几日？",o:["7月1日","6月1日","10月1日","9月10日"],a:2,k:"文化常识：国庆节",e:"National Day 国庆节在 October 1st（10月1日）。"},
{i:1227,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“last” 在 “last year” 中意思是？",o:["上一个","下一个","这个","每个"],a:0,k:"词汇：last 上一个",e:"last 上一个，last year 去年，next year 明年。"},
{i:1228,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“What will you do on your birthday?” 意思是？",o:["你的生日在什么时候？","你喜欢生日吗？","你生日那天要做什么？","你几岁了？"],a:2,k:"句型：What will you do...?",e:"What will you do on your birthday? 意为“你生日那天要做什么？”，will 表将来。"},
{i:1229,c:"en-10",ch:"五下·Unit 4 When is the art show?",f:0,q:"“I'll eat some noodles on my birthday.” 意思是？",o:["我生日那天要吃面条","我每天吃面条","我生日那天要吃蛋糕","我喜欢吃面条"],a:0,k:"句型：I'll + 动词原形",e:"I'll eat some noodles on my birthday. 意为“我生日那天要吃面条”（中国人过生日吃长寿面）。"},
{i:1230,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“mine” 的意思是？",o:["她的（东西）","他的（东西）","你的（东西）","我的（东西）"],a:3,k:"语法：名词性物主代词 mine",e:"mine 我的（东西），名词性物主代词，= my + 名词，如 The book is mine.。"},
{i:1231,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“yours” 的意思是？",o:["你的（东西）","我的（东西）","他的（东西）","他们的（东西）"],a:0,k:"语法：名词性物主代词 yours",e:"yours 你的（东西），= your + 名词，如 It's yours.。"},
{i:1232,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“his” 作为物主代词意思是？",o:["你的（东西）","她的（东西）","我的（东西）","他的（东西）"],a:3,k:"语法：物主代词 his",e:"his 他的（形容词性：his book；名词性：The book is his.）。"},
{i:1233,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“hers” 的意思是？",o:["他的（东西）","我们的（东西）","她们的（东西）","她的（东西）"],a:3,k:"语法：名词性物主代词 hers",e:"hers 她的（东西），= her + 名词，如 The bag is hers.。"},
{i:1234,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“theirs” 的意思是？",o:["他们的（东西）","我的（东西）","你的（东西）","我们的（东西）"],a:0,k:"语法：名词性物主代词 theirs",e:"theirs 他们的（东西），= their + 名词，如 The books are theirs.。"},
{i:1235,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“ours” 的意思是？",o:["我们的（东西）","他们的（东西）","她的（东西）","你们的（东西）"],a:0,k:"语法：名词性物主代词 ours",e:"ours 我们的（东西），= our + 名词，如 The classroom is ours.。"},
{i:1236,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“whose” 的意思是？",o:["谁的","怎样","什么","哪里"],a:0,k:"语法：疑问词 whose",e:"whose 谁的，Whose dog is it? 这是谁的狗？"},
{i:1237,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“climbing” 的意思是？",o:["正在跳","正在爬","正在吃","正在玩"],a:1,k:"语法：现在分词 climbing",e:"climbing 正在爬（climb + ing），The monkey is climbing. 猴子正在爬。"},
{i:1238,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“eating” 的意思是？",o:["正在睡","正在跑","正在喝","正在吃"],a:3,k:"语法：现在分词 eating",e:"eating 正在吃（eat + ing），The dog is eating. 狗正在吃。"},
{i:1239,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“playing” 的意思是？",o:["正在工作","正在学习","正在看书","正在玩"],a:3,k:"语法：现在分词 playing",e:"playing 正在玩（play + ing），The children are playing. 孩子们正在玩。"},
{i:1240,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“jumping” 的意思是？",o:["正在跳","正在跑","正在爬","正在走"],a:0,k:"语法：现在分词 jumping",e:"jumping 正在跳（jump + ing），The rabbit is jumping. 兔子正在跳。"},
{i:1241,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“drinking” 的意思是？",o:["正在吃","正在看","正在睡","正在喝"],a:3,k:"语法：现在分词 drinking",e:"drinking 正在喝（drink + ing），The cat is drinking water. 猫正在喝水。"},
{i:1242,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“sleeping” 的意思是？",o:["正在吃饭","正在睡觉","正在唱歌","正在跑步"],a:1,k:"语法：现在分词 sleeping",e:"sleeping 正在睡觉（sleep + ing），The dog is sleeping. 狗正在睡觉。"},
{i:1243,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:1,q:"——Whose dog is it?——It's ____（我的）.",o:[],a:"mine",k:"句型：Whose...is it? It's mine.",e:"Whose dog is it? 问“这是谁的狗？”答 It's mine.（是我的。）mine 名词性物主代词。"},
{i:1244,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"——Whose book is this?——It's ____.",o:["her","he","she","hers"],a:3,k:"语法：名词性物主代词",e:"回答 Whose 的问句用名词性物主代词：It's hers.（是她的。）hers = her book。"},
{i:1245,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“The dog is sleeping.” 表示动作？",o:["经常发生","已经完成","将要发生","正在进行"],a:3,k:"语法：现在进行时",e:"be + 动词ing 构成现在进行时，表示动作正在进行：The dog is sleeping. 狗正在睡觉。"},
{i:1246,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“Is it yours?” 的肯定回答是？",o:["Yes, it is.","Yes, I do.","Yes, I am.","Yes, it does."],a:0,k:"句型：Is it yours? 的回答",e:"Is it yours? 问“是你的吗？”肯定回答 Yes, it is.。"},
{i:1247,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:1,q:"Look! The cat is ____（正在爬）the tree.",o:[],a:"climbing",k:"语法：现在进行时 climbing",e:"Look! The cat is climbing the tree.（看！猫正在爬树。）is + climbing。"},
{i:1248,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“These are our books. They're ____.”",o:["ours","us","we","our"],a:0,k:"语法：名词性物主代词 ours",e:"They're ours. 是我们的。ours = our books，避免名词重复。"},
{i:1249,c:"en-11",ch:"五下·Unit 5 Whose dog is it?",f:0,q:"“My dog is very cute.” 中 cute 意思是？",o:["瘦小的","凶猛的","可爱的","高大的"],a:2,k:"词汇：cute 可爱的",e:"cute 可爱的、机灵的，a cute dog 可爱的狗。"},

{i:13,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:0,q:"下列哪个词表示“很大”？（ ）",o:["大","小","短","轻"],a:0,k:"大小描述物体体积",e:"解析：大和小用来形容物体的大小。"},
{i:14,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:0,q:"用天平或手掂一掂，可以比较物体的（ ）。",o:["轻重","颜色","气味","声音"],a:0,k:"掂一掂比轻重",e:"解析：用手掂或天平称，能知道哪个重哪个轻。"},
{i:15,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:0,q:"给物体按从短到长排队，最短的要放在（ ）。",o:["最前面","最后面","中间","随便放"],a:0,k:"排序从短到长由前到后",e:"解析：从短到长排队，最短的排第一（最前面）。"},
{i:16,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:0,q:"下列哪个杯子装的水最多？（ ）",o:["最大的杯子","最小的杯子","最轻的杯子","最红的杯子"],a:0,k:"容器越大装得越多",e:"解析：同样装满水时，杯子越大装的水越多。"},
{i:17,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:0,q:"用“拃（张开手掌）”可以粗略量物体的（ ）。",o:["长度","味道","颜色","温度"],a:0,k:"一拃量长度",e:"解析：张开大拇指到小指的距离叫一拃，可量长短。"},
{i:18,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:1,q:"比较两本书的厚薄，厚的那本排在____（前/后）。",o:[],a:"后",k:"厚薄比较",e:"解析：从薄到厚排队，厚的排在后面。"},
{i:19,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:0,q:"小明比小红高，说明小明的身高（ ）小红。",o:["大于","小于","等于","没关系"],a:0,k:"高表示身高数值大",e:"解析：高就是身高更长，数值更大。"},
{i:20,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:0,q:"下列哪个不是测量的工具？（ ）",o:["故事书","尺子","天平","量杯"],a:0,k:"故事书不是测量工具",e:"解析：尺子量长度、天平称轻重、量杯量体积，故事书不能测量。"},
{i:21,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:0,q:"把3块石头按从重到轻排，最重的应放在（ ）。",o:["最前面","最后面","中间","不用排"],a:0,k:"从重到轻重的在前",e:"解析：从重到轻，最重的排第一。"},
{i:22,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:1,q:"比较物体轻重最方便的办法之一是用手____一掂。",o:[],a:"掂",k:"掂量比较轻重",e:"解析：用手掂一掂能大概比较出哪个轻哪个重。"},
{i:23,c:"1sci-2",ch:"一上·第二单元 比较与测量",f:0,q:"下列物体中，通常最轻的是（ ）。",o:["一片羽毛","一块砖头","一桶水","一本书"],a:0,k:"羽毛很轻",e:"解析：羽毛又轻又软，比砖头、水、书都轻得多。"},
// ===== 第3章 一下·第一单元 我们周围的物体 =====
{i:24,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:0,q:"下列可以用眼睛直接看到的是物体的（ ）。",o:["颜色","味道","重量","温度"],a:0,k:"眼睛看颜色形状",e:"解析：颜色用眼睛看，味道要尝、重量要掂、温度要摸或用温度计。"},
{i:25,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:0,q:"乒乓球和铁球大小一样时，铁球比乒乓球（ ）。",o:["重","轻","一样重","没区别"],a:0,k:"材料不同轻重不同",e:"解析：铁比塑料密，同样大小铁球重得多。"},
{i:26,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:0,q:"下列说法正确的是（ ）。",o:["物体的形状有方有圆","所有物体都是方形","物体都没有颜色","物体都不能摸"],a:0,k:"物体形状多样",e:"解析：我们周围的物体形状各种各样，有方有圆。"},
{i:27,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:0,q:"区分盐和糖，最好用（ ）。",o:["尝一尝味道","看颜色","量长度","称重量"],a:0,k:"尝味道区分盐糖",e:"解析：盐和糖看起来像，但盐咸糖甜，尝味道能区分（要在大人允许下）。"},
{i:28,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:0,q:"下列物体摸起来软软的是（ ）。",o:["棉花","石头","铁块","玻璃"],a:0,k:"棉花柔软",e:"解析：棉花蓬松柔软，石头、铁、玻璃都硬。"},
{i:29,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:0,q:"用耳朵能辨别物体的（ ）。",o:["声音","颜色","重量","形状"],a:0,k:"耳朵听声音",e:"解析：敲不同物体声音不同，耳朵用来听声音。"},
{i:30,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:1,q:"我们周围常见的物体有颜色、形状、软硬、____等不同。",o:[],a:"轻重",k:"物体的特征",e:"解析：物体可以从颜色、形状、软硬、轻重等方面描述。"},
{i:31,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:0,q:"下列能浮在水面上的是（ ）。",o:["木块","铁块","石头","玻璃珠"],a:0,k:"木头能浮水",e:"解析：木头比水轻会浮起来，铁、石、玻璃会沉。"},
{i:32,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:0,q:"玻璃杯摔碎后，它的（ ）改变了。",o:["形状","颜色变红","重量变大","味道变甜"],a:0,k:"破碎改变形状",e:"解析：杯子碎了形状变了，但颜色和轻重基本不变。"},
{i:33,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:0,q:"下列物体有气味的是（ ）。",o:["香水","干净的白纸","铁块","石头"],a:0,k:"香水有气味",e:"解析：香水有香味，白纸、铁、石头基本没气味。"},
{i:34,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:1,q:"观察物体时，我们可以用眼睛看、手摸、耳朵听、鼻子闻、舌头____。",o:[],a:"尝",k:"感官观察",e:"解析：用五官观察物体，但不认识的东西不能随便尝。"},
{i:35,c:"1sci-3",ch:"一下·第一单元 我们周围的物体",f:0,q:"下列最硬、不容易变形的是（ ）。",o:["铁块","海绵","棉花","橡皮泥"],a:0,k:"铁很硬",e:"解析：铁块坚硬，海绵、棉花、橡皮泥都能压变形。"},
// ===== 第4章 一下·第二单元 动物（常见动物与特征） =====
{i:36,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:0,q:"下列会飞的是（ ）。",o:["小鸟","金鱼","乌龟","蜗牛"],a:0,k:"鸟会飞",e:"解析：小鸟有翅膀会飞，金鱼游水、乌龟爬行、蜗牛慢爬。"},
{i:37,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:0,q:"金鱼生活在（ ）。",o:["水里","树上","天上","土里"],a:0,k:"鱼生活在水中",e:"解析：金鱼用鳃在水中呼吸，离开水会死。"},
{i:38,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:0,q:"蜗牛爬过的地方会留下（ ）。",o:["黏液痕迹","脚印","水洼","沙子"],a:0,k:"蜗牛分泌黏液",e:"解析：蜗牛身体分泌黏液，爬过会留亮亮的痕迹。"},
{i:39,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:0,q:"下列动物中由妈妈生下来、喝奶长大的是（ ）。",o:["小狗","小鸡","小鱼","小虫"],a:0,k:"狗是哺乳动物",e:"解析：小狗是哺乳动物，胎生、喝母乳；鸡是卵生。"},
{i:40,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:0,q:"蚂蚁的身体分成头、胸、（ ）三部分。",o:["腹","尾","翅","根"],a:0,k:"昆虫分头胸腹",e:"解析：蚂蚁是昆虫，身体分头、胸、腹三段。"},
{i:41,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:0,q:"下列有六条腿的昆虫是（ ）。",o:["蜜蜂","蜘蛛","蚯蚓","蛇"],a:0,k:"昆虫六条腿",e:"解析：蜜蜂是昆虫有6条腿；蜘蛛8条腿不是昆虫。"},
{i:42,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:1,q:"动物和植物一样，都是有____的物体（生物）。",o:[],a:"生命",k:"动物是生物",e:"解析：动物会吃、会动、会长大，是有生命的生物。"},
{i:43,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:0,q:"乌龟遇到危险会把头脚缩进（ ）。",o:["壳里","洞里的水","天上","树叶上"],a:0,k:"龟有硬壳保护",e:"解析：乌龟有硬壳，遇危险缩进壳里保护自己。"},
{i:44,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:0,q:"下列动物中在夜间活动、爱吃叶子的是（ ）。",o:["蜗牛","老鹰","鸭子","鲸鱼"],a:0,k:"蜗牛夜行食叶",e:"解析：蜗牛常在潮湿夜晚出来吃植物叶子。"},
{i:45,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:0,q:"我们用（ ）观察校园里的小动物最安全。",o:["不伤害、远一点看","用手抓起来","踩它","喂它吃糖"],a:0,k:"观察动物要爱护",e:"解析：观察小动物要爱护它们，不捕捉不伤害。"},
{i:46,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:1,q:"鱼用____在水中呼吸。",o:[],a:"鳃",k:"鱼用鳃呼吸",e:"解析：鱼头两侧有鳃，从水中取氧气呼吸。"},
{i:47,c:"1sci-4",ch:"一下·第二单元 动物（常见动物与特征）",f:0,q:"下列会唱歌（鸣叫）的是（ ）。",o:["蟋蟀","石头","书本","杯子"],a:0,k:"蟋蟀会鸣叫",e:"解析：蟋蟀摩擦翅膀会发出叫声，其它不是动物不会叫。"},
// ===== 第5章 一年级·水（特征、找水） =====
{i:48,c:"1sci-5",ch:"一年级·水（特征、找水）",f:0,q:"常温下，纯净的水是（ ）。",o:["无色透明液体","白色固体","黑色气体","红色液体"],a:0,k:"水是无色透明液体",e:"解析：水没有颜色、透明、会流动，是液体。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g1sci/water3.svg"},
{i:49,c:"1sci-5",ch:"一年级·水（特征、找水）",f:0,q:"水放在不同形状的杯子里，会（ ）。",o:["变成杯子的形状","变成方形","不变","变成球"],a:0,k:"液体没有固定形状",e:"解析：水没有固定形状，装什么容器就成什么形状。"},
{i:50,c:"1sci-5",ch:"一年级·水（特征、找水）",f:0,q:"下列能找到水的地方是（ ）。",o:["小河、水龙头","石头里","云里面单独","火里"],a:0,k:"水在河里水管里",e:"解析：河、湖、水龙头都有水；云是水蒸气凝成但不是直接可取的水。"},
{i:51,c:"1sci-5",ch:"一年级·水（特征、找水）",f:0,q:"用手摸一杯水，感觉（ ）。",o:["凉凉的、湿湿的","烫手","扎人","干干的"],a:0,k:"水凉而湿",e:"解析：水摸起来又湿又凉（常温），不会扎人。"},
{i:52,c:"1sci-5",ch:"一年级·水（特征、找水）",f:0,q:"水被加热到很热会冒出（ ）。",o:["水蒸气","火焰","石头","沙子"],a:0,k:"热水产生水蒸气",e:"解析：水烧开冒白气，那是水蒸气遇冷凝成的小水珠。"},
{i:53,c:"1sci-5",ch:"一年级·水（特征、找水）",f:0,q:"下列做法正确的是（ ）。",o:["喝水要喝干净的水","喝生河水没关系","把脏水倒进河里","不洗手"],a:0,k:"要喝干净的水",e:"解析：要喝干净安全的水，不乱倒脏水保护水源。"},
{i:54,c:"1sci-5",ch:"一年级·水（特征、找水）",f:1,q:"水没有固定的____，装进什么容器就变成什么形状。",o:[],a:"形状",k:"液体无固定形状",e:"解析：水是液体，没有固定形状，会随容器改变。"},
{i:55,c:"1sci-5",ch:"一年级·水（特征、找水）",f:0,q:"把水从杯子里倒进碗里，水的（ ）不变。",o:["多少（量）","颜色变红","味道变甜","形状固定"],a:0,k:"水的量不随容器变",e:"解析：倒来倒去，水的总量不变，只是容器形状变了。"},
{i:56,c:"1sci-5",ch:"一年级·水（特征、找水）",f:0,q:"很冷的时候，水会结成（ ）。",o:["冰","汽","火","沙"],a:0,k:"水结冰是固态",e:"解析：温度降到0℃以下，水结成冰，是固态。",img:"https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/assets/g1sci/water3.svg"},
{i:57,c:"1sci-5",ch:"一年级·水（特征、找水）",f:0,q:"下列能溶解在水里、让水变甜的是（ ）。",o:["糖","沙子","小石子","树叶"],a:0,k:"糖能溶于水",e:"解析：糖放进水里会化掉（溶解），水变甜；沙子不化。"},
{i:58,c:"1sci-5",ch:"一年级·水（特征、找水）",f:1,q:"水在很热时变成看不见的____（气体）。",o:[],a:"水蒸气",k:"水变水蒸气",e:"解析：水受热变成水蒸气，水蒸气是水的气体状态。"},
{i:59,c:"1sci-5",ch:"一年级·水（特征、找水）",f:0,q:"水的作用很多，下列正确的是（ ）。",o:["人要喝水、植物要喝水","人可以几天不喝水","水没用","水只能洗澡"],a:0,k:"生命离不开水",e:"解析：人、动物、植物都离不开水，水很有用。"},
// ===== 第6章 一年级·空气（特征） =====
{i:60,c:"1sci-6",ch:"一年级·空气（特征）",f:0,q:"我们周围到处都有（ ）。",o:["空气","只有水里才有空气","只有山上才有","只有冬天有"],a:0,k:"空气无处不在",e:"解析：空气充满我们周围，到处都有，看不见摸不着。"},
{i:61,c:"1sci-6",ch:"一年级·空气（特征）",f:0,q:"空气是（ ）。",o:["无色无味气体","红色液体","黑色固体","甜味气体"],a:0,k:"空气无色无味",e:"解析：空气没有颜色、没有味道，是气体。"},
{i:62,c:"1sci-6",ch:"一年级·空气（特征）",f:0,q:"下列能证明空气存在的是（ ）。",o:["用塑料袋兜一下鼓起来","闭眼看不见","石头很重","水会流"],a:0,k:"兜气证明空气存在",e:"解析：塑料袋兜一下鼓起来，里面装的就是空气。"},
{i:63,c:"1sci-6",ch:"一年级·空气（特征）",f:0,q:"人每时每刻都要呼吸，吸进的是（ ）。",o:["空气","水","沙子","火"],a:0,k:"人呼吸空气",e:"解析：人用肺呼吸空气，离开空气不能活。"},
{i:64,c:"1sci-6",ch:"一年级·空气（特征）",f:0,q:"下列动物也用空气呼吸的是（ ）。",o:["小狗","石头","汽车","桌子"],a:0,k:"动物呼吸空气",e:"解析：小狗等动物也要呼吸空气；石头、桌子不是生物。"},
{i:65,c:"1sci-6",ch:"一年级·空气（特征）",f:0,q:"风是（ ）流动形成的。",o:["空气","水","沙子","太阳光"],a:0,k:"风是空气流动",e:"解析：空气从一个地方流到另一个地方，就形成了风。"},
{i:66,c:"1sci-6",ch:"一年级·空气（特征）",f:1,q:"空气看不见、摸不着，但____（填“充满”或“没有”）我们周围。",o:[],a:"充满",k:"空气充满周围",e:"解析：空气看不见，却充满我们周围的每个角落。"},
{i:67,c:"1sci-6",ch:"一年级·空气（特征）",f:0,q:"把气球吹大，是因为里面装了（ ）。",o:["空气","水","糖","沙子"],a:0,k:"气球装的是空气",e:"解析：吹气球是把空气吹进去，气球才鼓起来。"},
{i:68,c:"1sci-6",ch:"一年级·空气（特征）",f:0,q:"下列现象与空气有关的是（ ）。",o:["风筝飞上天","石头下沉","冰融化","糖溶解"],a:0,k:"风筝借助空气",e:"解析：风筝靠空气托着飞起来；其它与空气关系不大。"},
{i:69,c:"1sci-6",ch:"一年级·空气（特征）",f:0,q:"人和植物都需要空气，说明空气（ ）。",o:["很重要、离不开","没用","只有动物要","只有人不要"],a:0,k:"空气很重要",e:"解析：人和植物都要呼吸空气，空气非常重要。"},
{i:70,c:"1sci-6",ch:"一年级·空气（特征）",f:1,q:"我们呼吸时，鼻子吸进的是____，呼出的是二氧化碳。",o:[],a:"空气",k:"呼吸空气",e:"解析：鼻子里吸进空气（含氧气），身体用后呼出二氧化碳。"},
// ===== 第7章 一年级·常见材料（纸/塑料/金属/木头） =====
{i:71,c:"1sci-7",ch:"一年级·常见材料（纸/塑料/金属/木头）",f:0,q:"书本的纸是用（ ）做的，能写字。",o:["纸","铁","石头","水"],a:0,k:"书用纸做",e:"解析：纸薄、轻、能写字画画，书多用纸印成。"},

{i:5,c:"1yw-1",ch:"一上·第1单元 识字（一）",f:0,q:"“天地分上下”的下一句是？",o:["日月照今古","金木水火土","你我他","日月水火"],a:0,k:"课文：金木水火土",e:"解析：“天地分上下，日月照今古。”"},

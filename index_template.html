<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>惠州小学每日练</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:#f2f6f4; color:#2f3b34; font-size:18px;
    -webkit-font-smoothing:antialiased;
  }
  .app { max-width:560px; margin:0 auto; min-height:100%; padding:18px 16px 40px; }
  .hidden { display:none !important; }

  /* 顶部 */
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .topbar .logo { font-size:22px; font-weight:800; color:#2f7d5d; }
  .topbar .sub { font-size:13px; color:#7b8a80; margin-top:2px; }
  .flower-badge {
    background:#fff; border:2px solid #f3c74f; color:#b8860b;
    padding:6px 14px; border-radius:999px; font-size:16px; font-weight:700;
    display:flex; align-items:center; gap:6px;
  }
  .flower-badge .icon { font-size:20px; }

  /* 年级选择 */
  .grade-tabs { display:flex; gap:6px; margin-bottom:14px; }
  .grade-tab {
    flex:1; text-align:center; padding:10px 0; border-radius:12px;
    background:#fff; font-weight:800; font-size:15px; cursor:pointer;
    border:2px solid transparent; color:#7b8a80;
    box-shadow:0 2px 8px rgba(47,61,52,.05);
  }
  .grade-tab.active { background:#2f7d5d; color:#fff; }

  /* 卡片 */
  .card {
    background:#fff; border-radius:18px; padding:18px;
    box-shadow:0 2px 10px rgba(47,61,52,.06);
    margin-bottom:14px;
  }

  /* 今日进度 */
  .today-line { font-size:17px; font-weight:700; color:#2f3b34; margin-bottom:4px; }
  .today-progress { display:flex; gap:8px; margin-top:10px; }
  .tseg { flex:1; height:12px; border-radius:8px; background:#e6ece8; overflow:hidden; }
  .tseg.done { background:#2f7d5d; }

  /* 三科/四科卡片 */
  .subjects { display:flex; flex-direction:column; gap:12px; }
  .subj-card {
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:18px; padding:18px 20px; cursor:pointer;
    border:2px solid transparent; box-shadow:0 2px 10px rgba(47,61,52,.06);
    transition:transform .08s ease;
  }
  .subj-card:active { transform:scale(.98); }
  .subj-left { display:flex; align-items:center; gap:14px; }
  .subj-icon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff; font-weight:800; }
  .yw .subj-icon { background:#e88a6a; }
  .sx .subj-icon { background:#4a90d9; }
  .en .subj-icon { background:#58a97c; }
  .sci .subj-icon { background:#c77fd6; }
  .subj-name { font-size:20px; font-weight:800; }
  .subj-desc { font-size:13px; color:#8a978e; margin-top:2px; }
  .subj-state {
    font-size:14px; font-weight:700; padding:5px 12px; border-radius:999px;
    background:#eef2ef; color:#7b8a80;
  }
  .subj-state.done { background:#dff0e6; color:#2f7d5d; }
  .subj-state.empty { background:#f4f4f4; color:#b3bcb5; }

  /* 日历 */
  .cal-title { font-size:17px; font-weight:800; margin-bottom:10px; color:#2f3b34; }
  .cal-week { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:13px; color:#8a978e; margin-bottom:6px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell {
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:10px; font-size:15px; color:#2f3b34; position:relative;
  }
  .cal-cell.empty { visibility:hidden; }
  .cal-cell.today { background:#2f7d5d; color:#fff; font-weight:800; }
  .cal-cell.checked { background:#dff0e6; color:#2f7d5d; font-weight:700; }
  .cal-cell.today.checked { background:#2f7d5d; color:#fff; }
  .cal-cell.checked::after {
    content:""; position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    width:6px; height:6px; border-radius:50%; background:#f3c74f;
  }
  .cal-cell.today.checked::after { background:#f3c74f; }

  /* 鼓励语 */
  .cheer {
    background:linear-gradient(135deg,#fff6e0,#fff); border:2px solid #f3c74f;
    border-radius:16px; padding:14px 18px; font-size:17px; font-weight:800; color:#b8860b;
    text-align:center;
  }

  /* 章节页 */
  .page-title { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .back-btn {
    background:#fff; border:none; border-radius:12px; padding:8px 14px;
    font-size:15px; font-weight:700; color:#2f7d5d; cursor:pointer;
    box-shadow:0 2px 8px rgba(47,61,52,.08);
  }
  .page-title h1 { font-size:20px; font-weight:800; }
  .part-label { font-size:15px; font-weight:800; color:#2f7d5d; margin:14px 2px 8px; }
  .chapter-list { display:flex; flex-direction:column; gap:8px; }
  .chapter-item {
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:14px; padding:14px 16px; cursor:pointer;
    box-shadow:0 2px 8px rgba(47,61,52,.05);
  }
  .chapter-item:active { transform:scale(.98); }
  /* 单元测试条目：和分课练习区分开，左边加一道竖线方便电视端一眼分辨 */
  .unit-item {
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:14px; padding:14px 16px; cursor:pointer;
    box-shadow:0 2px 8px rgba(47,61,52,.05);
    border-left:5px solid #e0a23c;
  }
  .unit-item:active { transform:scale(.98); }
  .unit-main { display:flex; flex-direction:column; gap:3px; min-width:0; }
  .unit-name { font-size:16px; font-weight:700; }
  /* 单元测试条目的副标题：语文列出本单元课文，其它科目列出章节名 */
  .unit-sub {
    font-size:12px; font-weight:600; color:#8a9a90;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* 单元内的上下册小标题，比 part-label 弱一级 */
  .part-sub { font-size:13px; font-weight:800; color:#8a9a90; margin:8px 2px 4px 8px; }
  .chapter-name { font-size:16px; font-weight:700; }
  .chapter-badge {
    font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .badge-new { background:#eef2ef; color:#7b8a80; }
  .badge-ing { background:#e8f1fb; color:#2f6fb8; }
  .badge-ok { background:#dff0e6; color:#2f7d5d; }
  .badge-unit { background:#fdf1dd; color:#a9761f; }

  /* 做题页 */
  .quiz-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .quiz-progress { font-size:15px; font-weight:700; color:#7b8a80; }
  /* 「换一批」按钮：做题页随时可点，重抽一批新题 */
  .refresh-btn {
    background:#fff; border:2px solid #2f7d5d; color:#2f7d5d;
    border-radius:999px; padding:6px 14px; font-size:13px; font-weight:800;
    cursor:pointer; white-space:nowrap;
  }
  .refresh-btn:active { transform:scale(.96); }
  .refresh-btn:focus { outline:3px solid #f3c74f; outline-offset:2px; }
  .progress-track { height:10px; background:#e6ece8; border-radius:8px; overflow:hidden; margin-bottom:16px; }
  .progress-fill { height:100%; background:#2f7d5d; border-radius:8px; transition:width .2s ease; }
  .quiz-card { background:#fff; border-radius:18px; padding:22px 20px; box-shadow:0 2px 10px rgba(47,61,52,.06); }
  .quiz-chapter { font-size:13px; color:#8a978e; margin-bottom:8px; }
  .quiz-img { max-width:300px; margin:0 auto 16px; border-radius:12px; background:#fff; border:1px solid #e3eae6; overflow:hidden; }
  .quiz-img > svg, .quiz-img > img { width:100%; height:auto; display:block; }
  .quiz-q { font-size:19px; font-weight:700; line-height:1.6; margin-bottom:18px; }
  .option {
    display:block; width:100%; text-align:left;
    background:#f6f9f7; border:2px solid #e3eae6; border-radius:14px;
    padding:14px 16px; margin-bottom:10px; font-size:17px; color:#2f3b34; cursor:pointer;
    transition:border-color .1s, background .1s;
  }
  .option.correct { background:#dff0e6; border-color:#2f7d5d; color:#2f7d5d; font-weight:700; }
  .option.wrong { background:#fdeaea; border-color:#d95555; color:#d95555; }
  .option.disabled { pointer-events:none; }
  .fill-box { display:flex; gap:10px; margin-bottom:14px; }
  .fill-input {
    flex:1; font-size:19px; padding:13px 14px; border:2px solid #e3eae6; border-radius:12px;
    outline:none; color:#2f3b34; background:#f6f9f7;
  }
  .fill-input:focus { border-color:#2f7d5d; }
  .btn {
    background:#2f7d5d; color:#fff; border:none; border-radius:14px;
    padding:14px 20px; font-size:18px; font-weight:800; cursor:pointer; width:100%;
  }
  .btn:active { transform:scale(.98); }
  .btn.secondary { background:#eef2ef; color:#2f3b34; }
  .btn.gray { background:#cfd8d2; color:#2f3b34; }
  .feedback { margin-top:14px; padding:12px 14px; border-radius:12px; font-size:16px; font-weight:700; display:none; }
  .feedback.right { display:block; background:#dff0e6; color:#2f7d5d; }
  .feedback.wrong { display:block; background:#fdeaea; color:#d95555; }
  .explain { margin-top:12px; padding:14px 16px; border-radius:12px; background:#f0f4f9; border:1px solid #dde6ef; display:none; }
  .explain.show { display:block; }
  .ex-kp { font-size:14px; font-weight:800; color:#2f6fb8; margin-bottom:8px; line-height:1.6; }
  .ex-text { font-size:15px; color:#3d4a43; line-height:1.8; }

  /* 成绩单 */
  .result-wrap { text-align:center; padding-top:10px; }
  .result-score { font-size:52px; font-weight:900; color:#2f7d5d; line-height:1.1; }
  .result-label { font-size:16px; color:#7b8a80; margin-bottom:6px; }
  .result-flowers { font-size:22px; font-weight:800; color:#b8860b; margin:16px 0 4px; }
  .result-flowers .icon { font-size:26px; }
  .result-tip { font-size:15px; color:#8a978e; margin-bottom:22px; }
  .result-actions { display:flex; flex-direction:column; gap:10px; }
  /* 拔高题（重点班难度）标记 */
  .hard-badge{
    display:inline-block; margin-left:8px; padding:2px 9px;
    background:linear-gradient(135deg,#ff8a3d,#ff5e62); color:#fff;
    font-size:14px; font-weight:800; border-radius:999px;
    vertical-align:middle; letter-spacing:.5px;
  }
  /* 自绘弹窗：不依赖 WebView 的 alert/confirm（电视端这条链很脆弱） */
  .ui-mask{
    position:fixed; left:0; top:0; right:0; bottom:0; z-index:9999;
    background:rgba(20,32,26,.55);
    display:flex; align-items:center; justify-content:center; padding:24px;
    box-sizing:border-box;
  }
  .ui-dialog{
    background:#fff; border-radius:18px; padding:26px 24px 20px;
    max-width:360px; width:100%;
    box-shadow:0 12px 40px rgba(20,32,26,.28); text-align:center;
    box-sizing:border-box;
  }
  .ui-dialog-msg{ font-size:17px; line-height:1.7; color:#2f3d34; margin-bottom:22px; }
  .ui-dialog-btns{ display:flex; gap:12px; justify-content:center; }
  .ui-btn{
    flex:1; padding:12px 10px; border-radius:12px; cursor:pointer;
    font-size:16px; font-weight:700; text-align:center;
    border:2px solid #d8e3dc; background:#fff; color:#4a5a50;
    outline:none; user-select:none; -webkit-user-select:none;
  }
  .ui-btn.primary{ background:#2f7d5d; border-color:#2f7d5d; color:#fff; }
  .ui-btn:focus{ border-color:#2f7d5d; box-shadow:0 0 0 4px rgba(47,125,93,.18); }
  .ui-btn.primary:focus{ box-shadow:0 0 0 4px rgba(47,125,93,.32); }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 主页 -->
  <div id="view-home">
    <div class="topbar">
      <div>
        <div class="logo">惠州小学每日练</div>
        <div class="sub">1~6 年级 · 语数英科四科</div>
      </div>
      <div class="flower-badge"><span class="icon">🌸</span><span id="flowerCount">0</span></div>
    </div>
    <div id="bankStatus" style="font-size:12px;color:#8a978e;margin:2px 2px 12px;">题库：加载中…</div>

    <div class="grade-tabs" id="gradeTabs"></div>

    <div class="card">
      <div class="today-line" id="todayLine">今天已练 0 科</div>
      <div class="today-progress" id="todayProgress"></div>
    </div>

    <div class="card subjects" id="subjectCards"></div>

    <div class="cheer hidden" id="cheer">🏆 坚持之星！继续加油！</div>

    <div class="card">
      <div class="cal-title" id="calTitle"></div>
      <div class="cal-week">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- 章节页 -->
  <div id="view-chapters" class="hidden">
    <div class="page-title">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <h1 id="chSubjectTitle"></h1>
    </div>
    <div id="chaptersBody"></div>
  </div>

  <!-- 做题页 -->
  <div id="view-quiz" class="hidden">
    <div class="page-title">
      <button class="back-btn" onclick="confirmQuit()">← 退出</button>
      <h1 id="quizSubjectTitle"></h1>
    </div>
    <div class="quiz-head">
      <span class="quiz-progress" id="quizProgress"></span>
      <button class="refresh-btn" id="quizRefresh" onclick="refreshQuiz()">🔄 换一批</button>
    </div>
    <div class="progress-track"><div class="progress-fill" id="quizFill"></div></div>
    <div class="quiz-card">
      <div class="quiz-chapter" id="quizChapter"></div>
      <div id="quizImg"></div>
      <div class="quiz-q" id="quizQ"></div>
      <div id="quizBody"></div>
      <div class="feedback" id="quizFeedback"></div>
      <div class="explain" id="quizExplain">
        <div class="ex-kp" id="exKp"></div>
        <div class="ex-text" id="exText"></div>
      </div>
      <button class="btn gray hidden" id="quizNext" onclick="nextQuestion()">下一题 →</button>
      <button class="btn hidden" id="quizFinish" onclick="finishQuiz()">看成绩 →</button>
    </div>
  </div>

  <!-- 成绩单 -->
  <div id="view-result" class="hidden">
    <div class="card result-wrap">
      <div class="result-label">这科做对了</div>
      <div class="result-score" id="resultScore">0/10</div>
      <div class="result-flowers" id="resultFlowers"></div>
      <div class="result-tip" id="resultTip"></div>
      <div class="result-actions">
        <button class="btn" onclick="goHome()">返回主页</button>
        <button class="btn secondary" onclick="backToChapters()">继续练这一科</button>
      </div>
    </div>
  </div>

  <!-- 自绘弹窗：不经过 WebView 的 alert/confirm。
       电视盒上原生 confirm 要靠 onJsConfirm 转系统弹窗，链一断就"点了没反应"。
       这里用静态节点 + .hidden 开关，遥控器只跟 DOM 打交道。 -->
  <div id="uiMask" class="ui-mask hidden">
    <div class="ui-dialog">
      <div id="uiDialogMsg" class="ui-dialog-msg"></div>
      <div id="uiDialogBtns" class="ui-dialog-btns"></div>
    </div>
  </div>

</div>

<script>
/* ============ 年级 / 科目 定义 ============ */
/* 年级页签顺序：按 1→2→3→4→5→6 升序，符合人类习惯。
   孩子正在读五年级，所以 currentGrade 仍然默认选中 5（打开就能练），
   只是页签不再把 5 排到最前面。
   注意 GRADES 只决定页签显示顺序，题库的 key 仍是 "<年级><科目>"，
   跟顺序无关，重排不会丢数据。 */
var GRADES = ["1","2","3","4","5","6"];
var SUBJECTS = ["yw","sx","en","sci"];
var SUB_META = {
  yw:  { name:"语文", icon:"语", cls:"yw",  desc:"统编版" },
  sx:  { name:"数学", icon:"数", cls:"sx",  desc:"人教版" },
  en:  { name:"英语", icon:"英", cls:"en",  desc:"人教PEP" },
  sci: { name:"科学", icon:"科", cls:"sci", desc:"教科版" }
};
function key(g,s){ return g + s; }

/* ============ 题库（合并时注入；运行时把旧五年级 yw/sx/en 迁移到 5yw/5sx/5en） ============ */
var EXTERNAL_BANK_URL = "https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@6d705de/questions.json";
window.QA = { yw:[], sx:[], en:[] };
var QA = window.QA;
// 兼容题库文件里的 global.QA 引用：浏览器没有 global，这里给一个 window 的别名
var global = window;
/*__IMGS__*/
/*__BANK__*/
(function migrate(){
  ["yw","sx","en"].forEach(function(s){
    if(window.QA[s]){
      var k = "5"+s;
      // 必须 concat 合并，不能用 = 赋值：
      // 五年级拔高题是直接写进 QA["5yw"] 的，赋值会把它们整体覆盖掉
      // （曾出过这个 bug：342 道五年级拔高题在页面上凭空消失）
      window.QA[k] = (window.QA[k] || []).concat(window.QA[s]);
      delete window.QA[s];
    }
  });
  GRADES.forEach(function(g){ SUBJECTS.forEach(function(s){ if(!window.QA[key(g,s)]) window.QA[key(g,s)] = []; }); });
})();

/* ============ 自绘弹窗 ============
   为什么不用原生 confirm/alert：
   原生 confirm 要靠 WebView 的 onJsConfirm 转成系统 AlertDialog，中间隔着
   JsResult 回调、Activity 主题、系统弹窗焦点三层。电视盒子上任何一层没接住，
   原生 confirm 就永远拿不到 true，表现出来就是「点了退出按钮没反应」。
   改成页面内自绘弹窗后，整条链只剩 DOM，遥控器 OK 键直接由 tv-remote 脚本
   转成 click。同时把 __uiModalOpen 置位，让 tv-remote 的定时器别来抢焦点。

   结构用静态节点（#uiMask / #uiDialogMsg / #uiDialogBtns）+ .hidden 开关，
   而不是每次动态创建：e2e_quit.js 和 test_quit.js 依赖这套 id 做断言。*/
window.__uiModalOpen = false;
var uiPrevFocus = null;

function uiDialogClose(){
  var mask = document.getElementById("uiMask");
  var box  = document.getElementById("uiDialogBtns");
  if(mask) mask.classList.add("hidden");
  if(box)  box.innerHTML = "";
  window.__uiModalOpen = false;
  // 焦点要还给打开弹窗前的那个元素。掉到 body 上的话，遥控器方向键
  // 得盲按一下才找得到落点，用户看到的就是"没反应"。
  var p = uiPrevFocus;
  uiPrevFocus = null;
  if(p && p.focus){
    try{
      if(document.body && document.body.contains(p) && p.offsetParent !== null) p.focus();
    }catch(e){}
  }
}

/** 供返回键调用：弹窗开着就关掉并返回 true（表示已由页面处理） */
function uiModalBack(){
  if(!window.__uiModalOpen) return false;
  uiDialogClose();
  return true;
}

/**
 * @param {string} msg   正文
 * @param {Array}  btns  [{t:"确定", fn:function, primary:true}, ...]
 */
function uiDialog(msg, btns){
  uiDialogClose();   // 先清掉可能残留的旧弹窗
  var mask  = document.getElementById("uiMask");
  var msgEl = document.getElementById("uiDialogMsg");
  var box   = document.getElementById("uiDialogBtns");
  if(!mask || !msgEl || !box) return;   // 结构缺失就静默跳过，别把页面搞崩

  uiPrevFocus = (document.activeElement && document.activeElement !== document.body)
                ? document.activeElement : uiPrevFocus;

  msgEl.textContent = msg;
  box.innerHTML = "";
  var def = null;
  btns.forEach(function(b){
    // 用 div 而不是 button：电视端遥控器脚本只给「非 button」元素补 click，
    // 用 button 反而可能被系统按键和脚本各触发一次
    var el = document.createElement("div");
    el.className = "ui-btn" + (b.primary ? " primary" : "");
    el.setAttribute("tabindex", "0");
    el.setAttribute("role", "button");
    el.textContent = b.t;
    el.onclick = function(){
      uiDialogClose();
      if(b.fn) b.fn();
    };
    box.appendChild(el);
    if(b.primary || !def) def = el;
  });

  mask.classList.remove("hidden");
  window.__uiModalOpen = true;

  setTimeout(function(){ if(def && window.__uiModalOpen) def.focus(); }, 30);
}

// 弹窗内的键盘操作：OK 确认、左右切换按钮、返回键/ESC 当取消
document.addEventListener("keydown", function(e){
  if(!window.__uiModalOpen) return;
  var k = e.keyCode || e.which;
  var box = document.getElementById("uiDialogBtns");
  if(!box) return;
  var all = box.querySelectorAll(".ui-btn");
  // 13=回车 23=DPAD_CENTER 66=遥控器 OK
  if(k === 13 || k === 23 || k === 66){
    // 电视端遥控器脚本在捕获阶段已经点过一次，这里别重复触发
    if(e.defaultPrevented) return;
    e.preventDefault();
    var ae = document.activeElement;
    if(ae && ae.click) ae.click();
    else if(all[0]) all[0].click();
  } else if(k === 37 || k === 21 || k === 39 || k === 22){
    if(all.length < 2) return;
    e.preventDefault();
    var idx = 0;
    for(var i=0;i<all.length;i++){ if(all[i] === document.activeElement) idx = i; }
    var next = (k === 37 || k === 21) ? idx - 1 : idx + 1;
    if(next < 0) next = all.length - 1;
    if(next >= all.length) next = 0;
    all[next].focus();
  } else if(k === 4 || k === 111){
    // 4=返回键 111=ESC
    e.preventDefault();
    uiDialogClose();
  }
});

var CHAPTERS = {};

/* 章节码排序：把 "yw-1" / "sx-12" 拆成 [前缀, 数字]，按数字大小比。
   为什么必须自己排：题库里章节顺序取决于题目出现的先后，一旦某科
   章节数上两位数，字符串比较就会把 "sx-10" 排到 "sx-2" 前面
   （5 年级数学 15 章、英语 12 章都踩到过，界面上表现为单元顺序乱掉）。 */
function chapterNum(code){
  var m = /^(.*?)(\d+)$/.exec(String(code));
  return m ? { pre:m[1], n:parseInt(m[2], 10) } : { pre:String(code), n:0 };
}
function chapterCmp(a, b){
  var x = chapterNum(a), y = chapterNum(b);
  if(x.pre !== y.pre) return x.pre < y.pre ? -1 : 1;
  return x.n - y.n;
}

function rebuildChapters(){
  CHAPTERS = {};
  GRADES.forEach(function(g){ SUBJECTS.forEach(function(s){ CHAPTERS[key(g,s)] = []; }); });
  Object.keys(QA).forEach(function(k){
    if(!CHAPTERS[k]) CHAPTERS[k] = [];
    var seen = {};
    QA[k].forEach(function(q){
      if(!seen[q.c]){ seen[q.c] = 1; CHAPTERS[k].push({ c:q.c, ch:q.ch }); }
    });
    CHAPTERS[k].sort(function(p, q){ return chapterCmp(p.c, q.c); });
  });
}
rebuildChapters();

/* ============ 做题页 ============ */
var currentChapter = null;
var quizQuestions = [];
var quizIndex = 0;
var quizCorrect = 0;

var CHAPTER_QUIZ_SIZE = 20;   // 每个章节每次练习的题量
var UNIT_TEST_SIZE    = 30;   // 单元测试的题量（比单课练习多，覆盖整个单元）
var HARD_MIN = 8;             // 每次练习至少包含的拔高题（d:2）道数，保证重点班难度

/* ===== 抽题：每次进入都换一批，本章练完也不锁死 =====
   拆成 buildPool / applyHardMix 两步：
   - buildPool    只管「按优先级凑够题目」，不管难度配比；
   - applyHardMix 只管「保证拔高题占比」。
   这样「换一批」按钮和进入章节能复用同一套规则，不会出现两处抽题逻辑不一致。

   ★ 严格不跑题（2026-09-01 改）：以前本章新题不足 20 道时，会拿「同科其它
   章节」的题来凑数，结果就是「明明在练第 1 课，突然冒出第 8 课的题」。
   现在抽题范围由 opts.codes 锁定，不足时只用「本范围内做过的题」补，
   本范围题数本来就不够 20 就少出几道 —— 宁可少，也不跑题。
   单元测试走同一函数，只是把 codes 换成该单元下的所有章节码。 */
function buildPool(k, c, opts){
  opts = opts || {};
  var all = QA[k] || [];
  var done = doneArr(k);
  var review = !!state.review[k];        // 复习模式：所有题都当成「新题」
  var SIZE = opts.size || CHAPTER_QUIZ_SIZE;
  // 抽题范围：默认锁死在传入的这一个章节；单元测试传整单元的章节码
  var scope = (opts.codes && opts.codes.length) ? opts.codes : [c];
  function inScope(q){ return scope.indexOf(q.c) >= 0; }
  function isFresh(q){ return review || done.indexOf(q.i) < 0; }

  var scAll   = all.filter(inScope);
  var scFresh = shuffle(scAll.filter(isFresh));
  var scOld   = shuffle(scAll.filter(function(q){ return !isFresh(q); }));

  var picked = [], used = {};
  function take(list, limit){
    var cap = (limit === undefined) ? SIZE : Math.min(limit, SIZE);
    for(var i = 0; i < list.length && picked.length < cap; i++){
      var q = list[i];
      if(used[q.i]) continue;
      used[q.i] = 1;
      picked.push(q);
    }
  }

  take(scFresh);   // 先给本范围没做过的题
  take(scOld);     // 新题不够，用本范围做过的题补（不跨范围）
  take(scAll);     // 兜底：题号重复等极端情况下也要凑出一批
  return picked;
}

/* 拔高题配比：优先取 HARD_MIN 道 d:2 拔高题，其余用普通题补齐。
   1~3 年级没有拔高题（hard 为空），此时 nHard=0，全部取普通题 —— 属于正常降级。 */
function applyHardMix(pool, size){
  var S = size || CHAPTER_QUIZ_SIZE;
  var hard = pool.filter(function(q){ return q.d === 2; });
  var norm = pool.filter(function(q){ return q.d !== 2; });
  shuffle(hard); shuffle(norm);
  var nHard = Math.min(HARD_MIN, hard.length);
  // 抽剩的拔高题要并入普通题一起候补，否则拔高题多于 HARD_MIN 时
  // 多出来的会被白白丢掉，导致总题数凑不满 20（曾出过：只抽出 19 题）
  var rest = hard.slice(nHard).concat(norm);
  shuffle(rest);
  return hard.slice(0, nHard).concat(rest.slice(0, Math.max(0, S - nHard)));
}

/* 当前这一批题的抽题范围。
   - 单课/单单元练习：codes = [该章节码]，size = CHAPTER_QUIZ_SIZE
   - 单元测试：       codes = 该单元下所有章节码，size = UNIT_TEST_SIZE
   「换一批」要沿用同一组 codes，否则一点换一批又会跑回单课范围。 */
var currentCodes = null;
var currentSize  = CHAPTER_QUIZ_SIZE;

function startChapter(sub, c){
  currentSubject = sub;
  var k = key(currentGrade, sub);
  var all = QA[k] || [];
  currentCodes = [c];
  currentSize  = CHAPTER_QUIZ_SIZE;
  var pool = buildPool(k, c, { codes: currentCodes, size: currentSize });
  if(pool.length === 0){ uiAlert("这个科目还没有题目哦～"); return; }
  quizQuestions = applyHardMix(pool, currentSize);
  shuffle(quizQuestions);   // 打乱，避免拔高题全挤在前面
  currentChapter = c;
  quizIndex = 0;
  quizCorrect = 0;
  var chTotal = all.filter(function(q){ return q.c===c; }).length;
  var nHard   = quizQuestions.filter(function(q){ return q.d===2; }).length;
  var title = currentGrade+"年级 " + SUBJECT_NAMES[sub] + " · 练习";
  // 本章题数不足 20 就少出几道（绝不用别的课的题凑数），这里如实说明
  if(chTotal < CHAPTER_QUIZ_SIZE){
    title += "（本章共 "+chTotal+" 题，全部练一遍）";
  }
  if(nHard > 0) title += " · 含 "+nHard+" 道拔高题";
  document.getElementById("quizSubjectTitle").textContent = title;
  showView("view-quiz");
  renderQuestion();
}

/* ===== 单元测试 =====
   单元测试 = 把整个单元的题合在一起测（30 道），区别于单课/单单元的 20 道练习。
   数学 / 英语 / 科学：一个「章节」本身就是一个单元，单元测试会覆盖该单元全部题。
   语文：五上五下是按「课」分的，一个单元含好几课，靠 YW_UNITS 把课归到单元；
        其它年级语文的章节本身就是「第 N 单元」，一章即一单元。 */
var YW_UNITS = {
  // 每个数=该单元包含几课（按当前题库里的课文顺序切）
  "5上": [3,4,3,4,2,3,3,3],   // 五上 2025新版 25 课 → 8 单元（桂花雨=第1课）
  "5下": [4,4,4,2,3,3,3]      // 五下 23 课 → 7 个单元
};

function buildUnits(k){
  var list = CHAPTERS[k] || [];
  if(list.length === 0) return [];
  var sub = k.replace(/^\d+/, "");
  // 只有按「课」编排的语文需要合并成单元；其余科目一章 = 一单元
  var needGroup = (sub === "yw") && YW_UNITS[currentGrade + "上"];
  if(!needGroup){
    return list.map(function(ch, i){
      return { idx:i, label:ch.ch, codes:[ch.c], half:(ch.ch.indexOf("下")>=0) };
    });
  }
  var units = [];
  var half = null, cursor = 0, order = 0;
  while(cursor < list.length){
    var isDown = list[cursor].ch.indexOf("下") >= 0;
    var sizes = isDown ? (YW_UNITS[currentGrade + "下"] || []) : (YW_UNITS[currentGrade + "上"] || []);
    var u = (half === null || isDown !== half) ? 0 : (units.length ? units[units.length-1].u + 1 : 0);
    half = isDown;
    var size = sizes[u] || 1;
    var slice = list.slice(cursor, cursor + size);
    if(slice.length === 0) break;
    var total = 0;
    slice.forEach(function(ch){
      total += (QA[k] || []).filter(function(q){ return q.c === ch.c; }).length;
    });
    var names = slice.map(function(ch){
      var m = /第\s*\d+\s*课\s*(.+)$/.exec(ch.ch);
      return m ? m[1] : ch.ch;
    });
    units.push({
      idx: units.length,
      u: u,
      label: (isDown ? "五下·第" : "五上·第") + (u + 1) + "单元 " + names.join("、"),
      sub: names.join("、"),
      codes: slice.map(function(ch){ return ch.c; }),
      total: total,
      half: isDown
    });
    cursor += size;
  }
  return units;
}

function startUnitTest(sub, unitIdx){
  currentSubject = sub;
  var k = key(currentGrade, sub);
  var units = buildUnits(k);
  var u = units[unitIdx];
  if(!u) return;
  currentCodes = u.codes;
  currentSize  = UNIT_TEST_SIZE;
  var pool = buildPool(k, u.codes[0], { codes: currentCodes, size: currentSize });
  if(pool.length === 0){ uiAlert("这个单元还没有题目哦～"); return; }
  quizQuestions = applyHardMix(pool, currentSize);
  shuffle(quizQuestions);
  currentChapter = u.codes[0];
  quizIndex = 0;
  quizCorrect = 0;
  var nHard = quizQuestions.filter(function(q){ return q.d===2; }).length;
  document.getElementById("quizSubjectTitle").textContent =
    currentGrade+"年级 " + SUBJECT_NAMES[sub] + " · 单元测试（共 "+quizQuestions.length+" 题）"
    + (nHard > 0 ? " · 含 "+nHard+" 道拔高题" : "");
  showView("view-quiz");
  renderQuestion();
}

/* 「换一批」：重抽一批新题，回到第 1 题。
   每次进入章节本身就会重抽一批，这个按钮是给「这批想换换口味」用的。
   沿用 currentCodes / currentSize，保证单课练习换一批还是单课，
   单元测试换一批还是整个单元。 */
function refreshQuiz(){
  if(!currentSubject || !currentChapter) return;
  var prevIds = quizQuestions.map(function(q){ return q.i; }).join(",");
  var next = [];
  var opts = { codes: currentCodes || [currentChapter], size: currentSize };
  // 极小概率抽到完全相同的一批，重试几次，保证「点了确实换了一批」
  for(var guard = 0; guard < 8; guard++){
    next = applyHardMix(buildPool(key(currentGrade, currentSubject), currentChapter, opts), currentSize);
    if(next.map(function(q){ return q.i; }).join(",") !== prevIds) break;
  }
  quizQuestions = next;
  shuffle(quizQuestions);
  quizIndex = 0;
  quizCorrect = 0;
  renderQuestion();
}

/* 「重做本章」：重新抽一批开始。
   特意不清除已完成记录 —— 否则章节的「已完成」状态会被意外打回未练习。 */
function restartChapter(){ refreshQuiz(); }

function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
  return arr;   // 返回自身，方便 shuffle(x).slice(...) 这类链式写法
}
/* ===== 题目配图渲染 =====
   电视盒子的 WebView 加载的是 file:///android_asset/index.html，
   img 原来存的是 https://cdn.jsdelivr.net/... 远程地址，盒子取不到就整块空白。
   所以配图一律优先走内联的 SVG_IMGS（随 HTML 一起打包，离线可用）。

   兼容性处理：
   - 对 SVG_IMGS 命中的图片直接输出内联 <svg>。老 Android WebView 对
     data URI <img> 的支持参差不齐（有的不支持 ;utf8、有的对长 data URI 截断、
     有的不触发 onerror），直接内联 SVG 是最稳的方案。
   - build_imgs.js 已给每张 SVG 补上 width/height/viewBox，页面 CSS 里的
     .quiz-img > svg { width:100%; height:auto; } 保证大屏上自适应。
   - 仅对 SVG_IMGS 里找不到的外部地址，才退回到 <img>，失败时隐藏，不留破图。 */
function imgKeyOf(src){
  if(typeof src !== "string") return "";
  var m = src.match(/assets\/(.+\.svg)$/);   // 兼容老数据里残留的完整 CDN 地址
  return m ? m[1] : src;
}
function renderImg(src){
  if(!src) return "";
  if(src.charAt(0) === "<") return '<div class="quiz-img">' + src + '</div>';   // 本身就是 SVG 源码
  var key = imgKeyOf(src);
  if(typeof SVG_IMGS !== "undefined" && SVG_IMGS && SVG_IMGS[key]){
    // 内联 SVG：不经过 data URI / onerror，老 WebView 最可靠
    return '<div class="quiz-img">' + SVG_IMGS[key] + '</div>';
  }
  // 字典里没有：外部 URL 兜底，加载失败则隐藏
  return '<div class="quiz-img"><img src="' + src + '" alt="题目配图" data-key="'
    + key + '" onerror="imgFail(this)"></div>';
}
function imgFail(el){
  var key = el.getAttribute("data-key");
  if(key && typeof SVG_IMGS !== "undefined" && SVG_IMGS && SVG_IMGS[key]){
    el.parentNode.innerHTML = SVG_IMGS[key];
    return;
  }
  el.parentNode.style.display = "none";
}
function renderQuestion(){
  var q = quizQuestions[quizIndex];
  document.getElementById("quizProgress").textContent = "第 "+(quizIndex+1)+" / "+quizQuestions.length+" 题";
  document.getElementById("quizFill").style.width = (quizIndex/quizQuestions.length*100)+"%";
  // 章节标题后跟一个「拔高」标记（d:2 = 重点班难度题）
  document.getElementById("quizChapter").innerHTML =
    q.ch + (q.d === 2 ? ' <span class="hard-badge">拔高</span>' : '');
  document.getElementById("quizImg").innerHTML = renderImg(q.img);
  document.getElementById("quizQ").textContent = q.q;
  document.getElementById("quizFeedback").className = "feedback";
  document.getElementById("quizExplain").className = "explain";
  document.getElementById("quizNext").classList.add("hidden");
  document.getElementById("quizFinish").classList.add("hidden");

  var body = document.getElementById("quizBody");
  body.innerHTML = "";
  if(q.f === 1){
    body.innerHTML = '<div class="fill-box"><input class="fill-input" id="fillInput" placeholder="在这里填写答案" autocomplete="off"></div>'
      + '<button class="btn" id="fillSubmit" onclick="submitFill()">提交答案</button>';
    var inp = document.getElementById("fillInput");
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 60);
  } else {
    // 打乱选项展示顺序，避免正确答案总是同一位置（出题意向常把正确项放第一项）
    var letters = ["A","B","C","D"];
    var order = shuffle([0,1,2,3].slice(0, q.o.length)); // 原始下标的一次随机排列
    q._dc = order.indexOf(q.a);                           // 正确项落在展示顺序里的位置
    order.forEach(function(oi, idx){
      var el = document.createElement("button");
      el.className = "option";
      el.textContent = letters[idx]+". "+q.o[oi];
      el.onclick = function(){ answer(idx); };
      body.appendChild(el);
    });
  }
}
function answer(idx){
  var q = quizQuestions[quizIndex];
  var dc = (typeof q._dc === "number") ? q._dc : q.a; // 展示顺序里的正确位置
  var opts = document.querySelectorAll("#quizBody .option");
  opts.forEach(function(el, i){ el.classList.add("disabled"); if(i===dc) el.classList.add("correct"); });
  if(idx === dc){
    quizCorrect++;
    showFeedback("✅ 答对了！", true);
  } else {
    opts[idx].classList.add("wrong");
    showFeedback("❌ 答错了，正确答案是 "+("A,B,C,D".split(",")[dc]+". "+q.o[q.a]), false);
  }
  afterAnswer();
}
function submitFill(){
  var q = quizQuestions[quizIndex];
  var val = document.getElementById("fillInput").value.trim();
  if(val === ""){ uiAlert("先填上答案再提交哦"); return; }
  var ok = (val === q.a);
  if(ok) quizCorrect++;
  showFeedback(ok ? "✅ 答对了！" : "❌ 正确答案是："+q.a, ok);
  document.getElementById("fillSubmit").classList.add("hidden");
  document.getElementById("fillInput").disabled = true;
  afterAnswer();
}
function showFeedback(msg, right){
  var fb = document.getElementById("quizFeedback");
  fb.textContent = msg;
  fb.className = right ? "feedback right" : "feedback wrong";
  showExplain(quizQuestions[quizIndex]);
}
function showExplain(q){
  var kp = q.k || "本章节知识点";
  var ex = q.e || "（该题暂无解析）";
  document.getElementById("exKp").textContent = "📌 知识点：" + kp;
  document.getElementById("exText").textContent = "💡 解析：" + ex;
  document.getElementById("quizExplain").className = "explain show";
}
function afterAnswer(){
  if(quizIndex < quizQuestions.length-1){
    document.getElementById("quizNext").classList.remove("hidden");
  } else {
    document.getElementById("quizFinish").classList.remove("hidden");
  }
}
function nextQuestion(){
  quizIndex++;
  renderQuestion();
}
function finishQuiz(){
  var k = key(currentGrade, currentSubject);
  quizQuestions.forEach(function(q){ doneArr(k).push(q.i); });
  var total = quizQuestions.length;
  var flowers = total>=10 ? (quizCorrect===total?3:(quizCorrect>=8?2:1)) : (quizCorrect===total?2:1);
  state.flowers += flowers;
  markSubjectDone(k);
  save();

  document.getElementById("resultScore").textContent = quizCorrect+"/"+total;
  document.getElementById("resultFlowers").innerHTML = '<span class="icon">🌸</span> 获得 '+flowers+' 朵小红花（共 '+state.flowers+' 朵）';
  var tip = quizCorrect===total ? "太棒了，全对！" : (quizCorrect>=8 ? "真不错，继续保持！" : "完成就很棒，明天再来！");
  document.getElementById("resultTip").textContent = tip;
  showView("view-result");
}
function confirmQuit(){
  uiConfirm("退出后这次没做完的题不会记入成绩，确定退出吗？", function(){ goHome(); });
}
function backToChapters(){
  renderHome();
  openSubject(currentSubject);
}
function goHome(){
  renderHome();
  showView("view-home");
}

/* ============ 外置题库：启动时自动拉取最新版，失败则用内置兜底 ============ */
// jsDelivr 的 @main 有 12 小时边缘缓存，刚推上去的内容不一定马上拉得到，
// 拉到的可能比内置题库旧。内置题库是本版本打包时确定的，配图信息（img）更新，
// 所以在线题库里缺图的题目，一律用内置题库的同题号补全 —— 避免出现「提到图却没图」。
// 注意：题号 i 只在「同一科目内」唯一，不同科目之间会重复。
// 所以索引必须按科目分桶，否则会把别的科目的图错配到无关题目上。
function inlineImgMap(){
  var m = {};
  Object.keys(window.QA).forEach(function(k){
    var arr = window.QA[k];
    if(!arr || !arr.length) return;
    var sub = {};
    arr.forEach(function(q){ if(q && q.img && q.i !== undefined) sub[q.i] = q.img; });
    m[k] = sub;
  });
  return m;
}
function fillMissingImgs(data, map){
  var filled = 0;
  Object.keys(data).forEach(function(k){
    var arr = data[k], sub = map[k];
    if(!arr || !arr.length || !sub) return;
    arr.forEach(function(q){
      if(q && !q.img && q.i !== undefined && sub[q.i]){ q.img = sub[q.i]; filled++; }
    });
  });
  return filled;
}
function loadExternalBank(){
  if(!window.fetch || !EXTERNAL_BANK_URL){ return; }
  fetch(EXTERNAL_BANK_URL)
    .then(function(r){ if(!r.ok){ throw new Error('http ' + r.status); } return r.json(); })
    .then(function(data){
      if(data && Object.keys(data).length > 0){
        var filled = fillMissingImgs(data, inlineImgMap());
        window.QA = data;
        QA = window.QA;
        rebuildChapters();
        var total = 0;
        Object.keys(data).forEach(function(k){ if(Array.isArray(data[k])) total += data[k].length; });
        var s = document.getElementById("bankStatus");
        if(s){
          s.textContent = "题库：在线最新版（共 " + total + " 题）"
            + (filled ? "，配图补全 " + filled + " 题" : "");
        }
        // 关键：用户正在做题时，在线题库一到绝不能把人踢回章节页。
        // 2MB 题库比用户点进做题页更慢，无条件 openSubject() 会把做题页连同
        // 「← 退出」按钮一起换掉 —— 表现同样是"点了退出没反应"。
        // 新题库已经写进 QA 且 rebuildChapters() 已跑，等用户退出做题页
        // 再用不迟，此处保持界面不动。
        var quizEl = document.getElementById("view-quiz");
        var inQuiz = quizEl && quizEl.classList && !quizEl.classList.contains("hidden");
        if(inQuiz){
          // 正在做题：只更新状态栏，界面原样不动
        } else if(currentSubject){ openSubject(currentSubject); }
        else { renderHome(); }
      }
    })
    .catch(function(){
      var s = document.getElementById("bankStatus");
      if(s){ s.textContent = "题库：备用版（在线题库暂时连不上，题目未更新）"; }
    });
}

/* ============ 启动 ============ */
renderHome();
loadExternalBank();
</script>

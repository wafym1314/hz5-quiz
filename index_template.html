<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>惠州小学每日练</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:#f2f6f4; color:#2f3b34; font-size:18px;
    -webkit-font-smoothing:antialiased;
  }
  .app { max-width:560px; margin:0 auto; min-height:100%; padding:18px 16px 40px; }
  .hidden { display:none !important; }

  /* 顶部 */
  .topbar { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .topbar .logo { font-size:22px; font-weight:800; color:#2f7d5d; }
  .topbar .sub { font-size:13px; color:#7b8a80; margin-top:2px; }
  .flower-badge {
    background:#fff; border:2px solid #f3c74f; color:#b8860b;
    padding:6px 14px; border-radius:999px; font-size:16px; font-weight:700;
    display:flex; align-items:center; gap:6px;
  }
  .flower-badge .icon { font-size:20px; }

  /* 年级选择 */
  .grade-tabs { display:flex; gap:6px; margin-bottom:14px; }
  .grade-tab {
    flex:1; text-align:center; padding:10px 0; border-radius:12px;
    background:#fff; font-weight:800; font-size:15px; cursor:pointer;
    border:2px solid transparent; color:#7b8a80;
    box-shadow:0 2px 8px rgba(47,61,52,.05);
  }
  .grade-tab.active { background:#2f7d5d; color:#fff; }

  /* 卡片 */
  .card {
    background:#fff; border-radius:18px; padding:18px;
    box-shadow:0 2px 10px rgba(47,61,52,.06);
    margin-bottom:14px;
  }

  /* 今日进度 */
  .today-line { font-size:17px; font-weight:700; color:#2f3b34; margin-bottom:4px; }
  .today-progress { display:flex; gap:8px; margin-top:10px; }
  .tseg { flex:1; height:12px; border-radius:8px; background:#e6ece8; overflow:hidden; }
  .tseg.done { background:#2f7d5d; }

  /* 三科/四科卡片 */
  .subjects { display:flex; flex-direction:column; gap:12px; }
  .subj-card {
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:18px; padding:18px 20px; cursor:pointer;
    border:2px solid transparent; box-shadow:0 2px 10px rgba(47,61,52,.06);
    transition:transform .08s ease;
  }
  .subj-card:active { transform:scale(.98); }
  .subj-left { display:flex; align-items:center; gap:14px; }
  .subj-icon { width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:26px; color:#fff; font-weight:800; }
  .yw .subj-icon { background:#e88a6a; }
  .sx .subj-icon { background:#4a90d9; }
  .en .subj-icon { background:#58a97c; }
  .sci .subj-icon { background:#c77fd6; }
  .subj-name { font-size:20px; font-weight:800; }
  .subj-desc { font-size:13px; color:#8a978e; margin-top:2px; }
  .subj-state {
    font-size:14px; font-weight:700; padding:5px 12px; border-radius:999px;
    background:#eef2ef; color:#7b8a80;
  }
  .subj-state.done { background:#dff0e6; color:#2f7d5d; }
  .subj-state.empty { background:#f4f4f4; color:#b3bcb5; }

  /* 日历 */
  .cal-title { font-size:17px; font-weight:800; margin-bottom:10px; color:#2f3b34; }
  .cal-week { display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:13px; color:#8a978e; margin-bottom:6px; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .cal-cell {
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:10px; font-size:15px; color:#2f3b34; position:relative;
  }
  .cal-cell.empty { visibility:hidden; }
  .cal-cell.today { background:#2f7d5d; color:#fff; font-weight:800; }
  .cal-cell.checked { background:#dff0e6; color:#2f7d5d; font-weight:700; }
  .cal-cell.today.checked { background:#2f7d5d; color:#fff; }
  .cal-cell.checked::after {
    content:""; position:absolute; bottom:4px; left:50%; transform:translateX(-50%);
    width:6px; height:6px; border-radius:50%; background:#f3c74f;
  }
  .cal-cell.today.checked::after { background:#f3c74f; }

  /* 鼓励语 */
  .cheer {
    background:linear-gradient(135deg,#fff6e0,#fff); border:2px solid #f3c74f;
    border-radius:16px; padding:14px 18px; font-size:17px; font-weight:800; color:#b8860b;
    text-align:center;
  }

  /* 章节页 */
  .page-title { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .back-btn {
    background:#fff; border:none; border-radius:12px; padding:8px 14px;
    font-size:15px; font-weight:700; color:#2f7d5d; cursor:pointer;
    box-shadow:0 2px 8px rgba(47,61,52,.08);
  }
  .page-title h1 { font-size:20px; font-weight:800; }
  .part-label { font-size:15px; font-weight:800; color:#2f7d5d; margin:14px 2px 8px; }
  .chapter-list { display:flex; flex-direction:column; gap:8px; }
  .chapter-item {
    display:flex; align-items:center; justify-content:space-between;
    background:#fff; border-radius:14px; padding:14px 16px; cursor:pointer;
    box-shadow:0 2px 8px rgba(47,61,52,.05);
  }
  .chapter-item:active { transform:scale(.98); }
  .chapter-name { font-size:16px; font-weight:700; }
  .chapter-badge {
    font-size:13px; font-weight:700; padding:4px 10px; border-radius:999px; white-space:nowrap;
  }
  .badge-new { background:#eef2ef; color:#7b8a80; }
  .badge-ing { background:#e8f1fb; color:#2f6fb8; }
  .badge-ok { background:#dff0e6; color:#2f7d5d; }

  /* 做题页 */
  .quiz-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .quiz-progress { font-size:15px; font-weight:700; color:#7b8a80; }
  .progress-track { height:10px; background:#e6ece8; border-radius:8px; overflow:hidden; margin-bottom:16px; }
  .progress-fill { height:100%; background:#2f7d5d; border-radius:8px; transition:width .2s ease; }
  .quiz-card { background:#fff; border-radius:18px; padding:22px 20px; box-shadow:0 2px 10px rgba(47,61,52,.06); }
  .quiz-chapter { font-size:13px; color:#8a978e; margin-bottom:8px; }
  .quiz-img { max-width:300px; margin:0 auto 16px; border-radius:12px; background:#fff; border:1px solid #e3eae6; overflow:hidden; }
  .quiz-img > svg, .quiz-img > img { width:100%; height:auto; display:block; }
  .quiz-q { font-size:19px; font-weight:700; line-height:1.6; margin-bottom:18px; }
  .option {
    display:block; width:100%; text-align:left;
    background:#f6f9f7; border:2px solid #e3eae6; border-radius:14px;
    padding:14px 16px; margin-bottom:10px; font-size:17px; color:#2f3b34; cursor:pointer;
    transition:border-color .1s, background .1s;
  }
  .option.correct { background:#dff0e6; border-color:#2f7d5d; color:#2f7d5d; font-weight:700; }
  .option.wrong { background:#fdeaea; border-color:#d95555; color:#d95555; }
  .option.disabled { pointer-events:none; }
  .fill-box { display:flex; gap:10px; margin-bottom:14px; }
  .fill-input {
    flex:1; font-size:19px; padding:13px 14px; border:2px solid #e3eae6; border-radius:12px;
    outline:none; color:#2f3b34; background:#f6f9f7;
  }
  .fill-input:focus { border-color:#2f7d5d; }
  .btn {
    background:#2f7d5d; color:#fff; border:none; border-radius:14px;
    padding:14px 20px; font-size:18px; font-weight:800; cursor:pointer; width:100%;
  }
  .btn:active { transform:scale(.98); }
  .btn.secondary { background:#eef2ef; color:#2f3b34; }
  .btn.gray { background:#cfd8d2; color:#2f3b34; }
  .feedback { margin-top:14px; padding:12px 14px; border-radius:12px; font-size:16px; font-weight:700; display:none; }
  .feedback.right { display:block; background:#dff0e6; color:#2f7d5d; }
  .feedback.wrong { display:block; background:#fdeaea; color:#d95555; }
  .explain { margin-top:12px; padding:14px 16px; border-radius:12px; background:#f0f4f9; border:1px solid #dde6ef; display:none; }
  .explain.show { display:block; }
  .ex-kp { font-size:14px; font-weight:800; color:#2f6fb8; margin-bottom:8px; line-height:1.6; }
  .ex-text { font-size:15px; color:#3d4a43; line-height:1.8; }

  /* 成绩单 */
  .result-wrap { text-align:center; padding-top:10px; }
  .result-score { font-size:52px; font-weight:900; color:#2f7d5d; line-height:1.1; }
  .result-label { font-size:16px; color:#7b8a80; margin-bottom:6px; }
  .result-flowers { font-size:22px; font-weight:800; color:#b8860b; margin:16px 0 4px; }
  .result-flowers .icon { font-size:26px; }
  .result-tip { font-size:15px; color:#8a978e; margin-bottom:22px; }
  .result-actions { display:flex; flex-direction:column; gap:10px; }
  /* 拔高题（重点班难度）标记 */
  .hard-badge{
    display:inline-block; margin-left:8px; padding:2px 9px;
    background:linear-gradient(135deg,#ff8a3d,#ff5e62); color:#fff;
    font-size:14px; font-weight:800; border-radius:999px;
    vertical-align:middle; letter-spacing:.5px;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 主页 -->
  <div id="view-home">
    <div class="topbar">
      <div>
        <div class="logo">惠州小学每日练</div>
        <div class="sub">1~6 年级 · 语数英科四科</div>
      </div>
      <div class="flower-badge"><span class="icon">🌸</span><span id="flowerCount">0</span></div>
    </div>
    <div id="bankStatus" style="font-size:12px;color:#8a978e;margin:2px 2px 12px;">题库：加载中…</div>

    <div class="grade-tabs" id="gradeTabs"></div>

    <div class="card">
      <div class="today-line" id="todayLine">今天已练 0 科</div>
      <div class="today-progress" id="todayProgress"></div>
    </div>

    <div class="card subjects" id="subjectCards"></div>

    <div class="cheer hidden" id="cheer">🏆 坚持之星！继续加油！</div>

    <div class="card">
      <div class="cal-title" id="calTitle"></div>
      <div class="cal-week">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- 章节页 -->
  <div id="view-chapters" class="hidden">
    <div class="page-title">
      <button class="back-btn" onclick="goHome()">← 返回</button>
      <h1 id="chSubjectTitle"></h1>
    </div>
    <div id="chaptersBody"></div>
  </div>

  <!-- 做题页 -->
  <div id="view-quiz" class="hidden">
    <div class="page-title">
      <button class="back-btn" onclick="confirmQuit()">← 退出</button>
      <h1 id="quizSubjectTitle"></h1>
    </div>
    <div class="quiz-head"><span class="quiz-progress" id="quizProgress"></span></div>
    <div class="progress-track"><div class="progress-fill" id="quizFill"></div></div>
    <div class="quiz-card">
      <div class="quiz-chapter" id="quizChapter"></div>
      <div id="quizImg"></div>
      <div class="quiz-q" id="quizQ"></div>
      <div id="quizBody"></div>
      <div class="feedback" id="quizFeedback"></div>
      <div class="explain" id="quizExplain">
        <div class="ex-kp" id="exKp"></div>
        <div class="ex-text" id="exText"></div>
      </div>
      <button class="btn gray hidden" id="quizNext" onclick="nextQuestion()">下一题 →</button>
      <button class="btn hidden" id="quizFinish" onclick="finishQuiz()">看成绩 →</button>
    </div>
  </div>

  <!-- 成绩单 -->
  <div id="view-result" class="hidden">
    <div class="card result-wrap">
      <div class="result-label">这科做对了</div>
      <div class="result-score" id="resultScore">0/10</div>
      <div class="result-flowers" id="resultFlowers"></div>
      <div class="result-tip" id="resultTip"></div>
      <div class="result-actions">
        <button class="btn" onclick="goHome()">返回主页</button>
        <button class="btn secondary" onclick="backToChapters()">继续练这一科</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ============ 年级 / 科目 定义 ============ */
var GRADES = ["1","2","3","4","5","6"];
var SUBJECTS = ["yw","sx","en","sci"];
var SUB_META = {
  yw:  { name:"语文", icon:"语", cls:"yw",  desc:"统编版" },
  sx:  { name:"数学", icon:"数", cls:"sx",  desc:"人教版" },
  en:  { name:"英语", icon:"英", cls:"en",  desc:"人教PEP" },
  sci: { name:"科学", icon:"科", cls:"sci", desc:"教科版" }
};
function key(g,s){ return g + s; }

/* ============ 题库（合并时注入；运行时把旧五年级 yw/sx/en 迁移到 5yw/5sx/5en） ============ */
var EXTERNAL_BANK_URL = "https://cdn.jsdelivr.net/gh/wafym1314/hz5-quiz@main/questions.json";
window.QA = { yw:[], sx:[], en:[] };
var QA = window.QA;
// 兼容题库文件里的 global.QA 引用：浏览器没有 global，这里给一个 window 的别名
var global = window;
/*__IMGS__*/
/*__BANK__*/
(function migrate(){
  ["yw","sx","en"].forEach(function(s){
    if(window.QA[s]){
      var k = "5"+s;
      // 必须 concat 合并，不能用 = 赋值：
      // 五年级拔高题是直接写进 QA["5yw"] 的，赋值会把它们整体覆盖掉
      // （曾出过这个 bug：342 道五年级拔高题在页面上凭空消失）
      window.QA[k] = (window.QA[k] || []).concat(window.QA[s]);
      delete window.QA[s];
    }
  });
  GRADES.forEach(function(g){ SUBJECTS.forEach(function(s){ if(!window.QA[key(g,s)]) window.QA[key(g,s)] = []; }); });
})();

/* ============ 章节元数据 ============ */
var CHAPTERS = {};
function rebuildChapters(){
  CHAPTERS = {};
  GRADES.forEach(function(g){ SUBJECTS.forEach(function(s){ CHAPTERS[key(g,s)] = []; }); });
  Object.keys(QA).forEach(function(k){
    if(!CHAPTERS[k]) CHAPTERS[k] = [];
    var seen = {};
    QA[k].forEach(function(q){
      if(!seen[q.c]){ seen[q.c] = 1; CHAPTERS[k].push({ c:q.c, ch:q.ch }); }
    });
  });
}
rebuildChapters();

/* ============ 状态 ============ */
var STORE_KEY = "hz_daily_v2";
var state = load();
function defaultState(){
  return { done:{}, flowers:0, checkins:{}, review:{} };
}
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw){ var s = JSON.parse(raw); if(s && s.done){ return s; } }
  }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){} }
function doneArr(k){ if(!state.done[k]) state.done[k] = []; return state.done[k]; }
function todayKey(){ var d = new Date(); return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
function todayDoneSubjects(){ return state.checkins[todayKey()] || []; }
function isSubjectDoneToday(k){ return todayDoneSubjects().indexOf(k) >= 0; }
function markSubjectDone(k){
  var arr = state.checkins[todayKey()] || [];
  if(arr.indexOf(k) < 0) arr.push(k);
  state.checkins[todayKey()] = arr;
  save();
}

/* ============ 视图切换 ============ */
var VIEWS = ["view-home","view-chapters","view-quiz","view-result"];
function showView(id){
  VIEWS.forEach(function(v){ document.getElementById(v).classList.add("hidden"); });
  document.getElementById(id).classList.remove("hidden");
  window.scrollTo(0,0);
}

/* ============ 主页 ============ */
var currentGrade = "5";
function renderGradeTabs(){
  var html = "";
  GRADES.forEach(function(g){
    html += '<div class="grade-tab'+(g===currentGrade?' active':'')+'" onclick="selectGrade(\''+g+'\')">'+g+'年级</div>';
  });
  document.getElementById("gradeTabs").innerHTML = html;
}
function selectGrade(g){ currentGrade = g; renderHome(); }

function renderHome(){
  renderGradeTabs();
  var g = currentGrade;
  var done = todayDoneSubjects();
  var segsHtml = "";
  var subHtml = "";
  var activeCount = 0, doneCount = 0;
  SUBJECTS.forEach(function(s){
    var k = key(g,s);
    var meta = SUB_META[s];
    var chs = CHAPTERS[k] || [];
    var hasCh = chs.length > 0;
    if(hasCh) activeCount++;
    if(hasCh && done.indexOf(k) >= 0) doneCount++;
    segsHtml += '<div class="tseg'+(done.indexOf(k)>=0?' done':'')+'" data-k="'+k+'"></div>';
    var stateTxt, stateCls;
    if(!hasCh){ stateTxt = "暂无题目"; stateCls = " empty"; }
    else {
      var allDone = chs.every(function(ch){
        var all = QA[k].filter(function(q){ return q.c===ch.c; });
        return all.every(function(q){ return doneArr(k).indexOf(q.i)>=0; });
      });
      if(allDone){ stateTxt = "🎉 已通关"; stateCls = " done"; }
      else if(done.indexOf(k) >= 0){ stateTxt = "✅ 已完成"; stateCls = " done"; }
      else { stateTxt = "未完成"; stateCls = ""; }
    }
    subHtml += '<div class="subj-card '+meta.cls+'" onclick="openSubject(\''+s+'\')">'
      + '<div class="subj-left"><div class="subj-icon">'+meta.icon+'</div>'
      + '<div><div class="subj-name">'+meta.name+'</div><div class="subj-desc">'+meta.desc+' · '+g+'年级</div></div></div>'
      + '<div class="subj-state'+stateCls+'">'+stateTxt+'</div></div>';
  });
  document.getElementById("todayLine").textContent = "今天已练 "+doneCount+" / "+(activeCount||SUBJECTS.length)+" 科";
  document.getElementById("todayProgress").innerHTML = segsHtml;
  document.getElementById("flowerCount").textContent = state.flowers;
  document.getElementById("cheer").classList.toggle("hidden", state.flowers < 10);
  document.getElementById("subjectCards").innerHTML = subHtml;
  renderCalendar();
}
function renderCalendar(){
  var now = new Date();
  var y = now.getFullYear(), m = now.getMonth();
  document.getElementById("calTitle").textContent = y+" 年 "+(m+1)+" 月 打卡";
  var first = new Date(y,m,1).getDay();
  var days = new Date(y,m+1,0).getDate();
  var html = "";
  for(var i=0;i<first;i++) html += '<div class="cal-cell empty"></div>';
  for(var d=1; d<=days; d++){
    var key2 = y+"-"+("0"+(m+1)).slice(-2)+"-"+("0"+d).slice(-2);
    var checked = state.checkins[key2] && state.checkins[key2].length > 0;
    var isToday = (d === now.getDate());
    var cls = "cal-cell";
    if(isToday) cls += " today";
    if(checked) cls += " checked";
    html += '<div class="'+cls+'">'+d+'</div>';
  }
  document.getElementById("calGrid").innerHTML = html;
}

/* ============ 章节页 ============ */
var currentSubject = null;
var SUBJECT_NAMES = { yw:"语文", sx:"数学", en:"英语", sci:"科学" };

function openSubject(sub){
  currentSubject = sub;
  var k = key(currentGrade, sub);
  document.getElementById("chSubjectTitle").textContent = currentGrade+"年级 " + SUBJECT_NAMES[sub] + " · 选章节";
  var list = CHAPTERS[k] || [];
  if(list.length === 0){
    document.getElementById("chaptersBody").innerHTML = '<div class="part-label">这个年级的'+SUBJECT_NAMES[sub]+'题目还在整理中，敬请期待～</div>';
    showView("view-chapters");
    return;
  }
  var allDone = list.every(function(ch){
    var all = QA[k].filter(function(q){ return q.c===ch.c; });
    return all.every(function(q){ return doneArr(k).indexOf(q.i)>=0; });
  });
  if(allDone && !state.review[k]){
    if(confirm("这科的章节全都练完啦！要开始第二轮复习吗？复习时题目会重新出现。")){
      state.review[k] = true; save();
    }
  }
  var reviewTip = state.review[k] ? '<div class="part-label" style="color:#b8860b;">🔁 复习模式：所有章节题目重新出现</div>' : "";
  var html = reviewTip;
  var part = null;
  list.forEach(function(ch, idx){
    var isSecondHalf = (ch.ch.indexOf("下") >= 0);
    var pLabel = isSecondHalf ? "下册" : "上册";
    if(pLabel !== part){ part = pLabel; html += '<div class="part-label">'+pLabel+'</div>'; }
    var all = QA[k].filter(function(q){ return q.c===ch.c; });
    var doneCount = all.filter(function(q){ return doneArr(k).indexOf(q.i)>=0; }).length;
    var badge, cls;
    if(doneCount >= all.length){ cls="badge-ok"; badge="✅ 已完成"; }
    else if(doneCount > 0){ cls="badge-ing"; badge="进行中 "+doneCount+"/"+all.length; }
    else { cls="badge-new"; badge="未练习"; }
    html += '<div class="chapter-item" onclick="startChapter(\''+sub+'\',\''+ch.c+'\')">'
      + '<div class="chapter-name">'+ch.ch+'</div>'
      + '<div class="chapter-badge '+cls+'">'+badge+'</div></div>';
  });
  document.getElementById("chaptersBody").innerHTML = html;
  showView("view-chapters");
}

/* ============ 做题页 ============ */
var currentChapter = null;
var quizQuestions = [];
var quizIndex = 0;
var quizCorrect = 0;

var CHAPTER_QUIZ_SIZE = 20;   // 每个章节每次练习的题量
var HARD_MIN = 8;             // 每次练习至少包含的拔高题（d:2）道数，保证重点班难度

function startChapter(sub, c){
  currentSubject = sub;
  var k = key(currentGrade, sub);
  var all = QA[k] || [];
  var pool;
  if(state.review[k]){
    pool = all.filter(function(q){ return q.c===c; });
  } else {
    pool = all.filter(function(q){ return q.c===c && doneArr(k).indexOf(q.i)<0; });
  }
  // 本章本身题量不足 CHAPTER_QUIZ_SIZE 时，用同科目其它章节补足，保证一次能练够
  // 注意：只在本章还有没做的题时才补，否则会导致章节永远练不完
  var total = all.filter(function(q){ return q.c===c; }).length;
  var supplemented = 0;
  if(pool.length > 0 && total < CHAPTER_QUIZ_SIZE){
    var extra = all.filter(function(q){ return q.c!==c && doneArr(k).indexOf(q.i)<0; });
    shuffle(extra);
    var need = CHAPTER_QUIZ_SIZE - pool.length;
    if(extra.length < need) need = extra.length;
    supplemented = need;
    pool = pool.concat(extra.slice(0, need));
  }
  // 保证拔高题占比：先从池子里取够 HARD_MIN 道 d:2 拔高题，不够的部分用普通题补齐。
  // 1~3 年级没有拔高题（hard 为空），此时 nHard=0，全部取普通题 —— 属于正常降级。
  var hard = pool.filter(function(q){ return q.d===2; });
  var norm = pool.filter(function(q){ return q.d!==2; });
  shuffle(hard); shuffle(norm);
  var nHard = Math.min(HARD_MIN, hard.length);
  // 注意：抽剩的拔高题要并入普通题一起候补，否则拔高题多于 HARD_MIN 时
  // 多出来的会被白白丢掉，导致总题数凑不满 20（曾出过：只抽出 19 题）
  var rest = hard.slice(nHard).concat(norm);
  shuffle(rest);
  quizQuestions = hard.slice(0, nHard).concat(rest.slice(0, CHAPTER_QUIZ_SIZE - nHard));
  shuffle(quizQuestions);   // 打乱，避免拔高题全挤在前面
  if(quizQuestions.length === 0){
    alert("这个章节的题都练完啦，换个章节吧！");
    return;
  }
  currentChapter = c;
  quizIndex = 0;
  quizCorrect = 0;
  var title = currentGrade+"年级 " + SUBJECT_NAMES[sub] + " · 练习";
  if(supplemented > 0) title += "（本章共 "+total+" 题，已补充 "+supplemented+" 道同科题目）";
  if(nHard > 0) title += " · 含 "+nHard+" 道拔高题";
  document.getElementById("quizSubjectTitle").textContent = title;
  showView("view-quiz");
  renderQuestion();
}
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){
    var j = Math.floor(Math.random()*(i+1));
    var t = arr[i]; arr[i]=arr[j]; arr[j]=t;
  }
}
/* ===== 题目配图渲染 =====
   电视盒子的 WebView 加载的是 file:///android_asset/index.html，
   img 原来存的是 https://cdn.jsdelivr.net/... 远程地址，盒子取不到就整块空白。
   所以配图一律优先走内联的 SVG_IMGS（随 HTML 一起打包，离线可用）；
   字典里没有的才退回 <img>，加载失败再自动隐藏，不留破图。 */
function imgKeyOf(src){
  if(typeof src !== "string") return "";
  var m = src.match(/assets\/(.+\.svg)$/);   // 兼容老数据里残留的完整 CDN 地址
  return m ? m[1] : src;
}
function renderImg(src){
  if(!src) return "";
  if(src.charAt(0) === "<") return '<div class="quiz-img">' + src + '</div>';   // 本身就是 SVG 源码
  var key = imgKeyOf(src);
  if(typeof SVG_IMGS !== "undefined" && SVG_IMGS && SVG_IMGS[key]){
    return '<div class="quiz-img">' + SVG_IMGS[key] + '</div>';
  }
  // 字典里没有：退回 <img>，失败时先尝试同名本地图，再隐藏
  return '<div class="quiz-img"><img src="' + src + '" alt="题目配图" data-key="'
    + key + '" onerror="imgFail(this)"></div>';
}
function imgFail(el){
  var key = el.getAttribute("data-key");
  if(key && typeof SVG_IMGS !== "undefined" && SVG_IMGS && SVG_IMGS[key] && !el.getAttribute("data-fallback")){
    el.setAttribute("data-fallback", "1");
    el.parentNode.innerHTML = SVG_IMGS[key];
    return;
  }
  el.parentNode.style.display = "none";
}
function renderQuestion(){
  var q = quizQuestions[quizIndex];
  document.getElementById("quizProgress").textContent = "第 "+(quizIndex+1)+" / "+quizQuestions.length+" 题";
  document.getElementById("quizFill").style.width = (quizIndex/quizQuestions.length*100)+"%";
  // 章节标题后跟一个「拔高」标记（d:2 = 重点班难度题）
  document.getElementById("quizChapter").innerHTML =
    q.ch + (q.d === 2 ? ' <span class="hard-badge">拔高</span>' : '');
  document.getElementById("quizImg").innerHTML = renderImg(q.img);
  document.getElementById("quizQ").textContent = q.q;
  document.getElementById("quizFeedback").className = "feedback";
  document.getElementById("quizExplain").className = "explain";
  document.getElementById("quizNext").classList.add("hidden");
  document.getElementById("quizFinish").classList.add("hidden");

  var body = document.getElementById("quizBody");
  body.innerHTML = "";
  if(q.f === 1){
    body.innerHTML = '<div class="fill-box"><input class="fill-input" id="fillInput" placeholder="在这里填写答案" autocomplete="off"></div>'
      + '<button class="btn" id="fillSubmit" onclick="submitFill()">提交答案</button>';
    var inp = document.getElementById("fillInput");
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 60);
  } else {
    var letters = ["A","B","C","D"];
    q.o.forEach(function(opt, idx){
      var el = document.createElement("button");
      el.className = "option";
      el.textContent = letters[idx]+". "+opt;
      el.onclick = function(){ answer(idx); };
      body.appendChild(el);
    });
  }
}
function answer(idx){
  var q = quizQuestions[quizIndex];
  var opts = document.querySelectorAll("#quizBody .option");
  opts.forEach(function(el, i){ el.classList.add("disabled"); if(i===q.a) el.classList.add("correct"); });
  if(idx === q.a){
    quizCorrect++;
    showFeedback("✅ 答对了！", true);
  } else {
    opts[idx].classList.add("wrong");
    showFeedback("❌ 答错了，正确答案是 "+(q.f===1?q.a:(["A","B","C","D"][q.a]+". "+q.o[q.a])), false);
  }
  afterAnswer();
}
function submitFill(){
  var q = quizQuestions[quizIndex];
  var val = document.getElementById("fillInput").value.trim();
  if(val === ""){ alert("先填上答案再提交哦"); return; }
  var ok = (val === q.a);
  if(ok) quizCorrect++;
  showFeedback(ok ? "✅ 答对了！" : "❌ 正确答案是："+q.a, ok);
  document.getElementById("fillSubmit").classList.add("hidden");
  document.getElementById("fillInput").disabled = true;
  afterAnswer();
}
function showFeedback(msg, right){
  var fb = document.getElementById("quizFeedback");
  fb.textContent = msg;
  fb.className = right ? "feedback right" : "feedback wrong";
  showExplain(quizQuestions[quizIndex]);
}
function showExplain(q){
  var kp = q.k || "本章节知识点";
  var ex = q.e || "（该题暂无解析）";
  document.getElementById("exKp").textContent = "📌 知识点：" + kp;
  document.getElementById("exText").textContent = "💡 解析：" + ex;
  document.getElementById("quizExplain").className = "explain show";
}
function afterAnswer(){
  if(quizIndex < quizQuestions.length-1){
    document.getElementById("quizNext").classList.remove("hidden");
  } else {
    document.getElementById("quizFinish").classList.remove("hidden");
  }
}
function nextQuestion(){
  quizIndex++;
  renderQuestion();
}
function finishQuiz(){
  var k = key(currentGrade, currentSubject);
  quizQuestions.forEach(function(q){ doneArr(k).push(q.i); });
  var total = quizQuestions.length;
  var flowers = total>=10 ? (quizCorrect===total?3:(quizCorrect>=8?2:1)) : (quizCorrect===total?2:1);
  state.flowers += flowers;
  markSubjectDone(k);
  save();

  document.getElementById("resultScore").textContent = quizCorrect+"/"+total;
  document.getElementById("resultFlowers").innerHTML = '<span class="icon">🌸</span> 获得 '+flowers+' 朵小红花（共 '+state.flowers+' 朵）';
  var tip = quizCorrect===total ? "太棒了，全对！" : (quizCorrect>=8 ? "真不错，继续保持！" : "完成就很棒，明天再来！");
  document.getElementById("resultTip").textContent = tip;
  showView("view-result");
}
function confirmQuit(){
  if(confirm("退出后这次没做完的题不会记入成绩，确定退出吗？")){ goHome(); }
}
function backToChapters(){
  renderHome();
  openSubject(currentSubject);
}
function goHome(){
  renderHome();
  showView("view-home");
}

/* ============ 外置题库：启动时自动拉取最新版，失败则用内置兜底 ============ */
// jsDelivr 的 @main 有 12 小时边缘缓存，刚推上去的内容不一定马上拉得到，
// 拉到的可能比内置题库旧。内置题库是本版本打包时确定的，配图信息（img）更新，
// 所以在线题库里缺图的题目，一律用内置题库的同题号补全 —— 避免出现「提到图却没图」。
// 注意：题号 i 只在「同一科目内」唯一，不同科目之间会重复。
// 所以索引必须按科目分桶，否则会把别的科目的图错配到无关题目上。
function inlineImgMap(){
  var m = {};
  Object.keys(window.QA).forEach(function(k){
    var arr = window.QA[k];
    if(!arr || !arr.length) return;
    var sub = {};
    arr.forEach(function(q){ if(q && q.img && q.i !== undefined) sub[q.i] = q.img; });
    m[k] = sub;
  });
  return m;
}
function fillMissingImgs(data, map){
  var filled = 0;
  Object.keys(data).forEach(function(k){
    var arr = data[k], sub = map[k];
    if(!arr || !arr.length || !sub) return;
    arr.forEach(function(q){
      if(q && !q.img && q.i !== undefined && sub[q.i]){ q.img = sub[q.i]; filled++; }
    });
  });
  return filled;
}
function loadExternalBank(){
  if(!window.fetch || !EXTERNAL_BANK_URL){ return; }
  fetch(EXTERNAL_BANK_URL)
    .then(function(r){ if(!r.ok){ throw new Error('http ' + r.status); } return r.json(); })
    .then(function(data){
      if(data && Object.keys(data).length > 0){
        var filled = fillMissingImgs(data, inlineImgMap());
        window.QA = data;
        QA = window.QA;
        rebuildChapters();
        var total = 0;
        Object.keys(data).forEach(function(k){ if(Array.isArray(data[k])) total += data[k].length; });
        var s = document.getElementById("bankStatus");
        if(s){
          s.textContent = "题库：在线最新版（共 " + total + " 题）"
            + (filled ? "，配图补全 " + filled + " 题" : "");
        }
        if(currentSubject){ openSubject(currentSubject); }
        else { renderHome(); }
      }
    })
    .catch(function(){
      var s = document.getElementById("bankStatus");
      if(s){ s.textContent = "题库：备用版（在线题库暂时连不上，题目未更新）"; }
    });
}

/* ============ 启动 ============ */
renderHome();
loadExternalBank();
</script>
